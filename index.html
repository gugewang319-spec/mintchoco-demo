<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>薄荷巧克力 · 演示</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e4f3ec}
/* 每页一个外框：外框平移、里面的 iframe 反向平移，内容不动、只是露出来；全走合成层，不重绘页面 */
.pg{position:absolute;inset:0;overflow:hidden;z-index:1;contain:strict}
.pg iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#e4f3ec}
.pg.off{visibility:hidden;pointer-events:none;z-index:0}
.pg.top{z-index:3}
.pg,.pg iframe{will-change:auto}
.pg.mv,.pg.mv iframe{will-change:transform}
#edge{position:fixed;left:0;top:0;width:100%;height:120px;pointer-events:none;z-index:10;display:none;will-change:transform}
#shield{position:fixed;inset:0;z-index:11;display:none}
</style></head><body>
<canvas id="edge" aria-hidden="true"></canvas><div id="shield"></div>
<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const V=42;const url=k=>k==='gate'?`p/conn/index.html?v=${V}&gate=1`:`p/${k}/index.html?v=${V}`;
const MAX=10;                      /* 最多常驻 10 页，超出把最久没看的卸掉 */
const SUB={set:['chn','mdl','snd','hlt','use','conn'],today:['room'],list:['room','srch'],mem:['msrch']};
const pool=new Map();              /* k -> {box,fr,ready,used} */
let stack=[],busy=false,curK=null;
const edge=document.getElementById('edge'),ex=edge.getContext('2d'),shield=document.getElementById('shield');
const raf=()=>new Promise(r=>requestAnimationFrame(r));
const frames=async n=>{for(let i=0;i<n;i++)await raf()};

function get(k){
 let p=pool.get(k);
 if(!p){
  const box=document.createElement('div');box.className='pg off';
  const fr=document.createElement('iframe');fr.title='演示页面';box.appendChild(fr);document.body.appendChild(box);
  p={box,fr,used:0};
  p.ready=new Promise(r=>{let d=false;const f=async()=>{if(d)return;d=true;
    try{await fr.contentDocument.fonts.ready}catch(e){}r()};fr.onload=f;setTimeout(f,2500)});
  fr.src=url(k);pool.set(k,p);
  if(pool.size>MAX){ /* 卸掉最久没用、且不在返回栈里的页 */
   const old=[...pool].filter(([kk])=>kk!==k&&kk!==curK&&!stack.includes(kk)).sort((a,b)=>a[1].used-b[1].used)[0];
   if(old){old[1].box.remove();pool.delete(old[0])}}
 }
 p.used=performance.now();return p}

/* 显示一页并等它真正画出来（首帧画完），再开动画 */
async function show(p,z){await p.ready;p.box.classList.remove('off');p.box.style.zIndex=z;await frames(2)}
function hide(p){p.box.classList.add('off');p.box.style.zIndex='';p.box.style.transform='';p.fr.style.transform='';p.box.classList.remove('mv')}

/* 液面：同一套阻尼波，只画一条 120px 高的窄带，跟着液面平移 */
const N=28,BAND=120,TOPPAD=44;
function surf(W,p,dir,t,seed){
 const amp=(dir>0?16:12)*Math.sin(Math.PI*Math.min(1,p*1.1))*(1-.4*p);
 const tilt=(dir>0?22:-14)*(1-p)*(seed?1:-1);
 const ys=[];for(let i=0;i<=N;i++){const x=i/N;ys.push(amp*(Math.sin(x*6.2+t*11)*.6+Math.sin(x*11.3-t*15)*.4)+tilt*(x-.5)*2)}return ys}
let D=1;
function sizeEdge(W){D=Math.min(2,devicePixelRatio||1);if(edge.width!==Math.round(W*D)){edge.width=Math.round(W*D);edge.height=BAND*D}}
function drawEdge(ys,W,bub,p){
 ex.setTransform(D,0,0,D,0,0);ex.clearRect(0,0,W,BAND);
 const Y=i=>TOPPAD+ys[i];
 const path=()=>{ex.beginPath();ex.moveTo(0,Y(0));for(let i=1;i<=N;i++){const px=(i-.5)/N*W;ex.quadraticCurveTo((i-1)/N*W,Y(i-1),px,(Y(i-1)+Y(i))/2)}ex.lineTo(W,Y(N))};
 /* 液面以下一道奶茶带：盖住波谷与平切线之间的缝，往下渐隐进新页 */
 path();ex.lineTo(W,BAND);ex.lineTo(0,BAND);ex.closePath();
 const g=ex.createLinearGradient(0,0,0,BAND);g.addColorStop(0,'rgba(207,236,225,.97)');g.addColorStop((TOPPAD+42)/BAND,'rgba(207,236,225,.95)');g.addColorStop(1,'rgba(207,236,225,0)');ex.fillStyle=g;ex.fill();
 path();ex.lineWidth=4.5;ex.strokeStyle='rgba(255,250,240,.95)';ex.lineCap='round';ex.stroke();
 path();ex.lineWidth=1.25;ex.strokeStyle='#5fae95';ex.globalAlpha=.7;ex.stroke();ex.globalAlpha=1;
 for(const b of bub){const i=Math.round(b.x*N),y=Y(i)+b.dy+b.v*p*40;ex.beginPath();ex.arc(b.x*W,y,b.r,0,7);ex.lineWidth=1;ex.strokeStyle='rgba(95,174,149,.55)';ex.fillStyle='rgba(255,255,255,.5)';ex.fill();ex.stroke()}}

/* el 的外框露出液面以下的部分：外框 translateY(cut)，iframe translateY(-cut)；cut 取波面最低点再往下 TOPPAD 内由奶茶带盖住 */
function run(pg,dir,ms){return new Promise(res=>{
 const W=innerWidth,H=innerHeight,seed=Math.random()<.5,t0=performance.now();sizeEdge(W);
 const bub=Array.from({length:9},()=>({x:Math.random(),dy:6+Math.random()*16,r:1.5+Math.random()*2.6,v:dir>0?Math.random():-Math.random()*.3}));
 pg.box.classList.add('mv');edge.style.display='block';
 const f=now=>{const p=Math.min(1,(now-t0)/ms);
  const ease=dir>0?1-Math.pow(1-p,3):p*p*(3-2*p);
  const base=dir>0?(H+30)*(1-ease):H*ease;               /* 液面高度 */
  const ys=surf(W,p,dir,(now-t0)/1000,seed);
  const cut=Math.max(0,base+Math.max(...ys));            /* 平切在波面最低点，缝由奶茶带盖住 */
  const c=p>=1&&dir>0?0:cut;
  pg.box.style.transform=`translate3d(0,${c}px,0)`;pg.fr.style.transform=`translate3d(0,${-c}px,0)`;
  edge.style.transform=`translate3d(0,${base-TOPPAD}px,0)`;
  if(p<1){drawEdge(ys,W,bub,p);requestAnimationFrame(f)}
  else{edge.style.display='none';pg.box.classList.remove('mv');res()}};
 requestAnimationFrame(f)})}

async function push(k){
 const from=pool.get(curK),to=get(k);shield.style.display='block';
 if(RM){await show(to,3);if(from)hide(from);curK=k;return}
 to.box.style.transform=`translate3d(0,${innerHeight+60}px,0)`;to.fr.style.transform=`translate3d(0,${-(innerHeight+60)}px,0)`;
 await show(to,3);await run(to,1,430);
 to.box.style.transform='';to.fr.style.transform='';to.box.style.zIndex='';
 if(from)hide(from);curK=k}
async function back(k){
 const from=pool.get(curK),to=get(k);shield.style.display='block';
 await show(to,1);                     /* 上一页一直留着，直接垫在下面 */
 if(!RM&&from){from.box.style.zIndex=3;await run(from,-1,380)}
 if(from)hide(from);                   /* 退出的子页留着，再进不用重载 */
 to.box.style.zIndex='';curK=k}
async function tab(k){
 const from=pool.get(curK),to=get(k);shield.style.display='block';
 to.box.style.opacity=0;await show(to,3);
 if(!RM)await to.box.animate([{opacity:0},{opacity:1}],{duration:200,fill:'forwards'}).finished;
 to.box.getAnimations().forEach(a=>a.cancel());to.box.style.opacity='';to.box.style.zIndex='';
 if(from)hide(from);curK=k;warmSub(k)}
function warmSub(k){const l=(SUB[k]||[]).filter(x=>!pool.has(x));const go=()=>{const x=l.shift();if(!x||curK!==k)return;get(x).ready.then(()=>setTimeout(go,250))};(window.requestIdleCallback||setTimeout)(go,{timeout:1200})}

addEventListener('message',async e=>{const a=e.data&&e.data.demo;if(!a||busy)return;busy=true;try{
 const [t,k]=a.split(':');
 if(t==='tab'){if(k!==curK){stack=[k];await tab(k)}}
 else if(t==='push'){stack.push(k);await push(k)}
 else if(t==='enter'){const g=pool.get('gate');stack=['today'];await tab('today');if(g){g.box.remove();pool.delete('gate')}}
 else if(t==='back'&&stack.length>1){stack.pop();await back(stack[stack.length-1])}
}finally{busy=false;shield.style.display='none'}});

/* 每次打开先刷会员卡（地址钥匙只在内存）；带 #页名 打开时跳过，方便直接看某页 */
const start=(location.hash.slice(1)||'gate');stack=[start];curK=start;
const first=get(start);first.ready.then(()=>{first.box.classList.remove('off');
 /* 首页画完后，空闲时把另外四个主页悄悄预载好，切 tab 不用等 */
 const warm=['today','mem','list','role','set'].filter(k=>k!==start).concat(SUB[start]||[]);
 const next=()=>{const k=warm.shift();if(!k)return;const p=get(k);p.ready.then(()=>setTimeout(next,300))};
 (window.requestIdleCallback||setTimeout)(next,{timeout:1500})});
</script></body></html>
