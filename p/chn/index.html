<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>渠道</title>
<style>
@font-face{font-family:ZK;src:url(zk.ttf)}
@font-face{font-family:Baloo;src:url(baloo.ttf);font-weight:100 900}
@font-face{font-family:BalooX;src:url(baloo800.ttf)}
@font-face{font-family:WK;src:url(wk.ttf)}
@font-face{font-family:Script;src:url(script.ttf)}
:root{--ch:#5b3a2c;--ink:#4a3027;--cocoa:#8a5c46;--mint3:#2f6e58;--mintb:#3f9a80}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;outline:0;cursor:pointer}
img{display:block;user-select:none;-webkit-user-drag:none;width:100%}

.vp{position:fixed;inset:0;overflow:hidden;background-color:#e4f3ed;background-image:radial-gradient(110% 50% at 15% 0%,rgba(255,255,255,.75),rgba(255,255,255,0) 60%),repeating-linear-gradient(90deg,#d7eee5 0,#d7eee5 18px,#edf8f3 18px,#edf8f3 36px)}
.app{position:absolute;left:0;right:0;margin:0 auto;top:0;bottom:0;width:min(100%,412px);overflow:hidden}
.drizzle{position:absolute;left:0;top:0;width:100%;z-index:25;pointer-events:none}
.pearls{position:absolute;left:-4%;right:-4%;bottom:-46px;z-index:1;pointer-events:none;opacity:.8}
canvas#fx{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.o{position:absolute;z-index:6;will-change:transform}
.bit{position:absolute;pointer-events:none}
.ground{position:absolute;left:-56px;width:524px;top:694px;z-index:14;pointer-events:none}
.groundfill{position:absolute;left:0;right:0;top:796px;bottom:0;background:#fbf8eb;z-index:14}
.sp{position:absolute;pointer-events:none}



.lhead{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:flex-end;justify-content:space-between;padding:58px 18px 0}
.ttl{position:relative}
.ttl h1{font:32px/1 ZK;color:var(--ch);letter-spacing:.06em;position:relative;z-index:1}
.ttl .sc{position:absolute;left:52px;top:-14px;font:22px/1 Script;color:rgba(63,154,128,.55);transform:rotate(-8deg);white-space:nowrap}
.lhead .counter{margin:0 0 4px}
.counter{display:inline-flex;gap:2px;padding:3px;border-radius:5px;background:#5b3a2c}
.counter span{display:inline-block;min-width:12px;padding:1px 2px;border-radius:2px;background:#fdf9f0;font:700 13px/1.3 Baloo,ZK;text-align:center;color:#4a3027}
.counter b{align-self:center;font:13px/1 ZK;color:#fdf9f0;padding:0 3px}




.pearlbtn{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:rgba(252,250,244,.62);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 8px 18px -12px rgba(74,48,39,.45)}
.pearlbtn svg{stroke:#5b3a2c}
.lhead .lf{display:flex;align-items:flex-end;gap:12px}

.top[hidden]{display:none!important}
.top{position:absolute;left:22px;right:22px;top:118px;z-index:12;display:flex;align-items:baseline;justify-content:space-between;color:var(--cocoa)}
.top .k{font:13px/1 ZK;letter-spacing:.3em;display:flex;align-items:center;gap:7px}
.top .k i{width:7px;height:7px;border-radius:50%;background:var(--mintb)}
.top .d{font:12.5px/1 WK;color:#7a5a4c}
/* 出票口：前景固定件 */
.slot{position:absolute;left:14px;right:14px;top:150px;height:16px;z-index:16;pointer-events:none}
.slot::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;border-radius:5px;background:rgba(252,250,244,.66);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.2px solid var(--cocoa)}
.slot::after{content:"";position:absolute;left:8px;right:8px;top:6px;height:3.5px;border-radius:2px;background:#5b3a2c}
.roll{position:absolute;top:158px;z-index:10;overflow:hidden;padding:0 6px 26px}
.sway{transform-origin:50% 0;animation:sw var(--sp) ease-in-out infinite;animation-delay:var(--ph)}
@keyframes sw{0%,100%{transform:rotate(calc(var(--a) * -1))}50%{transform:rotate(var(--a))}}
.rc{position:relative;width:100%;padding:16px 15px 24px;color:#4a3027;background:#fffcf4 repeating-linear-gradient(0deg,rgba(91,58,44,.028) 0 1px,transparent 1px 3px);-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;transform:translateY(-102%);transition:transform 1.25s steps(14,end)}
.in .rc{transform:none}
.shade{filter:drop-shadow(0 0 .7px rgba(91,58,44,.55))}
.rc h2{font:21px/1.1 ZK;color:var(--ch);display:inline-block;position:relative;letter-spacing:.06em}
.rc h2::after{content:"";position:absolute;left:-3px;right:-5px;bottom:1px;height:7px;border-radius:4px;background:rgba(166,217,196,.75);z-index:-1}
.rc .host{display:block;margin-top:6px;font:500 11.5px/1.2 Baloo,ZK;color:#8a6a5a;letter-spacing:.03em}
.cut{margin:11px 0 9px;border-top:1.3px dashed rgba(91,58,44,.45)}
.ln{position:relative;min-height:25px;align-items:center;display:flex;justify-content:space-between;gap:8px;font:13.5px/1.9 WK;width:100%;text-align:left}
.ln .v{font:600 13.5px/1 Baloo,ZK}
.ln .st{font:12.5px/1 WK;display:inline-flex;align-items:center;gap:5px;color:#6f5446}
.ln .st i{width:7px;height:7px;border-radius:50%;background:var(--mintb)}
.ln .st i.cool{background:none;border:1.3px solid var(--mintb)}
.ln .st i.bad{background:#c2664a}
.ln .k{font:600 13.5px/1 Baloo,ZK;letter-spacing:.06em}
.sec{font:12px/1 ZK;color:var(--cocoa);letter-spacing:.24em;margin-bottom:4px;display:flex;justify-content:space-between}
.sec b{font:600 12px/1 Baloo,ZK;letter-spacing:0}
.lk{font:13px/1.9 WK;color:var(--cocoa);border-bottom:1.2px dashed var(--cocoa);line-height:1.3;padding-bottom:1px}
.rt .v{display:inline-block;min-width:24px;text-align:right}
.rt.pop .v{animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(1.5);color:#3f9a80}100%{transform:none}}
.keyop{display:flex;gap:16px;justify-content:flex-end;max-height:0;overflow:hidden;transition:max-height .35s}
.keyl.ex+.keyop{max-height:30px}
.keyop span{font:12.5px/1.8 WK;color:var(--cocoa);border-bottom:1.1px dashed var(--cocoa);line-height:1.2}
.more{max-height:0;overflow:hidden;transition:max-height .7s steps(6,end)}
.more .ln{font-size:12.5px}
.more .ln .v{font-weight:500;font-size:12px}
.foot{margin-top:12px;font:500 10.5px/1.5 Baloo,ZK;color:#9a7c6c;text-align:center;letter-spacing:.08em}
.bar{height:22px;margin:8px auto 0;width:82%;background:repeating-linear-gradient(90deg,#5b3a2c 0 1.5px,transparent 1.5px 3.5px,#5b3a2c 3.5px 6px,transparent 6px 7px,#5b3a2c 7px 7.8px,transparent 7.8px 10px);opacity:.75}
.circ{position:absolute;pointer-events:none;width:66px;height:32px;left:-3px;top:-3px;opacity:.9}
.newk{display:none}
.newk.on{display:flex}
.newk .ph{font:13px/1.9 WK;color:#a28878}
.newk .ph::after{content:"";display:inline-block;width:1.3px;height:14px;background:var(--ch);margin-left:2px;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.addch{position:absolute;left:22px;top:742px;z-index:12;font:14px/1.3 WK;color:var(--cocoa);border-bottom:1.3px dashed var(--cocoa)}
@media (prefers-reduced-motion:reduce){.sway{animation:none}.rc,.more{transition:none}}
.pnav{position:fixed;z-index:40;left:16px;right:16px;max-width:408px;margin:0 auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));height:62px;padding:5px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;border-radius:31px;background:rgba(252,250,244,.62);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 12px 26px -14px rgba(74,48,39,.45)}
.pill{position:absolute;z-index:0;top:5px;left:5px;height:52px;border-radius:26px;background:rgba(196,232,218,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);transition:transform 380ms cubic-bezier(.3,1.25,.5,1),width 380ms}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;border-radius:26px;color:#7a5a4c;text-align:center}.tab span{font-size:11px;line-height:1.2}.tab.on{color:#4a3027}.tab.on>span{font-weight:600}
.tab .dot{position:absolute;top:-1px;left:19px;width:7px;height:7px;border-radius:4px;background:#3f9a80;box-shadow:0 0 0 2px rgba(252,250,244,.95)}

.rail{position:absolute;left:14px;right:14px;top:150px;height:13px;z-index:16;pointer-events:none}
.rail::before{content:"";position:absolute;inset:0;border-radius:7px;background:rgba(252,250,244,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.2px solid var(--cocoa)}
.rail::after{content:"";position:absolute;left:10px;right:10px;top:8px;height:2.5px;border-radius:2px;background:rgba(91,58,44,.85)}
.track{position:absolute;left:0;right:0;top:156px;height:268px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;z-index:11;touch-action:pan-x}
.track::-webkit-scrollbar{display:none}
.track .in{position:relative;height:100%}
.tk{position:absolute;top:0;width:176px;height:238px;transform-origin:26px 0;animation:sw var(--sp) ease-in-out infinite;animation-delay:var(--ph);transition:transform .45s cubic-bezier(.3,1.3,.5,1),opacity .35s;text-align:left}
.tk .p{position:absolute;inset:0;background:#fffcf4 repeating-linear-gradient(0deg,rgba(91,58,44,.028) 0 1px,transparent 1px 3px);-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%}
.tk .sh{position:absolute;inset:0;filter:drop-shadow(0 0 .7px rgba(91,58,44,.6)) drop-shadow(-3px 0 4px rgba(91,58,44,.12))}
.tk .st{position:absolute;left:21px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--mintb)}
.tk .st.cool{background:none;border:1.4px solid var(--mintb)}.tk .st.bad{background:#c2664a}.tk .st.off{background:none;border:1.4px solid #b8a598}
.tk .nm{position:absolute;left:13px;top:40px;width:26px;writing-mode:vertical-rl;font:18px/26px ZK;letter-spacing:.14em;color:var(--ch)}
.tk.off .nm{color:#a99285}
.tk .kc{position:absolute;left:0;width:52px;bottom:22px;text-align:center;font:600 11px/1.2 Baloo,ZK;color:#8a6a5a}
.tk .kc small{display:block;font:10px/1.2 WK}
.tk .rt{position:absolute;left:62px;right:12px;top:18px;font:600 11px/1.6 Baloo,ZK;color:#8a6a5a;word-break:break-all}
.tk .rt b{display:block;font:15px/1.4 ZK;color:var(--ch);font-weight:400}
.tk .rt i{display:block;margin:8px 0;border-top:1.2px dashed rgba(91,58,44,.4)}
.tk .bar{position:absolute;left:62px;right:14px;bottom:24px;width:auto;margin:0}
.tk .cv{position:absolute;pointer-events:none;opacity:.9}
.tk.out{transform:translateY(60px);opacity:0;animation:none}
.tk.now .nm{background:linear-gradient(90deg,transparent 19px,rgba(166,217,196,.85) 19px 25px,transparent 25px)}
.clip{position:absolute;top:-3px;width:11px;height:11px;border-radius:50%;background:#fbf6ea;border:1.3px solid var(--cocoa);margin-left:-5.5px}
.open{position:absolute;left:22px;top:440px;width:262px;overflow:hidden;padding:0 6px 26px;margin-left:-6px;z-index:10}
.open .rc{transform:translateY(-104%)}
.open.on .rc{transform:none}
.open .lift{position:absolute;right:14px;top:16px;font:12.5px/1.2 WK;color:var(--cocoa);border-bottom:1.1px dashed var(--cocoa);z-index:2}
.app{overflow-y:auto;scrollbar-width:none}.app::-webkit-scrollbar{display:none}
.nt{position:absolute;top:0;width:150px;height:238px;border:1.4px dashed rgba(138,92,70,.55);border-top:0;border-radius:0 0 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:14px/1.4 WK;color:var(--cocoa);text-align:center}
.nt b{font:26px/1 Baloo,ZK;font-weight:400}
.hint{position:absolute;left:22px;top:440px;font:13px/1.6 WK;color:#8a6a5a;z-index:10;transition:opacity .3s}

.idle{position:absolute;left:22px;right:22px;top:446px;height:330px;z-index:10;transition:opacity .35s}
.idle.hide{opacity:0;pointer-events:none}
.spike{position:absolute;left:0;top:0;width:118px;height:322px;display:block}
.spike svg{position:absolute;inset:0;overflow:visible}
.spike .slips g{transform-box:fill-box;transform-origin:50% 50%}
.spike .top{animation:fl 4.9s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.spike .new{animation:drop .6s cubic-bezier(.4,1.5,.6,1)}
@keyframes drop{0%{transform:translateY(-90px);opacity:0}60%{opacity:1}}
.kpi{position:absolute;left:142px;right:0;top:4px;border-left:1.3px solid var(--cocoa);padding-left:16px}
.kpi .lb{font:14px/1.4 WK;color:#8a6a5a;letter-spacing:.1em}
.kpi .big{font:64px/1 Baloo,ZK;color:var(--ch);margin:6px 0 2px;letter-spacing:-.01em}
.kpi .u{font:13px/1.4 WK;color:#8a6a5a}
.kpi .row{margin-top:22px;border-top:1.2px dashed rgba(91,58,44,.45)}
.kpi .row div{display:flex;align-items:baseline;justify-content:space-between;padding:10px 0;border-bottom:1.2px dashed rgba(91,58,44,.45);font:14px/1.3 WK;color:var(--ch)}
.kpi .row b{font:22px/1 Baloo,ZK;font-weight:400}
.kpi .row b.bad{color:#c2664a}
.kpi .tip{margin-top:14px;font:12.5px/1.6 WK;color:#8a6a5a}
.kw{position:relative}
.keyl{position:relative}
.keyl .ring{position:absolute;left:-14px;top:-7px;width:118px;height:40px;opacity:0;pointer-events:none;clip-path:inset(0 100% 0 0);transition:clip-path .55s steps(8,end) 1.35s,opacity .1s 1.35s}
.open.on .keyl .ring{opacity:.92;clip-path:inset(0 0 0 0)}
.kw .keyl::after{content:"";position:absolute;left:-2px;top:52%;height:2px;width:calc(100% + 4px);border-radius:2px;background:#8a5c46;opacity:.75;transform:scaleX(0) rotate(-1.2deg);transform-origin:left;transition:transform .35s steps(6,end)}
.kw.gone .keyl::after{transform:scaleX(1) rotate(-1.2deg)}
.kw.gone .keyop .up{display:none}
.kw.gone .keyl .k,.kw.gone .keyl .st,.kw.gone .ring{opacity:.38}
.open.on .kw.gone .keyl .ring{opacity:.3}
.kw.flash .keyl{animation:fl2 .7s}
@keyframes fl2{30%{background:rgba(166,217,196,.55)}}
.tk{transition:transform .45s cubic-bezier(.3,1.3,.5,1),opacity .35s,rotate .9s cubic-bezier(.25,1.7,.45,1)}
.tk.drag{transition:transform .45s cubic-bezier(.3,1.3,.5,1),opacity .35s,rotate .12s linear}
@media (prefers-reduced-motion:reduce){.keyl .ring{transition:none}.kw .keyl::after{transition:none}}
.nt.lit{border-color:var(--cocoa);background:rgba(252,250,244,.35)}
.rc.nw input{display:block;width:100%;border:0;background:none;outline:0;color:var(--ch);caret-color:var(--cocoa);padding:0 0 3px;border-bottom:1.2px dotted rgba(91,58,44,.5)}
.rc.nw input::placeholder{color:#b49c8c}
.rc.nw .nmI{font:21px/1.25 ZK;width:62%;letter-spacing:.06em}
.rc.nw .hostI{margin-top:8px;font:500 11.5px/1.4 Baloo,ZK;color:#8a6a5a;letter-spacing:.03em}
.rc.nw .keyI{flex:1;font:600 13.5px/1.6 Baloo,ZK;letter-spacing:.06em;border-bottom-style:dotted}
.rc.nw input.miss{animation:miss .42s;border-bottom:1.6px solid #c2664a}
.rc.nw input.miss::placeholder{color:#c2664a}
@keyframes miss{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.rc.up{transform:translateY(-110%)!important;transition:transform .6s cubic-bezier(.5,0,.8,.4)!important}
.tk.fresh{animation:drop .7s cubic-bezier(.3,1.4,.5,1),sw var(--sp) ease-in-out .7s infinite}
@media (prefers-reduced-motion:reduce){.tk.fresh{animation:none}}
.spike svg{transform-origin:59px -414px;animation:pend 6.8s ease-in-out infinite}
.spike.hit svg{animation:pend 6.8s ease-in-out infinite,pk 1.4s cubic-bezier(.3,.6,.4,1)}
@keyframes pend{0%,100%{rotate:-.35deg}50%{rotate:.35deg}}
@keyframes pk{0%{transform:none}20%{transform:rotate(1.6deg)}45%{transform:rotate(-1.1deg)}70%{transform:rotate(.5deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.spike svg,.spike.hit svg{animation:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}/*nav-font 11-14*/.pnav,.pnav *{font-family:"OPPO Sans","HarmonyOS Sans SC","PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif}</style></head><body>
<div class="vp"><div class="app" id="app">
<img class="drizzle" src="today-bg.png" alt="">
<header class="lhead"><div class="lf"><button class="pearlbtn" aria-label="回到设置"><svg width="22" height="22" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="m15 18-6-6 6-6"/></svg></button><div class="ttl"><span class="sc" aria-hidden="true">channel</span><h1>渠道</h1></div></div><div class="counter"><span>1</span><span>4</span><b>条</b></div></header>
<div class="top" hidden><span class="k"></span></div>
<div class="rail" aria-hidden="true"></div>
<div class="track" id="track"><div class="in" id="tin"></div></div>
<div class="idle" id="idle">
<button class="spike" id="spike" aria-label="串绳：今天出过的单"><svg viewBox="0 0 118 322" id="spsvg"></svg></button>
<div class="kpi"><div class="lb">今 日 出 单</div><div class="big" id="cntb">1,284</div><div class="u">张 · 到 21:02 为止</div>
<div class="row"><div><span>平均出单</span><b>1.8<small style="font:12px WK"> 秒</small></b></div><div><span>没出成</span><b class="bad">3</b></div><div><span>换过钥匙</span><b>2</b></div></div>
</div>
</div>

<div class="open" id="open"></div>
<div id="sp" style="position:absolute;left:0;width:1px;height:1px;top:900px"></div>
<img class="bit" src="bit2.png" style="width:20px;left:356px;top:410px;z-index:9" alt="">
<div class="navfade" aria-hidden="true"></div>
<nav class="pnav" aria-label="主导航"><span class="pill" aria-hidden="true"></span>
