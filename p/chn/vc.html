<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>渠道 · 出单机样稿</title>
<link rel="stylesheet" href="../mc/mc.css?v=1">
<style>
/* 本页只写场景和布局；组件样式全在 ../mc/mc.css */
/* 挂单轨 */
.railw{position:relative;margin-top:122px;height:212px}
.rod{position:absolute;left:-6px;right:-6px;top:10px;height:10px;border-radius:5px;background:linear-gradient(#f3e3c6,#d8b98a);border:1.3px solid var(--ink);z-index:3}
.rod::after{content:"";position:absolute;left:6px;right:6px;top:2px;height:1.2px;background:rgba(255,255,255,.7);border-radius:1px}
.track{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;z-index:4}.track::-webkit-scrollbar{display:none}
.tin{position:relative;display:flex;gap:10px;padding:0 24px;height:100%;width:max-content}
/* 选中渠道详情 */
.det{position:relative;margin:0 6px;padding:16px 26px 18px}
.det h2{display:flex;align-items:baseline;gap:8px;font:20px/1.2 ZK;font-weight:400}
.det h2 em{font:16px/1 Script;color:var(--mint-d);font-style:normal}
.det h2 .ed{margin-left:auto;font:13px/1.2 WK;color:var(--cocoa);border-bottom:1.1px dashed var(--cocoa);padding:6px 0 2px;position:relative}
.det h2 .ed::before{content:'';position:absolute;inset:-8px -14px}
.pull{margin-top:8px;padding:8px 0 4px}
.pl2{max-height:220px;overflow-y:auto;scrollbar-width:none}
/* 出单机 + 纸卷 */
.mach{position:relative;margin:18px auto 0;width:340px;height:222px;z-index:6}
.mach>img{position:absolute;left:0;top:0;width:340px;display:block}
.win{position:absolute;left:118px;top:50px;width:104px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.win small{font:10px/1 WK;color:var(--cocoa);letter-spacing:.3em;margin-bottom:3px}
.win b{font:25px/1 BalooX;color:var(--ink);letter-spacing:.02em}
.mach .pl{position:absolute;width:20px}
#roll{margin:-68px auto 0;z-index:7;padding-bottom:140px}
</style></head><body>
<div class="vp"><div class="app" id="app">
<img class="drizzle" src="../mc/img/drizzle.png" alt="">
<div class="railw"><div class="rod" aria-hidden="true"></div><div class="track"><div class="tin" id="tin" role="listbox" aria-label="渠道"></div></div></div>
<section class="det soft" id="det" aria-live="polite"></section>
<div class="mach"><img src="printer.png" alt=""><div class="win" aria-label="今日出单 1284 张"><small>今日</small><b>1,284</b></div>
<img class="pl" src="../mc/img/pearl.png" style="left:-6px;top:196px" alt=""><img class="pl" src="../mc/img/pearl.png" style="left:12px;top:206px;width:15px" alt=""><img class="pl" src="../mc/img/cup-leaf.png" style="right:-8px;top:178px;width:30px;rotate:18deg" alt=""><img class="pl" src="../mc/img/pearl.png" style="right:22px;top:204px;width:16px" alt=""></div>
<div id="roll"></div>
</div></div>
<script src="../ui.js?v=67"></script>
<script src="../mc/mc.js?v=1"></script>
<script>
document.getElementById('app').prepend(MC.head({title:'渠道',en:'channel',back:'回到设置',right:[{icon:'search',label:'找渠道'}]}));
MC.nav('设置');
const ST=MC.STATES;
const CH=[
 {n:'主渠道',h:'api.mintchoco.dev',f:'OpenAI',s:'ok',k:3,keys:[['••••7f2a','今天 412 次','ok'],['••••c09e','用完了','bad'],['••••51bd','备用','']],mods:[['gpt-4o-mini',1],['claude-sonnet-4-5-20250929',1],['gemini-2.5-pro',1],['deepseek-chat',0]]},
 {n:'备用渠道',h:'relay.example.com',f:'OpenAI',s:'fail',k:1,keys:[['••••0d3e','过期了','bad']],mods:[['gpt-4o',0]]},
 {n:'奶盖中转',h:'cream.example.com',f:'Anthropic',s:'making',k:2,keys:[['••••a812','连接中',''],['••••9b70','备用','']],mods:[['claude-haiku-4-5',1],['gpt-4.1-nano',1]]},
 {n:'薄荷站',h:'mint.example.com',f:'OpenAI',s:'ok',k:1,keys:[['••••3c4f','今天 96 次','ok']],mods:[['qwen-max',1]]},
 {n:'焦糖站',h:'caramel.example.com',f:'OpenAI',s:'warn',k:2,keys:[['••••e2d1','额度剩一成','bad'],['••••77aa','备用','']],mods:[['gpt-4o',1],['o4-mini',1]]},
 {n:'可可站',h:'cocoa.example.com',f:'Gemini',s:'empty',k:0,keys:[],mods:[]},
];
const SEG=[
 {st:'making',t:'等它回复',c:'奶盖中转',m:'claude-haiku-4-5',tm:'21:24',nw:1},
 {st:'ok',t:'回好了',c:'主渠道',m:'claude-sonnet-4-5-20250929',tm:'21:20'},
 {st:'fail',t:'没发出去',c:'备用渠道',m:'gpt-4o',tm:'21:12',tip:'这把 key 过期了，去备用渠道换一把就能重发'},
 {st:'ok',t:'回好了',c:'薄荷站',m:'qwen-max',tm:'20:58'},
 {st:'ok',t:'回好了',c:'主渠道',m:'gpt-4o-mini',tm:'20:41'},
 {st:'ok',t:'回好了',c:'焦糖站',m:'o4-mini',tm:'20:30'},
];
let sel=0;
const UP={OpenAI:['gpt-4o','gpt-4o-mini','gpt-4.1','gpt-4.1-mini','gpt-4.1-nano','o3','o4-mini','gpt-5','gpt-5-mini','text-embedding-3-large'],Anthropic:['claude-opus-4-1-20250805','claude-sonnet-4-5-20250929','claude-haiku-4-5','claude-3-5-haiku-20241022'],Gemini:['gemini-2.5-pro','gemini-2.5-flash','gemini-2.5-flash-lite','gemini-2.0-flash']};
function renderTags(){const tin=document.getElementById('tin');tin.innerHTML='';
 CH.forEach((c,i)=>{const e=MC.tag({name:c.n,state:c.s,count:c.k,unit:'把',sel:i===sel});
  e.onclick=()=>{sel=i;mode='view';renderTags();renderDet()};tin.appendChild(e)});
 const a=MC.tag({add:1,name:'新渠道',sel:sel===-1});a.onclick=()=>{sel=-1;mode='new';renderTags();renderDet()};tin.appendChild(a)}
let mode='view';const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const toast=(t,o)=>window.MC&&MC.toast?MC.toast(t,o):0;
function renderDet(){const d=document.getElementById('det');
 if(mode==='new'||mode==='edit')return renderForm(d);
 const c=CH[sel];
 const rows=c.keys.length?c.keys.map((k,j)=>MC.row({cup:k[2]==='bad'?'fail':k[2]==='ok'?'ok':'empty',k:'钥匙 '+(j+1),sub:k[0],v:k[1],vs:k[2]})).join(''):MC.row({cup:'empty',k:'还没有钥匙'});
 d.innerHTML=`<h2>${c.n}<em>${c.k?c.k+' keys':'empty'}</em><button class="ed" id="edB">改</button></h2>${rows}
 <div class="rw nk" hidden><img src="${MC.cup('empty')}" alt=""><span class="f" style="flex:1;border:0"><input class="mono" id="nkI" placeholder="粘贴密钥" aria-label="新密钥" autocomplete="off" spellcheck="false"></span><button class="tx" id="nkOk">放进去</button></div>
 <div class="acts"><button class="tx" id="nkB">＋ 再放一把</button></div>
 <div class="sep"></div>${MC.chips(c.mods)}
 <div class="acts"><span></span><button class="tx" id="puB">拉新的 ›</button></div><div class="pull" id="pull" hidden></div>`;
 $('#edB').onclick=()=>{mode='edit';renderDet()};
 $('#nkB').onclick=()=>{const r=$('.nk');r.hidden=!r.hidden;if(!r.hidden)$('#nkI').focus()};
 $('#nkOk').onclick=()=>{const v=$('#nkI').value.trim();if(v.length<8){$('#nkI').placeholder='太短了，再粘一次';$('#nkI').value='';return}
  c.keys.push(['••••'+v.slice(-4),'备用','']);c.k=c.keys.length;if(c.s==='empty')c.s='ok';renderTags();renderDet();toast(`「${c.n}」多了一把钥匙`)};
 $('#puB').onclick=()=>openPull(c);}
function openPull(c){const p=$('#pull');if(!p.hidden){p.hidden=true;$('#puB').textContent='拉新的 ›';return}
 p.hidden=false;$('#puB').textContent='收起 ›';
 if(!c.keys.length){p.innerHTML=`<div class="ld"><img src="${MC.cup('fail')}" style="width:20px" alt="">先放一把钥匙才能拉</div>`;return}
 p.innerHTML=`<div class="ld"><svg width="18" height="18" viewBox="-9 -9 18 18">${MC.mark('making')}</svg>正在问上游有哪些模型…</div>`;
 setTimeout(()=>{if(p.hidden)return;
  if(c.s==='fail'){p.innerHTML=`<div class="ld"><img src="${MC.cup('fail')}" style="width:20px" alt="">上游没回话，钥匙可能过期了<button class="tx" id="rt" style="margin-left:auto">再试</button></div>`;$('#rt').onclick=()=>{p.hidden=true;openPull(c)};return}
  const have=new Set(c.mods.map(m=>m[0])),list=UP[c.f||'OpenAI'];const pick=new Set();
  p.innerHTML=`<label class="q"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8a5c46" stroke-width="1.5" stroke-linecap="round"><circle cx="6.8" cy="6.8" r="4.6"/><path d="M10.3 10.3l3.6 3.6"/></svg><input id="puI" placeholder="在 ${list.length} 个里找" aria-label="在上游里找" autocapitalize="off" spellcheck="false"></label>
  <div class="pl2" id="pl2">${list.map(n=>`<button class="pr${have.has(n)?' on':''}" data-n="${n}" ${have.has(n)?'disabled':''}><span class="bx"></span><span class="nmx">${n}</span>${have.has(n)?'<span class="hv">已有</span>':''}</button>`).join('')}</div>
  <div class="acts" style="margin-top:10px"><button class="tx" id="puX">算了 ›</button><button class="go" id="puG" disabled>加进来 <b>0</b> 个</button></div>`;
  const upd=()=>{$('#puG').disabled=!pick.size;$('#puG b').textContent=pick.size};
  $$('#pl2 .pr:not([disabled])').forEach(b=>b.onclick=()=>{const n=b.dataset.n;pick.has(n)?pick.delete(n):pick.add(n);b.classList.toggle('on');upd()});
  $('#puI').oninput=e=>{const q=e.target.value.trim().toLowerCase();$$('#pl2 .pr').forEach(b=>b.hidden=q&&!b.dataset.n.includes(q))};
  $('#puX').onclick=()=>openPull(c);
  $('#puG').onclick=()=>{const add=[...pick];add.forEach(n=>c.mods.push([n,1,1]));renderDet();toast(`拉进来 ${add.length} 个模型`);printSeg({st:'ok',t:'拉进来 '+add.length+' 个',c:c.n,m:add[0]+(add.length>1?' 等':''),tm:MC.now()})};
 },900)}
function renderForm(d){const ed=mode==='edit',c=ed?CH[sel]:{n:'',h:'',f:'OpenAI'};let f=c.f||'OpenAI';
 d.innerHTML=`<h2>${ed?c.n:'新渠道'}<em>${ed?'edit':'new'}</em>${ed?'<button class="ed" id="bk">不改了</button>':''}</h2>
 <div class="f"><label for="fn">名字</label><input id="fn" maxlength="6" value="${c.n}" placeholder="给它起个名字"></div>
 <div class="f"><label for="fh">地址</label><input id="fh" class="mono" value="${c.h||''}" placeholder="api.example.com" inputmode="url" autocapitalize="off" spellcheck="false"></div>
 <div class="f"><label>格式</label><div class="seg-pick">${Object.keys(UP).map(k=>`<button data-f="${k}" class="${k===f?'on':''}">${k}</button>`).join('')}</div></div>
 ${ed?'':`<div class="f"><label for="fk">密钥</label><input id="fk" class="mono" placeholder="粘贴第一把密钥" autocomplete="off" spellcheck="false"></div>`}
 <div class="err" id="fe"></div>${MC.stamp(ed?'存':'开')}
 ${ed?'<div class="acts"><span></span><button class="tx danger" id="rip">撕掉这张单 ›</button></div>':''}`;
 const sv=d.querySelector('.sv'),ok=()=>{const a=$('#fn').value.trim(),b=$('#fh').value.trim(),k=ed?'x':$('#fk').value.trim();const dirty=ed?(a!==c.n||b!==(c.h||'')||f!==(c.f||'OpenAI')):true;sv.classList.toggle('mute',!(a&&b&&k&&dirty))};
 $$('#det input').forEach(i=>i.oninput=ok);
 $$('.seg-pick button').forEach(b=>b.onclick=()=>{f=b.dataset.f;$$('.seg-pick button').forEach(x=>x.classList.toggle('on',x===b));ok()});
 if(ed){$('#bk').onclick=()=>{mode='view';renderDet()};
  $('#rip').onclick=async()=>{const yes=window.MC&&MC.confirm?await MC.confirm({title:'撕掉这张单？',body:`「${c.n}」和它的 ${c.k} 把钥匙会一起拿掉，<b>撕了就得重新接</b>。`,ok:'撕掉'}):confirm('撕掉？');if(!yes)return;
   const gone=CH.splice(sel,1)[0];sel=Math.max(0,sel-1);mode='view';renderTags();renderDet();toast(`撕掉了「${gone.n}」`,{undo:()=>{CH.splice(CH.indexOf(CH[sel])+1,0,gone);renderTags();renderDet()}})}}
 sv.onclick=()=>{if(sv.classList.contains('mute'))return;const n=$('#fn').value.trim(),h=$('#fh').value.trim();
  if(CH.some((x,j)=>x.n===n&&(!ed||j!==sel))){$('#fe').textContent='已经有叫「'+n+'」的了';return}
  sv.classList.add('inked');
  setTimeout(()=>{if(ed){Object.assign(c,{n,h,f});toast('存好了')}else{const k=$('#fk').value.trim();CH.push({n,h,f,s:'making',k:1,keys:[['••••'+k.slice(-4),'连接中','']],mods:[]});sel=CH.length-1;
    printSeg({st:'making',t:'正在接',c:n,m:h,tm:MC.now()});
    setTimeout(()=>{const x=CH.find(y=>y.n===n);if(!x)return;x.s='ok';x.keys[0][1]='能用';x.keys[0][2]='ok';SEG[0]={...SEG[0],st:'ok',t:'接上了',nw:0};renderRoll();renderTags();if(mode==='view'&&CH[sel]===x)renderDet()},1800)}
   mode='view';renderTags();renderDet();
   const t=document.querySelector('.tg.sel');t&&t.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})},380)};
 ok()}
let cnt=1284;
function printSeg(x){SEG.forEach(s=>s.nw=0);SEG.unshift({...x,nw:1});cnt++;$('.win b').textContent=cnt.toLocaleString('en');renderRoll()}
function renderRoll(){MC.roll(document.getElementById('roll'),SEG)}
document.fonts.ready.then(()=>{renderTags();renderDet();renderRoll()});
</script></body></html>
