<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

const COL={steps:'#c69a7c',heart:'#d98b78',rest:'#d98b78',sleep:'#9fd6bf'};
// 演示数据：每天几条（类型、时间、名字、数值、单位）
const D=[];let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
for(let n=0;n<30;n++){const L=[];
 const sh=6+Math.floor(rnd()*2),sm=Math.floor(rnd()*6)*10;L.push(['sleep','07:'+String(10+Math.floor(rnd()*40)).padStart(2,'0'),'睡眠',sh+'<small>小时</small>'+sm,'分']);
 L.push(['rest','08:10','静息心率',String(55+Math.floor(rnd()*7)),'次/分']);
 if(n>0||true){L.push(['steps','09:00','步数','+'+(1200+Math.floor(rnd()*2400)).toLocaleString('en'),'']);L.push(['heart','09:55',
 '心率',String(70+Math.floor(rnd()*25)),'次/分']);}
 L.push(['steps','12:30','步数','+'+(600+Math.floor(rnd()*1800)).toLocaleString('en'),'']);if(n%2===0)L.push(['steps','12:52','步数','+'+(200+Math.floor(rnd()*600)).toLocaleString('en'),'']);
 if(n>0){L.push(['heart','18:20','心率',String(68+Math.floor(rnd()*30)),'次/分']);L.push(['steps','20:40','步数','+'+(900+Math.floor(rnd()*3000)).toLocaleString('en'),''])}
 D.push(L.reverse())}
const NM={'':'全部',steps:'步数',heart:'心率',rest:'静息心率',sleep:'睡眠'};
const RING=['M30 5C58 0 96 6 97 20C98 34 62 39 40 37C14 35 2 28 3 18C4 9 18 4 46 3C60 2.6 70 4 76 6','M64 4C90 6 99 16 96 26C92 37 58 39 34 37C10 35 1 26 4 16C7 7 26 2 52 2.5C64 3 74 6 80 9','M24 6C54 0 97 5 97 21C97 35 60 39 38 37C12 35 2 27 4 17C6 8 22 3 50 3C62 3 72 5 79 8'];
const ring=i=>`<svg viewBox="0 0 100 40" preserveAspectRatio="none"><path pathLength="1" d="${RING[i%3]}" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;

const IC={steps:'<i class="ik ks"></i>',heart:'<i class="ik kh"></i>',rest:'<i class="ik kr"></i>',sleep:'<i class="ik km"></i>'};
/* 06:20 茶茶同意：步数按小时合成一行（都是增量），心率/睡眠每条照写；不折叠 */
function merge(L){const o=[],by={};L.forEach(r=>{if(r[0]!=='steps'){o.push(r);return}const h=r[1].slice(0,2),v=+r[3].replace(/[+,]/g,'');
 if(by[h]){by[h].sum+=v;by[h].n++;by[h].r[3]='+'+by[h].sum.toLocaleString('en');by[h].r[1]=h+':00';by[h].r[5]=`<small class="hr">–${String(+h+1).padStart(2,'0')}:00 · ${by[h].n} 笔</small>`}
 else{const c=r.slice();by[h]={sum:v,n:1,r:c};o.push(c)}});return o}
const hx=t=>{const[h,m]=t.split(':').map(Number);return ((h*60+m)/1440*100).toFixed(1)};
let kd='',rng='7',days=3,calOn=false,cm=0;

 opts($('#dts'),[['7','最近 7 天'],['30','最近 30 天'],['pick','挑一天']],calOn?'pick':rng,v=>{if(v==='pick'){calOn=!calOn;draw();return}calOn=false;rng=v;days=3;draw()});cal();
 $('#sum').textContent=`${NM[kd]} · 最近 ${rng} 天`;render()}
function render(){const N=+rng;const g=[];let tot=0;
 for(let n=0;n<N;n++){const h=merge(D[n].filter(r=>!kd||r[0]===kd));if(h.length){g.push({n,h});tot+=h.length}}
 $('#cnt').innerHTML=`<b>${tot}</b> 条健康记录`;
 const show=g.slice(0,days);$('#more').hidden=g.length<=days;
 $('#res').innerHTML=show.map((x,k)=>{const d=ago(x.n);const lab=`${d.getMonth()+1}/${d.getDate()}`;return `<section class="tray day" data-l="${lab}">${k===0?'<img class="stk" src="st-star.png" alt="" style="right:20px;top:-16px;width:34px;rotate:12deg;--a:5deg">':''}<div class="dh"><span class="num">${lab}</span><small>周${WK[d.getDay()]}${x.n===0?' · 今天':x.n===1?' · 昨天':''}</small><b class="cnt">${x.h.length}<small>条</small></b></div>

  x.h.map(r=>`<div class="r" aria-label="${r[1]} ${r[2]} ${r[3].replace(/<[^>]+>/g,'')}${r[4]}">${IC[r[0]]}<span class="tm">${r[1]}${r[5]||''}</span><span class="ld"></span><span class="vl">${r[3]}<small>${r[4]}</small></span></div>`).join('')}</section>`}).join('');

 $('#empty').hidden=!!g.length}
$('#more').onclick=()=>{days+=3;render()};
/* 06:30 茶茶：要能挑某一天跳过去 → 筛选里「挑一天」原地展开月历（不弹窗）：有记录的日子下面一颗小珍珠，今天手绘圈，点了收起筛选并滚到那天 */
function cal(){const el=$('#cal');el.classList.toggle('on',calOn);if(!calOn){el.innerHTML='';return}
 const base=new Date(T.getFullYear(),T.getMonth()-cm,1),y=base.getFullYear(),m=base.getMonth(),nd=new Date(y,m+1,0).getDate(),lead=base.getDay();
 const ok=d=>{const n=Math.round((T-d)/864e5);return n>=0&&n<30&&D[n].some(r=>!kd||r[0]===kd)?n:-1};
 let h=`<div class="ch"><button type="button" class="cn" data-d="1" ${cm>=1?'disabled':''}>‹</button><b>${y} 年 ${m+1} 月</b><button type="button" class="cn" data-d="-1" ${cm<=0?'disabled':''}>›</button></div><div class="cg">${[...WK].map(w=>`<i>${w}</i>`).join('')}${'<span></span>'.repeat(lead)}`;
 for(let i=1;i<=nd;i++){const d=new Date(y,m,i),n=ok(d),fut=d>T,td=+d===+T;h+=`<button type="button" class="cd${n<0?' no':''}${fut?' fut':''}${td?' td':''}" ${n<0?'disabled':`data-n="${n}"`}>${i}${td?ring(2):''}</button>`}

 el.querySelectorAll('.cd[data-n]').forEach(b=>b.onclick=()=>jump(+b.dataset.n))}
function jump(n){rng='30';calOn=false;const g=[];for(let i=0;i<30;i++)if(D[i].some(r=>!kd||r[0]===kd))g.push(i);const at=g.indexOf(n);days=Math.max(days,at+3);

const sc=$('#page');let ht=0;

/* 06:22 茶茶：切换时像一滴奶茶——拉出细腰滑到下一颗，远了就断开再合上（metaball 连接路径用 JS 算，不挂 filter；思路同 Hiroyuki Sato metaballs） */
const GS='http://www.w3.org/2000/svg';let G=null,gk=-1,LY=0,TY=0,LV=0,TV=0,goY=0,goL=0,goT=0,gRaf=0;const R0=4.8;

function mb(r1,r2,y1,y2){const d=Math.abs(y2-y1);if(d<.5||d>(r1+r2)*2.2)return '';const sg=y2>y1?1:-1,c1={x:11,y:y1},c2={x:11,y:y2};
 const u1=d<r1+r2?Math.acos((r1*r1+d*d-r2*r2)/(2*r1*d)):0,u2=d<r1+r2?Math.acos((r2*r2+d*d-r1*r1)/(2*r2*d)):0;

 const dd=Math.hypot(p1.x-p3.x,p1.y-p3.y),k=Math.min(v*2.4,dd/(r1+r2))*Math.min(1,d*2/(r1+r2));
 const h1=P(p1,r1*k,a1-Math.PI/2),h2=P(p2,r1*k,a2+Math.PI/2),h3=P(p3,r2*k,a3+Math.PI/2),h4=P(p4,r2*k,a4-Math.PI/2),f=n=>n.toFixed(2);
 return `M${f(p1.x)} ${f(p1.y)}C${f(h1.x)} ${f(h1.y)} ${f(h3.x)} ${f(h3.y)} ${f(p3.x)} ${f(p3.y)}L${f(p4.x)} ${f(p4.y)}C${f(h4.x)} ${f(h4.y)} ${f(h2.x)} ${f(h2.y)} ${f(p2.x)} ${f(p2.y)}Z`}
function gooDraw(){const d=Math.abs(LY-TY),rl=R0*(1+.08*Math.min(1,d/20)),rt=R0*(1-.45*Math.min(1,d/26));const c=`<circle cx="11" cy="${LY.toFixed(2)}" r="${rl.toFixed(2)}"/>`+(rt>.6?`<circle cx="11" cy="${TY.toFixed(2)}" r="${rt.toFixed(2)}"/>`:'');
 const n=mb(rl,Math.max(rt,.6),LY,TY);const sh=c+(n?`<path d="${n}"/>`:'');G.querySelector('#gs').innerHTML=sh;G.querySelector('#gf').innerHTML=sh}
function gooTick(){LV=LV*.6+(goL-LY)*.3;LY+=LV;TV=TV*.66+(goT-TY)*.16;TY+=TV;gooDraw();

function gooAt(h,t,first){if(!G)return;goL=yOf(h);goT=yOf(t);if(first){LY=goL;TY=goT;gooDraw()}else if(!gRaf&&!document.hidden)gRaf=requestAnimationFrame(gooTick)}

 let q=0;if(k<ds.length-1){const fr=(mid-tp[k])/(tp[k+1]-tp[k]);q=Math.max(0,Math.min(1,(fr-.65)/.35))}
 const c=x=>Math.max(0,Math.min(1,x));gooAt(k+c(q*1.6),k+c(q*1.6-.6),gk<0);gk=k}

/* 底栏上方毛玻璃小圆钮：滑动时藏，停下 0.45 秒出来，点了到底 */
{const DB=document.createElement('button');DB.className='tobot';DB.setAttribute('aria-label','到底部');DB.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b3a2c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></svg>';$('#app').appendChild(DB);
