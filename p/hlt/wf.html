<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#e9ecea;font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:#555}
.app{position:relative;width:min(100%,412px);margin:0 auto;height:100%;overflow-y:auto;background:#f4f5f4;scrollbar-width:none}
.g{position:fixed;inset:0;pointer-events:none;width:min(100%,412px);margin:0 auto;z-index:50;display:none;background:repeating-linear-gradient(0deg,rgba(255,0,80,.07) 0 1px,transparent 1px 8px)}

body.grid .g{display:block}
.hd{height:96px;padding:48px 24px 0;display:flex;align-items:center;gap:16px}
.ci{width:36px;height:36px;border-radius:50%;background:#d6d9d7}
.hd h1{font-size:20px;font-weight:700;color:#444}
.hd .sp{margin-left:auto;font-size:12px;color:#999}
.tag{font-size:13px;color:#888;letter-spacing:.15em}
.hero{position:relative;height:284px;padding:24px 24px 0}
.hero .big{font-size:clamp(56px,17vw,72px);font-weight:800;line-height:1;color:#333;margin-top:16px;letter-spacing:-.02em}
.hero .u{font-size:13px;color:#888;margin-left:8px}
.hero .note{font-size:13px;color:#888;margin-top:16px;line-height:1.6;max-width:56%}
.hero .note b{color:#444}
.cup{position:absolute;right:24px;top:40px;width:88px;height:216px;border:2px dashed #bbb;border-radius:8px 8px 32px 24px;display:grid;grid-template-columns:24px 24px;align-content:end;gap:8px;padding:16px}
.cup span{width:24px;height:24px;border-radius:50%;background:#9a9e9b}.cup span.e{background:none;border:1.5px dashed #c4c7c5}
.cup em{position:absolute;right:0;top:-24px;white-space:nowrap;text-align:right;font:12px/1 system-ui;color:#aaa;font-style:normal}
.gap{height:40px}
.pair{display:grid;grid-template-columns:1fr 1fr;padding:0 24px;column-gap:24px;height:120px}
.rd .n{font-size:28px;font-weight:800;color:#444;margin-top:8px}.rd .n small{font-size:13px;font-weight:400;color:#888;margin-left:4px}
.rd .s{font-size:13px;color:#999;margin-top:8px}
.vis{height:24px;margin-top:8px;background:#dcdfdd;border-radius:4px}
.moon{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 70% 40%,#f4f5f4 0 9px,#9a9e9b 10px);margin-top:8px}
.rec{padding:24px 24px 0}
.rec .row{display:flex;gap:16px;align-items:center;height:48px;border-bottom:1px solid #e1e3e2;font-size:13px}
.rec .t{width:40px;color:#999}.rec .k{flex:1;color:#555}.rec .v{font-weight:700;color:#444}
.dot{width:8px;height:8px;border-radius:50%;background:#9a9e9b}
.more{display:block;text-align:right;font-size:13px;color:#444;padding:16px 0 0;text-decoration:underline;text-underline-offset:4px}
.src{padding:32px 24px 160px;font-size:12px;color:#aaa}
.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),380px);height:64px;border-radius:32px;background:#dfe2e0;display:flex;align-items:center;justify-content:space-around;font-size:12px;color:#888;z-index:40}
.lab{position:absolute;font-size:10px;color:#e0336a;font-family:monospace;letter-spacing:0}
.tg{position:fixed;top:12px;left:max(24px,calc(50% - 182px));z-index:60;font-size:11px;color:#e0336a;background:#fff;border:1px solid #e0336a;border-radius:4px;padding:4px 8px}
