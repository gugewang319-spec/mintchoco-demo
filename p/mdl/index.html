<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>模型</title>
<style>
@font-face{font-family:ZK;src:url(zk.ttf)}
@font-face{font-family:Baloo;src:url(baloo.ttf);font-weight:100 900}
@font-face{font-family:WK;src:url(wk.ttf)}
@font-face{font-family:Script;src:url(script.ttf)}
/* v29 手账式：先把底做好看，再在固定锚点放装饰。一种字（WK），一种纸，一个色相（薄荷）+ 可可 + 奶油 */
:root{--ch:#5b3a2c;--ink:#5e4c43;--ink2:#8b786d;--ink3:#ad9e94;--cocoa:#8a5c46;
 --m1:#eef6f0;--m2:#dcefe5;--m3:#bfe0d1;--m4:#4f977f;--warn:#a2573d;--e:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;outline:0;cursor:pointer}
button:focus-visible{outline:1.5px dashed var(--m4);outline-offset:3px;border-radius:8px}
img{display:block;user-select:none;-webkit-user-drag:none}
.vp{position:fixed;inset:0;overflow:hidden;background:#f0f3e8 url(paper-bg.jpg) 0 0/256px 256px}
.app{position:absolute;left:0;right:0;margin:0 auto;top:0;bottom:0;width:min(100%,412px);overflow:hidden;font-family:WK,serif}
.drizzle{position:absolute;left:0;top:0;width:100%;z-index:25;pointer-events:none}
.lhead{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:flex-end;justify-content:space-between;padding:58px 18px 0}
.ttl{position:relative}
.ttl h1{font:32px/1 ZK;color:var(--ch);letter-spacing:.06em;position:relative;z-index:1}
.ttl .sc{position:absolute;left:52px;top:-14px;font:22px/1 Script;color:rgba(63,154,128,.55);transform:rotate(-8deg);white-space:nowrap}
.lhead .counter{margin:0 0 4px}
.counter{display:inline-flex;gap:2px;padding:3px;border-radius:5px;background:#5b3a2c}
.counter span{display:inline-block;min-width:12px;padding:1px 2px;border-radius:2px;background:#fdf9f0;font:700 13px/1.3 Baloo;text-align:center;color:#4a3027}
.counter b{align-self:center;font:13px/1 ZK;color:#fdf9f0;padding:0 3px}
.pearlbtn{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:rgba(252,250,244,.62);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 8px 18px -12px rgba(74,48,39,.45)}
.pearlbtn svg{stroke:#5b3a2c}
.lhead .lf{display:flex;align-items:flex-end;gap:12px}

.menu{position:absolute;left:0;right:0;top:122px;bottom:0;overflow-y:auto;overflow-x:hidden;z-index:10;padding:14px 16px 150px;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent 0,#000 18px);mask-image:linear-gradient(transparent 0,#000 18px)}
.menu::-webkit-scrollbar{display:none}
.lede{display:inline-block;font:12px/1.5 WK;color:var(--ink2);padding:4px 6px 0;letter-spacing:.02em}

/* ---- 一张纸：中转站 ---- */
.st{position:relative;margin:30px 0 0;border-radius:14px;background:#fbf8ef url(paper-card.jpg) 0 0/256px 256px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 1px 1.5px rgba(91,58,44,.06),0 12px 22px -16px rgba(91,58,44,.22)}
.st::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:14px;background:#e8f2ea url(paper-mint.jpg) 0 0/256px 256px;
 transform:translate(3px,5px) rotate(.7deg);box-shadow:0 1px 2px rgba(91,58,44,.07)}
.st:nth-of-type(even)::before{transform:translate(-3px,5px) rotate(-.6deg)}
.st.first{margin-top:22px}
.sth{position:relative;padding:18px 118px 6px 18px;min-height:64px}
.sth h2{font:19px/1.3 WK;color:var(--ch);letter-spacing:.02em;font-weight:normal}
.sth .meta{font:12px/1.4 WK;color:var(--ink2);margin-top:3px}
/* 贴纸堆：只在右上角，pointer-events 关掉，绝不压字 */
.stk{position:absolute;right:-8px;top:-22px;width:124px;height:88px;pointer-events:none;z-index:3}
.stk img{position:absolute;filter:drop-shadow(0 1.5px 1px rgba(91,58,44,.16))}
.stk .sq{position:absolute;width:44px;height:44px;display:grid;place-items:center;filter:drop-shadow(0 1.5px 1px rgba(91,58,44,.18))}
.stk .sq img{position:absolute;inset:0;width:100%;height:100%;filter:none}
.stk .sq b{position:relative;font:18px/1 WK;font-weight:normal;color:#fbf2e2;text-shadow:0 1px 0 rgba(60,32,22,.35);letter-spacing:-.02em;margin-top:-2px}
.stk .sq b small{font-size:10.5px;margin-left:1px}
.stk .sq.bump{animation:bp .5s var(--e)}
@keyframes bp{30%{transform:scale(1.14) rotate(var(--r))}100%{transform:rotate(var(--r))}}

/* ---- 模型行 ---- */
.rows{list-style:none;padding:0 8px 2px}
.r{position:relative}
.r+.r::before{content:"";position:absolute;left:10px;right:10px;top:0;border-top:1px dotted rgba(138,92,70,.22)}
.rb{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:9px 10px;text-align:left;border-radius:10px;transition:background-color .14s}
.rb:active{background:rgba(191,224,209,.38);transition-duration:.16s}
.rb .tx{flex:1;min-width:0}
.rb .nm{display:block;font:15px/1.35 WK;color:var(--ink);overflow-wrap:anywhere;transition:color .2s}
.rb .fl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:3px;font:12px/1.3 WK;color:var(--ink3)}
.rb .fl i{font-style:normal;padding:1px 6px 1.5px;border-radius:7px;background:var(--m2);color:#3f7f69}
.rb .cx{flex:none;text-align:right;font:18px/1 WK;color:var(--ch);font-variant-numeric:tabular-nums}
.rb .cx small{font-size:12px;margin-left:1px;color:var(--ink2)}
.rb .cx em{display:block;font:12px/1.2 WK;font-style:normal;color:var(--ink3);margin-top:4px}
.rb .cv{flex:none;width:14px;height:14px;stroke:var(--ink3);transition:transform .3s var(--e)}
.r.op .rb .cv{transform:rotate(90deg);stroke:var(--m4)}
.r.op .rb .nm{color:#3f7f69}
.r.op .rb{background:rgba(191,224,209,.22)}
.r.dim{opacity:.36;transition:opacity .3s}
.r.hit .rb{animation:hit 1.4s ease-out}
@keyframes hit{0%,40%{background:rgba(191,224,209,.55)}100%{background:rgba(191,224,209,0)}}
.r.new{animation:nw .5s var(--e) both}
@keyframes nw{from{opacity:0;transform:translateY(-6px)}}
.nw{display:inline-block;margin-left:6px;font:12px/1 WK;color:#fbf2e2;background:var(--m4);padding:2px 5px 3px;border-radius:6px;vertical-align:2px;transform:rotate(-4deg)}

/* ---- 就地展开的编辑器 ---- */
.ex{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s var(--e)}
.r.op .ex{grid-template-rows:1fr}
.ex>div{overflow:hidden;min-height:0}
.edi{margin:2px 2px 12px;padding:14px 14px 10px;border-radius:12px;background:#ecf4ee url(paper-mint.jpg) 0 0/256px 256px;box-shadow:inset 0 1px 2px rgba(91,58,44,.07),inset 0 -1px 0 rgba(255,255,255,.6)}
.meter{position:relative;height:30px;margin:0 2px 6px}
.meter .tr{position:absolute;left:0;right:0;top:9px;height:8px;border-radius:4px;background:rgba(255,255,255,.7);box-shadow:inset 0 1px 1.5px rgba(91,58,44,.12)}
.meter .w,.meter .o{position:absolute;left:0;top:0;height:100%;border-radius:4px;transition:width .3s var(--e)}
.meter .w{background:var(--m3)}
.meter .o{background:#c9a28b;height:4px;top:2px;left:2px}
.meter .tk{position:absolute;top:21px;left:0;right:0;height:12px;font:10.5px/1 WK;color:var(--ink3)}.meter .tk span{position:absolute;top:0}
.ln{display:flex;align-items:center;gap:10px;min-height:46px}
.ln .k{width:40px;flex:none;font:13px/1 WK;color:var(--ink2);letter-spacing:.08em}
.scr{display:inline-flex;align-items:center;height:38px;border-radius:19px;background:rgba(255,255,255,.72);box-shadow:inset 0 0 0 1px rgba(138,92,70,.14),0 1px 0 rgba(255,255,255,.8);touch-action:none;user-select:none}
.scr .ar{width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.scr .ar svg{width:14px;height:14px;stroke:var(--cocoa)}
.scr .ar:active{background:rgba(191,224,209,.6)}
.scr .v{min-width:60px;text-align:center;font:18px/1 WK;color:var(--ch);font-variant-numeric:tabular-nums;cursor:ew-resize}
.scr .v small{font-size:12px;margin-left:1px;color:var(--ink2)}
.scr .v.flip{animation:fl .26s var(--e)}
@keyframes fl{from{transform:translateY(5px);opacity:.2}}
.ln .hint{font:12px/1.3 WK;color:var(--ink3);white-space:nowrap}
.stop{font:12px/1.4 WK;color:var(--warn);max-height:0;opacity:0;overflow:hidden;padding-left:50px;transition:max-height .25s,opacity .2s}
.stop.on{max-height:24px;opacity:1}
.scr.nudge{animation:ng .3s ease-in-out}
@keyframes ng{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.chk{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 10px 0 2px;font:15px/1 WK;color:var(--ink);border-radius:10px}
.chk:active{background:rgba(191,224,209,.45)}
.chk .bx{position:relative;width:22px;height:22px;flex:none}
.chk .bx svg{position:absolute;inset:-2px;width:26px;height:26px;overflow:visible}
.chk .ck{stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .3s steps(7,end)}
.chk.on .ck{stroke-dashoffset:0}
.sub{display:flex;align-items:baseline;justify-content:space-between;margin:10px 0 2px;padding-top:10px;border-top:1px dotted rgba(138,92,70,.22)}
.sub h3{font:13px/1 WK;font-weight:normal;color:var(--ink2);letter-spacing:.08em}
.sub span{font:12px/1 WK;color:var(--ink3)}
.chain{list-style:none;counter-reset:c}
.chain li{position:relative;display:flex;align-items:center;gap:8px;min-height:38px;font:15px/1.3 WK;color:var(--ink)}
.chain li .o{flex:none;width:30px;font:12px/1 WK;color:var(--ink2)}
.chain li .nm{position:relative;min-width:0;overflow-wrap:anywhere}
.chain li .nm::after{content:"";position:absolute;left:-2px;right:-2px;top:55%;height:1.5px;background:var(--cocoa);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--e)}
.chain li.out .nm{color:var(--ink3)}
.chain li.out .nm::after{transform:scaleX(1)}
.chain li .so{font:12px/1 WK;color:var(--warn);opacity:0;transition:opacity .2s;white-space:nowrap}
.chain li.out .so{opacity:1}
.chain li.serve .nm{color:#3f7f69;background:linear-gradient(transparent 58%,rgba(191,224,209,.9) 58% 94%,transparent 94%)}
.chain li.serve .so{opacity:1;color:#3f7f69}
.chain li .x{margin-left:auto;flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.chain li .x svg{width:12px;height:12px;stroke:var(--ink3)}
.chain li .x:active{background:rgba(162,87,61,.12)}
.chain li.go{animation:nw .35s var(--e)}
.chain li.rm{opacity:0;max-height:0;min-height:0;transition:opacity .2s,max-height .25s .1s,min-height .25s .1s;overflow:hidden}
.pick{display:flex;flex-wrap:wrap;gap:6px;max-height:0;overflow:hidden;opacity:0;transition:max-height .3s var(--e),opacity .2s,margin .3s}
.pick.on{max-height:220px;opacity:1;margin:6px 0 4px}
.pick button{font:13px/1 WK;color:var(--ink);padding:8px 10px;border-radius:15px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px rgba(138,92,70,.14)}
.pick button:active{background:var(--m3)}
.pick .none{font:12px/1.4 WK;color:var(--ink3)}
.acts{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;min-height:48px}
.acts .l{display:flex;gap:6px}
.btn2{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:18px;font:13px/1 WK;color:var(--ch);background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1.2px rgba(138,92,70,.38);transition:transform .12s}
.btn2:active{transform:scale(.96);background:var(--m2)}
.btn2 svg{width:13px;height:13px;stroke:var(--cocoa)}
.btn2.busy{opacity:.55}
.acts .r2{display:flex;align-items:center;gap:8px}
.save{width:48px;height:48px;border-radius:50%;background:#6b4a3a;color:#fbf2e2;font:15px/1 WK;display:grid;place-items:center;transform:scale(.6);opacity:0;pointer-events:none;transition:transform .26s var(--e),opacity .18s;box-shadow:0 6px 12px -8px rgba(91,58,44,.6),inset 0 1px 0 rgba(255,255,255,.18)}
.save.on{transform:scale(1);opacity:1;pointer-events:auto}
.save.on:active{transform:scale(.94)}
.saved{font:12px/1 WK;color:#3f7f69;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}

/* ---- 上新 ---- */
.stf{display:flex;align-items:center;justify-content:space-between;padding:4px 14px 12px 18px}
.stf .hint{font:12px/1.3 WK;color:var(--ink3);transition:color .2s}
.stf .hint.no{color:var(--warn)}
.up{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 13px 0 10px;border-radius:17px;font:13px/1 WK;color:#3f7f69;background:var(--m2);box-shadow:inset 0 0 0 1px rgba(79,151,127,.18);transition:transform .12s}
.up svg{width:13px;height:13px;stroke:#3f7f69}
.up:active{transform:scale(.95);background:var(--m3)}
.up.shake{animation:ng .3s ease-in-out}

/* ---- 分隔：一行巧克力扣和薄荷糖 ---- */
.hr{display:flex;justify-content:center;align-items:center;gap:12px;margin:36px 0 4px;opacity:.9}
.hr img{width:12px}
.hr img.b{width:15px}

/* ---- 本店加料 ---- */
.ft{margin-top:30px}
.ft .rows{padding-bottom:10px}
.fr{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 10px;border-radius:10px;font:15px/1 WK;color:var(--ink);text-align:left}
.fr:active{background:rgba(191,224,209,.38)}
.fr .bx{position:relative;width:22px;height:22px;flex:none}
.fr .bx svg{position:absolute;inset:-2px;width:26px;height:26px;overflow:visible}
.fr .ck{stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .3s steps(7,end)}
.fr.on .ck{stroke-dashoffset:0}
.fr.on .lb{color:#3f7f69}
.fr .ld{flex:1;border-bottom:1.5px dotted rgba(138,92,70,.3);transform:translateY(4px)}
.fr .n{font:12px/1 WK;color:var(--ink2)}
.fr .n b{font:18px/1 WK;font-weight:normal;color:var(--ch);margin-right:2px;font-variant-numeric:tabular-nums}
.ft .cap{font:12px/1.5 WK;color:var(--ink3);padding:0 18px 14px}
.empty{font:13px/1.5 WK;color:var(--ink3);padding:6px 18px 14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pnav{position:fixed;z-index:40;left:16px;right:16px;max-width:408px;margin:0 auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));height:62px;padding:5px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;border-radius:31px;background:rgba(252,250,244,.62);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 12px 26px -14px rgba(74,48,39,.45)}
.pill{position:absolute;z-index:0;top:5px;left:5px;height:52px;border-radius:26px;background:rgba(196,232,218,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);transition:transform 380ms cubic-bezier(.3,1.25,.5,1),width 380ms}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;border-radius:26px;color:#7a5a4c;text-align:center}.tab span{font-size:11px;line-height:1.2}.tab.on{color:#4a3027}.tab.on>span{font-weight:600}
.tab .dot{position:absolute;top:-1px;left:19px;width:7px;height:7px;border-radius:4px;background:#3f9a80;box-shadow:0 0 0 2px rgba(252,250,244,.95)}
/*nav-font 11-14*/.pnav,.pnav *{font-family:"OPPO Sans","HarmonyOS Sans SC","PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif}
</style></head><body>
<div class="vp"><div class="app" id="app">
<img class="drizzle" src="today-bg.png" alt="">
<header class="lhead"><div class="lf"><button class="pearlbtn" aria-label="回到设置"><svg width="22" height="22" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="m15 18-6-6 6-6"/></svg></button><div class="ttl"><span class="sc" aria-hidden="true">menu</span><h1>模型</h1></div></div><div class="counter"><span>5</span><b>杯</b></div></header>
<div class="menu" id="menu"></div>
<nav class="pnav" aria-label="主导航"><span class="pill" aria-hidden="true"></span>
<button class="tab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 13C5 8.6 8.4 6.6 12 6.6s7 2 9.5 6.4C19 17.3 15.6 19.2 12 19.2S5 17.3 2.5 13Z" fill="#c4e8da"/><circle cx="12" cy="12.9" r="3.3" fill="#5b3a2c"/><circle cx="13.2" cy="11.8" r="0.9" fill="#fbf6ea" stroke="none"/><path d="M8 6.1 7 4.2M12 5.4V3.3M16 6.1l1-1.9"/></svg><span>今天</span></button>
<button class="tab"><span style="position:relative;display:inline-flex"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="16.5" rx="2.6" fill="#c4e8da"/><path d="M8.2 3v16.5"/><path d="M13.7 13.4c-1.9-1.3-2.9-2.3-2.9-3.4a1.45 1.45 0 0 1 2.9-.5 1.45 1.45 0 0 1 2.9.5c0 1.1-1 2.1-2.9 3.4Z" fill="#5b3a2c" stroke="none"/><path d="M14.6 19.5v3l1.3-1 1.3 1v-3" fill="#fbf6ea"/></svg><span class="dot"></span></span><span>记忆</span></button>
<button class="tab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2c4.7 0 8.5 3.1 8.5 7s-3.8 7-8.5 7c-1 0-1.9-.1-2.8-.4L4.8 19.6l1.3-3.5C4.6 14.8 3.5 13.1 3.5 11.2c0-3.9 3.8-7 8.5-7Z" fill="#c4e8da"/><circle cx="8.6" cy="11.3" r="1.1" fill="#5b3a2c" stroke="none"/><circle cx="12" cy="11.3" r="1.1" fill="#5b3a2c" stroke="none"/><circle cx="15.4" cy="11.3" r="1.1" fill="#5b3a2c" stroke="none"/></svg><span>聊天</span></button>
<button class="tab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 21c.5-3.8 3.6-6.3 7.5-6.3s7 2.5 7.5 6.3Z" fill="#c4e8da"/><circle cx="12" cy="8.6" r="4.6" fill="#c4e8da"/><circle cx="10.3" cy="8.4" r="0.75" fill="#5b3a2c" stroke="none"/><circle cx="13.7" cy="8.4" r="0.75" fill="#5b3a2c" stroke="none"/><ellipse cx="9.4" cy="10.3" rx="0.9" ry="0.55" fill="#e7b4a4" stroke="none"/><ellipse cx="14.6" cy="10.3" rx="0.9" ry="0.55" fill="#e7b4a4" stroke="none"/></svg><span>人格</span></button>
<button class="tab on" aria-current="page"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2" stroke="#5b3a2c" stroke-width="3.2" stroke-dasharray="2.7 3.74"/><circle cx="12" cy="12" r="6.6" fill="#c4e8da" stroke="#5b3a2c" stroke-width="1.5"/><circle cx="12" cy="12" r="2.3" fill="#fbf6ea" stroke="#5b3a2c" stroke-width="1.5"/></svg><span>设置</span></button>
</nav>
</div></div>
<script>
const $=s=>document.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const STEPS=[4,8,16,32,64,128,200,400,1000];
const fmt=k=>k>=1000?{n:k/1000,u:'M'}:{n:k,u:'K'};
const fx=k=>{const f=fmt(k);return `${f.n}<small>${f.u}</small>`};
const tx=k=>{const f=fmt(k);return f.n+f.u};
let uid=0;
const M=(name,ctx,out,stream,vision)=>({id:++uid,name,ctx,out,stream,vision,chain:[],s:null});
const CH=[
 {name:'小鲸鱼中转',ms:[M('gpt-4o',128,16,true,true),M('gpt-4.1-mini',1000,32,true,true)],up:[['gpt-5-mini',400,128,true,true]]},
 {name:'Anthropic 官方',ms:[M('claude-sonnet-4',200,64,true,true),M('claude-haiku-4',200,8,true,false)],up:[['claude-opus-4',200,32,true,true]]},
 {name:'Gemini 小站',ms:[M('gemini-2.5-pro',1000,64,true,true)],up:[['gemini-2.5-flash',1000,64,true,true]]},
 {name:'薄荷中转',ms:[M('deepseek-v3',64,8,true,false),M('kimi-k2',128,16,true,false),M('qwen3-max',200,32,false,false)],up:[]},
 {name:'夜猫小站',ms:[M('grok-4',200,32,true,true),M('glm-4.6',200,32,true,false)],up:[['mistral-large',128,8,true,false]]},
];
CH[2].ms[0].chain=[CH[1].ms[0].id,CH[0].ms[0].id];
CH[1].ms[0].chain=[CH[0].ms[0].id];
const all=()=>CH.flatMap(c=>c.ms);
const byId=id=>all().find(m=>m.id==id);
const chOf=id=>CH.findIndex(c=>c.ms.some(m=>m.id==id));
let openId=null;const F={vision:false,stream:false};

// 每张纸右上角的一堆贴纸：巧克力块上写款数，其他是陪衬。坐标相对 124×88 的角
const ST=[
 [['leaf',56,-4,40,-14],['scoop',52,14,62,4],['SQ',6,34,-7]],
 [['roll',42,6,62,-18],['scoop2',70,34,46,6],['SQ',8,30,6]],
 [['shard',58,12,46,14],['btn',96,52,30,0],['spr',40,0,38,0],['SQ',10,32,-5]],
 [['wafer',74,10,36,8],['drops',44,52,34,0],['leaf',86,-6,40,22],['SQ',8,26,7]],
 [['scoop2',64,22,46,-5],['roll',50,-2,62,14],['spr',96,56,38,0],['SQ',8,34,-8]],
];
const FTSTK=[['leaf',50,-2,40,-18],['wafer',74,12,36,-8],['drops',56,42,34,0]];
function stk(list,n){return `<div class="stk" aria-hidden="true">${list.map(([k,x,y,w,r])=>k=='SQ'
 ?`<span class="sq" style="left:${x}px;top:${y}px;--r:${w}deg;transform:rotate(${w}deg)"><img src="k_sq.png" alt=""><b>${n}<small>款</small></b></span>`
 :`<img src="k_${k}.png" alt="" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${r}deg)">`).join('')}</div>`}

const CV=`<svg class="cv" viewBox="0 0 16 16" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3.5 4.5 4.5L6 12.5"/></svg>`;
const BOX=`<svg viewBox="0 0 26 26"><path d="M4.2 4.6c5.6-.5 11.6-.4 17.4.1.4 5.6.3 11.2-.2 16.9-5.7.4-11.5.4-17.1-.1-.4-5.6-.5-11.3-.1-16.9Z" fill="rgba(255,255,255,.7)" stroke="#8a5c46" stroke-width="1.25"/><path class="ck" d="M7 13.5l4 4.5L21 6" fill="none" stroke="#4f977f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const AR=d=>`<svg viewBox="0 0 16 16" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d?'m6 3.5 4.5 4.5L6 12.5':'M10 3.5 5.5 8l4.5 4.5'}"/></svg>`;
const PLUS=`<svg viewBox="0 0 16 16" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>`;
const XX=`<svg viewBox="0 0 16 16" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>`;

function flags(m){const a=[];if(m.vision)a.push('<i>看图</i>');if(m.stream)a.push('<i>流式</i>');return a.join('')+`<span>输出 ${tx(m.out)}</span>`}
function rowHTML(m){return `<li class="r${m.fresh?' new':''}" data-id="${m.id}"><button class="rb" aria-expanded="false"><span class="tx"><span class="nm">${m.name}${m.fresh?'<span class="nw">新</span>':''}</span><span class="fl">${flags(m)}</span></span><span class="cx">${fx(m.ctx)}<em>窗口</em></span>${CV}</button><div class="ex"><div></div></div></li>`}
function range(c){if(!c.ms.length)return '';const v=c.ms.map(m=>m.ctx);const a=Math.min(...v),b=Math.max(...v);return a==b?tx(a):tx(a)+'–'+tx(b)}
function metaTxt(c){return `窗口 ${range(c)}`}
function stHTML(c,ci){return `<section class="st${ci?'':' first'}" data-c="${ci}">${stk(ST[ci],c.ms.length)}<div class="sth"><h2>${c.name}</h2><p class="meta">${metaTxt(c)}</p></div>
<ul class="rows">${c.ms.map(rowHTML).join('')}</ul>
<div class="stf"><span class="hint">${c.up.length?`上游有 ${c.up.length} 款新的`:'上游暂时没有新的'}</span><button class="up" data-c="${ci}">${PLUS}上新</button></div></section>`}
function footHTML(){return `<div class="hr" aria-hidden="true"><img src="k_drop.png" alt=""><img class="b" src="k_btn.png" alt=""><img src="k_drop.png" alt=""><img class="b" src="k_btn.png" alt=""><img src="k_drop.png" alt=""></div>
<section class="st ft">${stk(FTSTK)}<div class="sth"><h2>本店加料</h2><p class="meta">勾上就只看有这一样的</p></div>
<div class="rows"><button class="fr" data-f="vision"><span class="bx">${BOX}</span><span class="lb">能看图</span><span class="ld"></span><span class="n"><b>0</b>款</span></button><button class="fr" data-f="stream"><span class="bx">${BOX}</span><span class="lb">流式</span><span class="ld"></span><span class="n"><b>0</b>款</span></button></div></section>`}
function build(){$('#menu').innerHTML=`<p class="lede">点一款就地改；改过才会出现「存」。</p>`+CH.map(stHTML).join('')+footHTML();bind();sums()}
function bind(){
 $$('.rb').forEach(b=>b.onclick=()=>toggle(+b.closest('.r').dataset.id));
 $$('.up').forEach(b=>b.onclick=()=>addNew(+b.dataset.c,b));
 $$('.fr').forEach(b=>b.onclick=()=>filt(b));
}
function sums(){const n=all().length;
 $('.counter').innerHTML=String(n).split('').map(d=>`<span>${d}</span>`).join('')+'<b>款</b>';
 $$('.fr').forEach(b=>b.querySelector('.n b').textContent=all().filter(m=>m[b.dataset.f]).length)}

// ---- 就地展开 ----
const pct=k=>{const i=STEPS.indexOf(k);return (Math.max(0,i)/(STEPS.length-1))*100};
function edHTML(m){const s=m.s||(m.s={ctx:m.ctx,out:m.out,stream:m.stream,vision:m.vision});
 return `<div class="edi"><div class="meter" aria-hidden="true"><div class="tr"><div class="w" style="width:${pct(s.ctx)}%"><div class="o" style="width:calc(${pct(s.out)/Math.max(pct(s.ctx),1)*100}% - 4px)"></div></div></div><div class="tk"><span style="left:0">4K</span><span style="left:62.5%;transform:translateX(-50%)">128K</span><span style="right:0">1M</span></div></div>
 <div class="ln"><span class="k">窗口</span><span class="scr" data-f="ctx"><button class="ar" aria-label="窗口小一档">${AR(0)}</button><span class="v">${fx(s.ctx)}</span><button class="ar" aria-label="窗口大一档">${AR(1)}</button></span><span class="hint">一次读多少</span></div>
 <div class="ln"><span class="k">输出</span><span class="scr" data-f="out"><button class="ar" aria-label="输出小一档">${AR(0)}</button><span class="v">${fx(s.out)}</span><button class="ar" aria-label="输出大一档">${AR(1)}</button></span><span class="hint">一次写多少</span></div>
 <div class="stop">输出要比窗口小</div>
 <div class="ln"><button class="chk${s.vision?' on':''}" data-f="vision"><span class="bx">${BOX}</span>能看图</button><button class="chk${s.stream?' on':''}" data-f="stream"><span class="bx">${BOX}</span>流式</button></div>
 <div class="sub"><h3>备用链</h3><span>上一个没回应就换下一个</span></div>
 <ol class="chain">${chainHTML(m)}</ol>
 <div class="pick"></div>
 <div class="acts"><span class="l"><button class="btn2" data-a="addc">${PLUS}加备用</button><button class="btn2" data-a="try">试一下</button></span><span class="r2"><span class="saved">存好了</span><button class="save" aria-label="存好改动">存</button></span></div></div>`}
function chainHTML(m){return [m.id,...m.chain].map((id,i)=>`<li data-i="${i}" data-id="${id}"><span class="o">${i?'备 '+i:'先'}</span><span class="nm">${byId(id).name}</span><span class="so"></span>${i?`<button class="x" aria-label="去掉这个备用">${XX}</button>`:''}</li>`).join('')}
function row(id){return $(`.r[data-id="${id}"]`)}
function toggle(id){
 if(openId){const r=row(openId);if(r){r.classList.remove('op');r.querySelector('.rb').setAttribute('aria-expanded','false')}}
 if(openId==id){openId=null;return}
 openId=id;const m=byId(id),r=row(id),box=r.querySelector('.ex>div');
 box.innerHTML=edHTML(m);bindEd(m,r);check(m,r);
 requestAnimationFrame(()=>{r.classList.add('op');r.querySelector('.rb').setAttribute('aria-expanded','true')});
 setTimeout(()=>{const mn=$('#menu'),rr=r.getBoundingClientRect(),vh=innerHeight-100;if(rr.bottom>vh)mn.scrollBy({top:Math.min(rr.bottom-vh,rr.top-150),behavior:'smooth'})},360);
}
function dirty(m){const s=m.s;return s.ctx!=m.ctx||s.out!=m.out||s.stream!=m.stream||s.vision!=m.vision}
function check(m,r){r.querySelector('.save').classList.toggle('on',dirty(m))}
function meter(m,r){const w=r.querySelector('.meter .w'),o=r.querySelector('.meter .o');w.style.width=pct(m.s.ctx)+'%';o.style.width=`calc(${pct(m.s.out)/Math.max(pct(m.s.ctx),1)*100}% - 4px)`}
function bindEd(m,r){
 $$('.scr',r).forEach(sc=>{const f=sc.dataset.f;let x0=null;const v=sc.querySelector('.v');
  const step=d=>{let i=STEPS.indexOf(m.s[f]);i=Math.max(0,Math.min(STEPS.length-1,i+d));const nv=STEPS[i];
   if(nv==m.s[f])return;
   // 输出必须小于窗口：碰到就停，并说一句
   if((f=='out'&&nv>=m.s.ctx)||(f=='ctx'&&nv<=m.s.out)){sc.classList.remove('nudge');void sc.offsetWidth;sc.classList.add('nudge');const st=r.querySelector('.stop');st.classList.add('on');clearTimeout(st._t);st._t=setTimeout(()=>st.classList.remove('on'),1800);return}
   m.s[f]=nv;v.innerHTML=fx(nv);v.classList.remove('flip');void v.offsetWidth;v.classList.add('flip');meter(m,r);check(m,r)};
  const [a,b]=sc.querySelectorAll('.ar');a.onclick=e=>{e.stopPropagation();step(-1)};b.onclick=e=>{e.stopPropagation();step(1)};
  v.addEventListener('pointerdown',e=>{x0=e.clientX;try{v.setPointerCapture(e.pointerId)}catch(_){}});
  v.addEventListener('pointermove',e=>{if(x0==null)return;const dx=e.clientX-x0;if(Math.abs(dx)>22){step(dx>0?1:-1);x0=e.clientX}});
  v.addEventListener('pointerup',()=>{x0=null});v.addEventListener('pointercancel',()=>{x0=null});
 });
 $$('.chk',r).forEach(b=>b.onclick=()=>{const f=b.dataset.f;m.s[f]=!m.s[f];b.classList.toggle('on',m.s[f]);check(m,r)});
 bindChain(m,r);
 r.querySelector('[data-a=try]').onclick=()=>tryIt(m,r);
 r.querySelector('[data-a=addc]').onclick=()=>{const p=r.querySelector('.pick');if(p.classList.contains('on')){p.classList.remove('on');return}
  const c=all().filter(x=>x.id!=m.id&&!m.chain.includes(x.id));
  p.innerHTML=c.length?c.map(x=>`<button data-id="${x.id}">${x.name}</button>`).join(''):'<span class="none">店里的都排上了</span>';
  $$('button',p).forEach(b=>b.onclick=()=>{m.chain.push(+b.dataset.id);p.classList.remove('on');redrawChain(m,r,true)});
  p.classList.add('on')};
 r.querySelector('.save').onclick=()=>{Object.assign(m,{ctx:m.s.ctx,out:m.s.out,stream:m.s.stream,vision:m.s.vision});
  r.querySelector('.fl').innerHTML=flags(m);r.querySelector('.rb .cx').innerHTML=fx(m.ctx)+'<em>窗口</em>';
  const st=r.closest('.st');st.querySelector('.meta').textContent=metaTxt(CH[+st.dataset.c]);
  check(m,r);sums();applyF();const sv=r.querySelector('.saved');sv.classList.add('on');setTimeout(()=>sv.classList.remove('on'),1500)};
}
function redrawChain(m,r,isNew){const ol=r.querySelector('.chain');ol.innerHTML=chainHTML(m);bindChain(m,r);if(isNew)ol.lastElementChild.classList.add('go')}
function bindChain(m,r){$$('.chain .x',r).forEach(x=>x.onclick=e=>{e.stopPropagation();const li=x.closest('li');const id=+li.dataset.id;li.classList.add('rm');
 setTimeout(()=>{m.chain=m.chain.filter(i=>i!=id);redrawChain(m,r)},320)})}
let trying=false;
async function tryIt(m,r){if(trying)return;trying=true;const w=ms=>new Promise(k=>setTimeout(k,ms));
 const lis=$$('.chain li',r),n=lis.length;
 if(n==1){lis[0].classList.add('serve');lis[0].querySelector('.so').textContent='接上了，没有备用'}
 else for(let i=0;i<n;i++){const li=lis[i],so=li.querySelector('.so');
  if(i==n-1){li.classList.add('serve');so.textContent='由它接手';break}
  li.classList.add('out');so.textContent='没回应';await w(650)}
 await w(1700);lis.forEach(l=>{l.classList.remove('out','serve');l.querySelector('.so').textContent=''});trying=false}

// ---- 上新：新的一行在本站末尾展开，巧克力块上的数跟着变 ----
function addNew(ci,btn){const c=CH[ci],st=btn.closest('.st'),hint=st.querySelector('.stf .hint');
 if(!c.up.length){btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');hint.textContent='上游没有新的了';hint.classList.add('no');setTimeout(()=>hint.classList.remove('no'),1400);return}
 const m=M(...c.up.shift());m.fresh=1;c.ms.push(m);
 st.querySelector('.rows').insertAdjacentHTML('beforeend',rowHTML(m));
 const sq=st.querySelector('.sq');sq.querySelector('b').innerHTML=`${c.ms.length}<small>款</small>`;sq.classList.remove('bump');void sq.offsetWidth;sq.classList.add('bump');
 st.querySelector('.meta').textContent=metaTxt(c);
 hint.textContent=c.up.length?`上游还有 ${c.up.length} 款`:'上游暂时没有新的';
 bind();sums();applyF();
 setTimeout(()=>{const n=row(m.id);n&&n.classList.remove('new')},600)}

// ---- 本店加料：勾上只看有这一样的 ----
function applyF(){const on=Object.keys(F).filter(k=>F[k]);
 all().forEach(m=>{const r=row(m.id);if(r)r.classList.toggle('dim',on.length>0&&!on.every(k=>m[k]))})}
function filt(b){const f=b.dataset.f;F[f]=!F[f];b.classList.toggle('on',F[f]);applyF();
 if(!F[f])return;const hit=all().filter(m=>Object.keys(F).every(k=>!F[k]||m[k]));
 if(!hit.length)return;const first=row(hit[0].id),mn=$('#menu');
 mn.scrollTo({top:first.closest('.st').offsetTop-12,behavior:'smooth'});
 hit.forEach((m,i)=>{const r=row(m.id);r.classList.remove('hit');setTimeout(()=>{void r.offsetWidth;r.classList.add('hit')},300+i*50)})}
build();
</script><script>window.__DEMO_MAP=[[".pearlbtn", "back", 0, 0]]</script><script src="../../bridge.js"></script><script src="../pfix.js?v=27"></script></body></html>
