<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>模型</title>
<style>
@font-face{font-family:ZK;src:url(zk.ttf)}
@font-face{font-family:Baloo;src:url(baloo.ttf);font-weight:100 900}
@font-face{font-family:WK;src:url(wk.ttf)}
@font-face{font-family:Script;src:url(script.ttf)}
/* v30 手账 · 设置式：薄荷竖条纹底 + 一张大纸卡，左栏竖排中转站，右边原地换内容。页面不会自己滚。 */
:root{--ch:#5b3a2c;--ink:#5e4c43;--ink2:#8b786d;--ink3:#ad9e94;--cocoa:#8a5c46;
 --m1:#eef6f0;--m2:#dcefe5;--m3:#bfe0d1;--m4:#4f977f;--mt:#3f7f69;--warn:#a2573d;--e:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;outline:0;cursor:pointer}
button:focus-visible,.hd:focus-visible{outline:1.5px dashed var(--m4);outline-offset:2px;border-radius:8px}
img{display:block;user-select:none;-webkit-user-drag:none}
/* 和今天/渠道/设置页同一张底：薄荷竖条纹 */
.vp{position:fixed;inset:0;overflow:hidden;background-color:#e4f3ed;background-image:radial-gradient(110% 50% at 15% 0%,rgba(255,255,255,.75),rgba(255,255,255,0) 60%),repeating-linear-gradient(90deg,#d7eee5 0,#d7eee5 18px,#edf8f3 18px,#edf8f3 36px)}
.app{position:absolute;left:0;right:0;margin:0 auto;top:0;bottom:0;width:min(100%,412px);overflow:hidden;font-family:WK,serif}
.drizzle{position:absolute;left:0;top:0;width:100%;z-index:25;pointer-events:none}
.lhead{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:flex-end;justify-content:space-between;padding:58px 18px 0}
.ttl{position:relative}
.ttl h1{font:32px/1 ZK;color:var(--ch);letter-spacing:.06em;position:relative;z-index:1}
.ttl .sc{position:absolute;left:52px;top:-14px;font:22px/1 Script;color:rgba(63,154,128,.55);transform:rotate(-8deg);white-space:nowrap}
.lhead .counter{margin:0 0 4px}
.counter{display:inline-flex;gap:2px;padding:3px;border-radius:5px;background:#5b3a2c}
.counter span{display:inline-block;min-width:12px;padding:1px 2px;border-radius:2px;background:#fdf9f0;font:700 13px/1.3 Baloo;text-align:center;color:#4a3027}
.counter b{align-self:center;font:13px/1 ZK;color:#fdf9f0;padding:0 3px}
.pearlbtn{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:rgba(252,250,244,.62);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 8px 18px -12px rgba(74,48,39,.45)}
.pearlbtn svg{stroke:#5b3a2c}
.lhead .lf{display:flex;align-items:flex-end;gap:12px}

.menu{position:absolute;left:0;right:0;top:122px;bottom:0;overflow-y:auto;overflow-x:hidden;z-index:10;padding:8px 12px 150px;scrollbar-width:none;overflow-anchor:none;-webkit-mask-image:linear-gradient(transparent 0,#000 18px);mask-image:linear-gradient(transparent 0,#000 18px)}
.menu::-webkit-scrollbar{display:none}
.lede{font:12px/1.5 WK;color:var(--ink2);padding:6px 6px 0;letter-spacing:.02em}

/* ---- 木牌标题：画出来的木牌，字用 WK 压在上面 ---- */
.sign{position:relative;z-index:4;width:156px;height:51px;margin:22px 0 -20px -2px;display:grid;place-items:center;transform:rotate(-2.5deg);pointer-events:none}
.sign img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 3px 2px rgba(91,58,44,.18))}
.sign b{position:relative;font:19px/1 WK;font-weight:normal;color:#5b3a2c;letter-spacing:.12em;margin:-1px 0 0 4px;text-shadow:0 1px 0 rgba(255,240,210,.7)}

/* ---- 大纸卡 ---- */
.card{position:relative;border-radius:16px;background:#fbf8ef url(paper-card.jpg) 0 0/256px 256px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 1px 1.5px rgba(91,58,44,.06),0 14px 24px -16px rgba(91,58,44,.28)}
.card::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:16px;background:#e8f2ea url(paper-mint.jpg) 0 0/256px 256px;transform:translate(3px,5px) rotate(.6deg);box-shadow:0 1px 2px rgba(91,58,44,.07)}
.bow{position:absolute;right:-10px;top:-24px;width:70px;z-index:5;pointer-events:none;transform:rotate(12deg);filter:drop-shadow(0 2px 1.5px rgba(91,58,44,.18))}
.mc{display:grid;grid-template-columns:var(--rw,94px) minmax(0,1fr);gap:0;padding:36px 0 10px;min-height:500px}

/* 左栏：竖排的中转站。站多了在栏里自己滚，不推页面 */
.rail{position:relative;display:flex;flex-direction:column;min-height:0;padding:0 4px 0 7px;border-right:1px dashed rgba(138,92,70,.2)}
.tabs{flex:0 1 auto;min-height:0;max-height:330px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;display:flex;flex-direction:column;gap:4px;padding:2px 0 6px}
.tabs::-webkit-scrollbar{display:none}
.tb{position:relative;flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;padding:8px 6px 8px 9px;border-radius:14px;text-align:left;transition:background-color .2s,box-shadow .2s}
.tb .n{font:13px/1.3 WK;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere;transition:color .2s}
.tb .c{font:12px/1 WK;color:var(--ink3);font-variant-numeric:tabular-nums}
.tb .c b{font-weight:normal;color:var(--ink2)}
.tb:active{background:rgba(191,224,209,.35)}
.tb.on{background:var(--m2);box-shadow:inset 0 0 0 1px rgba(79,151,127,.28),inset 0 1px 0 rgba(255,255,255,.75),0 2px 4px -2px rgba(63,127,105,.3)}
.tb.on .n{color:var(--mt)}
.tb.on .c b{color:var(--mt)}
.tb.dim{opacity:.4}
.tb .c.bump{animation:bp .5s var(--e)}
@keyframes bp{30%{transform:scale(1.25)}}
.rail .sp{flex:1 1 0;min-height:8px}
.sundae{flex:none;align-self:center;width:84px;margin:0 0 4px 2px;pointer-events:none;filter:drop-shadow(0 2px 1.5px rgba(91,58,44,.14))}

/* 右边：选中的站。换站、换款都在这里原地淡入淡出 */
.pane{position:relative;min-width:0;padding:0 12px 0 12px}
.fade{transition:opacity .14s ease}
.fade.out{opacity:0;transition-duration:.09s}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:2px 0 8px}
.ph h2{font:15px/1.3 WK;font-weight:normal;color:var(--ch);min-width:0;overflow-wrap:anywhere}
.ph span{flex:none;font:12px/1 WK;color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:34px;padding:6px 11px 6px 7px;border-radius:17px;font:13px/1.2 WK;color:var(--ink);background:rgba(255,255,255,.66);box-shadow:inset 0 0 0 1px rgba(138,92,70,.2),0 1px 0 rgba(255,255,255,.8);text-align:left;transition:background-color .2s,box-shadow .2s,opacity .3s}
.chip .dt{position:relative;flex:none;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.2px rgba(138,92,70,.45);background:#fffdf7;transition:background-color .2s,box-shadow .2s}
.chip .dt svg{position:absolute;inset:3px;width:10px;height:10px;opacity:0;transform:scale(.4);transition:opacity .18s,transform .25s var(--e)}
.chip .t{min-width:0;overflow-wrap:anywhere}
.chip.on{background:var(--m2);box-shadow:inset 0 0 0 1.2px rgba(79,151,127,.55),0 1px 0 rgba(255,255,255,.8);color:var(--mt)}
.chip.on .dt{background:var(--m4);box-shadow:none}
.chip.on .dt svg{opacity:1;transform:none}
.chip.ed::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:3px;background:#c9a28b;box-shadow:0 0 0 1.5px #fbf8ef}
.chip.dim{opacity:.35}
.chip.new{animation:nw .45s var(--e) both}
@keyframes nw{from{opacity:0;transform:scale(.85)}}
.chip .nw{font:12px/1 WK;color:#fbf2e2;background:var(--m4);padding:2px 4px 3px;border-radius:6px;transform:rotate(-4deg)}
.chip.add{color:var(--mt);background:transparent;box-shadow:none;border:1.2px dashed rgba(79,151,127,.55);padding:6px 11px 6px 9px}
.chip.add svg{width:12px;height:12px;stroke:var(--mt)}
.chip.add:active{background:rgba(191,224,209,.4)}
.chip.shake{animation:ng .3s ease-in-out}
.uph{font:12px/1.4 WK;color:var(--ink3);padding:6px 2px 0;min-height:22px;transition:color .2s}
.uph.no{color:var(--warn)}
.hr{height:0;border-top:1.5px dashed rgba(138,92,70,.2);margin:10px 0 0}

/* 设定区 */
.sub{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 0 6px}
.sub h3{flex:none;font:13px/1 WK;font-weight:normal;color:var(--ink2);letter-spacing:.08em}
.sub span{min-width:0;font:12px/1.2 WK;color:var(--ink3);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub span.mn{color:var(--mt)}
.meter{position:relative;height:28px;margin:0 2px 4px}
.meter .tr{position:absolute;left:0;right:0;top:6px;height:8px;border-radius:4px;background:rgba(255,255,255,.75);box-shadow:inset 0 1px 1.5px rgba(91,58,44,.12)}
.meter .w,.meter .o{position:absolute;left:0;top:0;height:100%;border-radius:4px;transition:width .3s var(--e)}
.meter .w{background:var(--m3)}
.meter .o{background:#c9a28b;height:4px;top:2px;left:2px}
.meter .tk{position:absolute;top:18px;left:0;right:0;height:12px;font:10.5px/1 WK;color:var(--ink3)}.meter .tk span{position:absolute;top:0}
.ln{display:flex;align-items:center;gap:8px;min-height:44px}
.ln .k{width:30px;flex:none;font:13px/1 WK;color:var(--ink2);letter-spacing:.04em}
.scr{display:inline-flex;align-items:center;height:36px;border-radius:18px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px rgba(138,92,70,.16),0 1px 0 rgba(255,255,255,.8);touch-action:none;user-select:none}
.scr .ar{width:34px;height:36px;display:grid;place-items:center;border-radius:50%}
.scr .ar svg{width:13px;height:13px;stroke:var(--cocoa)}
.scr .ar:active{background:rgba(191,224,209,.6)}
.scr .v{min-width:56px;text-align:center;font:18px/1 WK;color:var(--ch);font-variant-numeric:tabular-nums;cursor:ew-resize}
.scr .v small{font-size:12px;margin-left:1px;color:var(--ink2)}
.scr .v.flip{animation:fl .26s var(--e)}
@keyframes fl{from{transform:translateY(5px);opacity:.2}}
.ln .hint{display:none;font:12px/1.3 WK;color:var(--ink3);white-space:nowrap}
@media (min-width:400px){.ln .hint{display:inline}}
.stop{font:12px/1.4 WK;color:var(--warn);height:0;opacity:0;overflow:visible;padding-left:38px;transition:opacity .2s;position:relative;top:-6px}
.stop.on{opacity:1}
.scr.nudge,.chip.shake{animation:ng .3s ease-in-out}
@keyframes ng{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.tg{display:flex;align-items:center;gap:6px;min-height:44px;flex-wrap:nowrap}
.sw{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 4px 0 0;font:13px/1 WK;color:var(--ink);border-radius:12px;white-space:nowrap}
.sw .trk{position:relative;flex:none;width:40px;height:22px;border-radius:11px;background:#efe7da;box-shadow:inset 0 0 0 1.2px rgba(138,92,70,.35),inset 0 1.5px 2px rgba(91,58,44,.12);transition:background-color .22s}
.sw .knb{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
 background:radial-gradient(circle at 32% 30%,#9a6a51 0 1.4px,transparent 1.6px),radial-gradient(circle at 66% 40%,#3e251b 0 1.3px,transparent 1.5px),radial-gradient(circle at 42% 68%,#3e251b 0 1.2px,transparent 1.4px),radial-gradient(circle at 70% 72%,#9a6a51 0 1.1px,transparent 1.3px),radial-gradient(circle at 38% 32%,#86593f,#5b3a2c 70%);
 box-shadow:0 1.5px 2px rgba(60,32,22,.35),inset 0 0 0 1px rgba(60,32,22,.35);transition:transform .26s var(--e)}
.sw.on .trk{background:var(--m3);box-shadow:inset 0 0 0 1.2px rgba(79,151,127,.55),inset 0 1.5px 2px rgba(63,127,105,.15)}
.sw.on .knb{transform:translateX(18px)}
.sw.on .l{color:var(--mt)}
.save{margin-left:auto;flex:none;width:42px;height:42px;border-radius:50%;background:#6b4a3a;color:#fbf2e2;font:15px/1 WK;display:grid;place-items:center;transform:scale(.6);opacity:0;pointer-events:none;transition:transform .26s var(--e),opacity .18s;box-shadow:0 6px 12px -8px rgba(91,58,44,.6),inset 0 1px 0 rgba(255,255,255,.18)}
.save.on{transform:scale(1);opacity:1;pointer-events:auto}
.tg{position:relative}.saved{position:absolute;right:2px;top:50%;margin-top:-6px;font:12px/1 WK;pointer-events:none;color:var(--mt);opacity:0;transition:opacity .3s;white-space:nowrap}
.saved.on{opacity:1}
.save.on+.saved{display:none}

/* 备用链：带序号、可拖动排序的条子 */
.chain{list-style:none;position:relative}
.chain li{position:relative;display:flex;align-items:center;gap:6px;height:40px;margin-bottom:6px;padding:0 0 0 4px;border-radius:12px;background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(138,92,70,.16);font:13px/1.2 WK;color:var(--ink);transition:transform .2s var(--e),box-shadow .2s,background-color .2s}
.chain.dragging li{transition:transform .18s var(--e)}
.chain li.drag{z-index:3;transition:none!important;background:#fffdf6;box-shadow:inset 0 0 0 1.2px rgba(79,151,127,.5),0 10px 18px -8px rgba(91,58,44,.4);scale:1.03}
.chain li .no{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--m2);color:var(--mt);font:12px/1 WK;font-variant-numeric:tabular-nums}
.chain li .hd{flex:none;width:22px;height:40px;display:grid;place-items:center;touch-action:none;cursor:grab;border-radius:6px}
.chain li .hd svg{width:10px;height:16px;fill:var(--ink3)}
.chain li.drag .hd{cursor:grabbing}
.chain li.drag .hd svg{fill:var(--mt)}
.chain li .nm{flex:1;min-width:0;display:flex}
.chain li .nm i{position:relative;font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chain li .nm i::after{content:"";position:absolute;left:0;right:0;top:55%;height:1.5px;background:var(--cocoa);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--e)}
.chain li .so{flex:none;font:12px/1 WK;color:var(--warn);white-space:nowrap;display:none}
.chain li.out .nm{color:var(--ink3)}
.chain li.out .nm i::after{transform:scaleX(1)}
.chain li.out .so{display:inline}
.chain li.serve{background:rgba(220,239,229,.9)}
.chain li.serve .nm{color:var(--mt)}
.chain li.serve .so{display:inline;color:var(--mt)}
.chain li .x{flex:none;width:34px;height:38px;display:grid;place-items:center;border-radius:10px}
.chain li .x svg{width:11px;height:11px;stroke:var(--ink3)}
.chain li .x:active{background:rgba(162,87,61,.12)}
.chain li.go{animation:nw .35s var(--e)}
.chain li.rm{opacity:0;transform:translateX(16px);transition:opacity .2s,transform .2s}
.first{font:12px/1.5 WK;color:var(--ink3);padding:0 2px 6px}
.first b{font-weight:normal;color:var(--ink2)}
.first.serve b{color:var(--mt)}
.first.out b{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--cocoa)}
.empty{font:12px/1.5 WK;color:var(--ink3);padding:2px 2px 8px}
.pick{display:none;flex-wrap:wrap;gap:6px;padding:2px 0 6px}
.pick.on{display:flex;animation:nw .25s var(--e)}
.pick button{font:13px/1 WK;color:var(--ink);padding:8px 10px;border-radius:15px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px rgba(138,92,70,.16)}
.pick button:active{background:var(--m3)}
.pick .none{font:12px/1.4 WK;color:var(--ink3)}
.acts{display:flex;align-items:center;gap:6px;margin-top:4px;min-height:44px}
.btn2{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 11px;border-radius:17px;font:13px/1 WK;color:var(--ch);background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1.2px rgba(138,92,70,.38);white-space:nowrap}
.btn2:active{background:var(--m2)}
.btn2 svg{width:12px;height:12px;stroke:var(--cocoa)}
.btn2.busy{opacity:.55}

/* ---- 本店加料 ---- */
.ft{padding:30px 8px 6px}
.fr{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 10px;border-radius:10px;font:15px/1 WK;color:var(--ink);text-align:left}
.fr:active{background:rgba(191,224,209,.38)}
.fr .bx{position:relative;width:22px;height:22px;flex:none}
.fr .bx svg{position:absolute;inset:-2px;width:26px;height:26px;overflow:visible}
.fr .ck{stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .3s steps(7,end)}
.fr.on .ck{stroke-dashoffset:0}
.fr.on .lb{color:var(--mt)}
.fr .ld{flex:1;border-bottom:1.5px dotted rgba(138,92,70,.3);transform:translateY(4px)}
.fr .n{font:12px/1 WK;color:var(--ink2)}
.fr .n b{font:18px/1 WK;font-weight:normal;color:var(--ch);margin-right:2px;font-variant-numeric:tabular-nums}
.ft .cap{font:12px/1.5 WK;color:var(--ink3);padding:2px 10px 6px}
@media (min-width:400px){.mc{--rw:104px}.tb{padding:9px 10px 9px 12px}.sundae{width:92px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pnav{position:fixed;z-index:40;left:16px;right:16px;max-width:408px;margin:0 auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));height:62px;padding:5px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;border-radius:31px;background:rgba(252,250,244,.62);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 12px 26px -14px rgba(74,48,39,.45)}
.pill{position:absolute;z-index:0;top:5px;left:5px;height:52px;border-radius:26px;background:rgba(196,232,218,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);transition:transform 380ms cubic-bezier(.3,1.25,.5,1),width 380ms}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;border-radius:26px;color:#7a5a4c;text-align:center}.tab span{font-size:11px;line-height:1.2}.tab.on{color:#4a3027}.tab.on>span{font-weight:600}
.tab .dot{position:absolute;top:-1px;left:19px;width:7px;height:7px;border-radius:4px;background:#3f9a80;box-shadow:0 0 0 2px rgba(252,250,244,.95)}
/*nav-font 11-14*/.pnav,.pnav *{font-family:"OPPO Sans","HarmonyOS Sans SC","PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif}
</style></head><body>
<div class="vp"><div class="app" id="app">
<img class="drizzle" src="today-bg.png" alt="">
<header class="lhead"><div class="lf"><button class="pearlbtn" aria-label="回到设置"><svg width="22" height="22" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="m15 18-6-6 6-6"/></svg></button><div class="ttl"><span class="sc" aria-hidden="true">menu</span><h1>模型</h1></div></div><div class="counter"><span>5</span><b>杯</b></div></header>
<div class="menu" id="menu">
<p class="lede">左边选中转站，点小圆片换一款；改过才会出现「存」。</p>
<div class="sign" aria-hidden="true"><img src="k_sign.png" alt=""><b>模型菜单</b></div>
<section class="card" aria-label="模型菜单"><img class="bow" src="k_bow.png" alt="" aria-hidden="true">
 <div class="mc"><div class="rail"><div class="tabs" id="tabs" role="tablist" aria-orientation="vertical" aria-label="中转站"></div><div class="sp"></div><img class="sundae" src="k_sundae.png" alt="" aria-hidden="true"></div>
 <div class="pane" id="pane" role="tabpanel"></div></div>
</section>
<div class="sign" aria-hidden="true"><img src="k_sign.png" alt=""><b>本店加料</b></div>
<section class="card ft" aria-label="本店加料"><div id="ft"></div><p class="cap">勾上，没有这一样的就变淡</p></section>
</div>
<nav class="pnav" aria-label="主导航"><span class="pill" aria-hidden="true"></span>

<button class="tab on" aria-current="page"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2" stroke="#5b3a2c" stroke-width="3.2" stroke-dasharray="2.7 3.74"/><circle cx="12" cy="12" r="6.6" fill="#c4e8da" stroke="#5b3a2c" stroke-width="1.5"/><circle cx="12" cy="12" r="2.3" fill="#fbf6ea" stroke="#5b3a2c" stroke-width="1.5"/></svg><span>设置</span></button>

<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const STEPS=[4,8,16,32,64,128,200,400,1000];
const fmt=k=>k>=1000?{n:k/1000,u:'M'}:{n:k,u:'K'};
const fx=k=>{const f=fmt(k);return `${f.n}<small>${f.u}</small>`};
const tx=k=>{const f=fmt(k);return f.n+f.u};
let uid=0;
const M=(name,ctx,out,stream,vision)=>({id:++uid,name,ctx,out,stream,vision,chain:[],s:null});
const CH=[
 {name:'小鲸鱼中转',ms:[M('gpt-4o',128,16,true,true),M('gpt-4.1-mini',1000,32,true,true)],up:[['gpt-5-mini',400,128,true,true]]},
 {name:'Anthropic 官方',ms:[M('claude-sonnet-4',200,64,true,true),M('claude-haiku-4',200,8,true,false)],up:[['claude-opus-4',200,32,true,true]]},
 {name:'Gemini 小站',ms:[M('gemini-2.5-pro',1000,64,true,true)],up:[['gemini-2.5-flash',1000,64,true,true]]},
 {name:'薄荷中转',ms:[M('deepseek-v3',64,8,true,false),M('kimi-k2',128,16,true,false),M('qwen3-max',200,32,false,false)],up:[]},
 {name:'夜猫小站',ms:[M('grok-4',200,32,true,true),M('glm-4.6',200,32,true,false)],up:[['mistral-large',128,8,true,false]]},
];
CH[2].ms[0].chain=[CH[1].ms[0].id,CH[0].ms[0].id,CH[3].ms[0].id];
CH[1].ms[0].chain=[CH[0].ms[0].id,CH[2].ms[0].id];
CH[0].ms[0].chain=[CH[1].ms[0].id];
const all=()=>CH.flatMap(c=>c.ms);
const byId=id=>all().find(m=>m.id==id);
const F={vision:false,stream:false};
let cur=0;const sel=CH.map(c=>c.ms[0]?c.ms[0].id:null);

const CK=`<svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.2 4.2 7.4 8 2.8"/></svg>`;
const BOX=`<svg viewBox="0 0 26 26"><path d="M4.2 4.6c5.6-.5 11.6-.4 17.4.1.4 5.6.3 11.2-.2 16.9-5.7.4-11.5.4-17.1-.1-.4-5.6-.5-11.3-.1-16.9Z" fill="rgba(255,255,255,.7)" stroke="#8a5c46" stroke-width="1.25"/><path class="ck" d="M7 13.5l4 4.5L21 6" fill="none" stroke="#4f977f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const AR=d=>`<svg viewBox="0 0 16 16" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d?'m6 3.5 4.5 4.5L6 12.5':'M10 3.5 5.5 8l4.5 4.5'}"/></svg>`;
const PLUS=`<svg viewBox="0 0 16 16" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>`;
const XX=`<svg viewBox="0 0 16 16" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>`;
const GRIP=`<svg viewBox="0 0 10 16"><circle cx="3" cy="3" r="1.4"/><circle cx="7" cy="3" r="1.4"/><circle cx="3" cy="8" r="1.4"/><circle cx="7" cy="8" r="1.4"/><circle cx="3" cy="13" r="1.4"/><circle cx="7" cy="13" r="1.4"/></svg>`;

const matchF=m=>Object.keys(F).every(k=>!F[k]||m[k]);
const fOn=()=>F.vision||F.stream;
function range(c){if(!c.ms.length)return '';const v=c.ms.map(m=>m.ctx);const a=Math.min(...v),b=Math.max(...v);return a==b?tx(a):tx(a)+'–'+tx(b)}

// ---- 左栏 ----
function tabsHTML(){return CH.map((c,i)=>{const hit=c.ms.filter(matchF).length;
 return `<button class="tb${i==cur?' on':''}${fOn()&&!hit?' dim':''}" role="tab" aria-selected="${i==cur}" data-c="${i}"><span class="n">${c.name}</span><span class="c"><b>${fOn()?hit+'/':''}${c.ms.length}</b> 款</span></button>`}).join('')}
function drawTabs(){const t=$('#tabs'),st=t.scrollTop;t.innerHTML=tabsHTML();t.scrollTop=st;
 $$('.tb',t).forEach(b=>b.onclick=()=>pickStation(+b.dataset.c))}

// ---- 右边 ----
function chipHTML(m){return `<button class="chip${m.id==sel[cur]?' on':''}${m.s&&dirty(m)?' ed':''}${fOn()&&!matchF(m)?' dim':''}${m.fresh?' new':''}" data-id="${m.id}" aria-pressed="${m.id==sel[cur]}"><span class="dt">${CK}</span><span class="t">${m.name}</span>${m.fresh?'<span class="nw">新</span>':''}</button>`}
function paneHTML(){const c=CH[cur];
 return `<div class="ph"><h2>${c.name}</h2><span>窗口 ${range(c)}</span></div>
 <div class="chips">${c.ms.map(chipHTML).join('')}<button class="chip add" data-a="up">${PLUS}上新</button></div>
 <p class="uph">${c.up.length?`上游有 ${c.up.length} 款新的`:'上游暂时没有新的'}</p>
 <div class="hr"></div><div class="ed fade" id="ed">${sel[cur]?edHTML(byId(sel[cur])):'<p class="empty">这一站还没有模型，点「上新」进一款。</p>'}</div>`}
const pct=k=>{const i=STEPS.indexOf(k);return (Math.max(0,i)/(STEPS.length-1))*100};
function S(m){return m.s||(m.s={ctx:m.ctx,out:m.out,stream:m.stream,vision:m.vision})}
function edHTML(m){const s=S(m);
 return `<div class="sub"><h3>设定</h3><span class="mn">${m.name}</span></div>
 <div class="meter" aria-hidden="true"><div class="tr"><div class="w" style="width:${pct(s.ctx)}%"><div class="o" style="width:calc(${pct(s.out)/Math.max(pct(s.ctx),1)*100}% - 4px)"></div></div></div><div class="tk"><span style="left:0">4K</span><span style="left:62.5%;transform:translateX(-50%)">128K</span><span style="right:0">1M</span></div></div>
 <div class="ln"><span class="k">窗口</span><span class="scr" data-f="ctx"><button class="ar" aria-label="窗口小一档">${AR(0)}</button><span class="v">${fx(s.ctx)}</span><button class="ar" aria-label="窗口大一档">${AR(1)}</button></span><span class="hint">一次读多少</span></div>
 <div class="ln"><span class="k">输出</span><span class="scr" data-f="out"><button class="ar" aria-label="输出小一档">${AR(0)}</button><span class="v">${fx(s.out)}</span><button class="ar" aria-label="输出大一档">${AR(1)}</button></span><span class="hint">一次写多少</span></div>
 <div class="stop">输出要比窗口小</div>
 <div class="tg"><button class="sw${s.vision?' on':''}" data-f="vision" role="switch" aria-checked="${s.vision}"><span class="l">看图</span><span class="trk"><span class="knb"></span></span></button><button class="sw${s.stream?' on':''}" data-f="stream" role="switch" aria-checked="${s.stream}"><span class="l">流式</span><span class="trk"><span class="knb"></span></span></button><button class="save${dirty(m)?' on':''}" aria-label="存好改动">存</button><span class="saved">存好了</span></div>
 <div class="hr"></div>
 <div class="sub"><h3>备用链</h3><span>没回应就按顺序换</span></div>
 <p class="first">先用 <b>${m.name}</b></p>
 <ol class="chain">${chainHTML(m)}</ol>
 <div class="pick"></div>
 <div class="acts"><button class="btn2" data-a="addc">${PLUS}加备用</button><button class="btn2" data-a="try">试一下</button></div>`}
function chainHTML(m){if(!m.chain.length)return '';return m.chain.map((id,i)=>`<li data-id="${id}"><span class="no">${i+1}</span><span class="hd" tabindex="0" aria-label="按住拖动换顺序，也可用上下键">${GRIP}</span><span class="nm"><i>${byId(id).name}</i></span><span class="so"></span><button class="x" aria-label="去掉这个备用">${XX}</button></li>`).join('')}
function dirty(m){const s=m.s;return !!s&&(s.ctx!=m.ctx||s.out!=m.out||s.stream!=m.stream||s.vision!=m.vision)}

// 原地淡出→换内容→淡入；不碰滚动位置
function swap(el,html,after){el.classList.add('out');setTimeout(()=>{el.innerHTML=html;after&&after();requestAnimationFrame(()=>el.classList.remove('out'))},90)}
function drawPane(fade){const p=$('#pane');const go=()=>{bindPane()};if(fade){p.classList.add('fade');swap(p,paneHTML(),go)}else{p.innerHTML=paneHTML();go()}}
function bindPane(){const p=$('#pane');
 $$('.chip[data-id]',p).forEach(b=>b.onclick=()=>pickModel(+b.dataset.id));
 $('[data-a=up]',p).onclick=e=>addNew(e.currentTarget);
 if(sel[cur])bindEd(byId(sel[cur]));
}
function pickStation(i){if(i==cur)return;cur=i;closeTry();
 $$('.tb').forEach((b,j)=>{b.classList.toggle('on',j==i);b.setAttribute('aria-selected',j==i)});drawPane(true)}
function pickModel(id){if(id==sel[cur])return;sel[cur]=id;closeTry();
 $$('#pane .chip[data-id]').forEach(b=>{const on=+b.dataset.id==id;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
 swap($('#ed'),edHTML(byId(id)),()=>bindEd(byId(id)))}
function chipMark(m){const c=$(`#pane .chip[data-id="${m.id}"]`);c&&c.classList.toggle('ed',dirty(m))}

function meter(m){const w=$('#ed .meter .w'),o=$('#ed .meter .o');w.style.width=pct(m.s.ctx)+'%';o.style.width=`calc(${pct(m.s.out)/Math.max(pct(m.s.ctx),1)*100}% - 4px)`}
function check(m){$('#ed .save').classList.toggle('on',dirty(m));chipMark(m)}
function bindEd(m){const r=$('#ed');
 $$('.scr',r).forEach(sc=>{const f=sc.dataset.f;let x0=null;const v=$('.v',sc);
  const step=d=>{let i=STEPS.indexOf(m.s[f]);i=Math.max(0,Math.min(STEPS.length-1,i+d));const nv=STEPS[i];
   if(nv==m.s[f])return;
   if((f=='out'&&nv>=m.s.ctx)||(f=='ctx'&&nv<=m.s.out)){sc.classList.remove('nudge');void sc.offsetWidth;sc.classList.add('nudge');const st=$('.stop',r);st.classList.add('on');clearTimeout(st._t);st._t=setTimeout(()=>st.classList.remove('on'),1800);return}
   m.s[f]=nv;v.innerHTML=fx(nv);v.classList.remove('flip');void v.offsetWidth;v.classList.add('flip');meter(m);check(m)};
  const [a,b]=$$('.ar',sc);a.onclick=()=>step(-1);b.onclick=()=>step(1);
  v.addEventListener('pointerdown',e=>{x0=e.clientX;try{v.setPointerCapture(e.pointerId)}catch(_){}});
  v.addEventListener('pointermove',e=>{if(x0==null)return;const dx=e.clientX-x0;if(Math.abs(dx)>22){step(dx>0?1:-1);x0=e.clientX}});
  v.addEventListener('pointerup',()=>{x0=null});v.addEventListener('pointercancel',()=>{x0=null});
 });
 $$('.sw',r).forEach(b=>b.onclick=()=>{const f=b.dataset.f;m.s[f]=!m.s[f];b.classList.toggle('on',m.s[f]);b.setAttribute('aria-checked',m.s[f]);check(m)});
 $('.save',r).onclick=()=>{Object.assign(m,{ctx:m.s.ctx,out:m.s.out,stream:m.s.stream,vision:m.s.vision});
  $('#pane .ph span').textContent='窗口 '+range(CH[cur]);check(m);sums();applyF();
  const sv=$('.saved',r);sv.classList.add('on');setTimeout(()=>sv.classList.remove('on'),1500)};
 bindChain(m);
 $('[data-a=try]',r).onclick=()=>tryIt(m);
 $('[data-a=addc]',r).onclick=()=>{const p=$('.pick',r);if(p.classList.contains('on')){p.classList.remove('on');return}
  const c=all().filter(x=>x.id!=m.id&&!m.chain.includes(x.id));
  p.innerHTML=c.length?c.map(x=>`<button data-id="${x.id}">${x.name}</button>`).join(''):'<span class="none">店里的都排上了</span>';
  $$('button',p).forEach(b=>b.onclick=()=>{m.chain.push(+b.dataset.id);p.classList.remove('on');redrawChain(m,true)});
  p.classList.add('on')};
}
function redrawChain(m,isNew){const ol=$('#ed .chain');ol.innerHTML=chainHTML(m);bindChain(m);if(isNew&&ol.lastElementChild)ol.lastElementChild.classList.add('go')}
function bindChain(m){const ol=$('#ed .chain');
 $$('.x',ol).forEach(x=>x.onclick=()=>{const li=x.closest('li'),id=+li.dataset.id;li.classList.add('rm');
  setTimeout(()=>{m.chain=m.chain.filter(i=>i!=id);redrawChain(m)},220)});
 $$('.hd',ol).forEach(h=>{h.addEventListener('pointerdown',e=>startDrag(e,m,h));
  h.addEventListener('keydown',e=>{if(e.key!='ArrowUp'&&e.key!='ArrowDown')return;e.preventDefault();
   const i=[...ol.children].indexOf(h.closest('li')),j=i+(e.key=='ArrowUp'?-1:1);if(j<0||j>=m.chain.length)return;
   const [x]=m.chain.splice(i,1);m.chain.splice(j,0,x);redrawChain(m);$$('.hd',ol)[j].focus({preventScroll:true})})});
}

// ---- 拖动排序：按住 ⋮⋮ 上下拖，别的条子让位；松手落定 ----
let dragging=null;
function startDrag(e,m,h){if(dragging||(e.button!=null&&e.button>0))return;e.preventDefault();
 const li=h.closest('li'),ol=li.parentElement,lis=[...ol.children],i0=lis.indexOf(li);
 if(lis.length<2){li.classList.add('drag');setTimeout(()=>li.classList.remove('drag'),160);return}
 const H=lis[1].getBoundingClientRect().top-lis[0].getBoundingClientRect().top;
 const y0=e.clientY;let at=i0;try{h.setPointerCapture(e.pointerId)}catch(_){}
 li.classList.add('drag');ol.classList.add('dragging');dragging={li};
 const nums=()=>lis.forEach((l,j)=>{let p=j;if(l===li)p=at;else if(i0<at&&j>i0&&j<=at)p=j-1;else if(i0>at&&j<i0&&j>=at)p=j+1;$('.no',l).textContent=p+1});
 const mv=ev=>{let dy=ev.clientY-y0;const lo=-i0*H-10,hi=(lis.length-1-i0)*H+10;dy=Math.max(lo,Math.min(hi,dy));
  li.style.transform=`translateY(${dy}px)`;const ni=Math.max(0,Math.min(lis.length-1,Math.round(i0+dy/H)));
  if(ni!=at){at=ni;lis.forEach((l,j)=>{if(l===li)return;let s=0;if(i0<at&&j>i0&&j<=at)s=-H;if(i0>at&&j<i0&&j>=at)s=H;l.style.transform=s?`translateY(${s}px)`:''});nums()}};
 const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
  li.style.transition='transform .18s cubic-bezier(.23,1,.32,1)';li.style.transform=`translateY(${(at-i0)*H}px)`;li.classList.remove('drag');
  setTimeout(()=>{const [x]=m.chain.splice(i0,1);m.chain.splice(at,0,x);ol.classList.remove('dragging');redrawChain(m);dragging=null},190)};
 h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
}

// ---- 试一下：先试本款，没回应就沿着备用链往下 ----
let trying=null;
function closeTry(){trying&&(trying.dead=true);trying=null}
async function tryIt(m){if(trying)return;const t=trying={};const w=ms=>new Promise(k=>setTimeout(k,ms));
 const r=$('#ed'),fs=$('.first',r),lis=$$('.chain li',r),b=$('[data-a=try]',r);b.classList.add('busy');
 const fb=$('b',fs);
 if(!lis.length){fs.classList.add('serve');fb.insertAdjacentHTML('afterend','<em class="tmp" style="font-style:normal;color:#3f7f69"> 接上了</em>')}
 else{fs.classList.add('out');fb.insertAdjacentHTML('afterend','<em class="tmp" style="font-style:normal;color:#a2573d"> 没回应</em>');await w(650);
  for(let i=0;i<lis.length;i++){if(t.dead)return;const li=lis[i],so=$('.so',li);
   if(i==lis.length-1){li.classList.add('serve');so.textContent='由它接手';break}
   li.classList.add('out');so.textContent='没回应';await w(650)}}
 await w(1700);if(t.dead)return;
 fs.classList.remove('out','serve');$$('.tmp',fs).forEach(x=>x.remove());lis.forEach(l=>{l.classList.remove('out','serve');$('.so',l).textContent=''});b.classList.remove('busy');trying=null}

// ---- 上新：新的一款作为小圆片出现在本站，左栏的数跟着变 ----
function addNew(btn){const c=CH[cur],h=$('#pane .uph');
 if(!c.up.length){btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');h.textContent='上游没有新的了';h.classList.add('no');setTimeout(()=>h.classList.remove('no'),1400);return}
 const m=M(...c.up.shift());m.fresh=1;c.ms.push(m);
 btn.insertAdjacentHTML('beforebegin',chipHTML(m));const ch=btn.previousElementSibling;ch.onclick=()=>pickModel(m.id);
 setTimeout(()=>{ch.classList.remove('new')},500);
 h.textContent=c.up.length?`上游还有 ${c.up.length} 款`:'上游暂时没有新的';
 $('#pane .ph span').textContent='窗口 '+range(c);
 drawTabs();const cc=$(`.tb[data-c="${cur}"] .c`);cc.classList.add('bump');
 if(!sel[cur]){sel[cur]=m.id;pickModelForce(m.id)}
 sums()}
function pickModelForce(id){$$('#pane .chip[data-id]').forEach(b=>b.classList.toggle('on',+b.dataset.id==id));swap($('#ed'),edHTML(byId(id)),()=>bindEd(byId(id)))}

// ---- 本店加料：勾上，没有这一样的变淡（不跳、不滚） ----
function ftHTML(){return `<button class="fr${F.vision?' on':''}" data-f="vision"><span class="bx">${BOX}</span><span class="lb">能看图</span><span class="ld"></span><span class="n"><b>0</b>款</span></button><button class="fr${F.stream?' on':''}" data-f="stream"><span class="bx">${BOX}</span><span class="lb">流式</span><span class="ld"></span><span class="n"><b>0</b>款</span></button>`}
function sums(){const n=all().length;
 $('.counter').innerHTML=String(n).split('').map(d=>`<span>${d}</span>`).join('')+'<b>款</b>';
 $$('.fr').forEach(b=>$('.n b',b).textContent=all().filter(m=>m[b.dataset.f]).length)}
function applyF(){drawTabs();$$('#pane .chip[data-id]').forEach(b=>b.classList.toggle('dim',fOn()&&!matchF(byId(+b.dataset.id))))}
function filt(b){const f=b.dataset.f;F[f]=!F[f];b.classList.toggle('on',F[f]);applyF()}
