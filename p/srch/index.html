<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>搜索聊天记录</title>
<style>
@font-face{font-family:ZK;src:url(zk.ttf)}
@font-face{font-family:Baloo;src:url(baloo.ttf);font-weight:100 900}
@font-face{font-family:BalooX;src:url(baloo800.ttf)}
@font-face{font-family:Script;src:url(script.ttf)}
@font-face{font-family:WK;src:url(wk.ttf)}
:root{--ch:#5b3a2c;--ink:#4a3027;--cocoa:#8a5c46;--mint3:#2f6e58;--mintb:#3f9a80}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;color:var(--ink)}
button,input{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}
img{display:block;user-select:none;-webkit-user-drag:none}
.vp{position:fixed;inset:0;overflow:hidden;background-color:#e7f4ee;background-image:radial-gradient(120% 40% at 20% 0%,rgba(255,255,255,.8),rgba(255,255,255,0) 60%),linear-gradient(180deg,#e8f6f0 0%,#e3f2ea 30%,#e9ecdf 52%,#eadfcf 70%,#ddc6ad 88%,#cfb193 100%)}
.app{position:absolute;left:0;right:0;margin:0 auto;top:0;bottom:0;width:min(100%,440px);overflow:hidden}
.drizzle{position:absolute;left:0;top:0;width:100%;z-index:25;pointer-events:none}
.pearls{position:absolute;left:-4%;right:-4%;bottom:-46px;z-index:1;pointer-events:none;opacity:.8}
.pearls img{width:100%}
.sc{position:absolute;inset:0;z-index:5;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;
 -webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 190px),transparent calc(100% - 100px));mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 190px),transparent calc(100% - 100px))}
.sc::-webkit-scrollbar{display:none}
.page{position:relative;min-height:100%;padding:0 34px 300px 24px}
canvas#fx{position:absolute;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}

.lhead{display:flex;align-items:flex-end;justify-content:space-between;padding:66px 0 0}
.ttl{position:relative}
.ttl h1{font:32px/1 ZK;color:var(--ch);letter-spacing:.06em;position:relative;z-index:1}
.ttl .s{position:absolute;left:52px;top:-14px;font:22px/1 Script;color:rgba(63,154,128,.55);transform:rotate(-8deg);white-space:nowrap}
.cancel{font:15px/1 ZK;color:var(--cocoa);letter-spacing:.06em;padding:8px 2px}

/* 搜索：字直接写在奶茶上，下面一道巧克力酱 */
.qa{position:relative;margin-top:34px;padding-right:86px}
.qa input{width:100%;font:400 27px/1.3 ZK;color:var(--ch);letter-spacing:.04em;caret-color:var(--mintb);padding:4px 0 8px}
.qa input::placeholder{color:rgba(138,92,70,.38)}
.qa input::-webkit-search-cancel-button{display:none}
.qa svg.line{position:absolute;left:-4px;right:70px;top:46px;width:calc(100% - 66px);height:22px;overflow:visible;pointer-events:none}
.qa svg.line path{fill:#5b3a2c;stroke:#3b2219;stroke-width:.9;stroke-linejoin:round}
.sieve{position:absolute;right:-30px;top:-14px;width:118px;transform-origin:62% 46%}
.sieve img{width:100%;transform:rotate(-16deg)}
.sieve span{position:absolute;right:30px;top:74px;font:11.5px/1 ZK;color:var(--cocoa);letter-spacing:.1em;white-space:nowrap;opacity:.8}

/* 筛选：一行小字，点开就地展开 */
.fl{margin-top:30px}
.fbar{display:flex;align-items:baseline;justify-content:space-between}
.fbar button{font:13px/1 ZK;color:var(--cocoa);letter-spacing:.08em;display:flex;align-items:baseline;gap:6px;padding:4px 0}
.fbar .ar{font-style:normal;font-size:10px;transition:transform .3s;display:inline-block}
.fl.open .fbar .ar{transform:rotate(180deg)}
.fbar i{font:13px/1 ZK;font-style:normal;color:var(--mint3);letter-spacing:.08em}
.box{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.3,1,.5,1)}
.fl.open .box{grid-template-rows:1fr}
.box>div{overflow:hidden}
.row{display:flex;gap:14px;align-items:baseline;padding:12px 0 2px}
.row>span{flex:none;width:30px;font:12px/1 ZK;color:var(--cocoa);letter-spacing:.12em}
.opts{display:flex;flex-wrap:wrap;gap:6px 18px}
.op{position:relative;font:15px/1.6 WK;color:rgba(74,48,39,.72);padding:2px 1px}
.op.on{color:var(--ch);font-weight:700}
.op svg{position:absolute;left:-8px;top:-4px;width:calc(100% + 16px);height:calc(100% + 8px);overflow:visible;pointer-events:none}
.op svg path{stroke-dasharray:1.02;stroke-dashoffset:1.02;transition:stroke-dashoffset .45s ease-out}
.op.on svg path{stroke-dashoffset:0}
.cal{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.3,1,.5,1)}
.cal.on{grid-template-rows:1fr}
.cal>div{overflow:hidden}
.mrow{display:flex;align-items:center;justify-content:space-between;margin:8px 0 2px}
.mrow h3{font:700 15px/1 Baloo,ZK;color:var(--ch)}
.mrow button{width:34px;height:34px;font:18px/1 system-ui;color:var(--cocoa)}
.mrow button[aria-disabled=true]{opacity:.25}
.wkd,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wkd span{font:11.5px/2 WK;color:rgba(122,90,76,.75)}
.days{isolation:isolate}
.d{position:relative;height:38px;font:600 14px/38px Baloo,ZK;color:var(--ink)}
.d.no{color:rgba(74,48,39,.22)}
.d .dot{position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--mintb)}
.d.in::before{content:"";position:absolute;inset:5px -1px;z-index:-1;background-image:radial-gradient(circle,#fffdf8 0 1.1px,transparent 1.7px),radial-gradient(circle,#fffdf8 0 .8px,transparent 1.3px);background-size:6px 6px,5px 5px;background-position:0 0,3px 2px}
.d.ed::after{content:"";position:absolute;inset:4px 6px;border:1.6px solid var(--ch);border-radius:50% 46% 52% 48%;transform:rotate(-8deg)}

/* 结果：没有框。糖粉大日期左右交错，正文始终左对齐 */
.res{margin-top:18px}
.day{position:relative;padding:26px 0 30px;isolation:isolate}
.day:last-of-type::before{-webkit-mask-image:linear-gradient(#000 calc(100% - 120px),transparent);mask-image:linear-gradient(#000 calc(100% - 120px),transparent)}
.day::before{content:"";position:absolute;top:0;bottom:0;left:-24px;right:-34px;background:var(--lay);z-index:-1}
.dh{display:flex;align-items:flex-end;gap:10px}
.day.r .dh{flex-direction:row-reverse;text-align:right}
.num{position:relative;font-family:BalooX,ZK;font-weight:400;line-height:.9;letter-spacing:-.01em;color:transparent;
 background:linear-gradient(180deg,#86563f 0%,#6b4433 50%,#5b3a2c 100%);-webkit-background-clip:text;background-clip:text;
 opacity:0;filter:blur(5px);transform:translateY(-10px)}
.dh small{font:13px/1.3 ZK;color:var(--mint3);letter-spacing:.08em;padding-bottom:6px;opacity:0;transition:opacity .5s .2s}
.dh small b{display:block;font:600 12px/1.2 Baloo,ZK;color:var(--cocoa);letter-spacing:0}
.on .num{opacity:1;filter:none;transform:none;transition:opacity .5s,filter .7s,transform .7s cubic-bezier(.3,1.5,.5,1)}
.on .dh small{opacity:1}
.hits{margin-top:14px}
.hit{display:block;width:100%;text-align:left;opacity:0;transform:translateY(26px)}
.on .hit{opacity:1;transform:none;transition:opacity .5s,transform .75s cubic-bezier(.3,1.45,.5,1)}
.hit+.hit{margin-top:22px}
.hit>p{font:17px/1.75 WK;color:var(--ink);word-break:break-word}
.hit mark{background:linear-gradient(180deg,transparent 60%,rgba(166,217,196,.9) 60% 92%,transparent 92%);color:var(--ch);font-weight:700;padding:0 1px}
.hit>small{display:block;margin-top:3px;font:12px/1.4 WK;color:rgba(122,90,76,.8);letter-spacing:.04em}
.hit>small em{font:600 12px/1 Baloo,ZK;font-style:normal}
/* 就地展开前后文：像贺卡打开 */
.ctx{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.3,1.2,.5,1)}
.ctx>div{overflow:hidden}
.ctx p{font:15px/1.7 WK;color:rgba(74,48,39,.6);padding-left:12px;border-left:1.2px dashed rgba(138,92,70,.45);transform:rotateX(70deg);transform-origin:50% 0;transition:transform .5s cubic-bezier(.3,1.3,.5,1);opacity:.0}
.ctx.a p{transform-origin:50% 100%}
.ctx p span{display:block;font:11.5px/1.4 ZK;color:rgba(122,90,76,.7);letter-spacing:.08em}
.hit.open .ctx{grid-template-rows:1fr}
.hit.open .ctx p{transform:none;opacity:1;transition:transform .5s cubic-bezier(.3,1.3,.5,1),opacity .3s}
.ctx.b p{margin-bottom:8px}.ctx.a p{margin-top:8px}

/* 天与天之间：一道奶层波浪，越往下越深 */
.wave{display:block;position:relative;width:calc(100% + 58px);margin-left:-24px;height:22px;overflow:visible}
/* 小料：只在页边，半截探出屏幕 */
.gar{position:absolute;z-index:3;pointer-events:auto;transform-origin:50% 80%}
.gar img{width:100%}

/* 右边一列小圆点：日期索引 */
.idx{position:absolute;right:6px;top:50%;z-index:22;display:flex;flex-direction:column;gap:2px;transform:translateY(-50%);transition:opacity .5s;opacity:0}
.idx.show,.idx:active{opacity:1}
.idx[hidden]{display:none}
.idx button{position:relative;width:22px;height:20px}
.idx button::before{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(138,92,70,.45);transition:transform .35s cubic-bezier(.3,1.6,.5,1),background .3s}
.idx button.on::before{background:#a6d9c4;box-shadow:0 0 0 1.2px var(--cocoa);transform:scale(1.6)}
.idx button span{position:absolute;right:22px;top:50%;transform:translateY(-50%);font:600 11px/1 Baloo,ZK;color:var(--cocoa);opacity:0;transition:opacity .3s;white-space:nowrap}
.idx button.on span{opacity:1}

.more{display:block;margin:26px 0 0;font:14px/1 ZK;color:var(--mint3);letter-spacing:.1em;padding:6px 0 4px;border-bottom:1.2px dashed var(--mint3)}
.empty{margin:36px 0 0;font:17px/1.9 WK;color:var(--cocoa)}
.empty small{display:block;font:12.5px/1.6 ZK;color:rgba(122,90,76,.7)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* 返回钮（11-12） */
.lhead{justify-content:flex-start!important;align-items:center!important;gap:12px}
.pearlbtn{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.pearlbtn:active{transform:scale(.92)}
.pearlbtn{background:rgba(252,250,244,.62)!important;backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);border:1px solid rgba(255,255,255,.85)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 8px 18px -12px rgba(74,48,39,.45)!important}
.pearlbtn svg{stroke:#5b3a2c!important}.pearlbtn .dots{fill:#5b3a2c!important}
/*hdr-align 11-13*/.lhead{margin-left:-6px;margin-top:-8px;align-items:flex-end!important}</style></head><body>
<div class="vp"><div class="app">
<img class="drizzle" src="today-bg.png" alt="">
<div class="pearls"><img src="pearls.png" alt=""></div>
<div class="sc" id="sc"><div class="page">
 <header class="lhead"><button class="pearlbtn back" type="button" aria-label="返回聊天列表"><svg width="22" height="22" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="m15 18-6-6 6-6"/></svg></button><div class="ttl"><span class="s" aria-hidden="true">search</span><h1>搜索</h1></div></header>

 <form class="qa" id="q" autocomplete="off" role="search">
  <input id="qi" type="search" placeholder="想找哪句话" value="布丁" aria-label="搜索聊天记录" enterkeyhint="search">
  <svg class="line" id="line" aria-hidden="true"><path/></svg>
  <button type="submit" class="sieve" id="sieve" aria-label="筛一筛"><img src="sieve-s.png" alt=""><span>点我筛</span></button>
 </form>

 <div class="fl" id="fl">
  <div class="fbar"><button type="button" id="flb" aria-expanded="false"><span id="sum">全部入口 · 最近 30 天</span><em class="ar">▾</em></button><i id="cnt"></i></div>
  <div class="box"><div>
   <div class="row"><span>入口</span><div class="opts" id="ens"></div></div>
   <div class="row"><span>日期</span><div class="opts" id="dts"></div></div>
   <div class="cal" id="cal"><div>
    <div class="mrow"><button type="button" id="pm" aria-label="上个月">‹</button><h3 id="mt"></h3><button type="button" id="nm" aria-label="下个月">›</button></div>
    <div class="wkd"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="days" id="days"></div>
   </div></div>
  </div></div>
 </div>

 <div class="res" id="res"></div>
 <p class="empty" id="empty" hidden></p>
 <button type="button" class="more" id="more" hidden>再筛一点</button>
</div></div>
<nav class="idx" id="idx" hidden></nav>
<canvas id="fx"></canvas>
</div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const T=new Date();T.setHours(0,0,0,0);const ago=n=>{const d=new Date(T);d.setDate(d.getDate()-n);return d};
const WK='日一二三四五六';
// 演示数据。字段对应接口：created_at、snippet、speaker、entry_kind；前后文为演示
const HITS=[
 [0,'今天下班顺路买了焦糖布丁，给你留了一口。','我','TG','21:14','下班了吗？','留一口是多大一口？'],
 [1,'你说布丁要先冰两个小时才好吃，我照做了。冰箱里那两个，一个写了你的名字。','我','QQ','13:02','中午吃了什么？','那我晚上回来吃写着我名字的那个。'],
 [3,'布丁杯底那层焦糖最好吃，别让我抢。','他','API','22:40','你吃东西是不是先挑最好的？','抢不过你，那就分你一半。'],
 [3,'抢不过你，那就分你一半布丁。','我','API','22:41','布丁杯底那层焦糖最好吃，别让我抢。','成交。'],
 [9,'周末想自己做布丁，模具要买哪种？','我','QQ','10:27','这周末不出门了。','陶瓷的那种，好脱模。'],
 [17,'第一次聊到布丁，是你说想吃甜的那天。','他','TG','23:58','你还记得我们第一次聊什么吗？','原来你都记得。'],
 [24,'那家店的布丁换了包装，味道还是一样。','我','TG','19:06','路过那家店了。','包装好看吗？'],
];
const EN={TG:'Telegram',API:'API',QQ:'QQ'};
const REC=new Set([0,1,3,5,9,12,17,21,24,26].map(n=>ago(n).toDateString()));
const RING=['M30 5C58 0 96 6 97 20C98 34 62 39 40 37C14 35 2 28 3 18C4 9 18 4 46 3C60 2.6 70 4 76 6','M64 4C90 6 99 16 96 26C92 37 58 39 34 37C10 35 1 26 4 16C7 7 26 2 52 2.5C64 3 74 6 80 9','M24 6C54 0 97 5 97 21C97 35 60 39 38 37C12 35 2 27 4 17C6 8 22 3 50 3C62 3 72 5 79 8'];
const ring=i=>`<svg viewBox="0 0 100 40" preserveAspectRatio="none"><path pathLength="1" d="${RING[i%3]}" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
let ent='',rng='30',cs=null,ce=null,shown=6,mon=new Date(T.getFullYear(),T.getMonth(),1);
const qi=$('#qi'),q=$('#q'),sc=$('#sc');
$('#flb').onclick=()=>{const o=$('#fl').classList.toggle('open');$('#flb').setAttribute('aria-expanded',o)};

/* ---------- 巧克力酱横线（带两三滴） ---------- */
const LINE={drips:[]};
function lineShape(){const s=$('#line'),w=s.getBoundingClientRect().width;LINE.w=w;LINE.drips=[0.18,0.52,0.81].map((p,i)=>({x:w*p,wd:5+i%2*3,base:5+i*3,per:3.1+i*.9,ph:i*1.7}))}
function lineDraw(t,on){const w=LINE.w;if(!w)return;let d=`M2 3 Q${w*.25} 1 ${w*.5} 2.6 T${w-2} 2.4 Q${w} 3.4 ${w-3} 5.2`;
 const ds=[...LINE.drips].sort((a,b)=>b.x-a.x);
 for(const u of ds){const L=u.base+(on?Math.sin(t*6.283/u.per+u.ph)*1.6:0)+(LINE.k?Math.exp(-(t-LINE.k)*2.4)*7:0);
  d+=` L${(u.x+u.wd/2).toFixed(1)} 5.2 C${(u.x+u.wd/2).toFixed(1)} ${(5+L*.6).toFixed(1)} ${(u.x+u.wd*.5).toFixed(1)} ${(5+L).toFixed(1)} ${u.x.toFixed(1)} ${(5+L).toFixed(1)} C${(u.x-u.wd*.5).toFixed(1)} ${(5+L).toFixed(1)} ${(u.x-u.wd/2).toFixed(1)} ${(5+L*.6).toFixed(1)} ${(u.x-u.wd/2).toFixed(1)} 5.2`}
 d+=` L4 5.4 Q0 5 2 3Z`;$('#line path').setAttribute('d',d)}

/* ---------- 小料 ---------- */
const FLOATS=[];
function garnish(host,src,w,css,rot){const e=document.createElement('span');e.className='gar';e.innerHTML=`<img src="${src}" alt="">`;e.style.cssText=`width:${w}px;${css}`;host.appendChild(e);
 const f={e,rot,per:3.4+Math.random()*2.8,ph:Math.random()*6.28,a:1.8,ra:2.6,sp:{x:0,v:0},vis:true};FLOATS.push(f);return f}
const SV={e:$('#sieve'),rot:0,per:6.8,ph:1,a:1.2,ra:1.6,sp:{x:0,v:0},vis:true};FLOATS.push(SV);
garnish($('.lhead'),'leaf.png',24,'right:-14px;top:150px',-24);

/* ---------- 筛选 ---------- */
function opts(el,list,cur,on){el.innerHTML=list.map((e,i)=>`<button type="button" class="op${e[0]===cur?' on':''}" data-v="${e[0]}">${e[1]}${ring(i)}</button>`).join('');
 el.querySelectorAll('.op').forEach(b=>b.onclick=()=>on(b.dataset.v))}
function drawOpts(){
 opts($('#ens'),[['','全部入口'],['TG','Telegram'],['API','API'],['QQ','QQ']],ent,v=>{ent=v;drawOpts();go()});
 const cl=cs&&ce?`${cs.getMonth()+1}/${cs.getDate()} 至 ${ce.getMonth()+1}/${ce.getDate()}`:'选日期';
 opts($('#dts'),[['30','最近 30 天'],['7','最近 7 天'],['c',cl]],rng,v=>{rng=v;$('#cal').classList.toggle('on',v==='c');drawOpts();if(v!=='c'||(cs&&ce))go()});
 $('#sum').textContent=`${ent?EN[ent]:'全部入口'} · ${rng==='c'?cl:rng==='7'?'最近 7 天':'最近 30 天'}`;
}
function cal(){const y=mon.getFullYear(),m=mon.getMonth();$('#mt').textContent=`${y} 年 ${m+1} 月`;
 const lead=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();let h='';
 for(let i=0;i<lead;i++)h+='<span></span>';
 for(let d=1;d<=n;d++){const dt=new Date(y,m,d),fut=dt>T;let c='d';if(fut)c+=' no';
  if(cs&&ce&&dt>=cs&&dt<=ce)c+=' in';if((cs&&+dt===+cs)||(ce&&+dt===+ce))c+=' ed';
  h+=`<button type="button" class="${c}" data-d="${d}">${d}${REC.has(dt.toDateString())&&!fut?'<i class="dot"></i>':''}</button>`}
 $('#days').innerHTML=h;$('#nm').setAttribute('aria-disabled',y===T.getFullYear()&&m===T.getMonth());
 $$('#days .d').forEach(b=>b.onclick=()=>{const dt=new Date(y,m,+b.dataset.d);if(dt>T)return;
  if(!cs||ce){cs=dt;ce=null}else{ce=dt;if(ce<cs)[cs,ce]=[ce,cs]}cal();drawOpts();if(cs&&ce)go()})}
$('#pm').onclick=()=>{mon.setMonth(mon.getMonth()-1);cal()};
$('#nm').onclick=()=>{if($('#nm').getAttribute('aria-disabled')==='true')return;mon.setMonth(mon.getMonth()+1);cal()};

/* ---------- 结果 ---------- */
function inR(n){const d=ago(n);if(rng==='7')return n<7;if(rng==='c')return cs&&ce&&d>=cs&&d<=ce;return n<30}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// 奶层颜色：薄荷奶 → 奶茶 → 可可，越旧越深
const LAY=['rgba(244,251,247,0)','rgba(240,232,214,.45)','rgba(232,214,188,.55)','rgba(214,186,155,.55)','rgba(196,160,128,.5)','rgba(176,138,108,.5)'];
const SUG=['#fbfffc','#f8f6ee','#f7eee0','#f3e4cf','#efdcc3','#ead2b6'];

function wave(i){const c=LAY[Math.min(i,LAY.length-1)],c0=LAY[Math.min(i-1,LAY.length-1)],W=480,a=4+i%2*2,k=2+i%2;

 return `<svg class="wave" viewBox="0 0 ${W} 22" preserveAspectRatio="none" aria-hidden="true" style="background:${c0}"><polygon points="0,22 ${top}${W},22" fill="${c}"/><polyline points="${top}" fill="none" stroke="#8a5c46" stroke-opacity=".4" stroke-width="1.1" vector-effect="non-scaling-stroke"/></svg>`}
let groups=[],io=null;

   x.h.map((h,j)=>`<button type="button" class="hit" style="transition-delay:${i*110+120+j*70}ms"><div class="ctx b"><div><p><span>前一句 · ${h[2]==='我'?'他':'我'}</span>${esc(h[5])}</p></div></div><p>${esc(h[1]).split(esc(kw)).join(`<mark>${esc(kw)}</mark>`)}</p><small>${h[2]} · ${EN[h[3]]} · <em>${h[4]}</em></small><div class="ctx a"><div><p><span>后一句 · ${h[2]==='我'?'他':'我'}</span>${esc(h[6])}</p></div></div></button>`).join('')}</div></section>`}).join('');
 $$('#res .day').forEach((el,i)=>{el.querySelector('.num').style.transitionDelay=`${i*110}ms`;el.querySelector('.dh small').style.transitionDelay=`${i*110+250}ms`;const a=GAR[i%GAR.length];const f=garnish(el,a[0],a[1],a[2],a[3]);f.day=1;f.sec=el});

const cv=$('#fx'),cx=cv.getContext('2d');let P=[],raf=0,DPR=Math.min(2,devicePixelRatio||1);

function grains(n,x0,x1,y0,y1,vy){for(let i=0;i<n;i++)P.push({x:x0+Math.random()*(x1-x0),y:y0+Math.random()*(y1-y0),vy:vy+Math.random()*1.2,vx:(Math.random()-.5)*.6,r:.9+Math.random()*1.6,a:1,m:Math.random()<.18});if(!raf)tick()}
function fromSieve(n){const b=base(),r=$('#sieve img').getBoundingClientRect();grains(n,r.left-b.left+r.width*.2,r.left-b.left+r.width*.75,r.top-b.top+r.height*.45,r.top-b.top+r.height*.7,.6)}

 for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.a*=.972;cx.globalAlpha=p.a;cx.fillStyle=p.m?'#9fd8c2':'#fffaf2';cx.strokeStyle='rgba(138,92,70,.28)';cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();cx.stroke()}
 raf=P.length?requestAnimationFrame(tick):0}

(function loop(n){const s=n/1000,on=!RM();lineDraw(s,on);
 for(const f of FLOATS){if(!f.vis&&!f.sp.v)continue;f.sp.v+=(-140*f.sp.x-7*f.sp.v)/60;f.sp.x+=f.sp.v/60;if(Math.abs(f.sp.v)<.01&&Math.abs(f.sp.x)<.001){f.sp.v=0;f.sp.x=0}
  let y=on?Math.sin(s*6.283/f.per+f.ph)*f.a:0,r=f.rot+(on?Math.sin(s*6.283/(f.per*1.4)+f.ph)*f.ra:0),x=0;

  f.e.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${r.toFixed(2)}deg) scale(${(1-f.sp.x*.03).toFixed(3)},${(1+f.sp.x*.03).toFixed(3)})`}
 requestAnimationFrame(loop)})(0);
