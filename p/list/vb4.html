 [['bit1.png','near',30,'left:52%;top:250px',-20],['bit11.png','fw',16,'left:44%;top:62%',0],['bit0.png','fw',34,'left:42%;top:86%',18],['bit19.png','fp',30,'left:30%;top:94%',-30],['bit15.png','fp',18,'left:47%;top:92%',0]].forEach(g=>{
  const e=document.createElement('button');e.className='fl';e.setAttribute('aria-hidden','true');e.tabIndex=-1;e.style.cssText=`width:${g[2]}px;height:${g[2]}px;${g[3]}`;e.innerHTML=`<img src="${g[0]}" alt="">`;$('#'+g[1]).appendChild(e);
  F.push({e,g:'fl',rot:g[4],per:5+Math.random()*4,ph:Math.random()*6.28,a:5,ra:9,sq:{x:0,v:0},sp:{x:0,v:0}})});
 /* L2 远景：远处小料，淡、小、慢，固定不随滚动 */
 const far2=$('#far2');[['ice.png',30,8,58,.22],['pearl.png',16,70,64,.28],['ice.png',24,82,40,.18],['pearl.png',12,22,80,.3],['pearl.png',14,48,88,.26],['bit17.png',12,60,30,.3],['ice.png',20,40,70,.16],['pearl.png',10,88,74,.3]].forEach(z=>{
  const e=document.createElement('i');e.className='fz';e.style.cssText=`width:${z[1]}px;height:${z[1]}px;left:${z[2]}%;top:${z[3]}%;opacity:${z[4]}`;e.innerHTML=`<img src="${z[0]}" alt="">`;far2.appendChild(e);
  F.push({e,g:'far',rot:Math.random()*40-20,per:9+Math.random()*6,ph:Math.random()*6.28,a:9,ra:14,dx:6+Math.random()*8,sq:{x:0,v:0},sp:{x:0,v:0}})});
 /* L3 气泡 */
 for(let i=0;i<(tier?8:16);i++){const b=document.createElement('i');b.className='bub';const s=3+Math.random()*6;b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;bottom:${-10-Math.random()*30}px;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*18}s`;$('#app').insertBefore(b,$('#sc'))}
}
build();
/* 猫猫 */
const cat=$('#catw'),CAT={sq:{x:0,v:0},sp:{x:0,v:0}};
/* 选中：物件和注释联动 */
function pick(q){const was=q.e.classList.contains('on');if(was){q.sq.v+=-14;return}F.forEach(o=>{if(o.g===q.g){o.e.classList.remove('on');o.note.classList.remove('on')}});if(!was){q.e.classList.add('on');q.note.classList.add('on')}q.sq.v+=-11;q.sp.v+=(Math.random()<.5?-1:1)*60}
F.forEach(q=>{if(q.note){q.e.onclick=()=>pick(q);q.note.onclick=()=>pick(q)}else if(q.g==='fl'){q.e.onclick=()=>{q.sp.v+=(Math.random()<.5?-1:1)*260;q.sq.v-=6}}});
const CJ={x:0,v:0};cat.onclick=()=>{CAT.sq.v-=34;CJ.v-=260;CAT.sp.v+=(Math.random()<.5?-1:1)*70;milkBurst(40)};


/* ===== 液面：略俯视的椭圆液面，水位 = 今天轮数 ===== */
const scene=$('#scene'),liq=$('#liq'),near=$('#near');
let SW=0,SH=0,surfY=0,catBase=0;
const rounds=+$('#rn').textContent;
function layout(){SW=scene.clientWidth;SH=scene.scrollHeight;liq.setAttribute('width',SW);liq.setAttribute('height',SH);liq.style.height=SH+'px';liq.setAttribute('viewBox',`0 0 ${SW} ${SH}`);$('#lg').setAttribute('y2',SH);
 const ch=cat.offsetWidth*407/560;surfY=Math.round(232-Math.min(rounds,20)*4);cat.style.top=(surfY-ch*.76)+'px';catBase=surfY;
 milkFit()}
/* 摇晃：滚动速度推一下液面 */
const SL={x:0,v:0};let lastY=0;const sc=$('#sc');
const hd=document.querySelector('.lhead');let acc=0;sc.addEventListener('scroll',()=>{const y=sc.scrollTop,d=y-lastY;lastY=y;acc=(Math.sign(d)===Math.sign(acc))?acc+d:d;if(y<40)hd.classList.remove('hide');else if(acc>12)hd.classList.add('hide');else if(acc<-12)hd.classList.remove('hide');SL.v+=Math.max(-30,Math.min(30,d))*.06;for(const p of P){p.vy-=d*.004}},{passive:true});
const RIP=[0,1,2].map(i=>{const e=document.createElementNS('http://www.w3.org/2000/svg','ellipse');$('#rip').appendChild(e);return{e,ph:i/3}});
function surface(t){const cx=SW*.5,rx=SW*.66,ry=26+SL.x*3,tilt=SL.x*.9,cy=surfY;let back=[],front=[];
 for(let x=-6;x<=SW+6;x+=6){const u=(x-cx)/rx,k=Math.sqrt(Math.max(0,1-u*u));const w=Math.sin(x*.035+t*1.6)*1.3+Math.sin(x*.013-t*.9)*1.1;back.push([x,cy-ry*k+w+u*tilt*10]);front.push([x,cy+ry*k*.92+w*.6+u*tilt*10])}
 const P2=a=>a.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 $('#lback').setAttribute('d',P2(back));$('#lfront').setAttribute('d',P2(front));
 $('#lbody').setAttribute('d',P2(back)+` L${SW+6} ${SH} L-6 ${SH} Z`);
 $('#lsurf').setAttribute('d',P2(back)+' '+P2([...front].reverse()).replace('M','L')+' Z');
 /* 猫猫脚下的涟漪 */
 const ccx=cat.offsetLeft+cat.offsetWidth/2;RIP.forEach(r=>{const u=((t/3.6+r.ph)%1),R=cat.offsetWidth*.5+u*SW*.42;r.e.setAttribute('cx',ccx);r.e.setAttribute('cy',cy+4);r.e.setAttribute('rx',R.toFixed(1));r.e.setAttribute('ry',(R*.17).toFixed(1));r.e.setAttribute('stroke',`rgba(255,252,244,${(.75*(1-u)*(1-u)).toFixed(3)})`);r.e.setAttribute('stroke-width',(1.6-u).toFixed(2))})}

/* ===== 牛奶在奶茶里晕开（卷须 + 蘑菇云，无实心奶滴） ===== */
const mc=$('#milk'),mx=mc.getContext('2d');let MW=0,MH=0;const P=[];
function milkFit(){MW=SW;MH=Math.min(SH,surfY+900);mc.width=MW;mc.height=MH;mc.style.height=MH+'px'}
const spr=document.createElement('canvas');spr.width=spr.height=64;{const g=spr.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,252,1)');r.addColorStop(.45,'rgba(255,253,247,.6)');r.addColorStop(1,'rgba(255,252,244,0)');g.fillStyle=r;g.fillRect(0,0,64,64)}
/* 平滑噪声 → 旋度场 */
const PERM=new Uint8Array(512);{const p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}for(let i=0;i<512;i++)PERM[i]=p[i&255]}
const fd=t=>t*t*t*(t*(t*6-15)+10),lr=(a,b,t)=>a+(b-a)*t;
function gr(h,x,y){switch(h&3){case 0:return x+y;case 1:return -x+y;case 2:return x-y;default:return -x-y}}
function noise(x,y){const X=Math.floor(x)&255,Y=Math.floor(y)&255;x-=Math.floor(x);y-=Math.floor(y);const u=fd(x),v=fd(y),a=PERM[X]+Y,b=PERM[X+1]+Y;return lr(lr(gr(PERM[a],x,y),gr(PERM[b],x-1,y),u),lr(gr(PERM[a+1],x,y-1),gr(PERM[b+1],x-1,y-1),u),v)}
function curl(x,y,t){const s=.0085,e=.6,z=t*.07;const n1=noise(x*s,(y+e)*s+z),n2=noise(x*s,(y-e)*s+z),n3=noise((x+e)*s+z,y*s),n4=noise((x-e)*s+z,y*s);return[(n1-n2)/(2*e*s),-(n3-n4)/(2*e*s)]}
const MAXP=tier?220:480;
function emit(x,y,vx,vy,life,r0){if(P.length>=MAXP)return;P.push({x,y,vx,vy,age:0,life,r0,a:.9})}
function milkBurst(n){const cx=cat.offsetLeft+cat.offsetWidth/2;for(let i=0;i<n;i++)emit(cx+(Math.random()-.5)*cat.offsetWidth*.7,catBase+6,(Math.random()-.5)*.5,.4+Math.random()*.6,3.5+Math.random()*2.5,5+Math.random()*3)}
function milkPuff(el,n){const r=el.getBoundingClientRect(),s=scene.getBoundingClientRect();const cx=r.left-s.left+r.width/2,cy=r.top-s.top+r.height/2;for(let i=0;i<n;i++){const a=Math.random()*6.28,v=.5+Math.random()*.9;emit(cx+Math.cos(a)*r.width*.3,cy+Math.sin(a)*r.height*.3,Math.cos(a)*v,Math.sin(a)*v,4+Math.random()*3,1.5+Math.random()*1.5)}}
let lastT=0,emitAcc=0;
function milkStep(t,dt){
 /* 慢慢褪：留下奶云的尾巴 */
 mx.globalCompositeOperation='destination-out';mx.fillStyle='rgba(0,0,0,.06)';mx.fillRect(0,0,MW,MH);mx.globalCompositeOperation='source-over';
 /* 猫猫下沿一直细细地往下渗 */
 emitAcc+=dt*(tier?9:16);const cx=cat.offsetLeft+cat.offsetWidth/2,cw=cat.offsetWidth;
 while(emitAcc>1){emitAcc--;const off=(Math.random()-.5)*.62*cw;emit(cx+off,catBase+6+Math.random()*6,(Math.random()-.5)*.12,.18+Math.random()*.25,3.2+Math.random()*2.2,4+Math.random()*3)}
 const top=sc.scrollTop-scene.offsetTop-40,bot=top+sc.clientHeight+80;
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.age+=dt;if(p.age>p.life||p.y>MH-4||p.y>catBase+200){P.splice(i,1);continue}
  const [cxv,cyv]=curl(p.x,p.y,t);const k=Math.min(1,p.age/1.4);
  p.vx+=(cxv*.01*k+(cx-p.x)*.0006)*dt*60;p.vy+=(cyv*.008*k+.0012)*dt*60;p.vx*=.95;p.vy*=.95;if(p.y>catBase+160)p.age+=dt*3;
  p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;if(p.y<catBase+2){p.y=catBase+2;p.vy=Math.abs(p.vy)}
  if(p.y<top||p.y>bot)continue;
  const u=p.age/p.life,r=p.r0+u*20,al=.07*Math.sin(Math.min(1,u*4)*1.5708)*(1-u);
  mx.globalAlpha=al;mx.drawImage(spr,p.x-r,p.y-r,r*2,r*2)}
 mx.globalAlpha=1}

/* ===== 漂浮小料（极繁：杯里到处有东西在动） ===== */
const dv=$('#drift'),dx=dv.getContext('2d');let DW=0,DH=0,ddpr=1;
const BITS=['bit1','bit5','bit19','bit0','bit12','bit13','bit24','bit2','bit9','bit11','bit15','bit17','bit8','bit26'].map(n=>{const im=new Image();im.src=n+'.png';return im});
const D=[];function dseed(){D.length=0;const n=tier?16:30;for(let i=0;i<n;i++){const far=i%3!==0;D.push({x:Math.random(),y:Math.random()*1.4,im:BITS[i%BITS.length],s:far?12+Math.random()*8:20+Math.random()*12,a:far?.5:.95,pz:far?.25:.6,vy:(far?.004:.007)*(Math.random()<.3?-1:1),r:Math.random()*6.28,vr:(Math.random()-.5)*.5,sw:Math.random()*6.28,sa:6+Math.random()*10})}}
function dfit(){ddpr=Math.min(devicePixelRatio||1,tier?1.5:2);DW=dv.clientWidth;DH=dv.clientHeight;dv.width=DW*ddpr;dv.height=DH*ddpr}
addEventListener('resize',dfit);dfit();dseed();
function drift(t,dt){dx.setTransform(ddpr,0,0,ddpr,0,0);dx.clearRect(0,0,DW,DH);const st=sc.scrollTop;
 for(const b of D){b.y+=b.vy*dt;b.r+=b.vr*dt;const H2=DH*1.4;let y=((b.y*DH-st*b.pz)%H2+H2)%H2-DH*.2;const x=b.x*DW+Math.sin(t*.5+b.sw)*b.sa;
  if(!b.im.complete||!b.im.naturalWidth)continue;dx.globalAlpha=b.a;dx.save();dx.translate(x,y);dx.rotate(b.r+Math.sin(t*.8+b.sw)*.3);const w=b.s,h=w*b.im.naturalHeight/b.im.naturalWidth;dx.drawImage(b.im,-w/2,-h/2,w,h);dx.restore()}
 dx.globalAlpha=1}

/* ===== 引线：注释 ↔ 物件，跟着物件呼吸 ===== */
function leads(){[['#fw','#lw','w'],['#fp','#lp','p']].forEach(([f,s,g])=>{const fr=$(f).getBoundingClientRect(),svg=$(s);let h='';
 F.filter(q=>q.g===g).forEach(q=>{const o=q.e.getBoundingClientRect(),n=q.note.querySelector('.d').getBoundingClientRect();
  const ox=o.left-fr.left+o.width/2,oy=o.top-fr.top+o.height/2,R=o.width*.42;
  const right=g==='w';const nx=right?n.left-fr.left-8:n.right-fr.left+8,ny=n.top-fr.top+n.height/2;
  const ang=Math.atan2(ny-oy,nx-ox),ex=ox+Math.cos(ang)*R,ey=oy+Math.sin(ang)*R;const mx2=right?nx-14:nx+14;
  h+=`<g class="${q.e.classList.contains('on')?'on':''}"><path d="M${ex.toFixed(1)} ${ey.toFixed(1)} L${mx2.toFixed(1)} ${ny.toFixed(1)} L${nx.toFixed(1)} ${ny.toFixed(1)}"/><circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="2.6"/></g>`});
 svg.innerHTML=h})}

/* ===== 呼吸：每件绕自己的支点微动，节奏错开；点了 QQ 弹 ===== */
function spring(s,dt,k,c){s.v+=(-k*s.x-c*s.v)*dt;s.x+=s.v*dt}
function loop(n){const t=n/1000,dt=Math.min(.05,lastT?t-lastT:.016);lastT=t;const on=!RM.matches;
 if(document.hidden){requestAnimationFrame(loop);return}
 spring(SL,dt,26,3.2);
 for(const q of F){spring(q.sq,dt,170,7.5);spring(q.sp,dt,60,5);
  const y=on?Math.sin(t*6.283/q.per+q.ph)*q.a:0,x=q.dx&&on?Math.sin(t*6.283/(q.per*1.7)+q.ph)*q.dx:0;
  const r=q.rot+(on?Math.sin(t*6.283/(q.per*1.3)+q.ph)*q.ra:0)+q.sp.x;
  const br=on?Math.sin(t*6.283/(q.per*.9)+q.ph*1.3)*.018:0;
  q.e.style.transform=`translate(${x.toFixed(1)}px,${(y+(q.e.classList.contains('on')?-5:0)).toFixed(1)}px) rotate(${r.toFixed(2)}deg) scale(${(1+br-q.sq.x*.05).toFixed(3)},${(1+br*.6+q.sq.x*.05).toFixed(3)})`}
 spring(CAT.sq,dt,120,3.6);spring(CAT.sp,dt,55,3.4);spring(CJ,dt,90,7);
 const cb=on?Math.sin(t*6.283/4.2)*.028:0,ct=on?Math.sin(t*6.283/6.1)*1.2:0;
 const sq=Math.max(-.35,Math.min(.35,CAT.sq.x*.11));cat.style.transform=`translateY(${((on?Math.sin(t*6.283/5.3)*1.6:0)+Math.min(0,CJ.x)).toFixed(1)}px) rotate(${(ct+CAT.sp.x).toFixed(2)}deg) scale(${(1-cb*.5-sq*.8).toFixed(3)},${(1+cb+sq).toFixed(3)})`;
 surface(on?t:0);if(on){milkStep(t,dt);drift(t,dt)}leads();
 requestAnimationFrame(loop)}
function init(){layout();surface(0);drift(0,0);if(!RM.matches)milkBurst(30);requestAnimationFrame(loop)}
addEventListener('resize',layout);
init();cat.querySelector('img').addEventListener('load',layout);document.fonts&&document.fonts.ready.then(layout);
const pill=$('.pill'),onT=$('.tab.on');if(pill&&onT){pill.style.width=onT.offsetWidth+'px';pill.style.transform=`translateX(${onT.offsetLeft-5}px)`}
