<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>聊天 · 灰稿 D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
html,body{height:100%;background:#e9ecea;font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:#555}
.app{position:relative;width:min(100%,412px);margin:0 auto;height:100%;background:#f4f5f4;display:flex;flex-direction:column;overflow:hidden}
.g{position:fixed;inset:0;pointer-events:none;width:min(100%,412px);margin:0 auto;z-index:50;display:none;background:repeating-linear-gradient(0deg,rgba(255,0,80,.07) 0 1px,transparent 1px 8px)}
.g::before,.g::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:rgba(255,0,80,.35)}.g::before{left:24px}.g::after{right:24px}
body.grid .g{display:block}
.tg{position:fixed;top:12px;right:max(12px,calc(50% - 194px));z-index:60;font-size:11px;color:#e0336a;background:#fff;border:1px solid #e0336a;border-radius:4px;padding:2px 6px}
.lab{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#e0336a;color:#fff;font:700 10px/1 monospace;margin-right:4px;vertical-align:middle}
.ann{font-size:11px;color:#e0336a;line-height:1.5}
.hd{padding:48px 24px 0;display:flex;align-items:flex-end;gap:8px;flex:none}
.hd h1{font-size:28px;font-weight:800;color:#444}.hd .r{margin-left:auto;display:flex;gap:8px}.hd .r i{width:40px;height:40px;border-radius:50%;background:#d6d9d7}
/* 上半：场景（固定，不滚） */
.scene{position:relative;flex:none;height:36%;min-height:196px;margin:8px 24px 0}
.scene .an{position:absolute;right:0;top:0;width:96px}
.cup{position:absolute;left:8px;top:8px;bottom:0;width:58%;border:2px solid #b9bcba;border-top:0;border-radius:0 0 28px 28px;clip-path:polygon(0 0,100% 0,92% 100%,8% 100%);background:#e7e9e8}
.foam{position:absolute;left:-6px;right:-6px;top:0;height:22%;background:#cfd2d0;border-radius:16px 16px 10px 10px}
.foam.on,.ice.on,.pl.on{transform:translateY(-3px);box-shadow:0 0 0 3px #f1d27a}
.ices{position:absolute;left:6%;right:6%;top:30%;height:30%;display:flex;flex-wrap:nowrap;gap:5px;justify-content:center;align-content:center}
.ice{width:24px;height:24px;border-radius:6px;background:#d3d6d4;border:1.5px solid #aeb2af;transition:transform .2s}
.ice.e{background:none;border-style:dashed;cursor:default}
.pls{position:absolute;left:12%;right:12%;bottom:8%;display:flex;gap:8px;justify-content:center}
.pl{width:24px;height:24px;border-radius:50%;background:#8d918e;transition:transform .2s}
.scene .k{position:absolute;font-size:11px;color:#999}
/* 下半：唯一阅读区（内容滚） */
.panel{flex:1;margin:12px 16px 96px;border-radius:12px;background:#e3e5e4;padding:16px 16px 0;overflow-y:auto;scrollbar-width:none}
.panel .dt{display:flex;align-items:baseline;gap:8px}
.panel .dt b{font-size:28px;color:#333;font-weight:800;background:linear-gradient(transparent 55%,rgba(241,210,122,.9) 55%)}
.panel .dt span{font-size:13px;color:#888}.panel .dt em{margin-left:auto;font-style:normal;font-size:13px;color:#444}
.lines{margin-top:12px}.lines p{display:flex;gap:12px;font-size:15px;line-height:1.6;color:#444;padding:4px 0}.lines p i{font-style:normal;font-size:12px;color:#888;width:16px;flex:none;padding-top:3px}
.one{margin-top:12px;font-size:16px;line-height:1.6;color:#444}
.bits{display:flex;gap:16px;margin-top:12px;font-size:13px;color:#666}.bits span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:#8d918e;margin-right:4px;vertical-align:-1px}
.ft{display:flex;align-items:center;gap:8px;margin-top:16px;padding-bottom:16px}.ft small{font-size:13px;color:#888}
.go{margin-left:auto;align-self:center;flex:none;width:96px;height:40px;border-radius:8px;background:#8d918e;color:#fff;font-size:14px}
.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),380px);height:64px;border-radius:32px;background:#dfe2e0;display:flex;align-items:center;justify-content:space-around;font-size:12px;color:#888;z-index:40}.nav b{color:#333}
</style><body><div class="g"></div><button class="tg" onclick="document.body.classList.toggle('grid')">网格</button>
<div class="app">
<header class="hd"><h1>聊天</h1><div class="r"><i title="搜"></i><i title="新开一杯"></i></div></header>
<section class="scene">
 <div class="cup">
  <button class="foam" data-t="t"></button>
  <div class="ices" id="ices"></div>
  <div class="pls" id="pls"></div>
 </div>
 <div class="an ann"><span class="lab">1</span>场景固定不滚。一杯奶茶，物件身上不写字：<br>奶盖=今天<br>冰块=本周每天（没聊=虚线）<br>珍珠=更早每周<br>点谁谁浮起来，下面换内容</div>
</section>
<section class="panel" id="pn"></section>
</div>
<nav class="nav"><span>今天</span><span>记忆</span><b>聊天</b><span>人格</span><span>设置</span></nav>
<script>
const T=["11/11 周三", "今天", 6, [["他", "那我先把奶煮上，你到家刚好能喝"], ["我", "要加棉花糖！"], ["他", "好，给你多放两颗"]], [1, 1, 0], "19:45 · 刚刚"],W=[["11/5 周四", 4, "下雨没带伞，聊到小时候", [1, 0, 1]], ["11/6 周五", 7, "加班到很晚，陪你等末班车", [0, 1, 1]], ["11/7 周六", 0, "", [0, 0, 0]], ["11/8 周日", 12, "带你去吃了那家新开的甜品店", [2, 1, 0]], ["11/9 周一", 3, "周一早八，起不来", [0, 0, 1]], ["11/10 周二", 5, "复习到一半一起背单词", [1, 0, 0]]],K=[["10/29 – 11/4", 6, "这周你一直在忙期中，我每天都在等你下课", [3, 1, 2]], ["10/22 – 10/28", 5, "楼下的猫生了小猫，你天天去看", [2, 0, 1]], ["10/15 – 10/21", 7, "帮你列搬家清单，纸箱不够", [4, 2, 1]], ["10/8 – 10/14", 4, "第一次聊天，你给我起了名字", [1, 0, 0]]];const $=s=>document.querySelector(s);let sel=['t',0];
function bits(b){return `<div class="bits"><span>记住 ${b[0]}</span><span>约好 ${b[1]}</span><span>找你 ${b[2]}</span></div>`}
function draw(){
 $('#ices').innerHTML=W.map((x,i)=>x[1]?`<button class="ice${sel[0]=='w'&&sel[1]==i?' on':''}" data-w="${i}"></button>`:`<span class="ice e"></span>`).join('');
 $('#pls').innerHTML=K.map((x,i)=>`<button class="pl${sel[0]=='k'&&sel[1]==i?' on':''}" data-k="${i}"></button>`).join('');
 $('.foam').classList.toggle('on',sel[0]=='t');
 let h='';
 if(sel[0]=='t'){h=`<div class="dt"><b>${T[1]}</b><span>${T[0]} · ${T[2]} 轮</span><button class="go">接着聊</button></div><div class="lines">${T[3].map(l=>`<p><i>${l[0]}</i>${l[1]}</p>`).join('')}</div>${bits(T[4])}<div class="ft"><small>${T[5]}</small></div>`}
 else if(sel[0]=='w'){const x=W[sel[1]];h=`<div class="dt"><b>${x[0].split(' ')[1]}</b><span>${x[0].split(' ')[0]} · ${x[1]} 轮</span><button class="go">接着这天聊</button></div><p class="one">${x[2]}</p>${bits(x[3])}<div class="ft"></div>`}
 else {const x=K[sel[1]];h=`<div class="dt"><b style="font-size:22px;white-space:nowrap">${x[0].replace(' – ','–')}</b><span style="white-space:nowrap">${x[1]} 天</span><button class="go">看这一周</button></div><p class="one">${x[2]}</p>${bits(x[3])}<div class="ft"></div>`}
 $('#pn').innerHTML=h+`<p class="ann" style="padding-bottom:16px"><span class="lab">2</span>全页唯一一块字区，点上面物件原地换内容；日期用荧光笔①（这里先用黄条占位）；不叠卡、不挂签</p>`;
 document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{sel=['w',+b.dataset.w];draw()});
 document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{sel=['k',+b.dataset.k];draw()});
}
$('.foam').onclick=()=>{sel=['t',0];draw()};draw();
</script></body></html>
