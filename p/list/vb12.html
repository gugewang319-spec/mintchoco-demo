<title>vb12 · vb9 · 茶茶的薄荷巧克力茶会 · 聊天</title>
<style>
@font-face{font-family:ZK;src:url(zk.ttf)}
@font-face{font-family:Script;src:url(script.ttf)}
:root{--ch:#5b3a2c;--ink:#4a3027;--cocoa:#8a5c46;--mint3:#2f6e58;--mintb:#3f9a80;--mintl:#c4e8da}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#e4f3ed;font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* 茶底：固定在 .app 上，不随滚动 */
.app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:min(100%,440px);overflow:hidden;background-color:#e4f3ed;background-image:repeating-linear-gradient(90deg,#d7eee5 0,#d7eee5 18px,#edf8f3 18px,#edf8f3 36px)}
/* 固定层：奶盖白 → 薄荷条纹 → 往下化进奶茶 → 杯底珍珠；都不随滑动 */
.bg{position:absolute;inset:0;z-index:0;pointer-events:none}
.bg .tea{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(180deg,rgba(236,231,216,0) 0%,rgba(234,223,207,.75) 30%,#e2cfb8 55%,#d6bb9f 80%,#cfb193 100%)}
.bg .foam{position:absolute;left:0;right:0;top:0;height:22%;background:linear-gradient(180deg,rgba(255,253,246,.85),rgba(255,253,246,0))}
.bg svg.pearls{position:absolute;left:0;bottom:0;width:100%;height:120px}
.bg svg.sunk{position:absolute;left:0;bottom:0;width:100%;height:260px;display:none}
.bg.deep svg.sunk{display:block}.bg.deep svg.pearls{display:none}
.bg.deep .tea{height:66%;background:linear-gradient(180deg,rgba(236,231,216,0) 0%,rgba(234,223,207,.72) 30%,#dcc6ac 58%,#cdb092 82%,#bf9e7e 100%)}
.sk{transform-box:fill-box;transform-origin:50% 60%;animation:rest var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes rest{0%,100%{transform:rotate(0deg) translateY(0)}50%{transform:rotate(var(--a)) translateY(-1.5px)}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.bg.sink::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(180deg,rgba(196,196,196,.85) 0%,rgba(190,190,190,.45) 55%,rgba(184,184,184,0) 100%)}
.far{position:absolute;will-change:transform;opacity:.7}
.far.lf{animation:drift var(--d) ease-in-out infinite;animation-delay:var(--dl)}
.far.oil{width:var(--s);height:var(--s);border-radius:50%;box-shadow:inset 0 0 0 1.2px #7fbea7;background:rgba(255,253,246,.5);animation:bob var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(var(--r))}50%{transform:translate(6px,-10px) rotate(calc(var(--r) + 8deg))}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.scroller{position:absolute;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}.scroller::-webkit-scrollbar{display:none}
.content{position:relative;min-height:100%}
/* 页头：交给 pfix.js 统一处理 */
.lhead{position:sticky;top:0;z-index:20;isolation:isolate;display:flex;align-items:flex-end;justify-content:space-between;padding:58px 18px 10px}
.drizzle{position:absolute;left:0;top:0;width:100%;z-index:25;pointer-events:none}
.ttl{position:relative}.ttl h1{font:32px/1 ZK;color:var(--ch);letter-spacing:.06em;position:relative;z-index:1}
.ttl .sc{position:absolute;left:52px;top:-14px;font:22px/1 Script;color:rgba(63,154,128,.55);transform:rotate(-8deg);white-space:nowrap}
.lbtns{display:flex;gap:10px}

.pg{position:relative;padding:4px 0 170px}
#leaf{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:0;overflow:visible}

/* 叶柄顶端：猫猫 */
.catw{display:flex;justify-content:center;padding-top:6px}
.cat{width:min(150px,38vw);position:relative;transform-origin:50% 88%;animation:catb 4.6s ease-in-out infinite}.cat img{width:100%;display:block}
@keyframes catb{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-3px) rotate(.6deg)}}

/* 节点：日期写在主脉的断口里 */
.node{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 0 0;cursor:pointer}

.node .n{font-size:11px;color:#8a6b5c;margin-top:1px}.node .n em{font-style:normal;font-weight:800;font-size:16px;color:var(--cocoa);margin-right:2px}
.node.today .n em{font-size:30px}
/* 一天一对侧脉：左边他说的，右边你说的；聊得越多，两句坐得越近 */
.pair{position:relative;display:flex;padding-top:22px;cursor:pointer}
.pair .s{width:50%;font-size:14.5px;line-height:1.6;color:var(--ink);transition:color .2s,opacity .2s}
.pair .s.his{text-align:right;padding:0 var(--g) 0 26px}
.pair .s.mine em{color:var(--mint3)}
.pair .s.mine{padding:0 26px 0 var(--g)}
.pair .s em{display:block;font-style:normal;font-size:11px;color:var(--cocoa);margin-bottom:2px}
.today .pair .s{font-size:16.5px}
/* 没聊的那天：主脉上一颗油腺小点 */
.gland{display:flex;flex-direction:column;align-items:center;padding:26px 0 0}
.gland i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--mintb);background:rgba(196,232,218,.85);animation:gl 3s ease-in-out infinite}
.gland span{font-size:10.5px;color:#a08676;margin-top:4px}
@keyframes gl{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
/* 分段标题 */
.sh{display:flex;flex-direction:column;align-items:center;padding-top:56px}
.sh b{font:20px ZK;color:var(--ch);letter-spacing:.08em}.sh span{font-size:11px;color:#8a6b5c;margin-top:2px}
/* 更早：叶尖细脉，一周一条，一句写在主脉下方 */
.wk .pair{padding-top:16px}
.wk .one{width:100%;text-align:center;font-size:13px;line-height:1.6;color:#6b4a3c;padding:0 72px;transition:color .2s,opacity .2s}
.dim .s,.dim .one{opacity:.45}
.note{height:300px}

.navfade{position:fixed;left:0;right:0;bottom:0;height:120px;z-index:38;pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(to top,#000 45%,transparent);mask-image:linear-gradient(to top,#000 45%,transparent);background:linear-gradient(to top,rgba(228,213,192,.7),rgba(228,213,192,0))}
.pnav{position:fixed;z-index:40;left:16px;right:16px;max-width:408px;margin:0 auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));height:62px;padding:5px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;border-radius:31px;background:rgba(252,250,244,.62);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 12px 26px -14px rgba(74,48,39,.45)}
.pill{position:absolute;z-index:0;top:5px;left:5px;height:52px;border-radius:26px;background:rgba(196,232,218,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);transition:transform 380ms cubic-bezier(.3,1.25,.5,1),width 380ms}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;border-radius:26px;color:#7a5a4c;text-align:center}.tab span{font-size:11px;line-height:1.2}.tab.on{color:#4a3027}.tab.on>span{font-weight:600}
.tab .dot{position:absolute;top:-1px;left:19px;width:7px;height:7px;border-radius:4px;background:#3f9a80;box-shadow:0 0 0 2px rgba(252,250,244,.95)}
@media (prefers-reduced-motion:reduce){#outline,.gland i,.far{animation:none}}

/* vb11：今天去掉饮品卡（淋酱+液面），改成同一套冰杯磨砂片，雾最薄 */
.tod .in{padding-top:22px!important}
.tod{position:relative;background:linear-gradient(158deg,rgba(255,255,255,.66),rgba(250,248,240,.4) 46%,rgba(214,238,228,.46))!important;box-shadow:0 0 0 1px rgba(138,92,70,.6),inset 0 1.5px 0 #fff,inset 0 -5px 0 rgba(176,222,204,.6),inset -3px 0 0 rgba(196,232,218,.45),inset 3px 0 0 rgba(255,255,255,.4),0 12px 22px -14px rgba(74,48,39,.32)!important}
.tod .key{font:700 20px/1.5 var(--body)!important;letter-spacing:.01em}
.tod .sub{font:15px/1.55 var(--body)!important}
.tod .drops{position:absolute;inset:0;pointer-events:none;z-index:1}

/* ===== vb12：卡片 = 今天页那只装奶茶的毛玻璃（同款 .glass + 液面），小料照今天页画法 ===== */
.gl,.duo .his,.duo .mine,.ice.dp1,.tod{background:linear-gradient(160deg,rgba(255,255,255,.8),rgba(250,252,248,.58))!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.gl::before{display:none!important}
.dk{isolation:isolate}
.dk>*:not(.lqw):not(.dc):not(.bh){position:relative;z-index:3}
.lqw{position:absolute!important;inset:0;border-radius:inherit;overflow:hidden;z-index:1!important;pointer-events:none}
.lqc{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.mm{position:absolute;z-index:2;width:13px;height:11px;border-radius:4px;background:linear-gradient(160deg,#fffdf7,#f1e6d6);box-shadow:inset -1px -1px 0 rgba(138,92,70,.25),0 0 0 .6px rgba(138,92,70,.35);will-change:transform}
.pearl{position:absolute;z-index:2;bottom:4px;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a57658 0 14%,#4b2c1f 60%);box-shadow:0 0 0 .6px rgba(60,35,25,.5);will-change:transform}
.foam{position:absolute;z-index:2;right:10px;top:7px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#fff8ec 0 55%,#e9d2b6 56% 64%,#b98a66 66%)}
.foam b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:20px/1 system-ui;color:#c99f7d;padding-top:2px}
.sodaleaf{position:absolute;z-index:2;right:14px;bottom:3px;width:22px;transform-origin:50% 100%;will-change:transform}
.lqw .bub{position:absolute;z-index:2;bottom:-8px;border-radius:50%;border:1.2px solid rgba(255,255,255,.95);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9) 0 18%,rgba(255,255,255,.15) 30%);will-change:transform}
.ice.latte p,.ice.latte b,.ice.latte small{padding-right:30px}
.tdz{position:absolute!important;left:0;right:0;top:0;z-index:4!important;border-radius:22px 22px 0 0;overflow:hidden;pointer-events:none}
.tdz img{display:block;width:100%}
main .tod.dk .in{padding-top:54px!important}
.tdd{position:absolute!important;z-index:5!important;width:8px;height:11px;margin-left:-4px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 35% 30%,#9c6a50,#43261a 72%);pointer-events:none;opacity:0}
.duo p,.ice p,.tod .key,.tod .sub{font-family:var(--body)!important}
.duo p,.ice p{font-weight:400!important}
.tod .key{font-weight:700!important}
.counter{display:inline-flex;gap:2px;padding:3px;border-radius:5px;background:#5b3a2c;box-shadow:0 2px 3px -1px rgba(74,48,39,.4);vertical-align:middle}
.counter span{display:inline-block;min-width:12px;padding:1px 2px;border-radius:2px;background:#fdf9f0;font:700 13px/1.3 Baloo,ZK!important;text-align:center;color:#4a3027}
main .counter>b{align-self:center;font:500 12px/1 var(--body)!important;color:#fdf9f0!important;margin:0!important;padding:0 2px 0 3px}
.rw .lb .counter{margin-left:auto}
.tod .side small{position:relative;z-index:4}
.tod .side .counter span{font-size:17px!important;min-width:15px}
.tdz,.tdd{display:none!important}
main .tod.dk .in{padding-top:22px!important}
.rds{position:relative;text-align:right;line-height:1}
.rds em{font:800 46px/1 BalooX,Baloo,ZK;font-style:normal;color:#5b3a2c;position:relative;z-index:2}
.rds b{font:15px ZK;color:#5b3a2c;margin-left:2px;position:relative;z-index:2}
.rds i{display:block;font:15px/1 Script;color:#3f9a80;margin-top:-4px;position:relative;z-index:2;opacity:.85}
.rds small{display:block;margin-top:6px;font:12px Baloo,ZK;color:#8a6b5c;position:relative;z-index:2}
.rds img{position:absolute;width:44px;right:44px;top:-14px;z-index:1;opacity:.95}
.brk .stk{position:absolute}
.stkp{z-index:1;pointer-events:none}
/* 冰块浮力：在水里上下浮沉、轻轻打转（只动 translate/rotate） */
.bgi.ic,.bh.ic{--an:bob;animation-direction:normal!important;animation-timing-function:ease-in-out!important}
@keyframes bob{0%{translate:0 0;rotate:calc(var(--r,0deg) - .8deg)}28%{translate:1px -7px;rotate:calc(var(--r,0deg) + 1.2deg)}55%{translate:-1px 1px;rotate:calc(var(--r,0deg) - .4deg)}78%{translate:0 -3px;rotate:calc(var(--r,0deg) + .5deg)}100%{translate:0 0;rotate:calc(var(--r,0deg) - .8deg)}}
/* 奶茶热气雾在玻璃内侧：几团淡白雾慢慢往上飘、散开 */
.steam{position:absolute!important;inset:0;z-index:3!important;overflow:hidden;border-radius:inherit;pointer-events:none}
.steam i{position:absolute;left:var(--x);bottom:28%;width:var(--w);aspect-ratio:1.5;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,.22) 55%,rgba(255,255,255,0));opacity:0;animation:stm var(--d) ease-out var(--dl) infinite}
.steam i:nth-child(1){--x:6%;--w:46%;--d:9s;--dl:-1s}
.steam i:nth-child(2){--x:34%;--w:40%;--d:11s;--dl:-5s}
.steam i:nth-child(3){--x:58%;--w:44%;--d:10s;--dl:-8s}
.steam i:nth-child(4){--x:20%;--w:52%;--d:12s;--dl:-3s}
@keyframes stm{0%{opacity:0;transform:translateY(20px) scale(.7,.6)}25%{opacity:.9}70%{opacity:.5}100%{opacity:0;transform:translateY(-120px) scale(1.25,1.1)}}
@media (prefers-reduced-motion:reduce){.steam i{animation:none;opacity:.5}}
main .gl,main .duo .his,main .duo .mine,main .ice,main .tod{background:linear-gradient(180deg,rgba(253,251,245,.92) 0%,rgba(252,249,243,.86) 55%,rgba(250,251,247,.6) 100%)!important}
main .gl .key,main .gl .sub,main .duo p,main .ice p,main .ice b,main .ice small{-webkit-text-stroke:0!important;text-shadow:none!important}
main .tod .key{font:600 20px/1.5 var(--body)!important;color:#4a3027!important;text-wrap:balance}
main .tod .sub{font:400 15px/1.5 var(--body)!important;color:#7a5a4a!important}
main .duo p,main .ice p{font:400 14px/1.55 var(--body)!important;color:#4a3027!important;text-wrap:pretty}
main .duo .mine p{color:#4a3027!important}
main .ice b{color:#4a3027!important}
main .ice small,.rw .lb small,.tod .side small,.rds small{color:#a08676!important}
main .tod i.k,main .duo p i{display:block!important;background:none!important;padding:0!important;margin-bottom:3px!important;font:11px/1.2 ZK!important;letter-spacing:.14em;color:#a08676!important}
/* 背景：奶茶里一直往上冒的小泡泡（L3，只动 transform/opacity） */
.bgb{position:absolute;bottom:-24px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;border:1.2px solid rgba(255,255,255,.9);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85) 0 18%,rgba(255,255,255,.12) 34%);opacity:0;animation:bgb var(--d) linear var(--dl) infinite;will-change:transform}
@keyframes bgb{0%{opacity:0;transform:translate(0,0)}12%{opacity:.85}45%{transform:translate(var(--sw),-30vh)}80%{opacity:.6}100%{opacity:0;transform:translate(calc(var(--sw)*-.6),-58vh)}}
/* 背景冰块和小装饰：在奶茶里随意漂（transform 漂移 + 原来的摆动，滚动视差仍走 translate） */
.bg .bgi.wan{animation:wan var(--wd) ease-in-out var(--dl,0s) infinite alternate!important}
@keyframes wan{0%{transform:translate(0,0) rotate(0)}22%{transform:translate(var(--wx),calc(var(--wy)*-1)) rotate(var(--wr))}48%{transform:translate(calc(var(--wx)*-.7),calc(var(--wy)*-.35)) rotate(calc(var(--wr)*-.8))}74%{transform:translate(calc(var(--wx)*.45),var(--wy)) rotate(calc(var(--wr)*.5))}100%{transform:translate(calc(var(--wx)*-.25),calc(var(--wy)*-.6)) rotate(calc(var(--wr)*-.3))}}
@media (prefers-reduced-motion:reduce){.bgb{display:none}.bg .bgi.wan{animation:none!important}}
main .tod .key,main .tod .sub,main .duo p,main .ice p,main .ice b{font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Source Han Sans SC",sans-serif!important}
main .tod .key{font-weight:600!important;font-size:19px!important}
/* 水位还原（各杯原液面）；字跟着液面换色：液面上是巧克力色，泡进奶茶的部分是奶白 */
main .tod .key,main .tod .sub,main .duo p,main .ice p,main .ice b,main .ice small,main .tod .side small{color:transparent!important;-webkit-text-fill-color:transparent;background:linear-gradient(180deg,var(--tc,#4a3027) calc(var(--cut,9999px) - 2px),var(--tw,#fff8ec) calc(var(--cut,9999px) + 2px))!important;-webkit-background-clip:text!important;background-clip:text!important}
main .tod .sub,main .ice small,main .tod .side small{--tc:#7a5a4a;--tw:rgba(255,248,236,.85)}
main .tod i.k,main .duo p i{color:transparent!important;-webkit-text-fill-color:transparent;opacity:.6}
/* 05:24 茶茶：照 vb1（07c06ef）的饮品卡做——可可细描边、上圆下更圆、奶白渐变玻璃、浅色液面过半、字是墨色文楷直接写在杯里，不换色不加特效 */
main .gl,main .duo .his,main .duo .mine,main .ice,main .tod{border:1.2px solid #8a5c46!important;border-radius:22px 22px 26px 26px!important;background:linear-gradient(170deg,rgba(255,253,248,.78),rgba(255,250,242,.52))!important;box-shadow:inset 0 1.5px 0 #fff,0 12px 22px -16px rgba(74,48,39,.5)!important}
main .tod .key,main .tod .sub,main .duo p,main .ice p,main .ice b,main .ice small,main .tod .side small{color:#4a3027!important;-webkit-text-fill-color:currentColor!important;background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;top:0!important}
main .duo p,main .ice p{font:16px/1.6 WK!important;letter-spacing:0!important}
main .tod .key{font:18px/1.6 WK!important;font-weight:400!important}
main .tod .sub{font:15px/1.6 WK!important;color:#7a5a4a!important}
main .ice b,main .rds b{font-family:Baloo,sans-serif!important}
main .ice small,main .tod .side small{font:12px/1.2 ZK!important;color:#8a5c46!important}
main .tod i.k,main .duo p i{-webkit-text-fill-color:currentColor!important;color:#2f6e58!important;opacity:1!important;font:12px/1.2 ZK!important;letter-spacing:.06em}
.tod .choco{position:absolute!important;left:0;top:0;width:100%;height:46px;z-index:3!important;pointer-events:none;clip-path:inset(0 round 21px 21px 0 0);overflow:hidden}
.tod .choco svg{display:block;width:100%;height:46px;overflow:visible}
.tod .cdrop{position:absolute;z-index:3;width:9px;height:11px;margin-left:-4.5px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:#5a3627;opacity:0;pointer-events:none;will-change:transform}
