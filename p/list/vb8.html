<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>vb8 · 茶茶的薄荷巧克力茶会 · 聊天</title>
<style>
@font-face{font-family:ZK;src:url(zk.ttf)}
@font-face{font-family:Script;src:url(script.ttf)}
:root{--ch:#5b3a2c;--ink:#4a3027;--cocoa:#8a5c46;--mint3:#2f6e58;--mintb:#3f9a80;--mintl:#c4e8da}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#e4f3ed;font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* 茶底：固定在 .app 上，不随滚动 */
.app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:min(100%,440px);overflow:hidden;background-color:#e4f3ed;background-image:repeating-linear-gradient(90deg,#d7eee5 0,#d7eee5 18px,#edf8f3 18px,#edf8f3 36px)}
/* 固定层：奶盖白 → 薄荷条纹 → 往下化进奶茶 → 杯底珍珠；都不随滑动 */
.bg{position:absolute;inset:0;z-index:0;pointer-events:none}
.bg .tea{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(180deg,rgba(236,231,216,0) 0%,rgba(234,223,207,.75) 30%,#e2cfb8 55%,#d6bb9f 80%,#cfb193 100%)}
.bg .foam{position:absolute;left:0;right:0;top:0;height:22%;background:linear-gradient(180deg,rgba(255,253,246,.85),rgba(255,253,246,0))}
.bg svg.pearls{position:absolute;left:0;bottom:0;width:100%;height:120px}
.bg svg.sunk{position:absolute;left:0;bottom:0;width:100%;height:260px;display:none}
.bg.deep svg.sunk{display:block}.bg.deep svg.pearls{display:none}
.bg.deep .tea{height:66%;background:linear-gradient(180deg,rgba(236,231,216,0) 0%,rgba(234,223,207,.72) 30%,#dcc6ac 58%,#cdb092 82%,#bf9e7e 100%)}
.sk{transform-box:fill-box;transform-origin:50% 60%;animation:rest var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes rest{0%,100%{transform:rotate(0deg) translateY(0)}50%{transform:rotate(var(--a)) translateY(-1.5px)}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.bg.sink::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(180deg,rgba(196,196,196,.85) 0%,rgba(190,190,190,.45) 55%,rgba(184,184,184,0) 100%)}
.far{position:absolute;will-change:transform;opacity:.7}
.far.lf{animation:drift var(--d) ease-in-out infinite;animation-delay:var(--dl)}
.far.oil{width:var(--s);height:var(--s);border-radius:50%;box-shadow:inset 0 0 0 1.2px #7fbea7;background:rgba(255,253,246,.5);animation:bob var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(var(--r))}50%{transform:translate(6px,-10px) rotate(calc(var(--r) + 8deg))}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.scroller{position:absolute;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}.scroller::-webkit-scrollbar{display:none}
.content{position:relative;min-height:100%}
/* 页头：交给 pfix.js 统一处理 */
.lhead{position:sticky;top:0;z-index:20;isolation:isolate;display:flex;align-items:flex-end;justify-content:space-between;padding:58px 18px 10px}
.drizzle{position:absolute;left:0;top:0;width:100%;z-index:25;pointer-events:none}
.ttl{position:relative}.ttl h1{font:32px/1 ZK;color:var(--ch);letter-spacing:.06em;position:relative;z-index:1}
.ttl .sc{position:absolute;left:52px;top:-14px;font:22px/1 Script;color:rgba(63,154,128,.55);transform:rotate(-8deg);white-space:nowrap}
.lbtns{display:flex;gap:10px}
.pearlbtn{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(252,250,244,.62);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 8px 18px -12px rgba(74,48,39,.45)}
.pearlbtn svg{stroke:#5b3a2c!important}

.pg{position:relative;padding:4px 0 170px}
#leaf{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:0;overflow:visible}
#outline{transform-origin:50% 0;animation:sway 9s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-.12deg)}50%{transform:rotate(.12deg)}}
.blk{position:relative;z-index:1}

/* 叶柄顶端：猫猫 */
.catw{display:flex;justify-content:center;padding-top:6px}
.cat{width:min(150px,38vw);position:relative;transform-origin:50% 88%;animation:catb 4.6s ease-in-out infinite}.cat img{width:100%;display:block}
@keyframes catb{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-3px) rotate(.6deg)}}

/* 节点：日期写在主脉的断口里 */
.node{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 0 0;cursor:pointer}
.node .d{font-size:12px;color:#8a6b5c;letter-spacing:.04em;line-height:1.3}
.node .d b{font:16px ZK;color:var(--ch);margin-right:5px}
.node .n{font-size:11px;color:#8a6b5c;margin-top:1px}.node .n em{font-style:normal;font-weight:800;font-size:16px;color:var(--cocoa);margin-right:2px}
.node.today .n em{font-size:30px}
/* 一天一对侧脉：左边他说的，右边你说的；聊得越多，两句坐得越近 */
.pair{position:relative;display:flex;padding-top:22px;cursor:pointer}
.pair .s{width:50%;font-size:14.5px;line-height:1.6;color:var(--ink);transition:color .2s,opacity .2s}
.pair .s.his{text-align:right;padding:0 var(--g) 0 26px}
.pair .s.mine em{color:var(--mint3)}
.pair .s.mine{padding:0 26px 0 var(--g)}
.pair .s em{display:block;font-style:normal;font-size:11px;color:var(--cocoa);margin-bottom:2px}
.today .pair .s{font-size:16.5px}
/* 没聊的那天：主脉上一颗油腺小点 */
.gland{display:flex;flex-direction:column;align-items:center;padding:26px 0 0}
.gland i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--mintb);background:rgba(196,232,218,.85);animation:gl 3s ease-in-out infinite}
.gland span{font-size:10.5px;color:#a08676;margin-top:4px}
@keyframes gl{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
/* 分段标题 */
.sh{display:flex;flex-direction:column;align-items:center;padding-top:56px}
.sh b{font:20px ZK;color:var(--ch);letter-spacing:.08em}.sh span{font-size:11px;color:#8a6b5c;margin-top:2px}
/* 更早：叶尖细脉，一周一条，一句写在主脉下方 */
.wk .pair{padding-top:16px}
.wk .one{width:100%;text-align:center;font-size:13px;line-height:1.6;color:#6b4a3c;padding:0 72px;transition:color .2s,opacity .2s}
.dim .s,.dim .one{opacity:.45}
.note{height:300px}

.navfade{position:fixed;left:0;right:0;bottom:0;height:120px;z-index:38;pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(to top,#000 45%,transparent);mask-image:linear-gradient(to top,#000 45%,transparent);background:linear-gradient(to top,rgba(228,213,192,.7),rgba(228,213,192,0))}
.pnav{position:fixed;z-index:40;left:16px;right:16px;max-width:408px;margin:0 auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));height:62px;padding:5px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;border-radius:31px;background:rgba(252,250,244,.62);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 12px 26px -14px rgba(74,48,39,.45)}
.pill{position:absolute;z-index:0;top:5px;left:5px;height:52px;border-radius:26px;background:rgba(196,232,218,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);transition:transform 380ms cubic-bezier(.3,1.25,.5,1),width 380ms}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;border-radius:26px;color:#7a5a4c;text-align:center}.tab span{font-size:11px;line-height:1.2}.tab.on{color:#4a3027}.tab.on>span{font-weight:600}
.tab .dot{position:absolute;top:-1px;left:19px;width:7px;height:7px;border-radius:4px;background:#3f9a80;box-shadow:0 0 0 2px rgba(252,250,244,.95)}
@media (prefers-reduced-motion:reduce){#outline,.gland i,.far{animation:none}}
</style></head><body>
<div class="app">
 <div class="bg" aria-hidden="true"><div class="foam"></div><div class="tea"></div><div id="far"></div><svg class="pearls" id="pearls" preserveAspectRatio="none"></svg><svg class="sunk" id="sunk" viewBox="0 0 440 260" preserveAspectRatio="xMidYMax meet"></svg></div>
 <div class="scroller" id="sc"><div class="content">
  <img class="drizzle" src="today-bg.png" alt="">
  <header class="lhead"><div class="ttl"><span class="sc" aria-hidden="true">chats</span><h1>聊天</h1></div><div class="lbtns"><button class="pearlbtn" aria-label="搜索聊天"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff3e2" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button><button class="pearlbtn" aria-label="筛选"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff3e2" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button></div></header>
  <div class="pg" id="pg">
   <svg id="leaf" aria-hidden="true"><g id="outline"></g><g id="veins"></g></svg>
   <div class="blk catw"><button class="cat" id="cat" aria-label="进今天的聊天"><img src="catfoam.png" alt=""></button></div>
   <div id="list"></div>
   <div class="note" aria-hidden="true"></div>
  </div>
 </div></div>
 <nav class="pnav" aria-label="主导航"><span class="pill" aria-hidden="true"></span>
<button class="tab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 13C5 8.6 8.4 6.6 12 6.6s7 2 9.5 6.4C19 17.3 15.6 19.2 12 19.2S5 17.3 2.5 13Z" fill="#c4e8da"/><circle cx="12" cy="12.9" r="3.3" fill="#5b3a2c"/><circle cx="13.2" cy="11.8" r="0.9" fill="#fbf6ea" stroke="none"/><path d="M8 6.1 7 4.2M12 5.4V3.3M16 6.1l1-1.9"/></svg><span>今天</span></button>
<button class="tab"><span style="position:relative;display:inline-flex"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="16.5" rx="2.6" fill="#c4e8da"/><path d="M8.2 3v16.5"/><path d="M13.7 13.4c-1.9-1.3-2.9-2.3-2.9-3.4a1.45 1.45 0 0 1 2.9-.5 1.45 1.45 0 0 1 2.9.5c0 1.1-1 2.1-2.9 3.4Z" fill="#5b3a2c" stroke="none"/><path d="M14.6 19.5v3l1.3-1 1.3 1v-3" fill="#fbf6ea"/></svg><span class="dot"></span></span><span>记忆</span></button>
<button class="tab on" aria-current="page"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2c4.7 0 8.5 3.1 8.5 7s-3.8 7-8.5 7c-1 0-1.9-.1-2.8-.4L4.8 19.6l1.3-3.5C4.6 14.8 3.5 13.1 3.5 11.2c0-3.9 3.8-7 8.5-7Z" fill="#c4e8da"/><circle cx="8.6" cy="11.3" r="1.1" fill="#5b3a2c" stroke="none"/><circle cx="12" cy="11.3" r="1.1" fill="#5b3a2c" stroke="none"/><circle cx="15.4" cy="11.3" r="1.1" fill="#5b3a2c" stroke="none"/></svg><span>聊天</span></button>
<button class="tab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 21c.5-3.8 3.6-6.3 7.5-6.3s7 2.5 7.5 6.3Z" fill="#c4e8da"/><circle cx="12" cy="8.6" r="4.6" fill="#c4e8da"/><circle cx="10.3" cy="8.4" r="0.75" fill="#5b3a2c" stroke="none"/><circle cx="13.7" cy="8.4" r="0.75" fill="#5b3a2c" stroke="none"/><ellipse cx="9.4" cy="10.3" rx="0.9" ry="0.55" fill="#e7b4a4" stroke="none"/><ellipse cx="14.6" cy="10.3" rx="0.9" ry="0.55" fill="#e7b4a4" stroke="none"/></svg><span>人格</span></button>
<button class="tab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2" stroke="#5b3a2c" stroke-width="3.2" stroke-dasharray="2.7 3.74"/><circle cx="12" cy="12" r="6.6" fill="#c4e8da" stroke="#5b3a2c" stroke-width="1.5"/><circle cx="12" cy="12" r="2.3" fill="#fbf6ea" stroke="#5b3a2c" stroke-width="1.5"/></svg><span>设置</span></button>
</nav>
 <div class="navfade" aria-hidden="true"></div>

<script>
const $=s=>document.querySelector(s);
const D=[
 {k:'today',d:'今天',sub:'11/11 周三',n:6,t:'19:45',his:'那我先把奶煮上，你到家刚好能喝',mine:'要加棉花糖！'},
 {sh:'本周',r:'11/5 – 11/10 · 31 轮'},
 {d:'11/10',sub:'周二',n:12,his:'要是真下雪，我去楼下给你堆一只小猫',mine:'你说明天会不会下雪呀'},
 {d:'11/9',sub:'周一',n:8,his:'那今晚什么都不想，陪你发呆',mine:'今天的会开了三个小时，脑袋好空'},
 {d:'11/8',sub:'周日',n:9,his:'下次还去，换你点单',mine:'那家的薄荷冰淇淋超好吃'},
 {d:'11/7',n:0},
 {d:'11/6',sub:'周五',n:2,his:'晚安',mine:'晚安～'},
 {d:'11/5',n:0},
 {sh:'更早',r:'10/8 – 11/4 · 4 周'},
 {w:1,d:'10/29 – 11/4',n:5,one:'万圣节那天他给你讲了一个超吓人的故事'},
 {w:1,d:'10/22 – 10/28',n:3,one:'这周你一直在忙期中'},
 {w:1,d:'10/15 – 10/21',n:4,one:'第一次一起看的那部电影'},
 {w:1,d:'10/8 – 10/14',n:2,one:'你说秋天最适合喝热可可'}];
const gap=n=>Math.max(12,Math.min(56,60-n*4));
let H='';
D.forEach((x,i)=>{
 if(x.sh){H+=`<div class="blk sh"><b>${x.sh}</b><span>${x.r}</span></div>`;return}
 if(!x.n){H+=`<div class="blk gland" data-i="${i}"><i style="animation-delay:-${i*.7}s"></i><span>${x.d}</span></div>`;return}
 if(x.w){H+=`<div class="blk day wk" data-i="${i}" data-go="${x.d}"><div class="node"><div class="d">${x.d}</div><div class="n">${x.n} 天</div></div><div class="pair" style="--g:0px"><div class="one">${x.one}</div></div></div>`;return}
 H+=`<div class="blk day ${x.k||''}" data-i="${i}" data-go="${x.d}"><div class="node"><div class="d"><b>${x.d}</b>${x.sub||''}</div><div class="n"><em>${x.n}</em>轮${x.t?' · '+x.t:''}</div></div>
  <div class="pair" style="--g:${gap(x.n)}px"><div class="s his"><em>他</em>${x.his}</div><div class="s mine"><em>我</em>${x.mine}</div></div></div>`});
$('#list').innerHTML=H;
const today=$('.day.today');today.classList.add('today');

/* 画叶子：外形、主脉、侧脉 */
const NS='http://www.w3.org/2000/svg',svg=$('#leaf'),pg=$('#pg');
const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
let veinMap=new Map();
function draw(){
 const W=pg.clientWidth,mid=W/2,pr=pg.getBoundingClientRect(),Ht=pg.scrollHeight;
 svg.setAttribute('height',Ht);svg.setAttribute('viewBox',`0 0 ${W} ${Ht}`);
 const og=$('#outline'),vg=$('#veins');og.innerHTML='';vg.innerHTML='';veinMap.clear();
 const cat=$('#cat').getBoundingClientRect(),top=cat.bottom-pr.top-4;
 const last=[...document.querySelectorAll('.day.wk')].pop().getBoundingClientRect(),tip=last.bottom-pr.top+170;
 /* 外形：叶柄连着猫猫，往下张开再收成叶尖；边上细细的锯齿 */
 const Wm=mid-8,L=tip-top,pts=[];
 for(let y=0;y<=L;y+=11){const t=y/L,w=Wm*Math.pow(Math.sin(Math.PI*Math.pow(t,.4)),.45),z=(Math.round(y/11)%2?-2.6:0)*Math.min(1,w/30);pts.push([y,Math.max(0,w+z)])}
 let d=`M${mid} ${top}`;pts.forEach(([y,w])=>d+=` L${(mid-w).toFixed(1)} ${(top+y).toFixed(1)}`);d+=` L${mid} ${tip}`;
 [...pts].reverse().forEach(([y,w])=>d+=` L${(mid+w).toFixed(1)} ${(top+y).toFixed(1)}`);d+='Z';
 og.appendChild(mk('path',{d,fill:'rgba(168,218,198,.66)',stroke:'#8a5c46','stroke-width':1.5,'stroke-linejoin':'round'}));
 /* 主脉：在日期、标题、细脉那句话处断开 */
 const holes=[...document.querySelectorAll('.node,.sh,.gland,.wk .one')].map(e=>{const r=e.getBoundingClientRect(),pad=e.classList.contains('gland')?-2:6;return[r.top-pr.top-pad,r.bottom-pr.top+pad]}).sort((a,b)=>a[0]-b[0]);
 let y0=top;holes.forEach(([a,b])=>{if(a>y0)vg.appendChild(mk('line',{x1:mid,y1:y0,x2:mid,y2:a,stroke:'rgba(138,92,70,.75)','stroke-width':2,'stroke-linecap':'round'}));y0=Math.max(y0,b)});
 if(tip-10>y0)vg.appendChild(mk('line',{x1:mid,y1:y0,x2:mid,y2:tip-10,stroke:'rgba(138,92,70,.6)','stroke-width':1.4,'stroke-linecap':'round'}));
 /* 侧脉：从节点下方分出去，弯到两句话的里侧；继续淡淡延到叶缘 */
 document.querySelectorAll('.day').forEach(el=>{
  const nd=el.querySelector('.node').getBoundingClientRect(),ny=nd.bottom-pr.top+3,arr=[];
  const wk=el.classList.contains('wk');
  const sides=wk?[[-1,null],[1,null]]:[[-1,el.querySelector('.his')],[1,el.querySelector('.mine')]];
  sides.forEach(([sg,s])=>{
   let ex,ey;
   if(s){const g=parseFloat(getComputedStyle(el.querySelector('.pair')).getPropertyValue('--g')),em=s.querySelector('em').getBoundingClientRect();ex=mid+sg*(g-4);ey=em.top-pr.top+em.height/2}
   else{ex=mid+sg*58;ey=ny+5}
   const p=`M${mid} ${ny} C${mid} ${ny+8} ${mid+sg*(Math.abs(ex-mid)*.25)} ${ey} ${ex} ${ey}`;
   const yy=ey-pr.top+pr.top, wAt=y=>{const t=Math.max(0,Math.min(1,(y-top)/L));return Wm*Math.pow(Math.sin(Math.PI*Math.pow(t,.4)),.45)};
   const edge=mid+sg*(wAt(ey-20)-6);
   if(!wk){vg.appendChild(mk('path',{d:`M${ex} ${ey} Q${(ex+edge)/2} ${ey-6} ${edge} ${ey-22}`,fill:'none',stroke:'rgba(63,154,128,.45)','stroke-width':1,'stroke-dasharray':'2 4','stroke-linecap':'round'}))}
   vg.appendChild(mk('path',{d:p,fill:'none',stroke:'#5fa58c','stroke-width':wk?1:1.6,'stroke-linecap':'round'}));
   const sap=mk('path',{d:p,fill:'none',stroke:'#2f9e7e','stroke-width':wk?2:2.8,'stroke-linecap':'round',opacity:0});
   vg.appendChild(sap);arr.push(sap)});
  veinMap.set(el,arr)});
}
/* 点一天：汁液顺着侧脉流过去；再点进去 */
let sel=null;
function flow(el){(veinMap.get(el)||[]).forEach(p=>{const l=p.getTotalLength();p.style.strokeDasharray=l;p.setAttribute('opacity',1);
 p.animate([{strokeDashoffset:l},{strokeDashoffset:0}],{duration:matchMedia('(prefers-reduced-motion: reduce)').matches?0:300,easing:'cubic-bezier(.23,1,.32,1)',fill:'forwards'})})}
document.querySelectorAll('.day').forEach(el=>el.addEventListener('click',()=>{
 if(sel===el){alert('进 '+el.dataset.go);return}
 if(sel)(veinMap.get(sel)||[]).forEach(p=>p.setAttribute('opacity',0));
 sel=el;document.querySelectorAll('.day').forEach(o=>o.classList.toggle('dim',o!==el));flow(el)}));
$('#cat').addEventListener('click',e=>{e.stopPropagation();$('#cat').animate([{transform:'scale(1)'},{transform:'scale(.97,.94)'},{transform:'scale(1)'}],{duration:260,easing:'cubic-bezier(.23,1,.32,1)'});setTimeout(()=>alert('进今天的聊天'),280)});
