/*hdr-align 11-13 margin34*/.lhead{padding:70px 34px 0!important}.big,.cmp{left:34px!important}.facts,.ingr,.cols{left:34px!important;right:34px!important}.cut{right:38px!important}/*sprig-fix 11-13*/#sprig{z-index:9!important;right:auto!important;left:250px!important}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}/*nav-font 11-14*/.pnav,.pnav *{font-family:"OPPO Sans","HarmonyOS Sans SC","PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif}/*phone-fix 11-14：矮屏可滚*/.app{left:0!important;right:0!important;margin:0 auto;transform:none!important;overflow-y:auto!important;overflow-x:hidden!important;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}.ingr{padding-bottom:120px}.app::-webkit-scrollbar{display:none}</style></head><body>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let mode=0,bigK=0;
$('#big').onclick=()=>{mode=1-mode;$('#bn').textContent=mode?'183.2':'128.4';$('#bk').textContent=mode?'上 周 这 时':'本 周 用 量';bigK=1;const r=$('#bn').getBoundingClientRect(),a=$('#app').getBoundingClientRect();for(let i=0;i<6;i++)bub(1,r.left-a.left+20+Math.random()*(r.width-40),r.bottom-a.top,1)};
const cv=$('#fx'),cx=cv.getContext('2d'),DPR=Math.min(2,devicePixelRatio||1);let B=[];
function fit(){const r=cv.getBoundingClientRect();cv.width=r.width*DPR;cv.height=r.height*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
function bub(n,x,y,top){const b=cv.getBoundingClientRect();for(let i=0;i<n;i++)B.push({x:x??Math.random()*b.width,y:y??b.height+10,r:1.5+Math.random()*3,vy:-(.35+Math.random()*.6),w:Math.random()*6.28,stop:top?y-120:-10})}
fit();addEventListener('resize',fit);for(let i=0;i<(RM?0:10);i++){bub(1);B[B.length-1].y=Math.random()*cv.getBoundingClientRect().height}
/* 小剪纸压在每行行尾、跨过分隔线；跟着行走 */
const C=$$('.cut').map((e,i)=>({e,T:[5.3,6.9,4.6,7.7][i],ph:i*1.7,k:0}));
function place(){const a0=$('#app').getBoundingClientRect(),st=$('#app').scrollTop,a={top:a0.top-st,left:a0.left};$$('.row').forEach((r,i)=>{const b=r.getBoundingClientRect();C[i].top=b.top-a.top+b.height*.5-C[i].e.offsetHeight*.42})
 const last=$$('.row')[3].getBoundingClientRect();$('#cols').style.top=(last.bottom-a.top+14)+'px'}
$$('.row').forEach((e,i)=>e.onclick=()=>{const o=!e.classList.contains('open');$$('.row').forEach(x=>x.classList.remove('open'));if(o)e.classList.add('open');C[i].k=1});
$$('.ingr button').forEach(b=>b.onclick=()=>{b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),300)});
place();requestAnimationFrame(()=>$('#app').classList.add('ready'));
let t0=performance.now();
function loop(now){const t=(now-t0)/1000,m=RM?0:1;place();
 C.forEach((c,i)=>{c.k*=.965;const sw=i==2?`rotate(${m*(t*14%360)+c.k*30*Math.sin(t*9)}deg)`:`rotate(${m*1.6*Math.sin(t*6.283/c.T+c.ph)+c.k*8*Math.sin(t*14)}deg)`;c.e.style.top=c.top+'px';c.e.style.transformOrigin=i==2?'50% 50%':'50% 4%';c.e.style.transform=`translateY(${m*1.2*Math.sin(t*6.283/(c.T*1.3)+c.ph)}px) ${sw}`});
 bigK*=.95;$('#bn').style.transform=`translateY(${-bigK*5*Math.abs(Math.sin(t*10))}px)`;
 cx.clearRect(0,0,cv.width,cv.height);if(Math.random()<.03&&!RM)bub(1);

 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
