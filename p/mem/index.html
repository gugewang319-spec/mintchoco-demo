<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>茶茶的薄荷巧克力茶会 · 聊天室</title>
<style>
@font-face{font-family:ZK;src:url(zk.ttf)}
@font-face{font-family:Baloo;src:url(baloo.ttf);font-weight:100 900}
@font-face{font-family:Script;src:url(script.ttf)}
@font-face{font-family:WK;src:url(wenkai.ttf)}
:root{--ch:#5b3a2c;--ink:#4a3027;--cocoa:#8a5c46;--mint3:#2f6e58;--mintb:#3f9a80;--pink:#e07f95;
 --body:"OPPO Sans","HarmonyOS Sans SC","PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;color:var(--ink);font-family:var(--body)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;user-select:none;-webkit-user-drag:none}
/* 底图：她的薄荷竖条纹 + 左上高光 */
.vp{position:fixed;inset:0;overflow:hidden;background-color:#e4f3ed;background-image:radial-gradient(110% 50% at 15% 0%,rgba(255,255,255,.75),rgba(255,255,255,0) 60%),repeating-linear-gradient(90deg,#d7eee5 0,#d7eee5 18px,#edf8f3 18px,#edf8f3 36px)}
.app{position:absolute;left:0;right:0;margin:0 auto;top:0;bottom:0;width:min(100%,440px);overflow:hidden}

/* 主角：奶茶杯，固定在右下，内容从它前面滚过 */
.cup{position:absolute;right:-58px;bottom:-34px;width:min(66%,280px);z-index:1;transform-origin:50% 96%;pointer-events:auto;will-change:transform}
.cup img{width:100%}
.cup .ins{position:absolute;inset:0;pointer-events:none;overflow:hidden;-webkit-mask:var(--cm) center/100% 100% no-repeat;mask:var(--cm) center/100% 100% no-repeat}
.cup .bb{position:absolute;border-radius:50%;border:1.3px solid rgba(255,255,255,.95);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9) 0 18%,rgba(255,255,255,.12) 32%)}
.veil{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(237,248,243,.55) 0,rgba(237,248,243,.25) 45%,rgba(237,248,243,0) 70%)}
.sugar{position:absolute;inset:0;z-index:1;pointer-events:none}

/* 滚动区 */
.scroller{position:absolute;inset:0;z-index:5;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.content{position:relative;min-height:100%;padding:0 16px 150px}
.drizzle{position:absolute;left:0;top:0;width:100%;z-index:25;pointer-events:none}

/* 顶栏：杯套 */
.head{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(54px + env(safe-area-inset-top,0px)) 0 10px;margin:0 -2px}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.72),rgba(255,255,255,.44));-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);border:1px solid rgba(255,255,255,.92);box-shadow:inset 0 1px 0 #fff,0 10px 22px -16px rgba(74,48,39,.5)}
.iconbtn{flex:none;width:44px;height:44px;border-radius:22px;display:grid;place-items:center}
.iconbtn:active{transform:scale(.92)}
.sleeve{flex:1;position:relative;height:56px;border-radius:14px 14px 18px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;overflow:hidden;background:linear-gradient(180deg,rgba(255,250,242,.82),rgba(255,250,242,.6));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid #fff;box-shadow:inset 0 1px 0 #fff,0 10px 20px -14px rgba(74,48,39,.55)}
.sleeve::before,.sleeve::after{content:"";position:absolute;left:0;right:0;height:5px;background:repeating-linear-gradient(90deg,#8a5c46 0 7px,#c9a58c 7px 10px);opacity:.55}
.sleeve::before{top:0}.sleeve::after{bottom:0}
.sleeve h1{font:400 18px/1 ZK;color:var(--ch);letter-spacing:.06em}
.sleeve h1 b{font:800 19px/1 Baloo;letter-spacing:0}
.sleeve .plat{font:12px/1 var(--body);color:var(--mint3);background:rgba(166,217,196,.45);border-radius:9px;padding:3px 9px}

/* 已总结：拿铁条 */
.sum{position:relative;margin:6px 0 4px;display:flex;align-items:center;justify-content:center;gap:4px;height:46px;border-radius:23px;overflow:hidden;font:400 14px/1 ZK;color:var(--cocoa);letter-spacing:.06em;isolation:isolate}
.sum b{font:800 16px/1 Baloo;color:var(--ch);letter-spacing:0}
.sum::before{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;z-index:-1;background:linear-gradient(180deg,rgba(196,150,112,.22),rgba(170,120,88,.32))}
.sum .art{position:absolute;left:12px;top:7px;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle,#fff8ec 0 55%,#e9d2b6 56% 64%,#b98a66 66%);display:grid;place-items:center;color:#c99f7d;font:16px/1 system-ui;z-index:1}

/* 时间：巧克力小方块 */
.clock{align-self:center;margin:18px 0 10px;display:flex;align-items:center;gap:8px;font:700 13px/1 Baloo;color:#fffaf2;letter-spacing:.06em}
.clock span{background:var(--ch);border-radius:7px;padding:6px 10px 5px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.18)}
.clock::before,.clock::after{content:"";width:28px;height:1.5px;border-radius:1px;background:rgba(138,92,70,.35)}

.thread{position:relative;z-index:2;display:flex;flex-direction:column}
.me,.him{display:flex;flex-direction:column;max-width:82%;margin-top:10px}
.me{align-self:flex-end;align-items:flex-end}
.him{align-self:flex-start;align-items:flex-start}
.bub{position:relative;isolation:isolate;overflow:hidden;font:15px/1.7 var(--body);padding:11px 15px 12px;letter-spacing:.01em;word-break:break-word}
.bub .tx{position:relative;z-index:2}
/* 他：奶泡白玻璃，顶上一圈奶泡 */
.bub-him{border-radius:8px 22px 22px 22px;padding-top:15px;background:linear-gradient(170deg,rgba(255,252,246,.86),rgba(255,250,242,.62));-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);border:1px solid #fff;box-shadow:inset 0 1px 0 #fff,0 10px 22px -16px rgba(74,48,39,.5)}
.foam{position:absolute;left:-4px;right:-4px;top:-2px;height:12px;z-index:1;pointer-events:none;transform-origin:50% 0}
.foam i{position:absolute;top:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fffefb,#f3e7d6);box-shadow:inset 0 -1px 0 rgba(185,138,102,.25)}
/* 我：薄荷苏打玻璃，气泡往上冒 */
.bub-me{border-radius:22px 8px 22px 22px;background:linear-gradient(170deg,rgba(214,240,229,.82),rgba(166,217,196,.62));-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);border:1px solid rgba(255,255,255,.92);box-shadow:inset 0 1px 0 #fff,0 10px 22px -16px rgba(47,110,88,.55);color:#2c4a3f}
.bub-me .bb{position:absolute;bottom:-8px;z-index:1;border-radius:50%;border:1.1px solid rgba(255,255,255,.95);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9) 0 18%,rgba(255,255,255,.1) 32%);pointer-events:none}

.sub{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:6px;padding-left:4px;font:12px/1 var(--body);color:var(--cocoa)}
.subbtn{display:flex;align-items:center;gap:6px;min-height:28px}
.subbtn .t{font:700 12px/1 Baloo;color:var(--cocoa)}
.chip{font:12px/1 var(--body);border-radius:10px;padding:4px 9px}
.chip.p{background:rgba(255,255,255,.6);border:1px solid #fff;color:var(--cocoa)}
.model{display:flex;align-items:center;gap:5px;font:12px/1 var(--body);color:var(--cocoa);overflow:hidden;max-width:0;opacity:0;transition:max-width .35s ease,opacity .25s}
.model.on{max-width:240px;opacity:1}
.model .n{font:700 12px/1 Baloo}
.vers{font:12px/1 ZK;color:var(--mint3);text-decoration:underline dotted 1px;text-underline-offset:3px;min-height:28px;display:flex;align-items:center}
/* 候选：薄荷苏打小瓶盖 */
.cand{margin-top:6px;display:flex;align-items:center;gap:6px;font:12px/1 ZK;color:var(--mint3);background:rgba(214,240,229,.8);border:1px solid #fff;border-radius:12px;padding:6px 10px;letter-spacing:.06em}
.cand i{width:10px;height:10px;border-radius:50%;border:1.3px solid #fff;background:radial-gradient(circle at 35% 30%,#fff 0 25%,#a6d9c4 35%)}
.cand b{font:800 14px/1 Baloo}
/* 存进记忆：一颗包好的糖 */
.saved{position:relative;align-self:center;margin:16px 0 4px;display:flex;align-items:center;height:40px;cursor:pointer}
.saved .wrap{position:relative;z-index:2;display:flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:12px;background:linear-gradient(180deg,rgba(255,250,242,.9),rgba(255,240,224,.75));border:1px solid #fff;box-shadow:inset 0 1px 0 #fff,inset 0 -6px 0 rgba(166,217,196,.35),0 8px 18px -12px rgba(74,48,39,.55);font:13px/1 var(--body);color:var(--ink)}
.saved .wrap em{font:12px/1 ZK;font-style:normal;color:var(--cocoa);letter-spacing:.08em}
.twist{position:relative;z-index:1;width:22px;height:30px;transform-origin:var(--o) 50%}
.twist svg{width:100%;height:100%}
.tw-l{margin-right:-3px;--o:100%}.tw-r{margin-left:-3px;--o:0%}

/* 结尾：杯底 */
.end{align-self:center;margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:8px;font:12px/1 ZK;color:var(--cocoa);letter-spacing:.3em}
.end .pearls{display:flex;gap:6px}
.end .pearls i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a57658 0 14%,#4b2c1f 60%)}

.fade{position:absolute;left:0;right:0;bottom:0;height:80px;z-index:8;pointer-events:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(to top,#000 35%,transparent);mask-image:linear-gradient(to top,#000 35%,transparent);background:linear-gradient(to top,rgba(228,243,237,.7),rgba(228,243,237,0))}
.lowtier .glass,.lowtier .bub,.lowtier .sleeve{-webkit-backdrop-filter:none;backdrop-filter:none}
.lowtier .bub-him{background:rgba(255,252,246,.94)}.lowtier .bub-me{background:rgba(214,240,229,.95)}

/* ===== room2：奶茶小料组件，统一可可细描边 ===== */
:root{--ol:#8a5c46}
/* 返回/更多：两颗大珍珠 */
.pearlbtn{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 34% 28%,#b98a6c 0 9%,#6a4130 30%,#3b2219 78%);border:1.3px solid #2e1a12;box-shadow:inset -3px -4px 6px rgba(0,0,0,.25),0 8px 14px -10px rgba(46,26,18,.7);transform-origin:50% 80%}
.pearlbtn svg{stroke:#fff3e2;fill:none}.pearlbtn .dots{fill:#fff3e2;stroke:none}
/* 日期：巧克力威化 */
.wafer{flex:1;position:relative;height:64px;border-style:solid;border-width:0 30px;border-image:url(wafer.png) 0 136 fill / 0 30px stretch;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:11px;gap:5px;cursor:pointer}
.wafer h1{font:400 18px/1 ZK;color:#fff6e8;letter-spacing:.06em;text-shadow:0 1px 0 rgba(59,34,25,.55)}
.wafer h1 b{font:800 19px/1 Baloo;letter-spacing:0}
.wafer .plat{font:11.5px/1 var(--body);color:#d8f1e6;letter-spacing:.04em}
.crumb{position:absolute;z-index:25;width:5px;height:4px;border-radius:1px;background:#5b3a2c;pointer-events:none}
/* 他：淋了巧克力酱的奶冻 */
.bub-him{background:none!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;overflow:visible!important;padding-top:30px!important}
.shell{position:absolute;inset:0;z-index:0;border-radius:18px 20px 22px 22px;border:1.3px solid var(--ol);pointer-events:none;transform-origin:50% 100%}
.bub-him .shell{background:radial-gradient(60% 50% at 22% 30%,rgba(255,255,255,.85),rgba(255,255,255,0) 70%),linear-gradient(180deg,rgba(255,251,243,.94),rgba(246,234,216,.9));box-shadow:inset 0 -7px 0 rgba(218,192,160,.45),inset 0 2px 0 #fff,0 10px 18px -14px rgba(74,48,39,.55)}
.sauce{position:absolute;left:0;top:-.5px;width:100%;height:40px;z-index:1;pointer-events:none;overflow:visible}
.sauce path.s{fill:#5b3a2c;stroke:#3b2219;stroke-width:1.1;stroke-linejoin:round}
.sauce path.h{fill:none;stroke:rgba(255,236,220,.55);stroke-width:1.6;stroke-linecap:round}
/* 我：薄荷果冻 */
.bub-me{background:none!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;overflow:visible!important}
.bub-me .shell{border-radius:20px 18px 20px 20px;background:radial-gradient(50% 45% at 24% 26%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%),linear-gradient(180deg,rgba(196,234,218,.86),rgba(150,210,186,.82));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 -7px 0 rgba(106,176,150,.35),inset 0 2px 0 rgba(255,255,255,.9),0 10px 18px -14px rgba(47,110,88,.6)}
.bub-me .jb{position:absolute;z-index:1;border-radius:50%;border:1px solid rgba(255,255,255,.95);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9) 0 20%,rgba(255,255,255,.12) 34%);pointer-events:none}
.bub-me .tx{color:#24443a}
/* 其他小件也加描边 */
.clock span{border:1.2px solid #2e1a12}
.cand{border:1.2px solid var(--ol)!important;background:rgba(214,240,229,.92)!important}
.saved .wrap{border:1.2px solid var(--ol)!important}
.sum{border:1.2px solid var(--ol)!important}
.sub .chip.p{border:1px solid rgba(138,92,70,.45)}

/* room4 */
.pearlbtn{background:#6b4433;border:1.2px solid #4a2c20;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.18),0 4px 10px -6px rgba(46,26,18,.55);position:relative}
.pearlbtn::after{content:"";position:absolute;left:11px;top:8px;width:9px;height:5px;border-radius:50%;background:rgba(255,243,226,.55);transform:rotate(-24deg)}
.saved{height:42px}
.saved .cbody{position:absolute;inset:0 -6px;z-index:1;border-style:solid;border-width:10px 34px;border-image:url(candy.png) 90 300 90 300 fill stretch;transform-origin:50% 50%;pointer-events:none}
.saved .wrap{background:none!important;border:0!important;box-shadow:none!important;height:42px;padding:0 44px;font-size:13px}
.wafer{padding-top:0;justify-content:flex-start}
.wafer .face{position:absolute;left:0;right:0;top:0;height:71%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.wafer h1{line-height:1}
.counter{align-self:center;display:inline-flex;gap:2px;margin:18px 0 8px;padding:3px;border-radius:5px;background:#5b3a2c;box-shadow:0 2px 3px -1px rgba(74,48,39,.4)}
.counter span{display:inline-block;min-width:12px;padding:1px 2px;border-radius:2px;background:#fdf9f0;font:700 13px/1.3 Baloo;text-align:center;color:#4a3027}
.counter b{align-self:center;font:700 13px/1 Baloo;color:#fdf9f0;padding:0 1px}
.head::before{content:"";position:absolute;left:-18px;right:-18px;top:0;bottom:-18px;z-index:-1;pointer-events:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);background:linear-gradient(180deg,rgba(232,246,240,.9),rgba(232,246,240,.55) 75%,rgba(232,246,240,0));-webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}
.head{isolation:isolate}

/* room5：在奶茶杯里 */
.vp{background-color:#e7f4ee;background-image:radial-gradient(120% 40% at 20% 0%,rgba(255,255,255,.8),rgba(255,255,255,0) 60%),linear-gradient(180deg,#e8f6f0 0%,#e3f2ea 30%,#e9ecdf 52%,#eadfcf 70%,#ddc6ad 88%,#cfb193 100%)}
.cup{inset:0!important;width:auto!important;right:0!important;bottom:0!important;transform:none!important;pointer-events:none!important}
.cup>img{display:none}
.cup .ins{-webkit-mask:none!important;mask:none!important}
.pearls{position:absolute;left:-4%;right:-4%;bottom:-6px;z-index:1;pointer-events:none;transform-origin:50% 100%}
.pearls img{width:100%}
.ice{position:absolute;z-index:1;pointer-events:none;opacity:.5}
.veil{background:linear-gradient(180deg,rgba(240,250,246,0),rgba(240,250,246,0))}
.pearlbtn::after{display:none}
.gar{position:absolute;z-index:3;pointer-events:none;transform-origin:50% 90%}
.gar img{width:100%}

/* ===== 聊天列表 ===== */
.lhead{position:sticky;top:0;z-index:20;display:flex;align-items:flex-end;justify-content:space-between;padding:58px 18px 10px;isolation:isolate}
.lhead::before{content:"";position:absolute;left:0;right:0;top:0;bottom:-16px;z-index:-1;pointer-events:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);background:linear-gradient(180deg,rgba(232,246,240,.9),rgba(232,246,240,.5) 75%,rgba(232,246,240,0));-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 70%,transparent)}
.ttl{position:relative}
.ttl h1{font:32px/1 ZK;color:var(--ch);letter-spacing:.06em;position:relative;z-index:1}
.ttl .sc{position:absolute;left:52px;top:-14px;font:22px/1 Script;color:rgba(63,154,128,.55);transform:rotate(-8deg);white-space:nowrap}
.lbtns{display:flex;gap:10px}


.sec{display:flex;align-items:baseline;gap:8px;margin:26px 22px 8px}
.sec h2{margin:0;font:400 19px/1.2 ZK;color:var(--ch);letter-spacing:.06em}
.sec b{font:700 16px/1 Baloo;color:#2f6e58}.sec span{font:13px/1 WK;color:#8a6a5a}
.list{position:relative;z-index:3;padding:0 14px 150px}
.hero{position:relative;z-index:4;height:238px;margin-top:-6px}
.jar{position:absolute;right:2px;top:0;width:52%;aspect-ratio:554/658;cursor:pointer;transform-origin:50% 96%;will-change:transform;z-index:5}
.jar img{width:100%;height:100%}
.stat{position:absolute;left:8px;top:36px;width:46%}
.stat .big{display:flex;align-items:baseline;gap:6px}
.stat .big b{font:800 54px/1 Baloo;color:var(--ch)}.stat .big span{font:16px/1 ZK;color:var(--ch);letter-spacing:.06em}
.stat p{margin:12px 0 0;font:14.5px/1.65 WK;color:var(--ink)}
.stat .mix{margin-top:14px;font:14px/1 ZK;color:var(--cocoa);letter-spacing:.06em}
.stat .mix em{font:700 16px/1 Baloo;font-style:normal;color:#2f6e58;margin-left:3px}
.stat .mix i{display:inline-block;width:1px;height:12px;background:#c9ab96;margin:0 12px;vertical-align:-1px}
/* 包装台：罐子就站在台面上 */
.desk{position:relative;z-index:3;width:100vw;margin:-58px 0 0 calc(50% - 50vw);padding:52px 0 34px;background:linear-gradient(180deg,transparent 30px,#f5e7d4 30px,#f5e7d4 calc(100% - 40px),rgba(245,231,212,0))}
.desk .top{position:absolute;left:0;top:0;height:34px;width:100%;pointer-events:none;z-index:-1}
.desk .hd{display:flex;align-items:center;gap:10px;padding:0 18px 0 12px}
.sign{position:relative;width:132px;flex:none;transform:rotate(-4deg);transform-origin:20% 80%}
.sign img{width:100%}
.sign b{position:absolute;left:24%;right:6%;top:9%;bottom:33%;display:grid;place-items:center;font:400 22px/1 ZK;color:var(--ch);letter-spacing:.12em}
.desk .hd .sub{font:15px/1.3 ZK;color:var(--ch);letter-spacing:.06em}
.desk .hd .sub em{font:700 17px/1 Baloo;font-style:normal;color:#2f6e58;margin:0 3px}
.desk .hd .sub small{display:block;margin-top:5px;font:12.5px/1.4 WK;color:#8a6a5a;letter-spacing:0}
.bench{position:relative;margin-top:6px}
.cands{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 34px;scroll-padding:0 34px;scrollbar-width:none}
.cands::-webkit-scrollbar{display:none}
.cand{position:relative;flex:none;width:344px;aspect-ratio:1368/617;scroll-snap-align:center;background:none!important;border:0!important;box-shadow:none!important;border-radius:0!important;padding:0!important;display:block!important;will-change:transform;transition:transform .35s cubic-bezier(.5,-.3,.6,1),opacity .35s}
.cand>img{position:absolute;inset:0;width:100%;height:100%}
.cand .tx{position:absolute;left:26.5%;right:25%;top:23%;bottom:27%;display:flex;flex-direction:column;justify-content:center;text-align:left}
.cand .tg{font:12.5px/1 ZK;color:var(--cocoa);letter-spacing:.06em}.cand .tg em,.mi .tg em{font-style:normal;color:#2f6e58}
