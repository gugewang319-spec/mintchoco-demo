<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>组件 · 极繁样张</title>
<style>
@font-face{font-family:ZK;src:url(zk.ttf)}@font-face{font-family:WK;src:url(wk.ttf)}@font-face{font-family:Script;src:url(script.ttf)}@font-face{font-family:BalooX;src:url(baloo800.ttf)}
:root{--ink:#5e4c43;--ink2:#8a7a70;--choc:#5b3a2c;--ol:#6b4a3b;--mint:#2f6e58;--mintl:#9fd3bf;--cream:#fffaf0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;color:var(--ink)}
img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.vp{position:fixed;inset:0;background-color:#e4f3ed;background-image:repeating-linear-gradient(90deg,#d7eee5 0,#d7eee5 18px,#edf8f3 18px,#edf8f3 36px)}
.app{position:absolute;inset:0;margin:0 auto;width:min(100%,412px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overflow-anchor:none;font-family:WK,serif;-webkit-tap-highlight-color:transparent}
.app::-webkit-scrollbar{display:none}
.in{position:relative;padding:0 0 40px}
.drip{width:100%}
.ttl{position:relative;margin:-6px 0 18px 26px}
.ttl h1{font:400 52px/1 ZK;color:var(--choc);letter-spacing:3px;text-shadow:2px 0 var(--cream),-2px 0 var(--cream),0 2px var(--cream),0 -2px var(--cream),5px 5px 0 var(--mintl)}
.ttl .en{position:absolute;left:118px;top:30px;font:32px/1 Script;color:#5fa98d;transform:rotate(-8deg);text-shadow:1.5px 0 var(--cream),-1.5px 0 var(--cream),0 1.5px var(--cream),0 -1.5px var(--cream),2px 2px 0 var(--ol)}
.sec{position:relative;margin:0 18px 30px}
.lab{display:flex;align-items:baseline;gap:8px;margin:0 0 12px 4px}
.lab b{font:400 22px/1 BalooX;color:var(--mintl);text-shadow:1.2px 0 var(--ol),-1.2px 0 var(--ol),0 1.2px var(--ol),0 -1.2px var(--ol)}
.lab span{font:17px ZK;color:var(--choc)}
.lab i{font:12px WK;font-style:normal;color:var(--ink2)}
.rw{display:flex;flex-wrap:wrap;align-items:center;gap:14px}

/* 按钮：巧克力牌主按钮、薄荷排块次按钮 */
.b1{min-width:120px;height:52px;padding:0 26px;border:solid 18px transparent;border-width:0 26px;border-image:url(m_plaque.png) 0 120 fill / 0 26px stretch;display:grid;place-items:center;font:17px ZK;color:var(--cream);letter-spacing:2px;transition:transform .15s}
.b2{min-width:104px;height:46px;padding:0 20px;border:solid transparent;border-width:0 22px;border-image:url(m_barm.png) 0 110 fill / 0 22px stretch;display:grid;place-items:center;font:15px ZK;color:var(--choc);transition:transform .15s}
.b1:active,.b2:active{transform:scale(.94) rotate(-1deg)}
.b3{height:40px;padding:0 6px;font:14px ZK;color:var(--mint);border-bottom:2px dashed var(--mintl)}

/* 开关：奶油槽 + 马卡龙 */
.sw{position:relative;flex:none;width:70px;height:36px;border-radius:18px;background:var(--cream);box-shadow:0 0 0 1.5px var(--ol),inset 0 2px 3px rgba(107,74,59,.15);transition:background .3s}
.sw::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:0;border-top:1.6px dashed transparent;transition:border-color .3s}
.sw img{position:absolute;z-index:1;left:3px;top:3px;width:30px;height:30px;object-fit:contain;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.sw.on{background:#bfe6d6}
.sw.on::after{border-color:rgba(47,110,88,.45)}
.sw.on img{transform:translateX(34px) rotate(200deg)}
.swl{font:15px WK;color:var(--ink)}

/* 输入框：白巧克力牌 */
.ip{display:block;width:100%;height:58px;border:solid transparent;border-width:20px 24px;border-image:url(m_white.png) 80 90 fill / 20px 24px stretch;font:15px WK;color:var(--choc);background:transparent;outline:none;padding:0 4px}
.ip::placeholder{color:#b0a092}
.ipw{position:relative}
.ipw .lf{position:absolute;right:6px;top:-14px;width:34px;transform:rotate(18deg)}

/* 滑条：糖霜绳 + 夹心球 */
.sl{position:relative;height:44px;touch-action:none;cursor:pointer}
.sl .tr{position:absolute;left:12px;right:12px;top:20px;height:6px;border-radius:3px;background:var(--cream);box-shadow:0 0 0 1.5px var(--ol)}
.sl .fl{position:absolute;left:12px;top:20px;height:6px;border-radius:3px;background:repeating-linear-gradient(115deg,#9fd3bf 0 5px,#d8f0e6 5px 9px);box-shadow:0 0 0 1.5px var(--ol)}
.sl img{position:absolute;top:0;width:40px;margin-left:-20px}
.slv{font:400 22px/1 BalooX;color:var(--choc);min-width:54px;text-align:right}

/* 小选单：薄荷排块点开，就地展开白巧克力牌 */
.dd{position:relative}
.dd .cur{width:100%;justify-content:space-between;display:flex;align-items:center;padding:0 14px 0 18px}
.dd .cur::after{content:"";width:8px;height:8px;border-right:2px solid var(--ol);border-bottom:2px solid var(--ol);transform:rotate(45deg) translateY(-3px);transition:transform .3s}
.dd.op .cur::after{transform:rotate(225deg) translateY(-3px)}
.dd .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.dd.op .bd{grid-template-rows:1fr}
.dd .bd>div{overflow:hidden;min-height:0}
.dd ul{list-style:none;margin-top:8px;border:solid transparent;border-width:22px 24px;border-image:url(m_white.png) 80 90 fill / 22px 24px stretch}
.dd li{position:relative;padding:9px 6px 9px 34px;font:15px WK;color:var(--choc);cursor:pointer;border-bottom:1px dashed rgba(107,74,59,.25)}
.dd li:last-child{border:0}
.dd li.on::before{content:"";position:absolute;left:0;top:6px;width:26px;height:22px;background:url(m_macaron.png) center/contain no-repeat}

/* 底栏：奶油花边托盘 + 手绘甜点图标，选中那个跳起来、垫一枚彩色小碟 */
.dk{position:relative;height:88px;margin-top:26px}
.dk .tray{position:absolute;left:0;right:0;bottom:0;height:70px;border-radius:24px 24px 28px 28px;background:#fffaf0;box-shadow:0 0 0 2px var(--ol),0 5px 0 -1px #c9a48a,0 5px 0 1px var(--ol)}
.dk .tray::before{content:"";position:absolute;left:12px;right:12px;top:-9px;height:14px;background:radial-gradient(circle at 7px 9px,#fffaf0 6px,var(--ol) 6.2px 7.8px,transparent 8px) center 0/14px 14px round no-repeat;clip-path:inset(0 0 5px 0)}
.dk .tray::after{content:"";position:absolute;left:14px;right:14px;bottom:9px;height:7px;border-radius:4px;background:repeating-linear-gradient(115deg,#9fd3bf 0 6px,#fffaf0 6px 10px,#f2c9c0 10px 16px,#fffaf0 16px 20px);box-shadow:0 0 0 1.3px var(--ol)}
.dk nav{position:absolute;inset:0 6px;display:grid;grid-template-columns:repeat(5,1fr)}
.dk .tb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:20px}
.dk .tb .ic{position:relative;width:46px;height:46px;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.dk .tb .ic img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;filter:saturate(.75) brightness(1.02);transition:filter .3s}
.dk .tb .ic::before{content:"";position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--ol),0 0 0 5px #fffaf0,0 0 0 6.5px var(--ol);transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.dk .tb .t{margin-top:3px;font:12px ZK;color:var(--ink2);transition:color .2s}
.dk .tb .dot{position:absolute;z-index:2;right:-2px;top:2px;width:10px;height:10px;border-radius:50%;background:#e59a86;box-shadow:0 0 0 1.5px var(--ol),0 0 0 3px #fffaf0}
.dk .tb.on .ic{transform:translateY(-22px) scale(1.12)}
.dk .tb.on .ic img{filter:none;animation:bob 2.6s ease-in-out infinite}
.dk .tb.on .ic::before{transform:scale(1)}
.dk .tb.on .t{position:relative;z-index:1;margin-top:-12px;padding:2px 9px 3px;border-radius:9px;background:var(--choc);color:#fffaf0;box-shadow:0 0 0 1.5px #fffaf0,0 0 0 2.8px var(--ol)}
@keyframes bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.dk .tb.on .ic img{animation:none}}
.cap{margin:8px 0 0 6px;font:12px WK;color:var(--ink2)}
</style></head><body>
<div class="vp"><div class="app" id="app"><div class="in">
<img class="drip" src="drizzle.png" alt="">
<header class="ttl"><h1>组件</h1><span class="en">Parts</span></header>

<section class="sec"><div class="lab"><b>01</b><span>按钮</span><i>主 · 次 · 文字</i></div>
 <div class="rw"><button class="b1">保存</button><button class="b2">试一下</button><button class="b3">恢复默认</button></div></section>

<section class="sec"><div class="lab"><b>02</b><span>开关</span></div>
 <div class="rw" style="gap:18px"><button class="sw on" aria-pressed="true"><img src="m_macaron.png" alt=""></button><span class="swl">看图时自动压缩</span></div>
 <div class="rw" style="gap:18px;margin-top:14px"><button class="sw" aria-pressed="false"><img src="m_macaron.png" alt=""></button><span class="swl">夜里换便宜的</span></div></section>

<section class="sec"><div class="lab"><b>03</b><span>输入框</span></div>
 <div class="ipw"><input class="ip" placeholder="给中转站起个名字" aria-label="中转站名字"></div></section>

<section class="sec"><div class="lab"><b>04</b><span>滑条</span><i>温度</i></div>
 <div class="rw" style="gap:8px;flex-wrap:nowrap"><div class="sl" id="sl" style="flex:1" role="slider" aria-label="温度" aria-valuemin="0" aria-valuemax="2"><i class="tr"></i><i class="fl"></i><img src="m_bonbon.png" alt=""></div><b class="slv" id="slv">0.7</b></div></section>

<section class="sec"><div class="lab"><b>05</b><span>小选单</span></div>
 <div class="dd" id="dd"><button class="b2 cur"><span id="ddv">跟着备用链走</span></button>
 <div class="bd"><div><ul><li class="on">跟着备用链走</li><li>一直用这一个</li><li>按价格从低到高</li></ul></div></div></div></section>

<section class="sec"><div class="lab"><b>06</b><span>底栏</span><i>点一下试试</i></div>
 <div class="dk"><i class="tray"></i><nav aria-label="主导航"><button class="tb on" style="--c:#cfeee0"><span class="ic"><img src="i_cup.png" alt=""></span><span class="t">今天</span></button><button class="tb" style="--c:#f6d9d2"><span class="ic"><img src="i_box.png" alt=""><i class=dot></i></span><span class="t">记忆</span></button><button class="tb" style="--c:#f8ebc4"><span class="ic"><img src="i_chat.png" alt=""></span><span class="t">聊天</span></button><button class="tb" style="--c:#d9ecf2"><span class="ic"><img src="i_mac.png" alt=""></span><span class="t">人格</span></button><button class="tb" style="--c:#e9dccf"><span class="ic"><img src="i_gear.png" alt=""></span><span class="t">设置</span></button></nav></div></section>
</div></div></div>
<script>
const app=document.getElementById('app');const keep=f=>e=>{const y=app.scrollTop;f(e);requestAnimationFrame(()=>app.scrollTop=y)};
document.querySelectorAll('.sw').forEach(s=>s.onclick=keep(()=>{s.classList.toggle('on');s.setAttribute('aria-pressed',s.classList.contains('on'))}));
const dd=document.getElementById('dd');dd.querySelector('.cur').onclick=keep(()=>dd.classList.toggle('op'));
dd.querySelectorAll('li').forEach(l=>l.onclick=keep(()=>{dd.querySelectorAll('li').forEach(x=>x.classList.remove('on'));l.classList.add('on');document.getElementById('ddv').textContent=l.textContent;dd.classList.remove('op')}));
document.querySelectorAll('.dk nav').forEach(n=>n.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{n.querySelectorAll('.tb').forEach(x=>x.classList.remove('on'));b.classList.add('on')}));
const sl=document.getElementById('sl'),fl=sl.querySelector('.fl'),th=sl.querySelector('img'),sv=document.getElementById('slv');let v=.7;
function draw(){const w=sl.offsetWidth-24,x=12+w*v/2;fl.style.width=(x-12)+'px';th.style.left=x+'px';th.style.transform=`rotate(${(v-1)*20}deg)`;sv.textContent=v.toFixed(1);sl.setAttribute('aria-valuenow',v.toFixed(1))}
function at(e){const r=sl.getBoundingClientRect();v=Math.round(Math.max(0,Math.min(1,(e.clientX-r.left-12)/(r.width-24)))*20)/10;draw()}
sl.onpointerdown=e=>{sl.setPointerCapture(e.pointerId);at(e);sl.onpointermove=at};sl.onpointerup=()=>sl.onpointermove=null;
draw();addEventListener('resize',draw);document.fonts&&document.fonts.ready.then(draw);
</script></body></html>
