<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>组件 · 极繁样张</title>
<style>
@font-face{font-family:ZK;src:url(zk.ttf)}@font-face{font-family:WK;src:url(wk.ttf)}@font-face{font-family:Script;src:url(script.ttf)}@font-face{font-family:BalooX;src:url(baloo800.ttf)}
:root{--ink:#5e4c43;--ink2:#8a7a70;--choc:#5b3a2c;--ol:#6b4a3b;--mint:#2f6e58;--mintl:#9fd3bf;--cream:#fffaf0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;color:var(--ink)}
img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.vp{position:fixed;inset:0;background-color:#e4f3ed;background-image:repeating-linear-gradient(90deg,#d7eee5 0,#d7eee5 18px,#edf8f3 18px,#edf8f3 36px)}
.app{position:absolute;inset:0;margin:0 auto;width:min(100%,412px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overflow-anchor:none;font-family:WK,serif;-webkit-tap-highlight-color:transparent}
.app::-webkit-scrollbar{display:none}
.in{position:relative;padding:0 0 40px}
.drip{width:100%}
.ttl{position:relative;margin:-6px 0 18px 26px}
.ttl h1{font:400 52px/1 ZK;color:var(--choc);letter-spacing:3px;text-shadow:2px 0 var(--cream),-2px 0 var(--cream),0 2px var(--cream),0 -2px var(--cream),5px 5px 0 var(--mintl)}
.ttl .en{position:absolute;left:118px;top:30px;font:32px/1 Script;color:#5fa98d;transform:rotate(-8deg);text-shadow:1.5px 0 var(--cream),-1.5px 0 var(--cream),0 1.5px var(--cream),0 -1.5px var(--cream),2px 2px 0 var(--ol)}
.sec{position:relative;margin:0 18px 30px}
.lab{display:flex;align-items:baseline;gap:8px;margin:0 0 12px 4px}
.lab b{font:400 22px/1 BalooX;color:var(--mintl);text-shadow:1.2px 0 var(--ol),-1.2px 0 var(--ol),0 1.2px var(--ol),0 -1.2px var(--ol)}
.lab span{font:17px ZK;color:var(--choc)}
.lab i{font:12px WK;font-style:normal;color:var(--ink2)}
.rw{display:flex;flex-wrap:wrap;align-items:center;gap:14px}

/* 按钮：巧克力牌主按钮、薄荷排块次按钮 */
.b1{min-width:120px;height:52px;padding:0 26px;border:solid 18px transparent;border-width:0 26px;border-image:url(m_plaque.png) 0 120 fill / 0 26px stretch;display:grid;place-items:center;font:17px ZK;color:var(--cream);letter-spacing:2px;transition:transform .15s}
.b2{min-width:104px;height:46px;padding:0 20px;border:solid transparent;border-width:0 22px;border-image:url(m_barm.png) 0 110 fill / 0 22px stretch;display:grid;place-items:center;font:15px ZK;color:var(--choc);transition:transform .15s}
.b1:active,.b2:active{transform:scale(.94) rotate(-1deg)}
.b3{height:40px;padding:0 6px;font:14px ZK;color:var(--mint);border-bottom:2px dashed var(--mintl)}

/* 开关：奶油槽 + 马卡龙 */
.sw{position:relative;width:68px;height:34px;border-radius:17px;background:var(--cream);box-shadow:0 0 0 1.5px var(--ol),inset 0 2px 3px rgba(107,74,59,.15);transition:background .3s}
.sw::after{content:"";position:absolute;inset:6px 10px;border-radius:12px;border:1.6px dashed transparent;transition:border-color .3s}
.sw img{position:absolute;left:-4px;top:-5px;width:46px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.sw.on{background:#bfe6d6}
.sw.on::after{border-color:rgba(47,110,88,.4)}
.sw.on img{transform:translateX(30px) rotate(18deg)}
.swl{font:15px WK;color:var(--ink)}

/* 输入框：白巧克力牌 */
.ip{display:block;width:100%;height:58px;border:solid transparent;border-width:20px 24px;border-image:url(m_white.png) 80 90 fill / 20px 24px stretch;font:15px WK;color:var(--choc);background:transparent;outline:none;padding:0 4px}
.ip::placeholder{color:#b0a092}
.ipw{position:relative}
.ipw .lf{position:absolute;right:6px;top:-14px;width:34px;transform:rotate(18deg)}

/* 滑条：糖霜绳 + 夹心球 */
.sl{position:relative;height:44px;touch-action:none;cursor:pointer}
.sl .tr{position:absolute;left:12px;right:12px;top:20px;height:6px;border-radius:3px;background:var(--cream);box-shadow:0 0 0 1.5px var(--ol)}
.sl .fl{position:absolute;left:12px;top:20px;height:6px;border-radius:3px;background:repeating-linear-gradient(115deg,#9fd3bf 0 5px,#d8f0e6 5px 9px);box-shadow:0 0 0 1.5px var(--ol)}
.sl img{position:absolute;top:0;width:40px;margin-left:-20px}
.slv{font:400 22px/1 BalooX;color:var(--choc);min-width:54px;text-align:right}

/* 小选单：薄荷排块点开，就地展开白巧克力牌 */
.dd{position:relative}
.dd .cur{width:100%;justify-content:space-between;display:flex;align-items:center;padding:0 14px 0 18px}
.dd .cur::after{content:"";width:8px;height:8px;border-right:2px solid var(--ol);border-bottom:2px solid var(--ol);transform:rotate(45deg) translateY(-3px);transition:transform .3s}
.dd.op .cur::after{transform:rotate(225deg) translateY(-3px)}
.dd .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.dd.op .bd{grid-template-rows:1fr}
.dd .bd>div{overflow:hidden;min-height:0}
.dd ul{list-style:none;margin-top:8px;border:solid transparent;border-width:22px 24px;border-image:url(m_white.png) 80 90 fill / 22px 24px stretch}
.dd li{position:relative;padding:9px 6px 9px 34px;font:15px WK;color:var(--choc);cursor:pointer;border-bottom:1px dashed rgba(107,74,59,.25)}
.dd li:last-child{border:0}
.dd li.on::before{content:"";position:absolute;left:0;top:6px;width:26px;height:22px;background:url(m_macaron.png) center/contain no-repeat}

/* 底栏 */
.nv{position:relative;height:72px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nv .tb{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:11px ZK}
.nv .tb svg{position:relative;z-index:1;width:24px;height:24px}
.nv .tb>span:last-child{position:relative;z-index:1}
.nv .tb .dot{position:absolute;right:-3px;top:-1px;width:7px;height:7px;border-radius:50%;background:#e59a86;box-shadow:0 0 0 1.5px var(--cream)}
/* A：白巧克力托盘，选中垫一颗薄荷圆章 */
.na{border:solid transparent;border-width:16px 18px;border-image:url(m_white.png) 80 90 fill / 16px 18px stretch;height:84px;padding:0 0}
.na .tb{color:var(--ink2)}
.na .tb.on{color:var(--choc)}
.na .tb.on::before{content:"";position:absolute;left:50%;top:-1px;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#f4fffa,#bfe6d6 72%);box-shadow:0 0 0 1.5px var(--ol),0 0 0 4px var(--cream),0 0 0 5.5px var(--mintl);transform:translateY(-9px)}
.na .tb.on svg{transform:translateY(-9px)}
/* B：巧克力牌托盘，选中是一块薄荷排块 */
.nb{border:solid transparent;border-width:0 30px;border-image:url(m_plaque.png) 0 120 fill / 0 30px stretch;height:76px;grid-template-columns:repeat(5,1fr)}
.nb .tb{color:#d8efe5}
.nb .tb svg *{stroke:#fffaf0}
.nb .tb svg [fill="#c4e8da"]{fill:#8a5c46}
.nb .tb.on{color:var(--choc)}
.nb .tb.on svg *{stroke:var(--choc)}
.nb .tb.on svg [fill="#8a5c46"]{fill:#c4e8da}
.nb .tb.on::before{content:"";position:absolute;inset:9px -4px;background:url(m_barm.png) center/100% 100% no-repeat}
.nav-demo{margin:0 -6px}
.cap{margin:8px 0 0 6px;font:12px WK;color:var(--ink2)}
</style></head><body>
<div class="vp"><div class="app" id="app"><div class="in">
<img class="drip" src="drizzle.png" alt="">
<header class="ttl"><h1>组件</h1><span class="en">Parts</span></header>

<section class="sec"><div class="lab"><b>01</b><span>按钮</span><i>主 · 次 · 文字</i></div>
 <div class="rw"><button class="b1">保存</button><button class="b2">试一下</button><button class="b3">恢复默认</button></div></section>

<section class="sec"><div class="lab"><b>02</b><span>开关</span></div>
 <div class="rw" style="gap:18px"><button class="sw on" aria-pressed="true"><img src="m_macaron.png" alt=""></button><span class="swl">看图时自动压缩</span></div>
 <div class="rw" style="gap:18px;margin-top:14px"><button class="sw" aria-pressed="false"><img src="m_macaron.png" alt=""></button><span class="swl">夜里换便宜的</span></div></section>

<section class="sec"><div class="lab"><b>03</b><span>输入框</span></div>
 <div class="ipw"><input class="ip" placeholder="给中转站起个名字" aria-label="中转站名字"></div></section>

<section class="sec"><div class="lab"><b>04</b><span>滑条</span><i>温度</i></div>
 <div class="rw" style="gap:8px;flex-wrap:nowrap"><div class="sl" id="sl" style="flex:1" role="slider" aria-label="温度" aria-valuemin="0" aria-valuemax="2"><i class="tr"></i><i class="fl"></i><img src="m_bonbon.png" alt=""></div><b class="slv" id="slv">0.7</b></div></section>

<section class="sec"><div class="lab"><b>05</b><span>小选单</span></div>
 <div class="dd" id="dd"><button class="b2 cur"><span id="ddv">跟着备用链走</span></button>
 <div class="bd"><div><ul><li class="on">跟着备用链走</li><li>一直用这一个</li><li>按价格从低到高</li></ul></div></div></div></section>

<section class="sec"><div class="lab"><b>06</b><span>底栏</span><i>A 白巧克力托盘</i></div>
 <div class="nav-demo"><nav class="nv na"><button class="tb on"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 13C5 8.6 8.4 6.6 12 6.6s7 2 9.5 6.4C19 17.3 15.6 19.2 12 19.2S5 17.3 2.5 13Z" fill="#c4e8da"/><circle cx="12" cy="12.9" r="3.3" fill="#5b3a2c"/><circle cx="13.2" cy="11.8" r="0.9" fill="#fbf6ea" stroke="none"/><path d="M8 6.1 7 4.2M12 5.4V3.3M16 6.1l1-1.9"/></svg><span>今天</span></button><button class="tb"><span style="position:relative;display:inline-flex"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="16.5" rx="2.6" fill="#c4e8da"/><path d="M8.2 3v16.5"/><path d="M13.7 13.4c-1.9-1.3-2.9-2.3-2.9-3.4a1.45 1.45 0 0 1 2.9-.5 1.45 1.45 0 0 1 2.9.5c0 1.1-1 2.1-2.9 3.4Z" fill="#5b3a2c" stroke="none"/><path d="M14.6 19.5v3l1.3-1 1.3 1v-3" fill="#fbf6ea"/></svg><span class="dot"></span></span><span>记忆</span></button><button class="tb"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2c4.7 0 8.5 3.1 8.5 7s-3.8 7-8.5 7c-1 0-1.9-.1-2.8-.4L4.8 19.6l1.3-3.5C4.6 14.8 3.5 13.1 3.5 11.2c0-3.9 3.8-7 8.5-7Z" fill="#c4e8da"/><circle cx="8.6" cy="11.3" r="1.1" fill="#5b3a2c" stroke="none"/><circle cx="12" cy="11.3" r="1.1" fill="#5b3a2c" stroke="none"/><circle cx="15.4" cy="11.3" r="1.1" fill="#5b3a2c" stroke="none"/></svg><span>聊天</span></button><button class="tb"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 21c.5-3.8 3.6-6.3 7.5-6.3s7 2.5 7.5 6.3Z" fill="#c4e8da"/><circle cx="12" cy="8.6" r="4.6" fill="#c4e8da"/><circle cx="10.3" cy="8.4" r="0.75" fill="#5b3a2c" stroke="none"/><circle cx="13.7" cy="8.4" r="0.75" fill="#5b3a2c" stroke="none"/><ellipse cx="9.4" cy="10.3" rx="0.9" ry="0.55" fill="#e7b4a4" stroke="none"/><ellipse cx="14.6" cy="10.3" rx="0.9" ry="0.55" fill="#e7b4a4" stroke="none"/></svg><span>人格</span></button><button class="tb"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2" stroke="#5b3a2c" stroke-width="3.2" stroke-dasharray="2.7 3.74"/><circle cx="12" cy="12" r="6.6" fill="#c4e8da" stroke="#5b3a2c" stroke-width="1.5"/><circle cx="12" cy="12" r="2.3" fill="#fbf6ea" stroke="#5b3a2c" stroke-width="1.5"/></svg><span>设置</span></button></nav></div></section>
<section class="sec"><div class="lab"><b>07</b><span>底栏</span><i>B 巧克力牌托盘</i></div>
 <div class="nav-demo"><nav class="nv nb"><button class="tb on"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 13C5 8.6 8.4 6.6 12 6.6s7 2 9.5 6.4C19 17.3 15.6 19.2 12 19.2S5 17.3 2.5 13Z" fill="#c4e8da"/><circle cx="12" cy="12.9" r="3.3" fill="#5b3a2c"/><circle cx="13.2" cy="11.8" r="0.9" fill="#fbf6ea" stroke="none"/><path d="M8 6.1 7 4.2M12 5.4V3.3M16 6.1l1-1.9"/></svg><span>今天</span></button><button class="tb"><span style="position:relative;display:inline-flex"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="16.5" rx="2.6" fill="#c4e8da"/><path d="M8.2 3v16.5"/><path d="M13.7 13.4c-1.9-1.3-2.9-2.3-2.9-3.4a1.45 1.45 0 0 1 2.9-.5 1.45 1.45 0 0 1 2.9.5c0 1.1-1 2.1-2.9 3.4Z" fill="#5b3a2c" stroke="none"/><path d="M14.6 19.5v3l1.3-1 1.3 1v-3" fill="#fbf6ea"/></svg><span class="dot"></span></span><span>记忆</span></button><button class="tb"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2c4.7 0 8.5 3.1 8.5 7s-3.8 7-8.5 7c-1 0-1.9-.1-2.8-.4L4.8 19.6l1.3-3.5C4.6 14.8 3.5 13.1 3.5 11.2c0-3.9 3.8-7 8.5-7Z" fill="#c4e8da"/><circle cx="8.6" cy="11.3" r="1.1" fill="#5b3a2c" stroke="none"/><circle cx="12" cy="11.3" r="1.1" fill="#5b3a2c" stroke="none"/><circle cx="15.4" cy="11.3" r="1.1" fill="#5b3a2c" stroke="none"/></svg><span>聊天</span></button><button class="tb"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5b3a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 21c.5-3.8 3.6-6.3 7.5-6.3s7 2.5 7.5 6.3Z" fill="#c4e8da"/><circle cx="12" cy="8.6" r="4.6" fill="#c4e8da"/><circle cx="10.3" cy="8.4" r="0.75" fill="#5b3a2c" stroke="none"/><circle cx="13.7" cy="8.4" r="0.75" fill="#5b3a2c" stroke="none"/><ellipse cx="9.4" cy="10.3" rx="0.9" ry="0.55" fill="#e7b4a4" stroke="none"/><ellipse cx="14.6" cy="10.3" rx="0.9" ry="0.55" fill="#e7b4a4" stroke="none"/></svg><span>人格</span></button><button class="tb"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2" stroke="#5b3a2c" stroke-width="3.2" stroke-dasharray="2.7 3.74"/><circle cx="12" cy="12" r="6.6" fill="#c4e8da" stroke="#5b3a2c" stroke-width="1.5"/><circle cx="12" cy="12" r="2.3" fill="#fbf6ea" stroke="#5b3a2c" stroke-width="1.5"/></svg><span>设置</span></button></nav></div></section>
</div></div></div>
<script>
const app=document.getElementById('app');const keep=f=>e=>{const y=app.scrollTop;f(e);requestAnimationFrame(()=>app.scrollTop=y)};
document.querySelectorAll('.sw').forEach(s=>s.onclick=keep(()=>{s.classList.toggle('on');s.setAttribute('aria-pressed',s.classList.contains('on'))}));
const dd=document.getElementById('dd');dd.querySelector('.cur').onclick=keep(()=>dd.classList.toggle('op'));
dd.querySelectorAll('li').forEach(l=>l.onclick=keep(()=>{dd.querySelectorAll('li').forEach(x=>x.classList.remove('on'));l.classList.add('on');document.getElementById('ddv').textContent=l.textContent;dd.classList.remove('op')}));
document.querySelectorAll('.nv').forEach(n=>n.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{n.querySelectorAll('.tb').forEach(x=>x.classList.remove('on'));b.classList.add('on')}));
const sl=document.getElementById('sl'),fl=sl.querySelector('.fl'),th=sl.querySelector('img'),sv=document.getElementById('slv');let v=.7;
function draw(){const w=sl.offsetWidth-24,x=12+w*v/2;fl.style.width=(x-12)+'px';th.style.left=x+'px';th.style.transform=`rotate(${(v-1)*20}deg)`;sv.textContent=v.toFixed(1);sl.setAttribute('aria-valuenow',v.toFixed(1))}
function at(e){const r=sl.getBoundingClientRect();v=Math.round(Math.max(0,Math.min(1,(e.clientX-r.left-12)/(r.width-24)))*20)/10;draw()}
sl.onpointerdown=e=>{sl.setPointerCapture(e.pointerId);at(e);sl.onpointermove=at};sl.onpointerup=()=>sl.onpointermove=null;
draw();addEventListener('resize',draw);document.fonts&&document.fonts.ready.then(draw);
</script></body></html>
