<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>样板间</title>
<style>@font-face{font-family:ZK;src:url(yb-zk.ttf)}@font-face{font-family:WK;src:url(yb-wk.ttf)}@font-face{font-family:Baloo;src:url(../snd/baloo.ttf);font-weight:100 900}@font-face{font-family:BalooX;src:url(../max/baloo800.ttf)}@font-face{font-family:Sofia;src:url(../max/sofia.ttf)}</style>
<link rel="stylesheet" href="base.css"><link id="skinlink" rel="stylesheet" href="skin-mint.css"><style>.note{margin-top:10px;font:var(--f4)/1.6 var(--ff-body);color:var(--ink2)}
.drip{position:absolute}
</style></head>
<body><div class="vp"><main class="app">
<img class="drip" src="../max/drizzle.png" alt="">
<header class="hd sec">
 <button class="b3 mt" aria-label="返回"><svg viewBox="0 0 20 20" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg></button>
 <div class="t"><h1>样板间</h1><span class="en">Kit</span></div>
 <span class="plate"><b>14</b>件</span>
</header>

<section class="sec">
 <img class="dec sway d2" src="../set/sprig.png" alt="" style="right:-96px;top:-34px;width:200px;opacity:.9;--o:100% 50%;--a:2deg">
 <div class="grp"><span class="no">00</span><span class="rib"><h2>换皮</h2><span class="ct">两套</span></span><span class="end"></span></div>
 <div class="pick" id="skin"><button class="cur"><span>皮肤</span><span class="v"><span>薄荷巧克力</span><svg viewBox="0 0 10 10" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="m2 3.5 3 3 3-3"/></svg></span></button>
 <div class="opts"><button class="opt on" data-s="skin-mint.css">薄荷巧克力</button><button class="opt" data-s="skin-dark.css">黑巧</button></div></div>
</section>

<section class="sec">
 <img class="dec sway" src="../max/leaves.png" alt="" style="left:-34px;top:-26px;width:62px;--o:80% 80%;--a:6deg">
 <div class="grp"><span class="no">01</span><span class="rib"><h2>列表行</h2><span class="ct">3 杯</span></span><span class="end"><button class="b4">拉新的</button></span></div>
 <div class="rows">
 <button class="row on"><span class="nm"><b>gpt-4o</b><svg class="ico" viewBox="0 0 16 16" fill="#a6d9c4" stroke="#5b8a74" stroke-width="1"><path d="M2.5 13.5C2.5 6 7 2.5 13.5 2.5 13.5 9 10 13.5 2.5 13.5Z"/><path d="M3 13 10 6" fill="none"/></svg><svg class="ico" viewBox="0 0 16 16" fill="#f6e3b8" stroke="#a9825f" stroke-width="1" stroke-linejoin="round"><path d="M8 1.8 9.8 6l4.4.4-3.3 2.9 1 4.4L8 11.4l-3.9 2.3 1-4.4L1.8 6.4 6.2 6Z"/></svg></span><span class="sub">窗口 128K · 输出 16K · 能看图 · 流式</span><span class="sep"></span><span class="num">128<sup>K</sup><small>中杯 56%</small></span></button>
 <button class="row"><span class="nm"><b>claude-sonnet-4</b><svg class="ico" viewBox="0 0 16 16" fill="#a6d9c4" stroke="#5b8a74" stroke-width="1"><path d="M2.5 13.5C2.5 6 7 2.5 13.5 2.5 13.5 9 10 13.5 2.5 13.5Z"/><path d="M3 13 10 6" fill="none"/></svg><svg class="ico" viewBox="0 0 16 16" fill="#f6e3b8" stroke="#a9825f" stroke-width="1" stroke-linejoin="round"><path d="M8 1.8 9.8 6l4.4.4-3.3 2.9 1 4.4L8 11.4l-3.9 2.3 1-4.4L1.8 6.4 6.2 6Z"/></svg></span><span class="sub">窗口 200K · 输出 64K · 备用 gpt-4o</span><span class="sep"></span><span class="num">200<sup>K</sup><small>大杯 72%</small></span></button>
 <button class="row"><span class="nm"><b>gemini-2.5-pro</b><svg class="ico" viewBox="0 0 16 16" fill="#f6e3b8" stroke="#a9825f" stroke-width="1" stroke-linejoin="round"><path d="M8 1.8 9.8 6l4.4.4-3.3 2.9 1 4.4L8 11.4l-3.9 2.3 1-4.4L1.8 6.4 6.2 6Z"/></svg></span><span class="sub">窗口 1M · 输出 64K</span><span class="sep"></span><span class="num">1<sup>M</sup><small>满格 100%</small></span></button>
 </div>
</section>

<section class="sec">
 <img class="dec sway d3" src="../max/truf.png" alt="" style="right:-22px;bottom:-38px;width:52px;--o:50% 100%;--a:5deg">
 <img class="dec sway d2" src="../max/bit3.png" alt="" style="right:10px;top:4px;width:26px;--o:50% 50%;--a:12deg">
 <div class="grp"><span class="no">02</span><span class="rib"><h2>按钮</h2><span class="ct">四级</span></span><span class="end"></span></div>
 <div class="b2s"><button class="b2"><svg class="ico" viewBox="0 0 16 16" fill="#a6d9c4" stroke="#5b8a74" stroke-width="1"><path d="M2.5 13.5C2.5 6 7 2.5 13.5 2.5 13.5 9 10 13.5 2.5 13.5Z"/><path d="M3 13 10 6" fill="none"/></svg>试听</button><button class="b2">设默认</button><button class="b2 dg">删掉</button></div>
 <div style="display:flex;align-items:center;gap:12px;margin-top:14px">
  <button class="b3" aria-label="新建"><svg viewBox="0 0 20 20" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4v12M4 10h12"/></svg></button><button class="b3 mt" aria-label="搜索"><svg viewBox="0 0 20 20" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.8" cy="8.8" r="5"/><path d="m12.6 12.6 3.6 3.6"/></svg></button><button class="b3 mt" aria-label="编辑"><svg viewBox="0 0 20 20" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 16 1-4 8-8 3 3-8 8Z"/></svg></button>
  <span style="margin-left:auto;display:flex;gap:2px"><button class="b4">再想想</button><button class="b4 dg">撕掉</button></span>
 </div>
 <p class="note">一级巧克力牌每屏只放一个，在下面「保存」。二级薄荷排块几格连着；三级圆形小甜点放图标；四级只是字。</p>
</section>

<section class="sec">
 <img class="dec sway d2" src="../max/m_curls.png" alt="" style="right:-60px;top:6px;width:150px;opacity:.9;--o:30% 50%;--a:-3deg">
 <div class="grp"><span class="no">03</span><span class="rib"><h2>填写</h2><span class="ct">改了才能存</span></span><span class="end"></span></div>
 <div class="fld"><label>名字</label><input class="in" id="f1" value="小鲸鱼中转"></div>
 <div class="fld"><label>地址</label><input class="in" id="f2" value="https://example.local/v1" inputmode="url"></div>
 <div class="fld"><label>格式</label>
 <div class="pick" id="fmt"><button class="cur"><span>请求格式</span><span class="v"><span>OpenAI</span><svg viewBox="0 0 10 10" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="m2 3.5 3 3 3-3"/></svg></span></button>
 <div class="opts"><button class="opt on">OpenAI</button><button class="opt">Anthropic</button><button class="opt">Gemini</button></div></div></div>
 <div class="fld"><label>备注</label><textarea class="in" id="f3" placeholder="写给自己看的，可不填"></textarea></div>
 <button class="b1" id="save" disabled><span>保存</span></button>
</section>

<section class="sec">
 <img class="dec sway" src="../max/m_macaron.png" alt="" style="right:-18px;top:2px;width:50px;--o:50% 100%;--a:-5deg">
 <div class="grp"><span class="no">04</span><span class="rib"><h2>筛选 · 搜索</h2><span class="ct"></span></span><span class="end"></span></div>
 <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input class="in" placeholder="搜模型名" style="flex:1"><button class="b3" aria-label="搜索"><svg viewBox="0 0 20 20" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.8" cy="8.8" r="5"/><path d="m12.6 12.6 3.6 3.6"/></svg></button></div>
 <div class="flt"><button class="fp on">全部 <i>5</i></button><button class="fp">小鲸鱼 <i>2</i></button><button class="fp">Anthropic <i>2</i></button><button class="fp">Gemini <i>1</i></button></div>
</section>

<section class="sec">
 <img class="dec sway d3" src="../max/whip.png" alt="" style="right:-14px;top:-14px;width:54px;--o:50% 100%;--a:4deg">
 <div class="grp"><span class="no">05</span><span class="rib"><h2>做完 · 危险</h2><span class="ct"></span></span><span class="end"></span></div>
 <div class="b2s"><button class="b2" id="tst">响出餐铃</button><button class="b2 dg" id="cfm"><svg viewBox="0 0 20 20" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6h11M8 6V4h4v2M6 6l1 10h6l1-10"/></svg>删一条</button></div>
</section>

<section class="sec">
 <img class="dec sway d2" src="../max/cookie.png" alt="" style="left:-46px;bottom:-96px;width:96px;--o:50% 100%;--a:3deg">
 <div class="grp"><span class="no">06</span><span class="rib"><h2>空 · 等 · 错</h2><span class="ct"></span></span><span class="end"></span></div>
 <div class="state"><img src="../max/m_bonbon.png" alt="" style="width:62px">
  <span class="t">罐子还空着</span><span class="s">先接一条渠道，模型会自己排进来</span>
  <div class="b2s" style="margin-top:4px"><button class="b2"><svg class="ico" viewBox="0 0 20 20" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4v12M4 10h12"/></svg>接一条</button></div></div>
 <div class="state" style="margin-top:10px"><div class="ld"><i></i><i></i><i></i></div><span class="s">正在拉模型…</span></div>
 <div class="state err" style="margin-top:10px"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#8a5c46" stroke-width="1.3" stroke-linejoin="round"><path d="M12 3 22 20H2Z" fill="#f6d7cb"/><path d="M12 9.5v5" stroke="#b8573c" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.2" fill="#b8573c" stroke="none"/></svg><span class="s">连不上 example.local，钥匙可能过期</span><button class="b4">重试</button></div>
</section>
</main></div><script src="../ui.js"></script><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
$$('.row').forEach(r=>r.onclick=()=>r.classList.toggle('on'));
$$('.fp').forEach(f=>f.onclick=()=>{$$('.fp').forEach(x=>x.classList.remove('on'));f.classList.add('on')});
function pick(el,cb){const c=el.querySelector('.cur'),v=el.querySelector('.v span');c.onclick=()=>el.classList.toggle('open');
 el.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{el.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));o.classList.add('on');v.textContent=o.textContent;setTimeout(()=>el.classList.remove('open'),180);cb&&cb(o)})}
pick($('#skin'),o=>{$('#skinlink').href=o.dataset.s;MC.toast('换成「'+o.textContent+'」了')});
const save=$('#save'),fs=['#f1','#f2','#f3'].map($);let base=fs.map(f=>f.value),fmt0='OpenAI';
const dirty=()=>fs.some((f,i)=>f.value!==base[i])||$('#fmt .v span').textContent!==fmt0;
const upd=()=>save.disabled=!dirty();fs.forEach(f=>f.oninput=upd);pick($('#fmt'),upd);
save.onclick=()=>{const old=base,of=fmt0;base=fs.map(f=>f.value);fmt0=$('#fmt .v span').textContent;upd();
 MC.toast('存好了',{undo:()=>{base=old;fmt0=of;upd()}})};
$('#tst').onclick=()=>MC.toast('模型拉好了，新来 2 杯',{undo:()=>MC.toast('撤回了')});
$('#cfm').onclick=async()=>{if(await MC.confirm({title:'删掉这条？',body:'<b>claude-sonnet-4</b> 会从渠道里拿掉，用它的人格会换成备用。',ok:'删掉',cancel:'再想想'}))MC.toast('删掉了',{undo:()=>MC.toast('放回去了')})};
</script></body></html>
