<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聊天室 · 描图样张</title>
<style>
/* 2026-11-22 聊天室样张二版：茶茶说一版不如聊天卡精致 → 改用聊天卡同一套做法：
   薄荷/奶油外带 + 纸纹内页 + 金色框中框 + 角花卷草 + 多层柔影；名牌=金边巧克力小牌；蝴蝶结沿用卡上那只；横幅=金边巧克力牌+绸带燕尾。
   结构仍是 A 名牌压沿 + B 两端挂饰 + C 大事横幅（参考直播聊天挂件，只借做法）。 */
@font-face{font-family:ZK;src:url(zk.ttf)}
@font-face{font-family:WK;src:url(wk.ttf)}
@font-face{font-family:Baloo;src:url(baloo.ttf);font-weight:100 900}
@font-face{font-family:Script;src:url(script.ttf)}
:root{--ink:#4a3027;--line:#5b3a2c;--cocoa:#8a5c46;--choc:#5b3a2b;--gold:#c9a063;--cream:#fbf3e4;--mint2:#9fd3bf;--mint3:#3f9a80;--msh:#86c2ab;
--sh:drop-shadow(0 1px 1.2px rgba(110,70,45,.32)) drop-shadow(2px 5px 6px rgba(110,70,45,.22)) drop-shadow(4px 11px 13px rgba(110,70,45,.13))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:repeating-linear-gradient(90deg,#d5efe5 0 24px,#eaf8f2 24px 48px);font-family:WK,serif;color:var(--ink);overflow-x:hidden}
.hd{position:relative;display:flex;align-items:center;gap:10px;padding:44px 14px 12px}
.rb{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 2px 8px rgba(70,110,95,.18);display:grid;place-items:center}
.rb svg{width:20px;height:20px}
.tt{flex:1;text-align:center;position:relative}
.tt h1{font:400 21px/1.1 ZK,sans-serif;color:var(--choc);letter-spacing:.06em}
.tt i{position:absolute;left:50%;top:-10px;margin-left:36px;font:19px/1 Script,cursive;color:var(--mint3);transform:rotate(-7deg);white-space:nowrap}
.tt small{display:block;margin-top:6px;font:11px/1 ZK,sans-serif;color:#8a6a5a;letter-spacing:.1em}
.tt small::before{content:"";display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--mint3);margin-right:5px;vertical-align:1px}
.flow{padding:18px 20px 124px 18px;display:flex;flex-direction:column;gap:34px}
.day{align-self:center;display:flex;align-items:center;gap:8px;font:12px/1 ZK,sans-serif;color:var(--cocoa);letter-spacing:.08em}
.day::before,.day::after{content:"";width:46px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.day::after{transform:scaleX(-1)}
.day b{font:700 13px/1 Baloo,sans-serif;color:var(--choc);letter-spacing:0}
.day i{width:5px;height:5px;background:var(--gold);transform:rotate(45deg)}
.m{position:relative;max-width:80%;margin-top:8px}
.m.me{align-self:flex-end}
.bb{position:relative;isolation:isolate;padding:22px 19px 15px;font-size:14.5px;line-height:1.72;color:#4f382c}
.bb>svg.fr{position:absolute;left:0;top:0;z-index:-1;overflow:visible;pointer-events:none;filter:var(--sh)}
.bb em{font-style:normal;color:#3a8f75}
.me .bb{color:#3d3a2c}.me .bb em{color:var(--cocoa)}
/* A 名牌：金边巧克力小牌（同日期牌） */
.nm{position:absolute;z-index:3;top:-13px;left:16px;height:26px;padding:0 13px;display:flex;align-items:center;gap:6px;font:12.5px/1 ZK,sans-serif;letter-spacing:.1em;color:#fbeedb;
border:2.2px solid transparent;border-radius:8px;background:linear-gradient(160deg,#6f4835,#4b2e21) padding-box,linear-gradient(135deg,#f6e2b8,#e0bb80 50%,#b98b52) border-box;
box-shadow:0 0 0 1.1px var(--cocoa);filter:drop-shadow(1px 2px 1.5px rgba(74,48,39,.3))}
.nm::before{content:"";position:absolute;inset:2px;border:.8px dashed #c99a62;border-radius:5px;pointer-events:none}
.nm i{width:4.5px;height:4.5px;background:#e2bf86;transform:rotate(45deg)}
.me .nm{left:auto;right:16px;color:#3f271d;background:linear-gradient(180deg,#dcf3e9,#a6d8c3) padding-box,linear-gradient(135deg,#f6e2b8,#e0bb80 50%,#b98b52) border-box}
.me .nm::before{border-color:#7fbea5}
.me .nm i{background:#c9a063}
/* B 挂饰 */
.or{position:absolute;z-index:4;pointer-events:none;overflow:visible;filter:drop-shadow(0 1px 1px rgba(60,35,25,.35))}
.or.bow{right:-16px;bottom:-14px;width:50px;height:30px;transform:rotate(-10deg)}
.or.lf{left:-14px;bottom:-12px;width:34px;height:30px;transform:rotate(10deg)}
.or.sp{width:13px;height:13px;filter:none}
.m:not(.me) .or.sp{right:14px;top:-7px}
.me .or.sp{left:14px;top:-7px}
.tm{margin-top:11px;padding:0 10px;display:flex;align-items:center;gap:5px;font:600 11px/1 Baloo,sans-serif;color:#9b7c6a;letter-spacing:.04em}
.tm::before{content:"";width:4px;height:4px;background:var(--gold);transform:rotate(45deg)}
.me .tm{justify-content:flex-end}
/* C 横幅：金边巧克力牌 + 绸带燕尾 */
.ev{position:relative;align-self:center;width:84%;margin:14px 0 6px;filter:var(--sh)}
.ev .lb{position:absolute;z-index:3;left:50%;top:-13px;transform:translateX(-50%);height:24px;padding:0 12px;display:flex;align-items:center;gap:6px;font:11.5px/1 ZK,sans-serif;letter-spacing:.14em;color:#3f271d;white-space:nowrap;
border:2px solid transparent;border-radius:7px;background:linear-gradient(180deg,#dcf3e9,#a6d8c3) padding-box,linear-gradient(135deg,#f6e2b8,#e0bb80 50%,#b98b52) border-box;box-shadow:0 0 0 1px var(--cocoa)}
.ev .lb i{width:4px;height:4px;background:#c9a063;transform:rotate(45deg)}
.ev .tail{position:absolute;z-index:0;top:12px;width:34px;height:40px;overflow:visible}
.ev .tail.l{left:-24px}.ev .tail.r{right:-24px;transform:scaleX(-1)}
.ev .band{position:relative;z-index:1;padding:17px 18px 13px;text-align:center;border:3px solid transparent;border-radius:12px;
background:linear-gradient(160deg,#6f4835,#4b2e21) padding-box,linear-gradient(135deg,#f6e2b8,#e0bb80 50%,#b98b52) border-box;box-shadow:0 0 0 1.3px var(--cocoa)}
.ev .band::before{content:"";position:absolute;inset:3px;border:.8px dashed #c99a62;border-radius:8px}
.ev .band::after{content:"";position:absolute;left:8px;top:5px;width:40%;height:10px;border-top:1.2px solid #9a6d52;border-left:1.2px solid #9a6d52;border-radius:8px 0 0 0;opacity:.8}
.ev p{position:relative;font:400 14px/1.5 ZK,sans-serif;color:#fbeedb;letter-spacing:.06em}
.ev p small{display:block;font:12px/1.5 WK,serif;color:#e6cfae;letter-spacing:.02em}
.ev .wl{position:absolute;z-index:2;top:14px;width:14px;height:30px}
.ev .wl.l{left:9px}.ev .wl.r{right:9px;transform:scaleX(-1)}
/* 输入栏：同底栏三版 */
.ip{position:fixed;z-index:20;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));height:58px;display:flex;align-items:center;gap:8px;padding:0 9px;background:var(--cream);border:2px solid var(--line);border-radius:22px;box-shadow:0 4px 0 var(--msh)}
.pl{width:36px;height:36px;flex:none;border-radius:50%;background:var(--mint2);border:1.4px solid var(--line);display:grid;place-items:center}
.pl svg{width:16px;height:16px}
.fd{flex:1;height:38px;border-radius:12px;background:#fffaf1;border:1.2px solid #d8c0a0;font:14px/38px WK,serif;color:#b59a85;padding:0 12px}
.sd{height:38px;flex:none;padding:0 15px;border:1.4px solid #3f271d;border-radius:10px;background:var(--choc);color:#fbeedb;font:14px/1 ZK,sans-serif;letter-spacing:.12em}

/* 三版：整页外框 + 生图物件 + 输入栏同气泡做法（照茶茶 GPT 概念图） */
.flow{padding:18px 20px 124px 18px}
.ob{position:absolute;z-index:5;pointer-events:none;height:auto}
/* 物件立在气泡上沿（像放在台面上），蝴蝶结系在角上 */
.ob.bowc{width:50px;left:-8px;top:-24px;transform:rotate(-14deg)}
.m.first .nm{left:34px}
.ob.choc{width:60px;right:14px;top:-37px}
.ob.cup{width:50px;left:16px;top:-36px}
.ob.cake{width:62px;right:14px;top:-38px}
.ob.bowm{width:50px;left:-18px;bottom:-12px;transform:rotate(-8deg)}
.ev .ob.jar{width:30px;right:30px;bottom:10px;z-index:4}
.ev .band p{padding-right:36px}
.ev .crn{position:absolute;z-index:4;left:50%;top:-32px;width:30px;height:20px;margin-left:-15px;overflow:visible}
.ev .lb{top:-14px}
.ip{position:fixed;z-index:20;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));height:60px;padding:0 12px 0 16px;display:flex;align-items:center;gap:8px;background:none;border:0;box-shadow:none;border-radius:0;isolation:isolate}
.ip>svg.fr{position:absolute;left:0;top:0;z-index:-1;overflow:visible;pointer-events:none;filter:var(--sh)}
.pl{width:38px;height:38px;border:0;background:none;border-radius:0;padding:0}
.pl svg{width:38px;height:38px;overflow:visible}
.fd{height:36px;border-radius:9px;background:#fffaf1;border:1px solid #d6bc98;box-shadow:inset 0 1px 2px rgba(120,80,50,.12);line-height:36px}
.sd{position:relative;height:36px;padding:0 16px;border:2.2px solid transparent;border-radius:9px;background:linear-gradient(160deg,#6f4835,#4b2e21) padding-box,linear-gradient(135deg,#f6e2b8,#e0bb80 50%,#b98b52) border-box;box-shadow:0 0 0 1.1px var(--cocoa);filter:drop-shadow(1px 2px 1.5px rgba(74,48,39,.3))}
.sd::before{content:"";position:absolute;inset:2px;border:.8px dashed #c99a62;border-radius:6px}

/* C 虚线内圈（照 kyri Matcha 版结构）：圆角 + 可可描边 + 一圈虚线，替换旧切角四层框 */
.bb>svg.fr,.ip>svg.fr{display:none}
.bb{padding:18px 18px 13px;background:#fffaf1;border:1.4px solid #8a5c46;border-radius:20px;box-shadow:0 1px 1.5px rgba(110,70,45,.25),2px 6px 12px rgba(110,70,45,.16)}
.bb::before{content:"";position:absolute;inset:4px;border:1.3px dashed #9fd2bd;border-radius:16px;pointer-events:none;z-index:-1}
.me .bb{background:#dcf1e8}
.me .bb::before{border-color:#fffaf1}
.ip{background:#fffaf1;border:1.4px solid #8a5c46;border-radius:22px;box-shadow:0 1px 1.5px rgba(110,70,45,.25),2px 6px 12px rgba(110,70,45,.18);padding:0 10px 0 9px}
.ip::before{content:"";position:absolute;inset:4px;border:1.3px dashed #9fd2bd;border-radius:18px;pointer-events:none;z-index:-1}

function cn(x,y,sx,sy,k){return `<g transform="translate(${x} ${y}) scale(${sx*k} ${sy*k})" fill="none" stroke="#a87a45" stroke-width="1.1" stroke-linecap="round">

function draw(bb){

  s.innerHTML=`
