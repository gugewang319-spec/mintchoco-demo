<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聊天卡 · 描图样张</title>
<style>
/* 2026-11-22 描图样张：照茶茶给的概念图，用 SVG 一层层画（背后两层错位卡、外框薄荷带、奶油内页、框中框、角花、
   斜纹条、蕾丝、日期巧克力牌 + 缎带、来源小牌、标题分隔、邮戳、底栏时间牌、页点、云朵计数牌、书签）。
   卡片外框随宽高由脚本重画，字是真文字，能换行。 */
@font-face{font-family:ZK;src:url(zk.ttf)}
@font-face{font-family:WK;src:url(wk.ttf)}
@font-face{font-family:Baloo;src:url(baloo.ttf);font-weight:100 900}
@font-face{font-family:Script;src:url(script.ttf)}
@font-face{font-family:Serif;src:url(serif.ttf);font-weight:800}
:root{--ink:#4a3027;--cocoa:#8a5c46;--choc:#5b3a2b;--gold:#c9a063;--cream:#f8efdf;--cream2:#f1e4cd;--mint:#bfe3d4;--mint2:#9fd3bf;--mint3:#5fae93}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:repeating-linear-gradient(90deg,#d5efe5 0 24px,#eaf8f2 24px 48px);font-family:WK,serif;color:var(--ink);overflow-x:hidden}
.top{padding:52px 22px 0;display:flex;align-items:flex-end;gap:6px}
.top h1{font-family:ZK,sans-serif;font-weight:400;font-size:30px;color:var(--choc);letter-spacing:.04em}
.top i{font:28px/1 Script,cursive;color:var(--mint3);transform:rotate(-6deg) translateY(-12px);display:block}
.list{padding:92px 26px 110px 20px}
.cc{position:relative;isolation:isolate;padding:64px 24px 118px;min-height:250px}
.cc>svg.fr{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;filter:drop-shadow(0 1px 1.2px rgba(110,70,45,.34)) drop-shadow(2px 6px 7px rgba(110,70,45,.26)) drop-shadow(5px 14px 16px rgba(110,70,45,.16))}
.cc .in{position:relative;z-index:2}
.cc h3{font-family:ZK,sans-serif;font-weight:400;font-size:24px;line-height:1.38;color:var(--choc);letter-spacing:.02em;-webkit-text-stroke:.45px var(--choc)}
.cc .dv{display:block;width:100%;height:20px;margin:6px 0 4px}
.cc p{font-size:14.5px;line-height:1.75;color:#5d4335}
/* 日期巧克力牌 */
.plq{position:absolute;z-index:4;left:0;top:-80px;width:132px;height:112px;transform:rotate(-4deg);transform-origin:50% 60%}
.plq svg{position:absolute;inset:0;overflow:visible;filter:drop-shadow(0 1px 1.2px rgba(110,70,45,.34)) drop-shadow(2px 6px 7px rgba(110,70,45,.26)) drop-shadow(5px 14px 16px rgba(110,70,45,.16))}
.plq b{position:absolute;left:0;right:0;top:28px;text-align:center;font:800 29px/1 Baloo,sans-serif;color:#fbeedb;letter-spacing:.01em}
.plq small{position:absolute;left:0;right:0;top:61px;text-align:center;font:11.5px/1 ZK,sans-serif;color:#f3e2c8;letter-spacing:.04em}
/* 来源小牌 */
.tag{position:absolute;z-index:4;right:16px;top:12px;height:24px;padding:0 12px 0 22px;border-radius:12px 4px 12px 4px;background:var(--cream);box-shadow:0 0 0 1.3px var(--cocoa),inset 0 0 0 2.5px #fff9ee,1px 2px 2px rgba(74,48,39,.25);background:linear-gradient(170deg,#fffaf0,#f3e6cf);font:700 13px/24px Baloo,sans-serif;color:var(--choc);letter-spacing:.04em}
.tag::before{content:"";position:absolute;left:10px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--choc)}
/* 底栏 */
.ft{position:absolute;z-index:3;left:22px;right:100px;bottom:27px;display:flex;align-items:center;gap:12px}
.tm{position:relative;display:block;width:112px;height:31px;flex:none}
.tm svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(1px 2px 1.5px rgba(74,48,39,.25))}
.tm b{position:absolute;inset:0;text-align:center;font:700 16px/31px Baloo,sans-serif;color:var(--choc)}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:9px;height:9px;border-radius:2.5px;background:#ead9c0;box-shadow:inset 0 0 0 1px #d8c0a0}
.dots i.on{background:var(--mint2);box-shadow:inset 0 0 0 1px var(--mint3)}
.dots em{font-style:normal;font-size:10px;color:#cdb393;letter-spacing:1px}
.bdg{position:absolute;z-index:5;right:-6px;bottom:2px;width:108px;height:92px}
.bdg svg{position:absolute;inset:0;overflow:visible;filter:drop-shadow(0 1px 1.2px rgba(110,70,45,.34)) drop-shadow(2px 6px 7px rgba(110,70,45,.26)) drop-shadow(5px 14px 16px rgba(110,70,45,.16))}
.bdg b{position:absolute;left:0;right:0;top:17px;text-align:center;font:800 38px/1 Serif,Georgia,serif;color:#fbeedb;text-shadow:0 1px 0 #3e261c}
.bdg small{position:absolute;left:0;right:0;top:59px;text-align:center;font:11px/1 ZK,sans-serif;color:var(--choc);letter-spacing:.06em}
.bm{position:absolute;z-index:-1;left:30px;bottom:-38px;width:22px;height:46px;overflow:visible;filter:drop-shadow(1px 2px 1.5px rgba(74,48,39,.3))}
/* 底部导航（2026-11-22 二版）：照 QQ 主题做法——一条底图 + 每钮正常/选中两套图标。底图同卡片：薄荷外带、奶油内页、金色框中框线。
   图标用原来的手绘图标：未选中只留可可线描（填奶油），选中填薄荷、轻跳一下，上沿的小蝴蝶结滑到选中格头上。 */
.nav{position:fixed;z-index:20;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));height:62px;background:#fbf3e4;border:2px solid #5b3a2c;border-radius:22px;box-shadow:0 4px 0 #86c2ab}
.nav .tabs{position:absolute;inset:0;padding:0 6px;display:flex}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8a6a5a;font:11.5px/1 ZK,sans-serif;letter-spacing:.08em;-webkit-tap-highlight-color:transparent;cursor:pointer}
.nav .ic{position:relative;display:block;width:26px;height:26px}
.nav .ic>svg:first-child{width:26px;height:26px;display:block;overflow:visible;transition:filter .25s}
.nav button.on .ic>svg:first-child{filter:drop-shadow(0 0 3px rgba(63,154,128,.85)) drop-shadow(0 0 6px rgba(166,213,193,.9))}
.nav .dot{position:absolute;top:-1px;right:-3px;width:7px;height:7px;border-radius:4px;background:#3f9a80;box-shadow:0 0 0 2px #fbf3e4}
.nav button.on{color:#4a3027}
.nav button.on span{font-weight:600}
.nav button.hop .ic>svg:first-child{animation:hop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-5px) scale(1.06)}100%{transform:none}}
@media (prefers-reduced-motion:no-preference){
  .bow{transform-origin:66px 92px;animation:sw 5.5s ease-in-out infinite}
  .bm{transform-origin:12px 0;animation:sw 6.5s ease-in-out infinite -2s}
  @keyframes sw{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
}
</style></head><body>

<script>

</g>`}
function draw(cc){

    <rect x="${P+118}" y="${P+13}" width="${iw}" height="1" fill="#8a5c46" opacity=".55"/>

  <line x1="${P+6}" y1="${fy+3}" x2="${W-P-6}" y2="${fy+3}" stroke="#c9a98a" stroke-width=".7" stroke-dasharray="3 2"/>
  ${cn(P+9,P+31,1,1)}${cn(W-P-9,P+31,-1,1)}${cn(P+9,fy-7,1,-1)}${cn(W-P-9,fy-7,-1,-1)}

  <g transform="translate(${W-P-64} ${fy-48})" opacity=".58" fill="none" stroke="#bfa283" stroke-width=".75" stroke-linecap="round">

}
