<title>聊天卡 · 描图样张</title>
<style>
/* 2026-11-22 描图样张：照茶茶给的概念图，用 SVG 一层层画（背后两层错位卡、外框薄荷带、奶油内页、框中框、角花、
   斜纹条、蕾丝、日期巧克力牌 + 缎带、来源小牌、标题分隔、邮戳、底栏时间牌、页点、云朵计数牌、书签）。
   卡片外框随宽高由脚本重画，字是真文字，能换行。 */
@font-face{font-family:ZK;src:url(zk.ttf)}
@font-face{font-family:WK;src:url(wk.ttf)}
@font-face{font-family:Baloo;src:url(baloo.ttf);font-weight:100 900}
@font-face{font-family:Script;src:url(script.ttf)}
:root{--ink:#4a3027;--cocoa:#8a5c46;--choc:#5b3a2b;--gold:#c9a063;--cream:#f8efdf;--cream2:#f1e4cd;--mint:#bfe3d4;--mint2:#9fd3bf;--mint3:#5fae93}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:repeating-linear-gradient(90deg,#d5efe5 0 24px,#eaf8f2 24px 48px);font-family:WK,serif;color:var(--ink);overflow-x:hidden}
.top{padding:40px 22px 0;display:flex;align-items:flex-end;gap:6px}
.top h1{font-family:ZK,sans-serif;font-weight:400;font-size:30px;color:var(--choc);letter-spacing:.04em}
.top i{font:28px/1 Script,cursive;color:var(--mint3);transform:rotate(-6deg) translateY(-12px);display:block}
.list{padding:70px 26px 80px 20px}
.cc{position:relative;padding:62px 24px 84px;min-height:250px}
.cc>svg.fr{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;filter:drop-shadow(2px 5px 6px rgba(74,48,39,.18))}
.cc .in{position:relative;z-index:2}
.cc h3{font-family:ZK,sans-serif;font-weight:400;font-size:22px;line-height:1.36;color:var(--choc);letter-spacing:.02em;margin-top:10px}
.cc .dv{display:block;width:100%;height:16px;margin:8px 0 6px}
.cc p{font-size:14.5px;line-height:1.75;color:#5d4335}
/* 日期巧克力牌 */
.plq{position:absolute;z-index:4;left:6px;top:-58px;width:118px;height:118px}
.plq svg{position:absolute;inset:0;overflow:visible;filter:drop-shadow(1.5px 3px 2.5px rgba(74,48,39,.32))}
.plq b{position:absolute;left:0;right:0;top:27px;text-align:center;font:800 29px/1 Baloo,sans-serif;color:#fbeedb;letter-spacing:.01em}
.plq small{position:absolute;left:0;right:0;top:63px;text-align:center;font:11.5px/1 ZK,sans-serif;color:#f3e2c8;letter-spacing:.04em}
/* 来源小牌 */
.tag{position:absolute;z-index:4;right:16px;top:12px;height:24px;padding:0 12px 0 22px;border-radius:12px 4px 12px 4px;background:var(--cream);box-shadow:0 0 0 1.3px var(--cocoa),inset 0 0 0 2.5px #fff9ee,1px 2px 2px rgba(74,48,39,.25);background:linear-gradient(170deg,#fffaf0,#f3e6cf);font:700 13px/24px Baloo,sans-serif;color:var(--choc);letter-spacing:.04em}
.tag::before{content:"";position:absolute;left:10px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--choc)}
/* 底栏 */
.ft{position:absolute;z-index:3;left:22px;right:100px;bottom:27px;display:flex;align-items:center;gap:12px}
.tm{position:relative;display:block;width:112px;height:31px;flex:none}
.tm svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(1px 2px 1.5px rgba(74,48,39,.25))}
.tm b{position:absolute;inset:0;text-align:center;font:700 16px/31px Baloo,sans-serif;color:var(--choc)}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:9px;height:9px;border-radius:2.5px;background:#ead9c0;box-shadow:inset 0 0 0 1px #d8c0a0}
.dots i.on{background:var(--mint2);box-shadow:inset 0 0 0 1px var(--mint3)}
.dots em{font-style:normal;font-size:10px;color:#cdb393;letter-spacing:1px}
.bdg{position:absolute;z-index:5;right:-6px;bottom:2px;width:108px;height:92px}
.bdg svg{position:absolute;inset:0;overflow:visible;filter:drop-shadow(1.5px 3px 2.5px rgba(74,48,39,.32))}
.bdg b{position:absolute;left:0;right:0;top:20px;text-align:center;font:800 32px/1 Baloo,sans-serif;color:#fbeedb}
.bdg small{position:absolute;left:0;right:0;top:63px;text-align:center;font:11px/1 ZK,sans-serif;color:var(--choc);letter-spacing:.06em}
.bm{position:absolute;z-index:1;left:28px;bottom:-34px;width:24px;height:44px;overflow:visible;filter:drop-shadow(1px 2px 1.5px rgba(74,48,39,.3))}
@media (prefers-reduced-motion:no-preference){
  .bow{transform-origin:59px 104px;animation:sw 5.5s ease-in-out infinite}
  .bm{transform-origin:12px 0;animation:sw 6.5s ease-in-out infinite -2s}
  @keyframes sw{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
}
