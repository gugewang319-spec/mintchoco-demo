<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>frame vb3 · 签条语言气泡框</title>
<style>
@font-face{font-family:Script;src:url(../hlt/script.ttf)}
@font-face{font-family:BalooX;src:url(../hlt/baloo800.ttf)}
@font-face{font-family:ZK;src:url(zk.ttf?v=2)}
@font-face{font-family:WK;src:url(wk.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:repeating-linear-gradient(90deg,#d7eee5 0,#d7eee5 18px,#edf8f3 18px,#edf8f3 36px)}
body{font-family:WK,sans-serif;color:#5b3a2c}
.app{width:min(100%,412px);margin:0 auto;padding:48px 20px 96px}
h1{font:28px/1 ZK;display:flex;align-items:baseline;gap:8px}
h1 small{font:24px/1 Script;color:#3f9a80}
.lab{font-size:12px;color:#8a5c46;opacity:.8;margin:28px 0 4px;letter-spacing:.1em}
.sl{position:relative;margin-bottom:10px}
.sl svg{display:block;overflow:visible;position:relative;z-index:1}
.sl .tx{position:absolute;font-size:14px;line-height:20px;color:#5b3a2c;letter-spacing:.02em}
.sl .tg{position:absolute;font:13px/19px Script;color:#fbf6ea;text-align:center;letter-spacing:.02em}
.sl img{position:absolute;display:block;pointer-events:none;z-index:2}
.sl img.bk{z-index:0}
.sl .tg,.sl .tx,.sl .ft{z-index:3}
.sl .mk{position:absolute;overflow:visible;pointer-events:none;z-index:2}
.sl .ft{position:absolute;text-align:center;left:0;right:0}
.ft b{display:block;font:20px/1 BalooX;letter-spacing:.08em;color:#5b3a2c}
.ft i{display:block;font:20px/1.3 Script;color:#8a5c46;margin-top:4px}
.sl .tg.zh{font:13px/19px ZK}
.ttl{position:absolute;z-index:3}
.ttl b{display:block;font:21px/1.2 ZK;color:#5b3a2c}
.ttl i{display:block;font:17px/1.2 Script;color:#3f9a80;margin-top:2px}
.ttl p{font:13px/1.75 WK;color:#7a5a4c;margin-top:8px}
.ttl em{font:12px/1 WK;font-style:normal;color:#8a5c46;opacity:.8}
.meta{position:absolute;z-index:3;font:11px/1 BalooX;letter-spacing:.06em;color:#8a5c46;opacity:.7}
</style>
<div class="app">
<h1>气泡框 <small>sleeve bubble</small></h1>
<div class="lab">大信息框</div><div id="big"></div>
<div class="lab">对话气泡</div><div id="chat"></div>
<div class="lab">长条框</div><div id="row"></div>
</div>
<script>
const C='#8a5c46',INK='#5b3a2c',P='#fbf6ea',CAR='#e6bf7a',CARD='#c99a48';
const S=[
 {k:'empty',tag:'empty cup',band:['#d9cbbd','#bfae9e'],tint:'#ece4da',dia:'#d9cbbd',txt:'空杯 · 还没有内容',ic:'empty'},
 {k:'member',tag:'Mint Choco',band:['#7cc4ad','#3f9a80'],tint:'#c4e8da',dia:'#9fd6c3',txt:'普通签条：这一条有身份，需要被看见',ic:'leaf',star:1},
 {k:'making',tag:'brewing',band:['#b07a5e','#8a5c46'],tint:'#e9dccd',dia:'#d6c0aa',txt:'制作中 · 糖浆从左往右灌',ic:'spin',fill:.5},
 {k:'done',tag:'done',band:['#7cc4ad','#3f9a80'],tint:'#c4e8da',dia:'#9fd6c3',txt:'做好了 · 薄荷糖浆配一枚勾',ic:'pearl',star:1},
 {k:'fail',tag:'oops',band:['#e3a08f','#c9786a'],tint:'#f3d6cc',dia:'#e9b5a7',txt:'做坏了 · 点尾巴重做一杯',ic:'x'},
 {k:'over',tag:'overflow',band:['#f0cf8f','#c99a48'],tint:'#f5e4c3',dia:'#ecd09c',txt:'额度快满 · 焦糖溢出杯口，这一行字故意写长一点看看两行',ic:'bang',drip:1,star:1}
];
let uid=0;
function sprig(x,y,sc,rot){return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})"><path d="M0 14C1 6 4 0 10-6" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/><path d="M0 14C1 6 4 0 10-6" fill="none" stroke="#5aa98f" stroke-width="1.2" stroke-linecap="round"/><path d="M3 4C-8 4-13-4-12-12C-3-12 4-6 3 4Z" fill="url(#gmint)" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/><path d="M3 4C-3-1-7-6-10-10" fill="none" stroke="#2f7a64" stroke-width=".8"/><path d="M7-2C9-12 17-16 25-14C24-6 17 0 7-2Z" fill="url(#gmint)" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/><path d="M7-2C13-6 18-10 22-13" fill="none" stroke="#2f7a64" stroke-width=".8"/></g>`}
function straw(x,y,len,rot,id){return `<g transform="translate(${x} ${y}) rotate(${rot})"><rect x="-4" y="${-len}" width="8" height="${len}" rx="1.5" fill="url(#sw${id})" stroke="${INK}" stroke-width="1.2"/><path d="M-4 ${-len+3}h8" stroke="${INK}" stroke-width=".7" opacity=".5"/></g>`}
function body(x0,x1,t,h,c,tl){ // left notch, crimped right edge like a cup sleeve
 const r=c,m=t+h/2,n=7,k=Math.max(3,Math.round(h/16)),st=h/k,b=st/2;
 let d=`M${x0+r} ${t}H${x1}`;for(let i=0;i<k;i++)d+=`A${b} ${b} 0 0 1 ${x1} ${t+st*(i+1)}`;
 if(tl==='l')d+=`H${x0+46}L${x0+26} ${t+h+12}L${x0+30} ${t+h}`;if(tl==='r')d+=`H${x1-22}L${x1-30} ${t+h+12}L${x1-42} ${t+h}`;
 return d+`H${x0+r}Q${x0} ${t+h} ${x0} ${t+h-r}V${m+n}L${x0+n} ${m}L${x0} ${m-n}V${t+r}Q${x0} ${t} ${x0+r} ${t}Z`}
function icon(k,cx,cy){
 switch(k){
 case'empty':return `<circle cx="${cx}" cy="${cy}" r="6" fill="none" stroke="${P}" stroke-width="1.6" stroke-dasharray="3 2.5"/>`;
 case'leaf':return `<path d="M${cx-6} ${cy+5}c0-8 5-12 12-12-1 8-6 12-12 12z" fill="#d7f2e8" stroke="${INK}" stroke-width="1.1"/><path d="M${cx-6} ${cy+5}l8-8" stroke="#3f9a80" stroke-width="1"/>`;
 case'spin':return `<circle cx="${cx}" cy="${cy}" r="6" fill="none" stroke="${P}" stroke-width="2" stroke-dasharray="9 5"><animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="360 ${cx} ${cy}" dur="2.4s" repeatCount="indefinite"/></circle>`;
 case'pearl':return `<circle cx="${cx-3}" cy="${cy+2}" r="4.5" fill="#5b3a2c" stroke="${INK}"/><circle cx="${cx+4}" cy="${cy-1}" r="4.5" fill="#6d4636" stroke="${INK}"/><circle cx="${cx+2.5}" cy="${cy-2.5}" r="1.3" fill="${P}" opacity=".7"/><circle cx="${cx-4.5}" cy="${cy+.5}" r="1.3" fill="${P}" opacity=".6"/>`;
 case'x':return `<path d="M${cx-5} ${cy-5}l10 10M${cx+5} ${cy-5}l-10 10" stroke="${P}" stroke-width="2.4" stroke-linecap="round"/>`;
 case'bang':return `<path d="M${cx} ${cy-7}v8" stroke="${P}" stroke-width="2.6" stroke-linecap="round"/><circle cx="${cx}" cy="${cy+5}" r="1.6" fill="${P}"/>`;
 }}
function defs(id){return `<linearGradient id="gcar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5d9a0"/><stop offset="1" stop-color="${CARD}"/></linearGradient><linearGradient id="gmint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9e6d4"/><stop offset="1" stop-color="#5aa98f"/></linearGradient><pattern id="sw${id}" width="8" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><rect width="8" height="10" fill="${P}"/><rect width="8" height="5" fill="#7cc4ad"/></pattern>`}
function cup(x,y,id,k){ // small topping cup
 return `<path d="M${x+2} ${y+38}h26" stroke="${INK}" stroke-width="3" opacity=".18" stroke-linecap="round"/><path d="M${x+1} ${y+6}L${x+4} ${y+34}Q${x+15} ${y+38} ${x+26} ${y+34}L${x+29} ${y+6}Z" fill="url(#b${id})" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"/><path d="M${x+5} ${y+12}L${x+7} ${y+30}" stroke="${P}" stroke-width="1" opacity=".4" stroke-linecap="round"/><rect x="${x-2}" y="${y+1}" width="34" height="7" rx="3.5" fill="${P}" stroke="${INK}" stroke-width="1.3"/><path d="M${x+2} ${y+4.5}h26" stroke="${C}" stroke-width=".7" stroke-dasharray="1.5 2" opacity=".6"/>`}

const TH={mint:{band:['#7cc4ad','#3f9a80'],tint:'#c4e8da',dia:'#9fd6c3',cup:'mint'},cocoa:{band:['#b07a5e','#8a5c46'],tint:'#e9dccd',dia:'#d6c0aa',cup:'cocoa'},car:{band:['#f0cf8f','#c99a48'],tint:'#f5e4c3',dia:'#ecd09c',cup:'caramel'}};
function frame(o){ // o:{W,H,th,tag,zh,tail,leaf,cup,wave,mug,straw}
 const s=TH[o.th],id='u'+(uid++),T=24,W=o.W,H=o.H,x0=o.x0??10,x1=W-(o.cup?26:12);
 const tagX=26,tagW=o.tagW||Math.max(84,o.tag.length*(o.zh?15:7.6)+30);
 const B=body(x0,x1,T,H,8,o.tail);
 let g=`<svg width="${W}" height="${T+H+16}"><defs>${defs(id)}
 <linearGradient id="f${id}" x1="0" x2="1"><stop offset=".25" stop-color="${P}"/><stop offset="1" stop-color="${s.tint}"/></linearGradient>
 <linearGradient id="m${id}" x1="0" x2="1"><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".95"/></linearGradient>
 <mask id="k${id}"><rect width="${W}" height="400" fill="url(#m${id})"/></mask>
 <pattern id="d${id}" width="20" height="16" patternUnits="userSpaceOnUse" patternTransform="translate(${x1%20} ${T+2})"><rect x="1.5" y="1.5" width="17" height="13" rx="2.5" fill="${s.dia}" opacity=".55"/><path d="M4 12.5V4.5Q4 4 4.5 4H16" fill="none" stroke="#fff" stroke-width=".8" opacity=".5"/></pattern>
 <linearGradient id="b${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.band[0]}"/><stop offset="1" stop-color="${s.band[1]}"/></linearGradient>
 <clipPath id="c${id}"><path d="${B}"/></clipPath></defs>
 <path d="${body(x0,x1,T+3,H,8,o.tail)}" fill="${INK}" opacity=".16"/><path d="${B}" fill="url(#f${id})"/>
 <g clip-path="url(#c${id})"><rect width="${W}" height="${T+H+14}" fill="url(#d${id})" mask="url(#k${id})"/>`;
 const wv=o.wave||6;{let w=`M0 ${T+H}V${T+H-wv}`;for(let x=0;x<W;x+=16)w+=`q4 -3 8 0t8 0`;g+=`<path d="${w}V${T+H+14}H0Z" fill="${s.band[1]}" opacity="${o.wave?.5:.3}"/><path d="${w.replace(/V[\d.]+$/,'')}" fill="none" stroke="${INK}" stroke-width=".7" opacity=".3"/>`;}
 if(o.mug)g+=`<g opacity=".17" stroke="${INK}" fill="none" stroke-width="1.4" stroke-linejoin="round" transform="translate(${x1-o.mug-6} ${T+H-o.mug*1.75}) scale(${o.mug/44})"><path d="M2 0h40l-5 64h-30z"/><path d="M-2 0h48"/><path d="M4 22h36"/><circle cx="14" cy="52" r="3"/><circle cx="24" cy="54" r="3"/><circle cx="30" cy="48" r="3"/><path d="M30 0L40 -26" stroke-width="3"/></g>`;
 g+=`</g><path d="${B}" fill="none" stroke="${INK}" stroke-width="1.4"/><path d="${body(x0+4,x1-4,T+4,H-(o.wave?wv+6:12),5)}" fill="none" stroke="${C}" stroke-width=".7" opacity=".35"/>`;
 g+=`<path d="M${tagX} ${T-10}H${tagX+tagW}l-6 9.5 6 9.5H${tagX}Z" fill="url(#b${id})" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"/><path d="M${tagX+3} ${T-7}H${tagX+tagW-8}l-4 6.5 4 6.5H${tagX+3}Z" fill="none" stroke="${P}" stroke-width=".7" opacity=".6"/>`;
 g+=(o.stars||[]).map(([x,y,r])=>`<path transform="translate(${x} ${y}) scale(${r})" d="M0-5Q.7-.7 5 0Q.7.7 0 5Q-.7.7-5 0Q-.7-.7 0-5Z" fill="#fffaf0" stroke="${INK}" stroke-width="${1/r}"/>`).join('')+'</svg>';
 const d=document.createElement('div');d.className='sl';const cy=T+H/2;
 let im=`<img src="../tok/tg-bead.png" style="left:${x0-6}px;top:${cy-7}px;width:14px">`
  +(o.straw!==0?`<img class="bk" src="../tok/tg-straw.png" style="left:${tagX+tagW-14}px;top:${T-34}px;height:32px">`:'');
 if(o.cup)im+=`<img src="../tok/tg-${s.cup}.png" style="left:${x1-17}px;top:${cy-18}px;width:30px;height:36px">`;
 (o.top||[]).forEach(([src,x,y,w,r])=>im+=`<img src="${src}" style="left:${x1+x}px;top:${y}px;width:${w}px;transform:rotate(${r}deg);filter:none">`);
 (o.leaf||[]).forEach(([x,y,w,r])=>im+=`<img src="../tok/tg-leaf.png" style="left:${x<0?x1+x:x}px;top:${y<0?T+H+y:y}px;width:${w}px;transform:rotate(${r}deg)">`);
 d.innerHTML=g+im+`<span class="tg${o.zh?' zh':''}" style="left:${tagX+3}px;width:${tagW-6}px;top:${T-10}px">${o.tag}</span>`+o.html(x0,x1,T,H);
 return d}
function render(){uid=0;const W=document.getElementById('big').clientWidth;
 ['big','chat','row'].forEach(i=>document.getElementById(i).innerHTML='');
 big.appendChild(frame({W,H:150,th:'mint',tag:'Today',mug:34,wave:12,top:[['../list/catfoam.png',-92,-30,100,4]],leaf:[[-118,6,36,-28],[-14,30,22,120],[0,-28,30,200]],stars:[[W*.52,46,1],[W-36,150,.8]],
  html:(x0,x1,T,H)=>`<div class="ttl" style="left:${x0+22}px;right:${W-x1+70}px;top:${T+16}px"><b>今日主理人</b><i>mint choco latte</i><p>薄荷可可 · 中杯 · 少冰，奶盖另加一份。</p></div><div class="meta" style="right:${W-x1+64}px;top:${T+H-30}px">NO.08</div>`}));
 chat.appendChild(frame({W:Math.round(W*.86),H:62,th:'cocoa',tag:'海螺',zh:1,tail:'l',top:[['../list/stk_mac.png',-46,-22,54,10]],leaf:[[-66,0,26,-30]],
  html:(x0,x1,T,H)=>`<span class="tx" style="left:${x0+20}px;right:${Math.round(W*.86)-x1+16}px;top:${T+12}px">今天想喝点什么呀？</span><div class="meta" style="right:${Math.round(W*.86)-x1+52}px;top:${T+H-19}px">03:51</div>`}));
 const me=frame({W:Math.round(W*.86),H:62,th:'mint',tag:'茶茶',zh:1,tail:'r',tagW:74,top:[['../list/stk_mm.png',-48,-24,52,-8]],leaf:[[2,-22,26,190],[-70,2,24,-20]],stars:[[W*.86-30,70,.8]],
  html:(x0,x1,T,H)=>`<span class="tx" style="left:${x0+20}px;right:16px;top:${T+12}px">薄荷巧克力，多加一份奶盖！</span><div class="meta" style="left:${x0+22}px;top:${T+H-19}px">03:52</div>`});
 me.style.marginLeft='auto';me.style.marginTop='18px';chat.appendChild(me);
 row.appendChild(frame({W,H:50,th:'car',tag:'connected',cup:1,top:[['../tok/rs-ice.png',-92,-4,30,-12],['../tok/rs-pearl.png',-66,2,20,0]],leaf:[[-108,2,30,-24]],
  html:(x0,x1,T,H)=>`<span class="tx" style="left:${x0+20}px;top:${T+15}px"><b style="font:15px ZK">海螺</b><span style="font-size:12px;color:#8a5c46;margin-left:10px">中转站 1 · 刚刚</span></span>`}));
}
render();addEventListener('resize',render);
</script></html>
