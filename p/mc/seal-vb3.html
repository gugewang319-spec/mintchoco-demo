<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>seal vb3 · 代码画圆章</title>
<link rel="stylesheet" href="mc.css?v=3">
<style>
body{overflow:auto}
.app{padding:70px 18px 60px}
h1{font:28px/1 ZK;color:var(--ch);letter-spacing:.06em;margin-bottom:6px}
.sub{font:13px/1.6 WK;color:var(--cocoa);margin-bottom:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin:0 0 22px}
.cap{font:12px/1 WK;color:var(--cocoa);letter-spacing:.2em;text-align:center;margin-top:8px}
.ref{background:#fdfaf2;border-radius:10px;box-shadow:0 0 0 1.3px rgba(138,92,70,.35);padding:8px}
.ref img{width:100%;display:block}
.mine{display:flex;justify-content:center;align-items:center;gap:18px;min-height:120px}
.sizes{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:14px 10px;margin:0 0 26px;padding:0 10px}
/* 代码画圆章 */
.cs{position:relative;width:64px;height:64px;flex:none;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cs.s46{width:46px;height:46px}.cs.s90{width:96px;height:96px}
.cs .sl{position:absolute;inset:0;display:block;transition:translate .25s cubic-bezier(.3,1.3,.5,1),scale .25s;translate:0 -2px}
.cs.keep .sl{rotate:6deg}.cs.tear .sl{rotate:-7deg}
.cs svg{position:absolute;inset:-14%;width:128%;height:128%;overflow:visible}
.cs b{position:absolute;inset:0;display:grid;place-items:center;font:22px/1 ZK;color:#5b3a2c;padding-top:2px}
.cs.s46 b{font-size:17px}.cs.s90 b{font-size:32px}
.cs.keep b{color:#2b6652;text-shadow:0 1px 0 rgba(255,255,255,.75),0 -.6px 0 rgba(31,80,62,.35)}.cs.tear b{color:#a8574a;text-shadow:0 1px 0 rgba(255,255,255,.85),0 -.6px 0 rgba(120,50,40,.3)}
.cs::after{content:'';position:absolute;left:20%;right:20%;bottom:-6px;height:6px;border-radius:50%;background:radial-gradient(closest-side,rgba(74,48,39,.16),transparent)}
.cs:active .sl{translate:0 0;scale:.93}
/* 仿确认框 */
.dlg{margin:6px auto 0;max-width:300px;padding:22px 20px 18px;background:#fdfaf2;border-radius:16px;box-shadow:0 0 0 1.3px rgba(138,92,70,.55),0 4px 0 rgba(91,58,44,.12)}
.dlg h4{font:20px/1.3 ZK;color:var(--ch)}
.dlg p{font:14px/1.7 WK;color:#7a5a4c;margin:8px 0 16px}
.dlg .acts{display:flex;justify-content:flex-end;gap:20px;padding-right:4px}
</style></head><body>
<div class="vp"><div class="app">
<h1>代码画圆章 · 精修</h1>
<div class="sub">左边是生图样子，右边是代码画的。描边同全站可可色，纸纹是代码叠的，放大缩小都不糊。</div>
<div class="row"><div class="ref"><img src="../../docs/design/hark/inbox/seal-buttons-01.png" alt="生图参考"></div><div class="mine" id="big"></div></div>
<div class="cap" style="margin:-12px 0 22px">左：生图　右：代码</div>
<div class="sizes" id="sizes"></div>
<div class="cap" style="margin:-16px 0 22px">46 / 64 / 96 三个尺寸</div>
<div class="dlg"><h4>撕掉「海螺」这张单？</h4><p>地址和密钥一起删掉，不能恢复。</p><div class="acts" id="acts"></div></div>
</div></div>
<script>
const C='#8a5c46';let n=0;
function wavy(cx,cy,r,a,k,ph){let d='';for(let i=0;i<=200;i++){const t=i/200*Math.PI*2,rr=r+a*Math.sin(k*t+ph)+0.9*Math.sin(3*t+1.3)+0.5*Math.sin(5*t+.2);d+=(i?'L':'M')+(cx+rr*Math.cos(t)).toFixed(2)+' '+(cy+rr*Math.sin(t)).toFixed(2)}return d+'Z'}
function grain(id){return `<filter id="${id}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="${n}"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .24  0 0 0 0 .18  0 0 0 .6 -.2"/><feComposite in2="SourceGraphic" operator="in"/></filter>`}
const ringPath=(id,r)=>`<path id="${id}" d="M50 50 m-${r} 0 a${r} ${r} 0 1 1 ${2*r} 0 a${r} ${r} 0 1 1 -${2*r} 0"/>`;
/* 左上来光：亮弧在左上，暗弧在右下 */
const lit=(r,w,o)=>`<path d="M${50-r*.94} ${50-r*.34} A${r} ${r} 0 0 1 ${50+r*.34} ${50-r*.94}" fill="none" stroke="#fff" stroke-opacity="${o}" stroke-width="${w}" stroke-linecap="round"/>`;
const shd=(r,w,o,c)=>`<path d="M${50+r*.94} ${50+r*.34} A${r} ${r} 0 0 1 ${50-r*.34} ${50+r*.94}" fill="none" stroke="${c}" stroke-opacity="${o}" stroke-width="${w}" stroke-linecap="round"/>`;
function keep(){const g='g'+(++n),cp='c'+n,lg='l'+n,rg='r'+n,sg='s'+n,tp='t'+n,lf='f'+n;const edge=wavy(50,50,38,2.4,9,.4);
return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs>${grain(g)}<clipPath id="${cp}"><path d="${edge}"/></clipPath>
<radialGradient id="${lg}" cx=".34" cy=".28" r=".85"><stop offset="0" stop-color="#e2f5ec"/><stop offset=".55" stop-color="#b6e1cd"/><stop offset="1" stop-color="#8fcdb3"/></radialGradient>
<linearGradient id="${rg}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b88a6e"/><stop offset=".5" stop-color="#8f6049"/><stop offset="1" stop-color="#6a4232"/></linearGradient>
<radialGradient id="${sg}" cx=".4" cy=".34" r=".7"><stop offset="0" stop-color="#e9f7f0"/><stop offset="1" stop-color="#bfe5d3"/></radialGradient>
<linearGradient id="${lf}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b5e3cd"/><stop offset="1" stop-color="#6fb898"/></linearGradient>${ringPath(tp,33.7)}</defs>
<path d="${edge}" transform="translate(.7 1)" fill="${C}"/>
<path d="M24 76 C21 81 22 85 26 85 C29 85 29 81 28 78Z" fill="#a9dcc6" stroke="${C}" stroke-width="1" stroke-linejoin="round"/>
<path d="${edge}" fill="url(#${lg})" stroke="${C}" stroke-width="1.15" stroke-linejoin="round"/>
<g clip-path="url(#${cp})">${shd(36,3,.22,'#2f6e58')}${lit(36.5,1.6,.7)}</g>
<text font-family="Baloo,sans-serif" font-size="3.7" font-weight="700" fill="#2f6e58" fill-opacity=".55" letter-spacing=".3"><textPath href="#${tp}" textLength="206" lengthAdjust="spacing">MINT CHOCO ✦ KEEP IT ✦ TEA ATELIER ✦</textPath></text>
<circle cx="50" cy="50" r="29.4" fill="url(#${sg})"/>
${shd(27.6,2.4,.28,'#2f6e58').replace('M','M')}${lit(27.4,1.4,.8)}
<circle cx="50" cy="50" r="29.4" fill="none" stroke="url(#${rg})" stroke-width="3.6"/>
<circle cx="50" cy="50" r="31.3" fill="none" stroke="${C}" stroke-width=".9"/><circle cx="50" cy="50" r="27.5" fill="none" stroke="${C}" stroke-width=".8"/>
${lit(29.4,1,.55)}
<circle cx="50" cy="50" r="24.2" fill="none" stroke="#5fae93" stroke-width=".7" stroke-dasharray=".1 2.2" stroke-linecap="round"/>
<rect width="100" height="100" filter="url(#${g})" clip-path="url(#${cp})" opacity=".45"/>
<g transform="translate(71 9) rotate(28)"><path d="M0 15 C-8 9 -7 1 0 -5 C7 1 8 9 0 15Z" fill="url(#${lf})" stroke="${C}" stroke-width="1.1" stroke-linejoin="round"/><path d="M-3.2 6 C-3.6 2 -2 -1 0 -3" stroke="#fff" stroke-opacity=".7" stroke-width="1" fill="none" stroke-linecap="round"/><path d="M0 13 L0 -3 M0 3.5 L3.4 .6 M0 7 L3.6 4.2 M0 5 L-2.6 2.6" stroke="${C}" stroke-width=".7" stroke-linecap="round" fill="none"/></g></svg>`}
function tear(){const g='g'+(++n),cp='c'+n,cg='l'+n,pg='p'+n,dg='d'+n,tp='t'+n,ig='i'+n;
const drip='M14.3 38 A37.5 37.5 0 0 1 85.7 38 C83.6 38.6 82.2 37 81 35.4 C79.6 33.8 77.6 34.4 77 36.6 C76.3 39.4 76.6 43.6 74.2 43.8 C71.8 44 72 39.8 71.2 37.4 C70 34.4 66.4 33 62.6 31.6 C58.6 30.2 54.6 29.8 52 30.2 C50.4 30.5 50.6 35.4 48.4 35.6 C46.2 35.8 46.4 31.8 45 30.6 C41.6 29.6 36.4 31 32.4 33 C28.6 34.8 27.4 38.6 24.8 38.8 C22.6 39 22.4 36.2 20.4 35.6 C18.2 35 16.4 37.6 14.3 38Z';
return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs>${grain(g)}<clipPath id="${cp}"><circle cx="50" cy="50" r="37.5"/></clipPath>
<radialGradient id="${cg}" cx=".34" cy=".3" r=".85"><stop offset="0" stop-color="#fffaf0"/><stop offset=".6" stop-color="#f7ebd3"/><stop offset="1" stop-color="#e9d6b6"/></radialGradient>
<linearGradient id="${pg}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9cdc6"/><stop offset=".5" stop-color="#ee9f97"/><stop offset="1" stop-color="#d77f77"/></linearGradient>
<linearGradient id="${dg}" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#9a654b"/><stop offset=".6" stop-color="#6f4433"/><stop offset="1" stop-color="#55331f"/></linearGradient>
<radialGradient id="${ig}" cx=".4" cy=".36" r=".7"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f6ecdc"/></radialGradient>${ringPath(tp,34.4)}</defs>
<circle cx="50.7" cy="51" r="37.5" fill="${C}"/>
<circle cx="50" cy="50" r="37.5" fill="url(#${cg})" stroke="${C}" stroke-width="1.15"/>
<g clip-path="url(#${cp})">${shd(36,3,.25,'#a07850')}${lit(36.4,1.6,.85)}</g>
<text font-family="Baloo,sans-serif" font-size="4.3" font-weight="700" fill="#b0604f" fill-opacity=".6" letter-spacing=".3"><textPath href="#${tp}" startOffset="38" textLength="150" lengthAdjust="spacing">✦ TEAR OFF ✦ MINT CHOCO ✦</textPath></text>
<circle cx="50" cy="50" r="28.4" fill="url(#${ig})"/>${shd(26.4,2.4,.3,'#c79a80')}
<circle cx="50" cy="50" r="28.4" fill="none" stroke="url(#${pg})" stroke-width="4"/>
<circle cx="50" cy="50" r="28.4" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width=".9" stroke-dasharray=".1 3.1" stroke-linecap="round"/>
<circle cx="50" cy="50" r="30.6" fill="none" stroke="${C}" stroke-width=".85"/><circle cx="50" cy="50" r="26.2" fill="none" stroke="${C}" stroke-width=".8"/>
<g clip-path="url(#${cp})"><path d="${drip}" transform="translate(.5 .9)" fill="#4a2c20" opacity=".25"/><path d="${drip}" fill="url(#${dg})" stroke="${C}" stroke-width="1" stroke-linejoin="round"/>
<path d="M22 30 C30 19 41 15 50 14.8" stroke="#fff" stroke-opacity=".55" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M57 15.6 C60 16 62.4 16.8 64 17.6" stroke="#fff" stroke-opacity=".45" stroke-width="1.4" fill="none" stroke-linecap="round"/>
<ellipse cx="73.6" cy="41.4" rx=".8" ry="1.1" fill="#fff" fill-opacity=".6"/><ellipse cx="48.2" cy="33.4" rx=".7" ry="1" fill="#fff" fill-opacity=".55"/><ellipse cx="25" cy="36.8" rx=".6" ry=".9" fill="#fff" fill-opacity=".5"/></g>
<rect width="100" height="100" filter="url(#${g})" clip-path="url(#${cp})" opacity=".4"/>
<path d="M88 13c.6 3.6 2.6 5.6 6.2 6.2-3.6.6-5.6 2.6-6.2 6.2-.6-3.6-2.6-5.6-6.2-6.2 3.6-.6 5.6-2.6 6.2-6.2Z" fill="#fff6dc" stroke="${C}" stroke-width="1" stroke-linejoin="round"/>
<path d="M93 30c.3 1.8 1.3 2.8 3.1 3.1-1.8.3-2.8 1.3-3.1 3.1-.3-1.8-1.3-2.8-3.1-3.1 1.8-.3 2.8-1.3 3.1-3.1Z" fill="#f0a6a0" stroke="${C}" stroke-width=".8" stroke-linejoin="round"/></svg>`}
const btn=(k,w,s)=>`<button class="cs ${k} ${s||''}" aria-label="${w}"><i class="sl">${k==='keep'?keep():tear()}<b>${w}</b></i></button>`;
document.getElementById('big').innerHTML=btn('keep','留','s90')+btn('tear','撕','s90');
document.getElementById('sizes').innerHTML=['s46','','s90'].map(s=>btn('keep','留',s)).join('')+['s46',''].map(s=>btn('tear','撕',s)).join('');
document.getElementById('acts').innerHTML=btn('keep','留','s46')+btn('tear','撕','s46');
</script></body></html>
