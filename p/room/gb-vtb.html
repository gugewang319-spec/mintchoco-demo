<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聊天室灰稿 · 直播间式</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#e9e9e6;font-family:system-ui,sans-serif;color:#444;overflow:hidden}
.ph{position:relative;width:min(100%,412px);height:100%;margin:0 auto;background:repeating-linear-gradient(90deg,#e2e2df 0 18px,#ececea 18px 36px);display:flex;flex-direction:column}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;flex:none}
.top .bk{width:36px;height:36px;border-radius:50%;background:#cfcfcb;display:grid;place-items:center;font-size:11px;color:#777}
.top b{font-size:15px;font-weight:600;color:#555}
.room{position:relative;flex:1;margin:46px 14px 0;min-height:0;display:flex;flex-direction:column}
/* 名牌：唯一的装饰区 */
.plate{position:absolute;left:18px;right:40px;top:-22px;height:44px;z-index:3;background:#bdbdb8;border-radius:10px;display:flex;align-items:center;padding:0 12px 0 66px;gap:6px}
.plate .t{white-space:nowrap;font-size:14px;font-weight:700;color:#3f3f3c}
.plate .d{font-size:11px;color:#5d5d59;margin-left:auto;white-space:nowrap}
.mascot{position:absolute;left:4px;top:-30px;width:58px;height:58px;border-radius:50%;border:1.4px solid #8f8f8a;background:#d6d6d2;display:grid;place-items:center;font-size:11px;color:#6b6b67;text-align:center;line-height:1.2}
/* 素面框：半透明，只有一道细线 */
.frame{position:relative;flex:1;min-height:0;border-radius:18px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1.3px #a9a9a4;overflow:hidden}
.list{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:38px 14px 14px;display:flex;flex-direction:column;gap:10px}
.list>:first-child{margin-top:auto}
.list::-webkit-scrollbar{display:none}
.m{display:flex;flex-direction:column;align-items:flex-start;gap:4px;animation:up .38s cubic-bezier(.3,1.3,.5,1) both}
.m .tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px;background:#9d9d98;color:#fff}
.m.me .tag{background:#c4c4bf;color:#4d4d4a}
.m .tx{font-size:15px;line-height:1.6;color:#444;padding-left:2px}
.m .tm{font-size:10px;color:inherit;opacity:.7;margin-left:6px;font-weight:400}
.day{align-self:center;font-size:11px;color:#777;background:#d8d8d4;padding:3px 10px;border-radius:5px}
@keyframes up{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
/* 底部输入 */
.inp{flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px 18px}
.inp .f{flex:1;height:44px;border-radius:12px;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1.2px #b3b3ae;display:flex;align-items:center;padding:0 14px;font-size:14px;color:#9a9a96}
.inp .s{width:46px;height:46px;border-radius:50%;background:#bdbdb8;display:grid;place-items:center;font-size:11px;color:#555}
.note{margin-left:auto;font-size:10px;color:#999;text-align:right;line-height:1.3}
</style></head><body>
<div class="ph">
 <div class="top"><span class="bk">返回</span><b>聊天室</b><span class="note">灰稿：装饰只在名牌<br>和吉祥物，框四边素</span></div>
 <div class="room">
  <div class="plate"><span class="mascot">吉祥物<br>（待定）</span><span class="t">茶茶 × 海螺</span><span class="d">11/10 周二 · 12 轮</span></div>
  <div class="frame"><div class="list" id="L"></div></div>
 </div>
 <div class="inp"><div class="f">说点什么…</div><div class="s">发送<br></div></div>
</div>
<script>
const msgs=[['海螺','今天的薄荷是不是放多了一点',''],['茶茶','没有呀，是你舌头太敏感','me'],['海螺','那下次少放半勺',''],['茶茶','不要，我就喜欢凉凉的','me'],['海螺','好，听你的',''],['茶茶','明天还来吗','me'],['海螺','来，给你带可可饼干','']];
const L=document.getElementById('L');let t=21*60+4;
const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function add([n,x,c]){t+=2;const d=document.createElement('div');d.className='m '+c;d.innerHTML=`<span class="tag">${n}<span class="tm">${fmt(t)}</span></span><span class="tx">${x}</span>`;L.append(d);L.scrollTop=L.scrollHeight}
L.innerHTML='<div class="day">11/10 周二</div>';
let i=0;(function step(){add(msgs[i%msgs.length]);i++;setTimeout(step,i<5?260:2600)})();
</script></body></html>
