function draw(){const d=agg(),f=$('#fig');d.mx=Math.max(...d.c.map(c=>c[0]),.01);MX=d.mx;let h='<defs><pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#b3b7b4"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8d918e" stroke-width="2"/></pattern></defs>';

 // 右侧阶梯架：三级，从左到右升高
 const st=[[176,300],[236,252],[296,204]];
 st.forEach(([x,y],k)=>{h+=`<rect x="${x-4}" y="${y}" width="68" height="${372-y}" fill="#e3e5e4" stroke="#bbb"/>`});
 st.forEach(([x,y],k)=>{const [hh]=bottle(x+6,y,48,92,d.c[k+1],k+1,0);h+=hh});
 // 保质期章：贴在最高一级台阶立面上，点开日历
 const DS=`${day.getMonth()+1}.${String(day.getDate()).padStart(2,'0')}`;

 // 没报用量：大瓶脚边虚线空瓶
 h+=`<g><rect x="0" y="330" width="20" height="40" rx="5" fill="#f4f5f4" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3"/><text x="10" y="355" class="ln" style="font-size:12px">${d.u}</text><text x="10" y="324" class="an" text-anchor="middle" style="font-size:9px">没报</text></g>`;

 f.querySelectorAll('.bt').forEach(g=>g.onclick=()=>{const i=+g.dataset.i;sel=sel==i?-1:i;if(sel>=0&&CL[pick][1]!=NM[sel]){const k=CL.findIndex(c=>c[1]==NM[sel]);if(k>=0)pick=k}draw()});$('#stp').onclick=e=>{e.stopPropagation();cal();const b=$('#stp').getBoundingClientRect(),w=$('#fw').getBoundingClientRect();$('#cal').style.top=(b.bottom-w.top+8)+'px';$('#fw').classList.toggle('on')};f.querySelectorAll('.dr').forEach(g=>g.onclick=()=>{pick=+g.dataset.k;draw()});
 $('#tn').textContent=d.t.toFixed(2);$('#tk').textContent=dayLabel(day)+' · 用量';

 const hit=d.c.reduce((a,c)=>a+(c[2]||0),0),mis=d.c.reduce((a,c)=>a+(c[3]||0),0);const sc=sel<0?null:d.c[sel];$('#cs').innerHTML=sc?`${NM[sel]} ${sc[0]} 万 · 调用 ${sc[1]} 次 · `+(sc[2]!=null?`缓存命中 <b>${sc[2]}</b> 万 · 未命中 <b>${sc[3]}</b> 万`:'缓存不适用'):`缓存命中 <b>${hit.toFixed(2)}</b> 万 · 未命中 <b>${mis.toFixed(2)}</b> 万 · 没报缓存 <b>${d.m}</b> 次`;
 list();
}
