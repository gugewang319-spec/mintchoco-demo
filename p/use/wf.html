<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>用量 · 糖浆泵架 A 线框</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#e9ecea;font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:#555}
.app{position:relative;width:min(100%,412px);margin:0 auto;height:100%;overflow-y:auto;background:#f4f5f4;scrollbar-width:none}
.app::-webkit-scrollbar{display:none}
.g{position:fixed;inset:0;pointer-events:none;width:min(100%,412px);margin:0 auto;z-index:50;display:none;background:repeating-linear-gradient(0deg,rgba(255,0,80,.07) 0 1px,transparent 1px 8px)}
.g::before,.g::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:rgba(255,0,80,.35)}.g::before{left:24px}.g::after{right:24px}
body.grid .g{display:block}
.tg{position:fixed;top:12px;right:max(24px,calc(50% - 182px));z-index:60;font-size:11px;color:#e0336a;background:#fff;border:1px solid #e0336a;border-radius:4px;padding:4px 8px}
.hd{height:96px;padding:48px 24px 0;display:flex;align-items:center;gap:16px}
.bk{width:40px;height:40px;border-radius:50%;background:#dfe2e0;border:0;font:700 20px system-ui;color:#777}
.hd h1{font-size:28px;font-weight:800;color:#444}
.rg{margin-left:auto;position:relative}
.rg>button{height:32px;padding:0 12px;border:1.5px solid #bbb;border-radius:6px;background:#fff;font:13px system-ui;color:#555}
.rg ul{position:absolute;right:0;top:36px;list-style:none;background:#fff;border:1.5px solid #bbb;border-radius:6px;display:none;z-index:30;min-width:96px}
.rg.on ul{display:block}.rg li{padding:8px 12px;font-size:13px;cursor:pointer}.rg li.cur{color:#222;font-weight:700}
.tot{margin:16px 24px 0}
.tot .k{font-size:13px;color:#888;letter-spacing:.3em}
.tot .n{font-size:clamp(56px,18vw,72px);font-weight:800;line-height:1;color:#333;margin-top:8px}
.tot .u{font-size:13px;color:#888;margin-top:8px}
.fig{display:block;width:calc(100% - 48px);margin:24px 24px 0;height:auto;overflow:visible}
.fig text{font-family:system-ui}
.fig .pn{font:700 12px system-ui;fill:#fff;text-anchor:middle}
.fig .ln{font:700 13px system-ui;fill:#444;text-anchor:middle}
.fig .lt{font:11px system-ui;fill:#777;text-anchor:middle}
.fig .no{font:700 10px system-ui;fill:#fff;text-anchor:middle}
.fig .bt{cursor:pointer}
.fig .bt.sel .glass{stroke:#444;stroke-width:2.4}
.lg{margin:16px 24px 0;display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:13px;color:#666;line-height:16px}
.lg i{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#777;color:#fff;font:700 10px/1 system-ui;font-style:normal}
.dt{margin:16px 24px 0;border:1.5px solid #bbb;border-radius:6px;background:#fff;padding:16px;display:none}
.dt.on{display:block}
.dt h3{font-size:28px;font-weight:800;color:#444;line-height:1}
.dt .r{display:flex;justify-content:space-between;font-size:13px;line-height:32px;border-top:1px dashed #ddd}
.dt .r:first-of-type{margin-top:16px}
.dt .r b{color:#333}
.cs{margin:16px 24px 0;font-size:13px;color:#666;line-height:1.6}.cs b{color:#333}.fig .an{font:11px system-ui;fill:#e0336a}.fig .in{font:700 12px system-ui;fill:#333;text-anchor:middle;paint-order:stroke;stroke:#f4f5f4;stroke-width:3px;pointer-events:none}
.cc{margin:32px 24px 0}
.cc h2{font-size:28px;font-weight:800;color:#444}
.cc .s{font-size:13px;color:#888;margin-top:8px;line-height:1.6}
.cc .bx{display:flex;gap:8px;margin-top:16px}
.cc .bx div{flex:1;height:72px;border-radius:6px;background:#dfe2e0;padding:8px;font-size:11px;color:#777}
.cc .bx b{display:block;font-size:20px;color:#444;margin-top:8px}
.note{padding:24px 24px 160px;font-size:12px;color:#aaa;line-height:1.8}
.hint{color:#e0336a}
</style>
<body>
<button class="tg" onclick="document.body.classList.toggle('grid')">网格</button>
<div class="app">
<div class="g"></div>
<header class="hd"><button class="bk" aria-label="返回">‹</button><h1>用量</h1>
<div class="rg" id="rg"><button id="rb" aria-haspopup="listbox">近 7 天 ▾</button><ul role="listbox"><li>今天</li><li class="cur">近 7 天</li><li>近 30 天</li></ul></div></header>
<div class="tot"><div class="k" id="tk">近 7 天 用 量</div><div class="n" id="tn">128.4</div><div class="u">万 tokens · 调用 <b id="tc">947</b> 次</div></div>
<svg class="fig" viewBox="0 0 364 384" id="fig"></svg>
<p class="cs" id="cs"></p>
<p class="note hint" style="padding:8px 24px 0">点一瓶 → 下面原地展开明细，再点收起。缓存 = 供应商提示词缓存，只算上游报了的</p>
<section class="dt" id="dt"></section>
<p class="note">灰稿 · 用量二级页（设置页点大字进来，设置页不再放秤）。母题：糖浆泵架，A 构图：聊天一大瓶当主角，另三瓶站右边阶梯架，注解直接写在图上。字号三级 72 / 28 / 13，8 点网格，边距 24。范围就地小选单。数据为演示。</p>
</div>
<script>
const R={"今天": {"t": 18.6, "c": [[13.9, 58, 8.6, 4.1], [3.2, 6, 1.3, 0.9], [1.1, 57, 0.3, 0.6], [0.4, 14, null, null]], "u": 0, "m": 1}, "近 7 天": {"t": 128.4, "c": [[96.1, 412, 58.0, 31.2], [22.4, 38, 9.1, 11.0], [7.6, 401, 2.1, 4.3], [2.3, 96, null, null]], "u": 3, "m": 5}, "近 30 天": {"t": 566.0, "c": [[421.8, 1806, 247.3, 148.9], [99.5, 171, 41.2, 51.0], [34.1, 1752, 9.8, 20.6], [10.6, 430, null, null]], "u": 11, "m": 19}},NM=["聊天", "记忆整理", "检索", "向量索引"];let cur='近 7 天',sel=-1;
const $=s=>document.querySelector(s);
function bottle(x,bot,w,H,c,i,big){let h='';const top=bot-H,lv=Math.max(8,(H-6)*c[0]/R[cur].mx),ly=bot-3-lv;
  h+=`<g class="bt${sel==i?' sel':''}" data-i="${i}">`;
  const pw=big?44:30,ph=big?22:16,py=top-(big?60:42);
  h+=`<rect x="${x+w/2-(big?5:3.5)}" y="${py+ph}" width="${big?10:7}" height="${top-py-ph-(big?14:10)}" fill="#bfc3c0"/><path d="M${x+w/2} ${py+ph+6} H${x+w/2-(big?38:24)} v${big?8:6} H${x+w/2}" fill="#bfc3c0"/><rect x="${x+w/2-pw/2}" y="${py}" width="${pw}" height="${ph}" rx="4" fill="#777"/><text x="${x+w/2}" y="${py+ph/2+4}" class="pn" style="font-size:${big?13:11}px">${c[1]}</text>`;
  h+=`<rect x="${x+w/2-(big?14:9)}" y="${top-(big?14:10)}" width="${big?28:18}" height="${big?14:10}" fill="#cfd2d0"/><rect class="glass" x="${x}" y="${top}" width="${w}" height="${H}" rx="${big?12:7}" fill="#fff" stroke="#999" stroke-width="1.4"/>`;
  h+=`<rect x="${x+3}" y="${ly}" width="${w-6}" height="${lv}" rx="5" fill="#cfd2d0"/>`;
  let ch=0;if(c[2]!=null){ch=lv*c[2]/c[0];h+=`<rect x="${x+3}" y="${bot-3-ch}" width="${w-6}" height="${ch}" fill="url(#hp)"/>`}
  const lw=w-(big?24:10),lh=big?48:30,lx=x+(w-lw)/2,lyy=top+(big?20:10);
  h+=`<rect x="${lx}" y="${lyy}" width="${lw}" height="${lh}" rx="3" fill="#fff" stroke="#bbb"/><text x="${x+w/2}" y="${lyy+(big?24:14)}" class="ln" style="font-size:${big?20:12}px">${c[0]}</text><text x="${x+w/2}" y="${lyy+(big?40:25)}" class="lt" style="font-size:${big?11:9}px">${NM[i]}</text></g>`;
  return [h,ly,ch]}
function draw(){const d=R[cur],f=$('#fig');d.mx=d.c[0][0];let h='<defs><pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#b3b7b4"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8d918e" stroke-width="2"/></pattern></defs>';
 // 地面
 h+='<rect x="0" y="372" width="364" height="10" rx="3" fill="#9a9e9b"/>';
 // 主角大瓶
 const [hb,ly,ch]=bottle(24,372,128,250,d.c[0],0,1);h+=hb;
 const c0=d.c[0];
 // 注解直接写在大瓶液体上
 const hy=372-3-ch/2,uy=(Math.max(ly,190)+(372-3-ch))/2;
 h+=`<text x="88" y="${hy+4}" class="in">缓存命中 ${c0[2].toFixed(1)} 万</text>`;
 if(372-3-ch-Math.max(ly,190)>18)h+=`<text x="88" y="${uy+4}" class="in">未命中 ${c0[3].toFixed(1)} 万</text>`;
 h+=`<text x="116" y="80" class="an">← 按了几次</text>`;
 // 右侧阶梯架：三级，从左到右升高
 const st=[[176,300],[236,252],[296,204]];
 st.forEach(([x,y],k)=>{h+=`<rect x="${x-4}" y="${y}" width="68" height="${372-y}" fill="#e3e5e4" stroke="#bbb"/>`});
 st.forEach(([x,y],k)=>{const [hh]=bottle(x+6,y,48,92,d.c[k+1],k+1,0);h+=hh});
 // 没报用量：大瓶脚边虚线空瓶
 h+=`<g><rect x="0" y="330" width="20" height="40" rx="5" fill="#f4f5f4" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3"/><text x="10" y="355" class="ln" style="font-size:12px">${d.u}</text><text x="10" y="324" class="an" text-anchor="middle" style="font-size:9px">没报</text></g>`;
 f.innerHTML=h;
 f.querySelectorAll('.bt').forEach(g=>g.onclick=()=>{const i=+g.dataset.i;sel=sel==i?-1:i;draw()});
 $('#tn').textContent=d.t.toFixed(1);$('#tk').textContent=cur+' · 用量';
 $('#tc').textContent=d.c.reduce((a,c)=>a+c[1],0);
 const hit=d.c.reduce((a,c)=>a+(c[2]||0),0),mis=d.c.reduce((a,c)=>a+(c[3]||0),0);$('#cs').innerHTML=`缓存命中 <b>${hit.toFixed(1)}</b> 万 · 未命中 <b>${mis.toFixed(1)}</b> 万 · 没报缓存 <b>${d.m}</b> 次`;
 const dt=$('#dt');if(sel<0){dt.className='dt';dt.innerHTML=''}else{const c=d.c[sel];dt.className='dt on';
  dt.innerHTML=`<h3>${NM[sel]}</h3><div class="r"><span>调用</span><b>${c[1]} 次</b></div><div class="r"><span>tokens</span><b>${c[0]} 万</b></div>`+(c[2]!=null?`<div class="r"><span>缓存命中</span><b>${c[2].toFixed(1)} 万</b></div><div class="r"><span>缓存未命中</span><b>${c[3].toFixed(1)} 万</b></div>`:`<div class="r"><span>缓存</span><b>不适用</b></div>`)}
}
$('#rb').onclick=e=>{e.stopPropagation();$('#rg').classList.toggle('on')};
document.querySelectorAll('.rg li').forEach(li=>li.onclick=()=>{cur=li.textContent;document.querySelectorAll('.rg li').forEach(x=>x.classList.toggle('cur',x==li));$('#rb').textContent=cur+' ▾';$('#rg').classList.remove('on');draw()});
addEventListener('click',()=>$('#rg').classList.remove('on'));
if(location.hash=='#sel')sel=0;
draw();
</script>
