<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>设置</title>
<style>
@font-face{font-family:ZK;src:url(zk.ttf)}
@font-face{font-family:Baloo;src:url(baloo.ttf);font-weight:100 900}
@font-face{font-family:BalooX;src:url(baloo800.ttf)}
@font-face{font-family:WK;src:url(wk-u.ttf)}
@font-face{font-family:Script;src:url(script.ttf)}
:root{--ch:#5b3a2c;--ink:#4a3027;--cocoa:#8a5c46;--mint3:#2f6e58;--mintb:#3f9a80}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;outline:0;cursor:pointer}
img{display:block;user-select:none;-webkit-user-drag:none;width:100%}

.vp{position:fixed;inset:0;overflow:hidden;background-color:#e4f3ed;background-image:radial-gradient(110% 50% at 15% 0%,rgba(255,255,255,.75),rgba(255,255,255,0) 60%),repeating-linear-gradient(90deg,#d7eee5 0,#d7eee5 18px,#edf8f3 18px,#edf8f3 36px)}
.app{position:absolute;left:0;right:0;margin:0 auto;top:0;bottom:0;width:min(100%,412px);overflow:hidden}
.drizzle{position:absolute;left:0;top:0;width:100%;z-index:25;pointer-events:none}
.pearls{position:absolute;left:-4%;right:-4%;bottom:-46px;z-index:1;pointer-events:none;opacity:.8}
canvas#fx{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.o{position:absolute;z-index:6;will-change:transform}
.bit{position:absolute;pointer-events:none}
.ground{position:absolute;left:-56px;width:524px;top:694px;z-index:14;pointer-events:none}
.groundfill{position:absolute;left:0;right:0;top:796px;bottom:0;background:#fbf8eb;z-index:14}
.sp{position:absolute;pointer-events:none}



.lhead{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:flex-end;justify-content:space-between;padding:58px 18px 0}
.ttl{position:relative}
.ttl h1{font:32px/1 ZK;color:var(--ch);letter-spacing:.06em;position:relative;z-index:1}
.ttl .sc{position:absolute;left:52px;top:-14px;font:22px/1 Script;color:rgba(63,154,128,.55);transform:rotate(-8deg);white-space:nowrap}
.lhead .counter{margin:0 0 4px}
.counter{display:inline-flex;gap:2px;padding:3px;border-radius:5px;background:#5b3a2c}
.counter span{display:inline-block;min-width:12px;padding:1px 2px;border-radius:2px;background:#fdf9f0;font:700 13px/1.3 Baloo;text-align:center;color:#4a3027}
.counter b{align-self:center;font:13px/1 ZK;color:#fdf9f0;padding:0 3px}




.pearlbtn{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:rgba(252,250,244,.62);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 8px 18px -12px rgba(74,48,39,.45)}
.pearlbtn svg{stroke:#5b3a2c}
.lhead .lf{display:flex;align-items:flex-end;gap:12px}
/* 顶部印字 */
.top{position:absolute;left:22px;right:22px;top:122px;z-index:12;color:var(--ch);display:flex;align-items:flex-end;justify-content:space-between}
.top .k{font:13px/1 ZK;color:var(--cocoa);letter-spacing:.3em;display:flex;align-items:center;gap:7px}
.top .k i{width:7px;height:7px;border-radius:50%;background:var(--mintb)}
.top .n{margin-top:8px;font:800 50px/.9 BalooX}
.top .n small{font:14px/1 ZK;margin-left:4px}
.top .d{font:12.5px/1.5 WK;color:#7a5a4c;text-align:right}
/* 量筒 */
#cyl{position:absolute;left:34px;top:226px;width:118px;height:452px;z-index:10}
#cyl .lip{position:absolute;left:-7px;right:-7px;top:-8px;height:10px;border:1.3px solid var(--cocoa);border-radius:6px 6px 3px 3px;background:rgba(255,255,255,.55)}
#cyl .lip::after{display:none;content:"";position:absolute;right:-9px;top:-5px;width:14px;height:9px;border:1.3px solid var(--cocoa);border-left:0;border-bottom:0;border-radius:0 10px 0 0;background:rgba(255,255,255,.55)}
#cyl .tube{position:absolute;inset:0;border:1.3px solid var(--cocoa);border-top:0;border-radius:0 0 18px 18px;background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.34));-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.85);overflow:hidden}
#cyl .base{position:absolute;left:-16px;right:-16px;bottom:-12px;height:13px;border:1.3px solid var(--cocoa);border-radius:4px;background:#fbf6ea}
.pearl{position:absolute;z-index:5;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 50% 58%,rgba(120,72,48,.78) 0 30%,rgba(70,38,26,.9) 62%,rgba(44,24,17,.95) 100%);box-shadow:inset 0 -2px 3px rgba(255,214,170,.35),0 0 0 .7px rgba(60,35,25,.45);opacity:0;transition:opacity .6s}.pearl::after{content:"";position:absolute;left:4px;top:3px;width:6px;height:4px;border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-25deg)}
.tb{position:absolute;z-index:4;border-radius:50%;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.22);pointer-events:none}
.lay{position:absolute;left:0;right:0;bottom:0;height:0;transition:height 1.1s cubic-bezier(.45,0,.25,1)}
.lay::before{content:"";position:absolute;left:0;right:0;top:-8px;height:9px;background:var(--wave) repeat-x 0 0/56px 9px;animation:wv var(--wd,5s) linear infinite}.lay.topl::before{display:none}
.lay::after{display:none}
.lay.hi{filter:brightness(1.07) saturate(1.15)}
.surf{position:absolute;left:0;right:0;height:9px;z-index:3;pointer-events:none}
.surf::before,.surf::after{content:"";position:absolute;inset:0;background:var(--wave) repeat-x 0 0/56px 9px;animation:wv 6.6s linear infinite}
.surf::after{opacity:.55;animation-duration:4.1s;animation-direction:reverse;top:2px}
@keyframes wv{to{background-position:56px 0}}
.ticks{position:absolute;right:0;top:0;bottom:0;width:20px;z-index:4;pointer-events:none}
.ticks b{position:absolute;right:0;height:0;border-top:1.2px solid rgba(91,58,44,.6)}
.last{position:absolute;left:-6px;width:calc(100% + 12px);height:0;border-top:1.5px dashed #a0533c;z-index:5;pointer-events:none}
.stream{position:absolute;left:58px;width:6px;top:-60px;border-radius:3px;z-index:2;opacity:0;transition:opacity .3s}
.pouring .stream{opacity:1}
.glint{position:absolute;left:12px;top:14px;bottom:30px;width:7px;border-radius:4px;background:rgba(255,255,255,.55);z-index:6;pointer-events:none}
/* 刻度外侧印字：沿同一条竖线 */
.scale{position:absolute;left:160px;z-index:11;font:700 11px/1 Baloo;color:#9a7a6a}
.lbl{position:absolute;left:196px;right:22px;z-index:12;display:block;text-align:left;color:var(--ch);transform:translateY(-50%);transition:opacity .4s}
.lbl .r{display:flex;align-items:baseline;gap:8px}
.lbl .dn{font:17px/1 ZK;letter-spacing:.1em;display:flex;align-items:center;gap:6px}
.lbl .dn i{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 1.2px var(--cocoa)}
.lbl .v{font:800 19px/1 BalooX}
.lbl .v small{font:12px/1 ZK;margin-left:2px}
.lbl .t{font:11px/1 WK;color:var(--mint3)}
.lbl .ex{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.3,1,.4,1);font:12.5px/1.6 WK;color:#7a5a4c;padding-left:15px}
.lbl.open .ex{max-height:60px}
.lastl{position:absolute;left:196px;z-index:12;font:12.5px/1.3 WK;color:#a0533c;transform:translateY(-50%)}
.lastl b{font:800 16px/1 BalooX;margin:0 2px}
/* 最近四周：印成一行 */
.weeks{position:absolute;left:22px;right:22px;top:706px;z-index:12;display:flex;align-items:baseline;justify-content:space-between;border-top:1.3px solid rgba(91,58,44,.55);padding-top:12px;color:var(--ch)}
.weeks .t{font:13px/1 ZK;color:var(--cocoa);letter-spacing:.24em;display:flex;align-items:center;gap:6px}
.weeks .t i{width:6px;height:6px;border-radius:50%;background:var(--mintb)}
.weeks span.w{font:11.5px/1.5 WK;color:#7a5a4c;text-align:center}
.weeks span.w b{display:block;font:800 17px/1.1 BalooX;color:var(--ch)}
.weeks span.w.now b{border-bottom:1.3px dashed var(--cocoa)}
.bit{position:absolute;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.navfade{position:fixed;left:0;right:0;bottom:0;height:120px;z-index:38;pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(to top,#000 45%,transparent);mask-image:linear-gradient(to top,#000 45%,transparent);background:linear-gradient(to top,rgba(228,243,237,.85),rgba(228,243,237,0))}
.pnav{position:fixed;z-index:40;left:16px;right:16px;max-width:408px;margin:0 auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));height:62px;padding:5px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;border-radius:31px;background:rgba(252,250,244,.62);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 12px 26px -14px rgba(74,48,39,.45)}
.pill{position:absolute;z-index:0;top:5px;left:5px;height:52px;border-radius:26px;background:rgba(196,232,218,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);transition:transform 380ms cubic-bezier(.3,1.25,.5,1),width 380ms}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;border-radius:26px;color:#7a5a4c;text-align:center}.tab span{font-size:11px;line-height:1.2}.tab.on{color:#4a3027}.tab.on>span{font-weight:600}
.tab .dot{position:absolute;top:-1px;left:19px;width:7px;height:7px;border-radius:4px;background:#3f9a80;box-shadow:0 0 0 2px rgba(252,250,244,.95)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}/*nav-font 11-14*/.pnav,.pnav *{font-family:"OPPO Sans","HarmonyOS Sans SC","PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif}/*phone-fix 11-14：矮屏整页可滚*/.vp{overflow-y:auto!important;overflow-x:hidden!important;overscroll-behavior:contain;scrollbar-width:none}.vp::-webkit-scrollbar{display:none}.app{left:0!important;right:0!important;margin:0 auto;transform:none!important;bottom:auto!important;height:max(100%,900px)!important}
/* 用量 vb2：糖浆泵架 + 分层 */
.scn{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;width:min(100%,412px);margin:0 auto}
.scn>*{position:absolute}
.far{opacity:.09}
.wall{left:0;right:0;top:0;height:78%;background:linear-gradient(180deg,rgba(251,246,234,.32),rgba(251,246,234,.2) 70%,rgba(251,246,234,0));-webkit-mask-image:linear-gradient(#000 75%,transparent);mask-image:linear-gradient(#000 75%,transparent)}
.wall::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 51px,rgba(138,92,70,.13) 51px 52.3px)}
.stk{position:absolute;z-index:12;pointer-events:none;animation:sts 5s ease-in-out infinite;transform-origin:50% 0}
@keyframes sts{50%{transform:rotate(var(--a,3deg))}}
#fig .sw{animation:sts2 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sts2{50%{transform:rotate(var(--a,2deg))}}
.htag{position:absolute;right:6px;top:112px;width:48px;z-index:12;animation:sts 5.5s ease-in-out infinite;transform-origin:50% 4px;--a:4deg;rotate:8deg}
.htag img{width:100%}.htag p{position:absolute;left:0;right:0;top:46%;text-align:center;font:9px/1.3 WK;color:var(--cocoa)}.htag b{display:block;font:800 14px BalooX;color:var(--ch)}
@media (prefers-reduced-motion:reduce){.stk,.htag,#fig .sw{animation:none}}
.app{height:auto!important;min-height:100%;overflow:visible!important}
.uc{position:relative;z-index:10;padding:132px 24px 180px}
.tk2{font:13px/1 WK;color:var(--cocoa);letter-spacing:.2em}
.tn2{font:72px/1 BalooX,WK;color:var(--ch);margin-top:8px;letter-spacing:-.01em}
.tn2 small{font:13px WK;color:var(--cocoa);margin-left:6px;letter-spacing:0}
.cs2{font:13px/1.7 WK;color:var(--ink);margin-top:6px}.cs2 b{font:800 14px BalooX,WK;color:var(--ch)}
#fig{display:block;width:100%;height:auto;margin-top:16px;overflow:visible}
#fig .bt{cursor:pointer}#fig .bt image{transition:transform .25s}
#fig .bt.sel image{filter:none}
#fig .tv{font-family:BalooX,WK;fill:var(--ch);text-anchor:middle}
#fig .tn{font:10px WK;fill:var(--cocoa);text-anchor:middle}
#fig .lq{font:12px WK;fill:var(--ch);text-anchor:middle;paint-order:stroke;stroke:#fbf6ea;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
#fig .rn{font:11px WK;fill:#fbf6ea;text-anchor:middle}
#fig .rc{font:800 11px BalooX,WK;fill:#e4f5ed;text-anchor:middle}
#fig .an{font:12px WK;fill:var(--ch)}#fig .ab{font:800 13px BalooX}
#fig .no{font:800 9px BalooX;fill:#fbf6ea;text-anchor:middle}
#fig .tk{font:700 10px Baloo,WK;fill:var(--cocoa);text-anchor:middle}
#fig .mo{font:700 7px Baloo;fill:#2f6e58;text-anchor:middle;letter-spacing:.18em}
#fig .cd{font-family:BalooX;fill:var(--ch);text-anchor:middle}
#fig .cw{font:9px WK;fill:var(--cocoa);text-anchor:middle}
#fig .stp{cursor:pointer}
#cl{list-style:none;position:relative}
#cl::before{content:"";position:absolute;left:18.4px;top:-10px;bottom:0;width:3.2px;border-radius:2px;background:#d8ab7e}
#cl li{position:relative;display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-radius:14px;cursor:pointer}
#cl li{transition:transform .3s cubic-bezier(.2,.8,.2,1),background-color .3s,box-shadow .3s;border:1px solid transparent}
#cl li.on{transform:translateY(-3px);background:linear-gradient(160deg,rgba(253,248,234,.5),rgba(249,240,220,.36));backdrop-filter:blur(14px) saturate(115%);-webkit-backdrop-filter:blur(14px) saturate(115%);border-color:rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 22px -14px rgba(120,84,50,.4)}
#cl li .tm,#cl li .ty,#cl li .a b{transition:background-size .35s cubic-bezier(.2,.8,.2,1);background:linear-gradient(transparent 52%,rgba(63,154,128,.3) 52%,rgba(63,154,128,.3) 92%,transparent 92%) no-repeat 0 0/0% 100%;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#cl li.on .tm,#cl li.on .ty,#cl li.on .a b{background-size:100% 100%}
#cl .dp{flex:none;position:relative;z-index:1}
#cl .tx{flex:1;min-width:0;padding:8px 12px 0 0}
#cl .a{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
#cl .tm{font:700 13px Baloo,WK;color:var(--cocoa)}#cl .ty{font:14px WK;color:var(--ch)}
#cl .a b{margin-left:auto;font:800 15px BalooX,WK;color:var(--ch)}#cl .a b.uk{font:13px WK;color:#c0705a}
#cl .md{font:11px/16px Baloo,WK;color:var(--cocoa);opacity:.85}#cl .b{font:11px/16px WK;color:var(--cocoa)}
#cl .em{font:13px WK;color:var(--cocoa);padding-left:48px}
.mr{margin:8px 0 0 48px;font:13px WK;color:var(--cocoa);padding:8px 0}
.csh{position:fixed;inset:0;z-index:70;width:min(100%,412px);margin:0 auto}.csh[hidden]{display:none}
.csh .cbg{position:absolute;inset:0;background:rgba(74,48,39,.18);opacity:0;transition:opacity .26s}
.cal{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:8px 12px 12px;border-radius:22px;background:rgba(252,250,244,.86);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 6px 18px rgba(74,48,39,.14);transform:translateY(24px);opacity:0;transition:transform .26s cubic-bezier(.23,1,.32,1),opacity .2s}
.csh.on .cbg{opacity:1}.csh.on .cal{transform:none;opacity:1}
.cal .mh{display:flex;align-items:center;justify-content:space-between;height:40px;font:16px ZK,WK;color:var(--ch)}
.cal .mh button{width:40px;height:40px;font:700 18px Baloo;color:var(--cocoa)}
.cal .gr{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal .wk{font:11px/24px WK;color:var(--cocoa)}
.cal .d{height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 13px Baloo;color:var(--ink);border-radius:12px;cursor:pointer}
.cal .d i{display:block;border-radius:50%;background:#7fc8ad;box-shadow:inset 0 0 0 1px rgba(91,58,44,.45)}
.cal .d.x{color:rgba(138,92,70,.35);cursor:default}
.cal .d.rg{background:#e4f5ed;border-radius:0}
.cal .d.cur{background:#c9ebdc;color:#2c4a3e;box-shadow:inset 0 0 0 1px rgba(47,110,88,.25)}.cal .d.cur i{background:var(--ch);box-shadow:none}
.cal .d.td{text-decoration:none;box-shadow:inset 0 0 0 1.2px rgba(138,92,70,.5)}
.cal .tip{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;min-height:36px;margin-top:4px;font:12.5px WK;color:var(--cocoa)}
.cal .tip b{font:13px WK;color:var(--ch);font-weight:400}
.cal .tip button{font:12.5px WK;color:#2f6e58;padding:4px 8px}
.cal .tip button.sel{border-radius:12px;background:#c9ebdc}
</style></head><body>
<div class="vp"><div class="app" id="app">
<img class="drizzle" src="today-bg.png" alt="">
<div class="scn" aria-hidden="true"><div class="wall"></div><img class="far" src="f-syrupwall.svg" style="left:-150px;top:150px;width:640px" alt=""><img class="far" src="../set/f-sprig.svg" style="right:-110px;bottom:120px;width:240px;rotate:-60deg;opacity:.16" alt=""></div>
<header class="lhead"><div class="lf"><button class="pearlbtn" aria-label="返回设置"><svg width="22" height="22" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="m15 18-6-6 6-6"/></svg></button><div class="ttl"><span class="sc" aria-hidden="true">usage</span><h1>用量</h1></div></div><div class="counter"><span>1</span><span>9</span><b>日</b></div></header>
<div class="uc"><div class="htag" aria-label="缓存命中率"><img src="u-tag.png" alt=""><p>命中率<b id="hr">0%</b></p></div>
<div class="tk2" id="tk"></div>
<div class="tn2"><span id="tn"></span><small>万 tokens · 调用 <b id="tc" style="font:800 14px BalooX">0</b> 次</small></div>
<p class="cs2" id="cs"></p>
<svg id="fig" viewBox="0 0 364 512" aria-label="糖浆泵架：四类用量和这一天的每次调用"></svg>
<ul id="cl"></ul>
<button class="mr" id="pv">看前一天</button>
</div>
<div class="csh" id="csh" hidden><div class="cbg"></div><div class="cal" id="cal" role="dialog" aria-label="用量台历"></div></div>
<div class="navfade" aria-hidden="true"></div>
<nav class="pnav" aria-label="主导航"><span class="pill" aria-hidden="true"></span>
