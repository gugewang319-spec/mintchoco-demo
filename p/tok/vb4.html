<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小票 · 精修样张（印刷工艺）</title>
<style>
@font-face{font-family:Script;src:url(../hlt/script.ttf)}
@font-face{font-family:BalooX;src:url(../hlt/baloo800.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:repeating-linear-gradient(90deg,#d7eee5 0,#d7eee5 18px,#edf8f3 18px,#edf8f3 36px)}
body{font-family:system-ui,"PingFang SC","Noto Sans SC",sans-serif;color:#5b3a2c}
.app{width:min(100%,412px);margin:0 auto;padding:48px 20px 96px}
h1{font:800 28px/1 BalooX,system-ui;display:flex;align-items:baseline;gap:8px}
h1 small{font:24px/1 Script;color:#3f9a80}
.lab{font-size:12px;color:#8a5c46;opacity:.8;margin:28px 0 8px;letter-spacing:.1em}
.tk{position:relative;margin-bottom:18px}
.tk svg{display:block;overflow:visible}
.tk .t{position:absolute;white-space:nowrap}
.hd{font:800 11px/1 BalooX,system-ui;letter-spacing:.32em;color:#8a5c46;text-shadow:0 1px 0 rgba(255,255,255,.9),0 -1px 0 rgba(91,58,44,.35)}
.big{font-size:26px;font-weight:800;letter-spacing:.06em;color:#5b3a2c}
.big .mis{position:absolute;left:2px;top:1.5px;color:#7cc4ad;mix-blend-mode:multiply}
.ln{font-size:12px;color:#5b3a2c;display:flex;gap:4px;align-items:baseline}
.ln i{flex:1;border-bottom:1.5px dotted rgba(138,92,70,.55);transform:translateY(-3px)}
.ln b{font:700 12px BalooX,system-ui;color:#5b3a2c}
.no{font:800 12px/1 BalooX,system-ui;letter-spacing:.12em;color:#8a5c46;transform:rotate(-90deg);transform-origin:left top}
.note{font-size:12px;line-height:1.7;color:#8a5c46;margin-top:6px}
</style>
<div class="app">
<h1>小票 <small>receipt</small></h1>
<div class="lab">第三级 · 重要的事打一张小票</div>
<div id="list"></div>
<p class="note">做法来自印刷工艺，不来自别人的图：孔版颗粒、套色错位、热敏网点渐淡、凸版压痕字、油墨店章、手撕毛边。元素只用店里的：热敏小票、杯底水渍圈、店章。</p>
</div>
<script>
const C='#8a5c46',INK='#5b3a2c',P='#fbf6ea',MINT='#3f9a80';
const T=[
 {k:'open',no:'NO.0057',hd:'MINT CHOCO · ORDER',big:'新单已开',rows:[['渠道','中转站 3'],['开单','21:20'],['状态','还在往下打']],stamp:'开',stub:1,zig:1},
 {k:'done',no:'NO.0056',hd:'MINT CHOCO · ORDER',big:'这杯好了',rows:[['渠道','中转站 1'],['出杯','20:58'],['用时','4 分 12 秒']],stamp:'好',torn:1,ring:1},
 {k:'void',no:'NO.0055',hd:'MINT CHOCO · ORDER',big:'这单作废',rows:[['渠道','中转站 2'],['作废','20:31'],['原因','key 过期']],stamp:'退',stub:1,strike:1,red:1}
];
function rnd(i){const x=Math.sin(i*12.9898)*43758.5453;return x-Math.floor(x)}
function edgeR(x,t,h,seed){ // deckle zigzag on right
 let d='',n=Math.round(h/10);for(let i=1;i<=n;i++){const y=t+i*h/n;d+=`L${x+(i%2?8+rnd(seed+i)*3:rnd(seed+i)*2)} ${y-h/n/2}L${x+rnd(seed+i*7)*2} ${y}`}return d}
function edgeL(x,t,h,seed){ // torn fibres going up
 let d='',n=Math.round(h/5);for(let i=n-1;i>=0;i--){d+=`L${x-rnd(seed+i)*4} ${t+i*h/n}`}return d}
function render(){
 const L=document.getElementById('list'),W=L.clientWidth;L.innerHTML='';
 T.forEach((s,n)=>{
  const H=150,t=6,sx=s.torn?0:62,x0=0,x1=W-12,id='r'+n;
  let shape=`M${x0} ${t}H${x1}`+(s.zig?edgeR(x1,t,H,n*31):`V${t+H}`)+`H${x0}`;
  shape+=s.torn?edgeL(x0,t,H,n*17)+'Z':`V${t}Z`;
  let o=`<svg width="${W}" height="${H+t+14}"><defs>
  <filter id="g${id}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="${n+3}"/><feColorMatrix values="0 0 0 0 .36  0 0 0 0 .23  0 0 0 0 .17  0 0 0 -1.6 .9"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  <linearGradient id="p${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfaf2"/><stop offset="1" stop-color="#f3ecdc"/></linearGradient>
  <clipPath id="c${id}"><path d="${shape}"/></clipPath>
  <filter id="sb${id}"><feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="1" seed="${n+9}"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter></defs>
  <path d="${shape}" transform="translate(1 3)" fill="${INK}" opacity=".15"/>
  <path d="${shape}" fill="url(#p${id})"/>
  <g clip-path="url(#c${id})">`;
  // halftone fade band at bottom (thermal fade)
  for(let y=t+H-26,r=0;y<t+H+4;y+=5,r++)for(let x=sx+6+(r%2)*2.5;x<x1;x+=5){const k=(y-(t+H-26))/30;o+=`<circle cx="${x}" cy="${y}" r="${(.35+k*1.3).toFixed(2)}" fill="${s.red?'#c9786a':MINT}" opacity=".45"/>`}
  // cup ring stain
  if(s.ring)o+=`<g opacity=".35" fill="none" stroke="${MINT}"><circle cx="${x1-36}" cy="${t+30}" r="30" stroke-width="3"/><circle cx="${x1-36}" cy="${t+30}" r="27" stroke-width=".8" stroke-dasharray="14 6 3 8"/></g>`;
  // grain
  o+=`<rect x="0" y="0" width="${W}" height="${H+t+10}" fill="#fff" filter="url(#g${id})" opacity=".22"/></g>`;
  o+=`<path d="${shape}" fill="none" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"/>`;
  if(!s.torn){o+=`<path d="M${sx} ${t+8}V${t+H-8}" stroke="${C}" stroke-width="1.2" stroke-dasharray="1 4" stroke-linecap="round"/><path d="M${sx-6} ${t}A6 6 0 0 0 ${sx+6} ${t}Z" fill="#e6f4ee" stroke="${INK}" stroke-width="1.3"/><path d="M${sx-6} ${t+H}A6 6 0 0 1 ${sx+6} ${t+H}Z" fill="#e6f4ee" stroke="${INK}" stroke-width="1.3"/><path d="M${sx-5.3} ${t}H${sx+5.3}M${sx-5.3} ${t+H}H${sx+5.3}" stroke="#e6f4ee" stroke-width="2"/>`}
  // ink stamp
  const scx=s.torn?x1-36:sx-30,scy=s.torn?t+30:t+H-40,col=s.red?'#c9786a':MINT;
  o+=`<g filter="url(#sb${id})" opacity=".85" transform="rotate(${s.torn?-10:-14} ${scx} ${scy})"><circle cx="${scx}" cy="${scy}" r="19" fill="none" stroke="${col}" stroke-width="2.4"/><circle cx="${scx}" cy="${scy}" r="15" fill="none" stroke="${col}" stroke-width=".9"/><text x="${scx}" y="${scy+6.5}" font-size="18" font-weight="800" text-anchor="middle" fill="${col}" font-family="system-ui">${s.stamp}</text></g>`;
  if(s.strike)o+=`<path d="M${sx+14} ${t+56}q${(x1-sx)/2} -14 ${x1-sx-40} 6" stroke="#c9786a" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".85"/>`;
  o+='</svg>';
  const cx=sx+18;
  const d=document.createElement('div');d.className='tk';
  d.innerHTML=o+(s.torn?'':`<span class="t no" style="left:${sx/2-6}px;top:${t+74}px">${s.no}</span>`)+
   `<span class="t hd" style="left:${cx}px;top:${t+14}px">${s.hd}</span>`+
   `<span class="t big" style="left:${cx}px;top:${t+30}px;position:absolute"><span style="position:relative;display:inline-block"><span class="mis">${s.big}</span><span style="position:relative">${s.big}</span></span></span>`+
   `<div class="t" style="left:${cx}px;right:${s.ring?78:34}px;top:${t+72}px;display:grid;gap:4px">${s.rows.map(r=>`<div class="ln">${r[0]}<i></i><b>${r[1]}</b></div>`).join('')}</div>`;
  L.appendChild(d);
 });
}
render();addEventListener('resize',render);
</script>
</html>
