<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小票 · vb11</title>
<style>
@font-face{font-family:Script;src:url(../hlt/script.ttf)}
@font-face{font-family:BalooX;src:url(../hlt/baloo800.ttf)}
@font-face{font-family:ZK;src:url(zk.ttf)}
@font-face{font-family:WK;src:url(wk.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:repeating-linear-gradient(90deg,#d7eee5 0,#d7eee5 18px,#edf8f3 18px,#edf8f3 36px)}
body{font-family:WK,sans-serif;color:#4a2e24}
.app{width:min(100%,412px);margin:0 auto;padding:48px 16px 96px;position:relative}
h1{font:800 28px/1 BalooX;display:flex;align-items:baseline;gap:8px;margin-bottom:28px}
h1 small{font:24px/1 Script;color:#2f7a64}
.bg{position:absolute;inset:90px 0 0;pointer-events:none}
.bg i{position:absolute;border-radius:50%;background:#8a5c46;opacity:.08}
.tk{position:relative;margin:0 0 26px}.tk svg{display:block;width:100%;height:auto;overflow:visible}
.tk:nth-child(odd){transform:rotate(-1.6deg)}.tk:nth-child(even){transform:rotate(1.4deg) translateX(6px)}
.ii{cursor:pointer;outline:none}
.tip{position:absolute;font:12px/1.5 WK;color:#4a2e24;background:#fbf6ea;border:1.2px solid #8a5c46;padding:5px 10px;border-radius:8px;white-space:nowrap;opacity:0;transform:translateY(4px);transition:.18s;pointer-events:none}
.tip.on{opacity:1;transform:none}
</style>
<div class="app">
<div class="bg"><i style="left:52%;top:20px;width:150px;height:150px"></i><i style="left:78%;top:150px;width:80px;height:80px"></i><i style="left:8%;top:210px;width:110px;height:110px"></i><i style="left:40%;top:300px;width:190px;height:190px"></i><i style="left:82%;top:380px;width:60px;height:60px"></i></div>
<h1>小票 <small>receipt</small></h1>
<div id="list"></div>
</div>
<script>
const CO='#4a2e24',CR='#fbf6ea';
const V=[
 {big:'等它回复',pill:'中转站 3 · gpt-4o',time:'21:20',no:'0057',ln:'#2f7a64',stub:'#9fd6c3',band:'#cfeee2',body:CR,ink:CO},
 {big:'回好了',pill:'中转站 1 · claude · 4′12″',time:'21:16',no:'0056',ln:'#b8864a',stub:'#e6bf7a',band:'#f3dfb4',body:CR,ink:CO},
 {big:'没发出去',pill:'中转站 2 · key 过期',time:'21:09',no:'0055',ln:'#6d4636',stub:'#b29486',band:'#ddcdc2',body:'#f1e9df',ink:CO,tip:'去渠道页换个 key 就能重发'},
];
const L=document.getElementById('list');
document.fonts.ready.then(()=>V.forEach((v,n)=>{
 const W=340,H=96,S=66,G=6,X=S+G,id='t'+n,R=v.ln;
 // chocolate-block bars on stub
 let bars='';const hs=[10,6,8,4,9,5,7,3,8,6];hs.forEach((h,i)=>{bars+=`<rect x="${42}" y="${16+i*6.6}" width="${h+6}" height="3.6" rx="1" fill="${R}" opacity="${i%3?.55:.9}"/>`});
 const o=`<svg role="img" aria-label="${v.big}，${v.pill}，${v.time}" viewBox="-4 -4 ${W+8} ${H+8}">
 <defs>
  <mask id="ms${id}"><rect x="0" y="0" width="${S}" height="${H}" rx="7" fill="#fff"/><circle cx="0" cy="${H/2}" r="9" fill="#000"/></mask>
  <mask id="mb${id}"><rect x="${X}" y="0" width="${W-X}" height="${H}" rx="7" fill="#fff"/><circle cx="${W}" cy="${H/2}" r="10" fill="#000"/></mask>
  <clipPath id="cb${id}"><rect x="${X}" y="0" width="${W-X}" height="${H}" rx="7"/></clipPath>
 </defs>
 <g mask="url(#ms${id})"><rect x="0" y="0" width="${S}" height="${H}" rx="7" fill="${v.stub}"/></g>
 <path d="M7 0H${S-7}Q${S} 0 ${S} 7V${H-7}Q${S} ${H} ${S-7} ${H}H7Q0 ${H} 0 ${H-7}V${H/2+9}A9 9 0 0 0 0 ${H/2-9}V7Q0 0 7 0Z" fill="none" stroke="${R}" stroke-width="2.2"/>
 <rect x="5" y="5" width="${S-10}" height="${H-10}" rx="4" fill="none" stroke="${R}" stroke-width=".8" opacity=".7"/>
 <path d="M${S/2-4} 12V${H-12}" stroke="${R}" stroke-width="1" stroke-dasharray="2 2.5"/>
 <text transform="translate(${S/2-9} ${H/2}) rotate(-90)" text-anchor="middle" font-family="BalooX" font-size="11" letter-spacing="1" fill="${v.ink}">${v.time}</text>
 ${bars}
 <g mask="url(#mb${id})"><rect x="${X}" y="0" width="${W-X}" height="${H}" fill="${v.body}"/>
  <g clip-path="url(#cb${id})" fill="${R}" opacity=".16"><circle cx="${X+150}" cy="20" r="17"/><circle cx="${X+190}" cy="16" r="10"/><circle cx="${X+180}" cy="58" r="22"/><circle cx="${X+140}" cy="${H+2}" r="14"/><circle cx="${X+214}" cy="${H-10}" r="9"/></g>
  <rect x="${W-40}" y="0" width="40" height="${H}" fill="${v.band}"/></g>
 <path d="M${X+7} 0H${W-7}Q${W} 0 ${W} 7V${H/2-10}A10 10 0 0 0 ${W} ${H/2+10}V${H-7}Q${W} ${H} ${W-7} ${H}H${X+7}Q${X} ${H} ${X} ${H-7}V7Q${X} 0 ${X+7} 0Z" fill="none" stroke="${R}" stroke-width="2.2"/>
 <rect x="${X+5}" y="5" width="${W-X-10}" height="${H-10}" rx="4" fill="none" stroke="${R}" stroke-width=".8" opacity=".7"/>
 <path d="M${W-40} 5V${H-5}" stroke="${R}" stroke-width=".8" opacity=".7"/>
 <text transform="translate(${W-17} ${H/2}) rotate(-90)" text-anchor="middle" font-family="BalooX" font-size="11" letter-spacing="1.5" fill="${v.ink}">No.${v.no}</text>
 <text x="${X+18}" y="${H/2+2}" font-family="ZK" font-size="27" letter-spacing="2" fill="${v.ink}">${v.big}</text>
 <g class="pill"><rect x="${X+16}" y="${H/2+11}" width="10" height="17" rx="8.5" fill="none" stroke="${R}" stroke-width="1"/>
 <text x="${X+25}" y="${H/2+23.5}" font-family="WK" font-size="10" letter-spacing=".6" fill="${v.ink}">${v.pill}</text></g>
 ${v.tip?`<g class="ii" role="button" tabindex="0" aria-label="怎么办"><circle r="8" fill="transparent"/><circle r="4.4" fill="none" stroke="${v.ink}" stroke-width=".8"/><circle cy="-2" r=".6" fill="${v.ink}"/><path d="M0 -.6v3" stroke="${v.ink}" stroke-width=".9" stroke-linecap="round"/></g>`:''}
 </svg>`;
 const d=document.createElement('div');d.className='tk';d.innerHTML=o+(v.tip?`<div class="tip" role="tooltip">${v.tip}</div>`:'');L.appendChild(d);
 const tx=d.querySelector('.pill text'),bb=tx.getBBox(),pr=d.querySelector('.pill rect');pr.setAttribute('width',bb.width+18);
 const ii=d.querySelector('.ii');if(ii){const cx=X+16+bb.width+18+10,cy=H/2+19.5;ii.setAttribute('transform',`translate(${cx} ${cy})`);const tp=d.querySelector('.tip'),k=d.querySelector('svg').getBoundingClientRect().width/(W+8);const L0=(cx+4)*k-14;tp.style.left=L0+'px';tp.style.top=((cy+4)*k+12)+'px';const tg=e=>{e.stopPropagation();tp.classList.toggle('on');const mx=d.clientWidth-tp.offsetWidth-4;tp.style.left=Math.min(L0,mx)+'px'};ii.onclick=tg;ii.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')tg(e)};addEventListener('click',()=>tp.classList.remove('on'))}
}));
</script>
</html>
