<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>模型 · 极繁样张</title>
<style>
@font-face{font-family:ZK;src:url(zk.ttf)}@font-face{font-family:WK;src:url(wk.ttf)}@font-face{font-family:Script;src:url(script.ttf)}@font-face{font-family:BalooX;src:url(baloo800.ttf)}
:root{--ink:#5e4c43;--ink2:#8a7a70;--choc:#5b3a2c;--ol:#6b4a3b;--mint:#2f6e58;--mintl:#9fd3bf;--cream:#fffaf0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;color:var(--ink)}
img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.vp{position:fixed;inset:0;background-color:#e4f3ed;background-image:repeating-linear-gradient(90deg,#d7eee5 0,#d7eee5 18px,#edf8f3 18px,#edf8f3 36px)}
.app{position:absolute;inset:0;margin:0 auto;width:min(100%,412px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overflow-anchor:none;font-family:WK,serif;-webkit-tap-highlight-color:transparent}
.app::-webkit-scrollbar{display:none}
.in{position:relative;padding-bottom:20px;overflow:hidden}
.abs{position:absolute}

/* ---------- 封面 ---------- */
.drip{position:absolute;left:0;top:0;width:100%;z-index:5}
.cover{position:relative;height:350px}
.issue{position:absolute;left:14px;top:62px;writing-mode:vertical-rl;font:12px/1 WK;letter-spacing:5px;color:var(--ol);padding:8px 3px;border-left:1px solid rgba(107,74,59,.5);border-right:1px solid rgba(107,74,59,.5)}
.issue b{font-weight:400;color:var(--mint)}
.ttl{position:absolute;left:44px;top:84px;z-index:3}
.ttl h1{font:400 82px/1 ZK;color:var(--choc);letter-spacing:4px;
 text-shadow:2.5px 0 var(--cream),-2.5px 0 var(--cream),0 2.5px var(--cream),0 -2.5px var(--cream),2px 2px var(--cream),-2px -2px var(--cream),2px -2px var(--cream),-2px 2px var(--cream),6px 7px 0 var(--mintl)}
.ttl .en{position:absolute;left:96px;top:62px;font:44px/1 Script;color:#5fa98d;transform:rotate(-9deg);white-space:nowrap;
 text-shadow:1.5px 0 var(--cream),-1.5px 0 var(--cream),0 1.5px var(--cream),0 -1.5px var(--cream),2px 3px 0 var(--ol)}
.ttl .star{position:absolute;left:-6px;top:-10px;font:18px ZK;color:var(--mint)}
.stand{position:absolute;right:-14px;top:58px;width:min(172px,43vw);z-index:2}
.cone{position:absolute;right:146px;top:30px;width:52px;transform:rotate(-14deg);z-index:1}
.meta{position:absolute;left:44px;top:212px;display:flex;align-items:center;gap:12px;z-index:3}
.no{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;text-align:center;font:10px/1.1 WK;color:var(--ol);
 background:radial-gradient(circle at 38% 32%,#fffdf6,#f3ead6 70%);box-shadow:inset 1.5px 1.5px 0 #fff,inset -2px -2px 3px rgba(107,74,59,.18),0 0 0 1.5px var(--ol),0 0 0 4px var(--cream),0 0 0 5.5px var(--mintl)}
.no b{display:block;font:400 20px/1 BalooX;color:var(--choc)}
.fig{display:flex;align-items:baseline;gap:4px;padding:0 10px;border-left:1px solid rgba(107,74,59,.45)}
.fig b{font:400 34px/1 BalooX,ZK;color:var(--choc)}
.fig span{font:13px ZK;color:var(--ink2)}
.curls{position:absolute;left:24px;top:270px;width:230px;z-index:1;transform:rotate(-3deg)}

/* ---------- 视觉小说对话框 ---------- */
.vn{position:relative;margin:0 18px 34px;padding:26px 18px 16px;background:var(--cream);border:2px solid var(--ol);border-radius:16px;
 box-shadow:inset 0 0 0 4px var(--cream),inset 0 0 0 5.5px var(--mintl)}
.vn .np{position:absolute;left:14px;top:-19px;width:128px;height:36px;display:grid;place-items:center}
.vn .np img{position:absolute;inset:0;width:100%;height:100%}
.vn .np span{position:relative;font:15px ZK;color:var(--cream);letter-spacing:2px}
.vn p{font:15px/1.7 WK;color:var(--ink);min-height:51px}
.vn p em{font-style:normal;color:var(--mint)}
.vn .nx{position:absolute;right:16px;bottom:10px;width:0;height:0;border:6px solid transparent;border-top:8px solid var(--ol);border-bottom:0;animation:bob 1s ease-in-out infinite}
.vn .leaf{position:absolute;right:-14px;top:-22px;width:52px;transform:rotate(14deg)}
@keyframes bob{50%{transform:translateY(3px)}}

/* ---------- 中转站 ---------- */
.ch{position:relative;margin-bottom:26px}
.ph{position:relative;width:300px;height:84px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transform:rotate(var(--r,-1.5deg));transform-origin:50% 0}
.ph>img{position:absolute;inset:0;width:100%;height:100%}
.ph h2{position:relative;font:400 23px/1 ZK;color:var(--cream);letter-spacing:1px}
.ph small{position:relative;font:12px ZK;color:#d8efe5}
.ph .idx{position:absolute;left:-22px;top:22px;font:400 30px/1 BalooX;color:var(--mintl);text-shadow:1.5px 0 var(--ol),-1.5px 0 var(--ol),0 1.5px var(--ol),0 -1.5px var(--ol)}
.ph.sw{animation:swing .7s ease-out}
@keyframes swing{20%{transform:rotate(4deg)}45%{transform:rotate(-5deg)}70%{transform:rotate(2deg)}100%{transform:rotate(var(--r,-1.5deg))}}
.row{position:relative;display:flex;align-items:center;margin:0 10px;cursor:pointer}
.row.rv{flex-direction:row-reverse}
.wr{position:relative;flex:0 0 230px;height:104px;transform:rotate(var(--t,-2deg));transition:transform .25s}
.row.rv .wr{--t:2.5deg}
.row:active .wr{transform:rotate(var(--t,-2deg)) scale(.96)}
.wr>img{position:absolute;inset:0;width:100%;height:100%}
.wr .lb{position:absolute;left:24%;right:24%;top:24%;bottom:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.wr .n{font:14px/1.15 WK;color:var(--choc);white-space:nowrap}
.wr .t{margin-top:3px;font:11px ZK;color:var(--mint);letter-spacing:1px}
.num{flex:1;text-align:center}
.num b{display:block;font:400 30px/1 BalooX;color:var(--choc);letter-spacing:.5px}
.num i{display:block;margin-top:3px;font:11px/1 WK;font-style:normal;color:var(--ink2);letter-spacing:3px}
.mac{position:absolute;z-index:8;width:50px;transition:left .45s cubic-bezier(.3,1.4,.5,1),top .45s cubic-bezier(.3,1.4,.5,1)}
.mac.hop{animation:hop .45s}
@keyframes hop{40%{transform:translateY(-16px) rotate(-12deg)}}
.dc{position:absolute;z-index:0}


/* ---------- 中转站（可折叠） ---------- */
#sts{position:relative;padding:0 0 6px}
.st{position:relative;margin:0 0 10px}
.sp{position:relative;width:calc(100% - 44px);max-width:340px;height:66px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:0 30px 0 34px;cursor:pointer;transform:rotate(var(--r,0deg));transition:transform .25s}
.sp>img{position:absolute;inset:0;width:100%;height:100%}
.sp:active{transform:rotate(var(--r,0deg)) scale(.97)}
.sp h2{position:relative;flex:1;min-width:0;font:400 19px/1 ZK;color:var(--cream);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp small{position:relative;font:12px ZK;color:#d8efe5;white-space:nowrap}
.sp .ar{position:relative;width:9px;height:9px;border-right:2px solid #d8efe5;border-bottom:2px solid #d8efe5;transform:rotate(45deg) translate(-2px,-2px);transition:transform .3s}
.st.op .sp .ar{transform:rotate(225deg) translate(-2px,-2px)}
.sp .use{position:absolute;right:-6px;top:-12px;width:40px;height:40px;display:grid;place-items:center;font:11px/1 ZK;color:var(--choc);
 background:radial-gradient(circle at 38% 32%,#f4fffa,#bfe6d6 72%);border-radius:50%;box-shadow:0 0 0 1.5px var(--ol),0 0 0 4px var(--cream);transform:rotate(12deg)}
.bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.st.op .bd{grid-template-rows:1fr}
.bd>div{overflow:hidden;min-height:0}
.ls{padding:10px 0 4px;display:flex;flex-direction:column;gap:6px;align-items:center}
.br{position:relative;width:calc(100% - 64px);max-width:320px;height:58px;cursor:pointer;transform:rotate(var(--t,0deg));transition:transform .2s}
.br:nth-child(odd){--t:-.8deg}.br:nth-child(even){--t:.8deg;left:6px}
.br:active{transform:rotate(var(--t)) scale(.97)}
.br>img{position:absolute;inset:0;width:100%;height:100%}
.br .tx{position:absolute;left:10%;right:8%;top:22%;bottom:30%;display:flex;align-items:center;gap:8px}
.br .n{flex:1;min-width:0;font:14px/1 WK;color:var(--choc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .tg{font:10px/1 ZK;color:var(--mint);white-space:nowrap}
.br .k{font:400 16px/1 BalooX;color:var(--choc);white-space:nowrap}
.br .mc{position:absolute;left:-22px;top:4px;width:40px;animation:hop .45s}

/* ---------- 备用链 ---------- */
.chain{position:relative;margin:8px 0 0;height:256px}
.chain .ph{--r:1.2deg}
.rope{position:absolute;left:0;top:116px;width:100%;height:60px}
.cd{position:absolute;top:0;width:112px;text-align:center;cursor:pointer;transition:left .45s cubic-bezier(.3,1.3,.5,1)}
.cd img{width:72px;margin:0 auto}
.cd .o{display:block;margin-top:4px;font:400 18px/1 BalooX;color:var(--choc)}
.cd .m{display:block;margin-top:3px;font:12px WK;color:var(--ink);white-space:nowrap}
.cd .s{display:block;font:10px ZK;color:var(--mint);letter-spacing:1px}

.foot{position:relative;height:150px}
.ft{position:absolute;left:24px;bottom:42px;font:min(30px,7vw) Script;white-space:nowrap;color:var(--ol);transform:rotate(-4deg)}
.drink{position:absolute;right:16px;bottom:8px;width:76px;transform:rotate(5deg)}
.cookie{position:absolute;right:86px;bottom:2px;width:70px;transform:rotate(-8deg)}
</style></head><body>
<div class="vp"><div class="app" id="app"><div class="in" id="in">
<img class="drip" src="drizzle.png" alt="">

<header class="cover">
 <p class="issue">薄荷巧克力<b>·</b>本日供应</p>
 <img class="cone" src="m_cone.png" alt="">
 <img class="stand" src="m_stand.png" alt="">
 <div class="ttl"><span class="star">✦</span><h1>模型</h1><span class="en">Models</span></div>
 <img class="curls" src="m_curls.png" alt="">
 <div class="meta">
  <div class="no"><span><b>03</b>本期</span></div>
  <div class="fig"><b id="nst">6</b><span>中转站</span></div>
  <div class="fig"><b id="nmd">14</b><span>款</span></div>
 </div>
</header>

<section class="vn" aria-live="polite">
 <div class="np"><img src="m_plaque.png" alt=""><span>薄荷店长</span></div>
 <img class="leaf" src="k_mint.png" alt="">
 <p id="say">今天先用 <em>gpt-4o</em>，没回应就按备用链换下一个。点哪块巧克力，就换哪个先用。</p>
 <i class="nx"></i>
</section>

<div id="sts"></div>
<img class="dc" src="m_curls.png" alt="" style="right:-40px;margin-top:-30px;width:160px;transform:rotate(-12deg);position:relative;left:auto;float:right">
<section class="ch chain" id="chain">
 <div class="ph"><img src="m_plaque.png" alt=""><h2>备用链</h2></div>
 <svg class="rope" viewBox="0 0 412 60" preserveAspectRatio="none"><path d="M-4 14 Q103 52 206 22 T416 18" fill="none" stroke="#6b4a3b" stroke-width="1.6" stroke-linecap="round"/><path d="M-4 18 Q103 56 206 26 T416 22" fill="none" stroke="#9fd3bf" stroke-width="1.6" stroke-dasharray="5 5" stroke-linecap="round"/></svg>
</section>

<div class="foot"><p class="ft">Mint Chocolate Models</p><img class="cookie" src="cookie.png" alt=""><img class="drink" src="drink.png" alt=""></div>
</div></div></div>
<script>
const app=document.getElementById('app'),inn=document.getElementById('in'),say=document.getElementById('say');
let cur='gpt-4o',typing;
function talk(html){clearInterval(typing);const tmp=document.createElement('div');tmp.innerHTML=html;const full=tmp.textContent;let i=0;say.textContent='';
 typing=setInterval(()=>{i++;if(i>=full.length){clearInterval(typing);say.innerHTML=html;return}say.textContent=full.slice(0,i)},28)}

const STS=[
 {n:'小鲸鱼中转',m:[['gpt-4o','看图','128K'],['gpt-4.1-mini','长文','1M'],['o4-mini','推理','200K']]},
 {n:'Anthropic 官方',m:[['claude-sonnet-4','看图','200K'],['claude-haiku-4','快','200K']]},
 {n:'夜猫小站',m:[['deepseek-v3','流式','64K'],['qwen-max','夜里便宜','32K']]},
 {n:'OpenRouter',m:[['gemini-2.5-pro','看图','1M'],['llama-4-maverick','','1M'],['mistral-large','','128K']]},
 {n:'薄荷自建',m:[['qwen3-32b','本地','32K'],['glm-4.5-air','','128K']]},
 {n:'备用小铺',m:[['kimi-k2','长文','128K']]}];
const sts=document.getElementById('sts');let curSt=0;
document.getElementById('nst').textContent=STS.length;document.getElementById('nmd').textContent=STS.reduce((a,s)=>a+s.m.length,0);
function renderSt(){sts.innerHTML=STS.map((s,i)=>`<div class="st${i===0?' op':''}" data-i="${i}"><div class="sp" style="--r:${i%2?1:-1}deg"><img src="m_plaque.png" alt=""><h2>${s.n}</h2><small>${s.m.length} 款</small><i class="ar"></i>${i===curSt?'<span class="use">在用</span>':''}</div>
 <div class="bd"><div><div class="ls">${s.m.map(([m,tg,k])=>`<div class="br" data-m="${m}" data-s="${i}"><img src="m_bar.png" alt=""><div class="tx"><span class="n">${m}</span>${tg?`<span class="tg">${tg}</span>`:''}<span class="k">${k}</span></div>${m===cur?'<img class="mc" src="m_macaron.png" alt="先用">':''}</div>`).join('')}</div></div></div></div>`).join('');}
renderSt();
sts.addEventListener('click',ev=>{const y=app.scrollTop;const sp=ev.target.closest('.sp');
 if(sp){sp.parentNode.classList.toggle('op');requestAnimationFrame(()=>app.scrollTop=y);return}
 const br=ev.target.closest('.br');if(!br)return;const m=br.dataset.m;
 if(m===cur){talk(`<em>${m}</em> 已经在用啦。`);return}
 cur=m;const old=sts.querySelector('.mc');old&&old.remove();br.insertAdjacentHTML('beforeend','<img class="mc" src="m_macaron.png" alt="先用">');
 const s=+br.dataset.s;if(s!==curSt){const u=sts.querySelector('.use');u&&u.remove();sts.querySelector(`.st[data-i="${s}"] .sp`).insertAdjacentHTML('beforeend','<span class="use">在用</span>');curSt=s}
 talk(`好，换成 <em>${m}</em> 先用。`);app.scrollTop=y});
// 备用链：点一颗糖，往前挪一位
const chain=document.getElementById('chain');let order=[['gpt-4o','小鲸鱼'],['claude-sonnet-4','官方'],['deepseek-v3','夜猫']];const ORD='①②③';
const cds=order.map(([m,s])=>{const d=document.createElement('div');d.className='cd';d.dataset.m=m;d.innerHTML=`<img src="m_bonbon.png" alt=""><span class="o"></span><span class="m">${m}</span><span class="s">${s}</span>`;chain.appendChild(d);return d});
const tilt=[-6,5,-3],tops=[104,118,102];
function lay(){const W=inn.offsetWidth,gap=(W-3*112)/4;order.forEach(([m],k)=>{const d=cds.find(c=>c.dataset.m===m);d.style.left=(gap+k*(112+gap))+'px';d.style.top=tops[k]+'px';d.querySelector('img').style.transform=`rotate(${tilt[k]}deg)`;d.querySelector('.o').textContent=ORD[k]})}
cds.forEach(d=>d.onclick=()=>{const k=order.findIndex(o=>o[0]===d.dataset.m);if(k===0){talk(`<em>${d.dataset.m}</em> 已经排第一啦。`);return}
 [order[k-1],order[k]]=[order[k],order[k-1]];lay();talk(`<em>${d.dataset.m}</em> 往前挪到第 ${k} 个。`)});
const all=()=>{lay()};all();addEventListener('resize',all);document.fonts&&document.fonts.ready.then(all);
window.addEventListener('load',all);
</script>
</body></html>
